apiVersion: srw/v1alpha1
kind: Job
metadata:
  name: native-process-example
  scope:
    kind: Account
    name: personal
spec:
  task:
    text: Run an ordinary container with no SRW callbacks.
  execution:
    expert:
      inline:
        runtime:
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["printf 'Hello from an ordinary image\\n'"]
          config:
            arbitraryPrivateSetting: null
    workspace: null
    connectors: {}
  completion:
    mode: ProcessExit
  timeoutSeconds: 120
  retry:
    maxAttempts: 1
