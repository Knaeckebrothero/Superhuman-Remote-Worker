# A prebuilt VM workspace for building and testing SRW with Docker, k3d and Tilt.
# This resource stores a recipe; applying it alone does not allocate a VM.
# Omitted scope uses the authenticated Account (or the CLI's explicit scope).
apiVersion: srw/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: srw-development
spec:
  backend: vm
  resources:
    cpu: 12
    memory: 24Gi
    storage: 120Gi
  environment:
    # Bootable SRW VM disk, published 2026-09-14. Each VM gets its own rootdisk.
    image: ghcr.io/superhuman-remote-worker/srw-agent-vm-base@sha256:38c04a4a291ebe6112fe786259941e1c9da22cee6da4184f583312249d0e9547
    pullPolicy: IfNotPresent
    cache: Reuse
  retention: Delete
