  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="assets/env.js"></script>
  <script>
    // Reveal Material Symbols ligatures only after the icon font has loaded.
    // Without this, the literal text (e.g. "settings") flashes before glyphs
    // arrive — visible as broken `.notdef` boxes in the UI.
    (function () {
      function markLoaded() { document.body.classList.add('fonts-loaded'); }
      if (document.fonts && document.fonts.load) {
        document.fonts.load('1em "Material Symbols Outlined"')
          .then(markLoaded)
          .catch(markLoaded);
        // Hard fallback so icons never stay invisible if the font fails.
        setTimeout(markLoaded, 3000);
      } else {
        markLoaded();
      }
    })();
  </script>
</head>
<body class="theme-travertine">
  <script>
    // Pre-paint theme resolution: pick the body class before Angular hydrates so
    // dark-OS users don't flash through the Travertine fallback class on first paint.
    // Mirrors ThemeService.readStoredPreference() — keep in sync.
    (function () {
      try {
        var raw = window.localStorage.getItem('cockpit:theme');
        var migrate = {dark: 'senate', light: 'travertine', praetorian: 'senate'};
        var pref = (raw && migrate[raw]) || raw || 'system';
        var valid = {travertine: 1, senate: 1, system: 1};
        if (!valid[pref]) pref = 'system';
        var resolved = pref;
        if (pref === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'senate' : 'travertine';
        }
        document.body.classList.remove('theme-travertine', 'theme-senate', 'theme-praetorian');
        document.body.classList.add('theme-' + resolved);
      } catch (e) { /* leave fallback class in place */ }
    })();
  </script>
  <app-root></app-root>
</body>
</html>
