# Apply this to the Rancher cluster to register the VM controller with Fleet
#
# Usage:
#   kubectl apply -f fleet-gitrepo-vms.yaml --context local
#
# Separate GitRepo to avoid target merging with the main SRW GitRepo
# No auth needed — public GitHub repo
---
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: superhuman-remote-worker-vms
  namespace: fleet-default
spec:
  repo: https://github.com/Knaeckebrothero/Superhuman-Remote-Worker.git
  branch: main
  paths:
    - deployment/srw-vm-controller
  targets:
    - clusterSelector:
        matchLabels:
          management.cattle.io/cluster-display-name: vms
  pollingInterval: "300s"
