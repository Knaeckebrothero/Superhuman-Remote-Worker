      retries: 5
      start_period: 15s
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # QEMU VMs (Docker Compose mode, optional)
  # ---------------------------------------------------------------------------
  # Uncomment to enable VM workspaces via QEMU-in-Docker.  Requires:
  #   - Linux host with /dev/kvm (hardware virtualization)
  #   - agent-vm-base.qcow2 built by Packer (docker/agent-vm-base/)
  #   - VM_HOSTS=agent-vm-1 in .env (or orchestrator environment)
  # The same qcow2 image used by KubeVirt in production runs unchanged here.
  #
  # agent-vm-1:
  #   image: qemux/qemu
  #   container_name: srw-agent-vm-1
  #   devices:
  #     - /dev/kvm
  #     - /dev/net/tun
  #   cap_add:
  #     - NET_ADMIN
  #   environment:
  #     BOOT: /disk/agent-vm-base.qcow2
  #     RAM_SIZE: ${VM_RAM:-4G}
  #     CPU_CORES: ${VM_CPUS:-4}
  #     DISK_FMT: qcow2
  #     DISK_IO: native
  #     DISK_CACHE: none
  #   volumes:
  #     - ./docker/agent-vm-base/output/agent-vm-base.qcow2:/disk/agent-vm-base.qcow2:ro
  #     - vm_1_disk:/storage
  #   healthcheck:
  #     test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  #     start_period: 60s
  #   stop_grace_period: 2m
  #   restart: unless-stopped

  mcp:
    image: ghcr.io/knaeckebrothero/superhuman-remote-worker-mcp:${IMAGE_TAG:-latest}
    container_name: srw-mcp
    environment:
      COCKPIT_API_URL: http://orchestrator:8085
      MCP_TRANSPORT: http
      MCP_PORT: 8055
      MCP_INTERNAL_KEY: ${MCP_INTERNAL_KEY:-dev-internal-key}
    ports:
      - "${MCP_PORT:-8055}:8055"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8055/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cockpit:
    image: ghcr.io/knaeckebrothero/superhuman-remote-worker-cockpit:${IMAGE_TAG:-latest}
    container_name: srw-cockpit
    environment:
      PORT: 4000
    ports:
      - "${COCKPIT_PORT:-4000}:4000"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Messaging (optional — required for VM lifecycle)
  # ---------------------------------------------------------------------------
  nats:
    image: docker.io/nats:2.10-alpine
    container_name: srw-nats
    command: ["--jetstream", "--store_dir", "/data"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Object Storage (optional — for VM snapshots + IDE sessions)
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: srw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-srw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-srw_password}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Admin UIs & Utilities
  # ---------------------------------------------------------------------------
  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: srw-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@srw.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-express:
    image: docker.io/library/mongo-express:latest
    container_name: srw-mongo-express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Codex OAuth Proxy (optional — for codex/* models via ChatGPT subscription)
  # ---------------------------------------------------------------------------
  # Provides OpenAI-compatible API backed by ChatGPT Plus/Pro subscription.
  # First run: authenticate via SSH tunnel + browser:
  #   podman exec -it srw-codex-proxy ./CLIProxyAPI --codex-login
  codex-proxy:
    image: docker.io/eceasy/cli-proxy-api:latest
    container_name: srw-codex-proxy
    environment:
      MANAGEMENT_PASSWORD: ${CODEX_MANAGEMENT_KEY:-}
    ports:
      - "${CODEX_PROXY_PORT:-8317}:8317"
      - "${CODEX_OAUTH_PORT:-1455}:1455"
    volumes:
      - ./docker/codex-proxy/config.yaml:/CLIProxyAPI/config.yaml:Z
      - codex_proxy_auths:/root/.cli-proxy-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8317/v1/models", "||", "exit", "1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Container log viewer (optional)
  # ---------------------------------------------------------------------------
  # Socket path varies by runtime:
  #   Rootless Podman: /run/user/<UID>/podman/podman.sock  (default below)
  #   Rootful Podman:  /run/podman/podman.sock
  #   Docker:          /var/run/docker.sock
  dozzle:
    image: docker.io/amir20/dozzle:latest
    container_name: srw-dozzle
    security_opt:
      - label:disable
    environment:
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /run/user/${HOST_UID:-1000}/podman/podman.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: srw_postgres_data
  postgres_vector_data:
    name: srw_postgres_vector_data
  mongodb_data:
    name: srw_mongodb_data
  neo4j_data:
    name: srw_neo4j_data
  nats_data:
    name: srw_nats_data
  gitea_data:
    name: srw_gitea_data
  nextcloud_data:
    name: srw_nextcloud_data
  minio_data:
    name: srw_minio_data
  workspace_data:
    name: srw_workspace_data
  agent_home:
    name: srw_agent_home
  ssh_keys:
    name: srw_ssh_keys
  codex_proxy_auths:
    name: srw_codex_proxy_auths
