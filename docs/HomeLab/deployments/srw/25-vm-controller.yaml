# VM Controller — Agent Cluster
#
# Manages KubeVirt VM lifecycle via NATS.
# Deployed to the AGENT cluster (not the main cluster).
# Namespace: agent-vms (must exist on the agent cluster).
#
# Prerequisites:
#   - NATS leaf deployed on agent cluster (see deployment/nats/nats-leaf-values.yaml)
#   - KubeVirt installed on agent cluster (see docs/features/vm_agent_cluster_setup.md)
#   - agent-vms namespace exists (kubectl create namespace agent-vms)
#
# Deploy:
#   # Update the vm-template ConfigMap data from the canonical template:
#   kubectl create configmap vm-template -n agent-vms \
#     --from-file=vm-template.yaml=deployment/harvester/vm-template.yaml \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl apply -f deployment/25-vm-controller.yaml
#
# Image build:
#   cd vm-controller
#   podman build -t ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller:latest .
#   podman push ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller:latest

---
# Namespace (idempotent — already created during agent cluster setup)
apiVersion: v1
kind: Namespace
metadata:
  name: agent-vms
  labels:
    app.kubernetes.io/part-of: superhuman-remote-worker

---
# ServiceAccount for the VM Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-controller
  namespace: agent-vms
  labels:
    app: srw-vm-controller

---
# Role: KubeVirt CRD access scoped to agent-vms namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-controller
  namespace: agent-vms
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

---
# Bind the role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-controller
  namespace: agent-vms
subjects:
  - kind: ServiceAccount
    name: vm-controller
    namespace: agent-vms
roleRef:
  kind: Role
  name: vm-controller
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole for node listing (nodes are cluster-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-controller-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vm-controller-nodes
subjects:
  - kind: ServiceAccount
    name: vm-controller
    namespace: agent-vms
roleRef:
  kind: ClusterRole
  name: vm-controller-nodes
  apiGroup: rbac.authorization.k8s.io

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-vm-controller
  namespace: agent-vms
  labels:
    app: srw-vm-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-vm-controller
  template:
    metadata:
      labels:
        app: srw-vm-controller
    spec:
      serviceAccountName: vm-controller
      containers:
        - name: vm-controller
          image: ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller:latest
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: "nats://nats-leaf.nats.svc.cluster.local:4222"
            - name: VM_TEMPLATE_PATH
              value: "/config/vm-template.yaml"
            - name: VM_NAMESPACE
              value: "agent-vms"
            - name: DEFAULT_VM_IMAGE
              value: "ghcr.io/knaeckebrothero/agent-vm-base:latest"
            - name: DEFAULT_CPU
              value: "2"
            - name: DEFAULT_MEMORY
              value: "4Gi"
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: vm-template
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # No HTTP endpoints — communication is via NATS only.
          # Use a simple exec probe to verify the process is running.
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.getpid()"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: vm-template
          configMap:
            name: vm-template
