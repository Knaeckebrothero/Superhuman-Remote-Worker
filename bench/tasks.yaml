      quorum, tombstone, write-amplification.

      Acceptance criteria (ALL must be met):
      1. Exactly five entries, one per term, in the order listed above.
      2. Each entry is 2-3 sentences of plain-English definition.
      3. Each entry ends with its own line beginning `Trade-off:` followed by
