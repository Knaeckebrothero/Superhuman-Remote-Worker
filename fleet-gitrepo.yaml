# Apply this to the Rancher cluster to register the SRW repo with Fleet
#
# Usage:
#   kubectl apply -f fleet-gitrepo.yaml --context local
#
# No auth needed — public GitHub repo
---
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: superhuman-remote-worker
  namespace: fleet-default
spec:
  repo: https://github.com/Knaeckebrothero/Superhuman-Remote-Worker.git
  branch: main
  paths:
    - deployment
  # Target the downstream (main) cluster by default
  # Per-directory fleet.yaml can override (e.g. srw-vm-controller → vms cluster)
  targets:
    - clusterSelector:
        matchLabels:
          management.cattle.io/cluster-display-name: main
  # Poll every 5 minutes
  pollingInterval: "300s"
