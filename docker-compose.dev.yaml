# =============================================================================
# Superhuman Remote Worker - Development Infrastructure
# =============================================================================
#
# Supporting services for local development. Run agent, orchestrator, and
# cockpit locally for easy debugging and iteration.
#
# VPN services publish ports to the host so locally-running agents can reach
# the LLM cluster and research proxy. Set these in .env for local dev:
#   LLM_BASE_URL=http://localhost:8080/v1
#   WORKSTATION_BASE_URL=http://localhost:8090/v1  (embeddings, vision, whisper, TTS)
#   RESEARCH_PROXY_TYPE=socks5
#   RESEARCH_PROXY_HOST=localhost
#   RESEARCH_PROXY_PORT=1080
#
# Usage:
#   podman-compose -f docker-compose.dev.yaml up -d     # Start all services
#   podman-compose -f docker-compose.dev.yaml down      # Stop services
#   podman-compose -f docker-compose.dev.yaml down -v   # Stop and remove data
#
# Start only databases:
#   podman-compose -f docker-compose.dev.yaml up -d postgres mongodb
#
#
# Start only databases + MCP:
#   podman-compose -f docker-compose.dev.yaml up -d postgres mongodb mcp
#
# Start Codex OAuth proxy (for codex/* models via ChatGPT subscription):
#   podman-compose -f docker-compose.dev.yaml up -d codex-proxy
#   # First run: authenticate via SSH tunnel + browser (see docs)
#
# Run application components locally:
#   cd orchestrator && uvicorn main:app --reload --port 8085
#   python agent.py --config defaults --port 8001
#   cd cockpit && npm start
#
# =============================================================================

name: superhuman-remote-worker

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg15
    container_name: srw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srw_password}
      POSTGRES_DB: ${POSTGRES_DB:-srw}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./orchestrator/database/init_sso_dbs.sh:/docker-entrypoint-initdb.d/000_init_sso_dbs.sh:Z
      - ./orchestrator/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:Z
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-vector:
    image: docker.io/pgvector/pgvector:pg15
    container_name: srw-postgres-vector
    environment:
      POSTGRES_USER: ${VECTOR_POSTGRES_USER:-srw}
      POSTGRES_PASSWORD: ${VECTOR_POSTGRES_PASSWORD:-srw_password}
      POSTGRES_DB: ${VECTOR_POSTGRES_DB:-srw_vector}
    volumes:
      - postgres_vector_dev_data:/var/lib/postgresql/data
      - ./orchestrator/database/vector_schema.sql:/docker-entrypoint-initdb.d/001_vector_schema.sql:Z
    ports:
      - "${VECTOR_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_POSTGRES_USER:-srw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: docker.io/library/mongo:7
    container_name: srw-mongodb
    environment:
      MONGO_INITDB_DATABASE: srw_logs
    volumes:
      - mongodb_dev_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: srw-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@srw.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: docker.io/library/neo4j:5
    container_name: srw-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_dev_data:/data
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:-neo4j}", "-p", "${NEO4J_PASSWORD:-neo4j_password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: docker.io/library/mongo-express:latest
    container_name: srw-mongo-express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  nats:
    image: docker.io/nats:2.10-alpine
    container_name: srw-nats
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_dev_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gitea:
    image: docker.io/gitea/gitea:1.22-rootless
    container_name: srw-gitea
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /var/lib/gitea/data/gitea.db
      GITEA__server__ROOT_URL: http://localhost:3000
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__service__ENABLE_CAPTCHA: "false"
      GITEA__service__AUTO_WATCH_NEW_REPOS: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__UPDATE_EXISTING: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
    volumes:
      - gitea_dev_data:/var/lib/gitea
    ports:
      - "${GITEA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: srw-keycloak
    command: start-dev --import-realm
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Hostname — front-channel URLs use localhost so the browser can reach them.
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC allows container-to-container backchannel
      # requests (e.g. Gitea token exchange) to use the internal hostname.
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      # Admin console credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # SMTP — Proton Bridge on host machine (set in .env)
      SMTP_HOST: "${SMTP_HOST:-host.containers.internal}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    volumes:
      # Copy realm-export.json.example to realm-export.json and edit credentials.
      # See docker/keycloak/realm-export.json.example for the template.
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/srw-realm.json:ro,Z
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  nextcloud:
    image: docker.io/library/nextcloud:31-apache
    container_name: srw-nextcloud
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    volumes:
      - nextcloud_dev_data:/var/www/html
    ports:
      - "${NEXTCLOUD_PORT:-8800}:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    image: srw-mcp:dev
    container_name: srw-mcp
    network_mode: host
    environment:
      COCKPIT_API_URL: http://localhost:8085
      MCP_TRANSPORT: http
      MCP_PORT: ${MCP_PORT:-8055}
      MCP_INTERNAL_KEY: ${MCP_INTERNAL_KEY:-dev-internal-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MCP_PORT:-8055}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  vpn-cluster:
    build:
      context: docker/vpn
      dockerfile: Dockerfile
    image: srw-vpn:dev
    container_name: srw-vpn-cluster
    cap_add:
      - NET_ADMIN
    security_opt:
      - label:disable
    devices:
      - /dev/ppp:/dev/ppp
    volumes:
      - ./certs:/etc/vpn/certs:ro
    ports:
      - "${VPN_LLM_PORT:-8080}:8080"
    environment:
      SOCKS_PORT: 1080
      FORWARD_PORT: 8080
      FORWARD_TARGET: ${VPN_CLUSTER_LLM_ENDPOINT:-}
      VPN_HOST: ${VPN_CLUSTER_HOST:-}
      VPN_PORT: ${VPN_CLUSTER_PORT:-443}
      VPN_REALM: ${VPN_CLUSTER_REALM:-}
      VPN_USER: ${VPN_CLUSTER_USER:-}
      VPN_PASS: ${VPN_CLUSTER_PASS:-}
      VPN_TRUSTED_CERT: ${VPN_CLUSTER_TRUSTED_CERT:-}
    healthcheck:
      test: ps aux | grep -q '[o]penfortivpn' && ps aux | grep -q '[m]icrosocks'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  vpn-research:
    build:
      context: docker/vpn
      dockerfile: Dockerfile
    image: srw-vpn:dev
    container_name: srw-vpn-research
    cap_add:
      - NET_ADMIN
    security_opt:
      - label:disable
    devices:
      - /dev/ppp:/dev/ppp
    volumes:
      - ./certs:/etc/vpn/certs:ro
    ports:
      - "${VPN_SOCKS_PORT:-1080}:1080"
    environment:
      SOCKS_PORT: 1080
      VPN_HOST: ${VPN_RESEARCH_HOST:-}
      VPN_PORT: ${VPN_RESEARCH_PORT:-443}
      VPN_REALM: ${VPN_RESEARCH_REALM:-}
      VPN_USER: ${VPN_RESEARCH_USER:-}
      VPN_PASS: ${VPN_RESEARCH_PASS:-}
      VPN_TRUSTED_CERT: ${VPN_RESEARCH_TRUSTED_CERT:-}
    healthcheck:
      test: ps aux | grep -q '[o]penfortivpn' && ps aux | grep -q '[m]icrosocks'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  vpn-workstation:
    build:
      context: docker/vpn
      dockerfile: Dockerfile
    image: srw-vpn:dev
    container_name: srw-vpn-workstation
    cap_add:
      - NET_ADMIN
    security_opt:
      - label:disable
    devices:
      - /dev/ppp:/dev/ppp
    volumes:
      - ./certs:/etc/vpn/certs:ro
    ports:
      - "${VPN_WORKSTATION_PORT_HOST:-8090}:8080"
    environment:
      SOCKS_PORT: 1080
      FORWARD_PORT: 8080
      FORWARD_TARGET: ${VPN_WORKSTATION_ENDPOINT:-10.18.2.105:8090}
      VPN_HOST: ${VPN_WORKSTATION_HOST:-}
      VPN_PORT: ${VPN_WORKSTATION_PORT:-443}
      VPN_REALM: ${VPN_WORKSTATION_REALM:-}
      VPN_USER: ${VPN_WORKSTATION_USER:-}
      VPN_PASS: ${VPN_WORKSTATION_PASS:-}
      VPN_TRUSTED_CERT: ${VPN_WORKSTATION_TRUSTED_CERT:-}
    healthcheck:
      test: ps aux | grep -q '[o]penfortivpn' && ps aux | grep -q '[m]icrosocks'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # S3-compatible object store (MinIO) — VM snapshots + IDE sessions
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: srw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-srw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-srw_password}
    volumes:
      - minio_dev_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Container log viewer (Dozzle)
  # ---------------------------------------------------------------------------
  # Socket path varies by runtime:
  #   Rootless Podman: /run/user/<UID>/podman/podman.sock  (default below)
  #   Rootful Podman:  /run/podman/podman.sock
  #   Docker:          /var/run/docker.sock
  codex-proxy:
    image: docker.io/eceasy/cli-proxy-api:latest
    container_name: srw-codex-proxy
    environment:
      MANAGEMENT_PASSWORD: ${CODEX_MANAGEMENT_KEY:-}
    ports:
      - "${CODEX_PROXY_PORT:-8317}:8317"
      - "${CODEX_OAUTH_PORT:-1455}:1455"
    volumes:
      - ./docker/codex-proxy/config.yaml:/CLIProxyAPI/config.yaml:Z
      - codex_proxy_auths:/root/.cli-proxy-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8317/v1/models", "||", "exit", "1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dozzle:
    image: docker.io/amir20/dozzle:latest
    container_name: srw-dozzle
    security_opt:
      - label:disable
    environment:
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /run/user/${HOST_UID:-1000}/podman/podman.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    restart: unless-stopped

volumes:
  postgres_dev_data:
    name: srw_postgres_dev_data
  postgres_vector_dev_data:
    name: srw_postgres_vector_dev_data
  mongodb_dev_data:
    name: srw_mongodb_dev_data
  neo4j_dev_data:
    name: srw_neo4j_dev_data
  nats_dev_data:
    name: srw_nats_dev_data
  gitea_dev_data:
    name: srw_gitea_dev_data
  nextcloud_dev_data:
    name: srw_nextcloud_dev_data
  minio_dev_data:
    name: srw_minio_dev_data
  codex_proxy_auths:
    name: srw_codex_proxy_auths
