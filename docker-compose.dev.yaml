# =============================================================================
# Superhuman Remote Worker - Development Infrastructure
# =============================================================================
#
# Databases, workspace containers, and supporting services for local
# development.  Run agent, orchestrator, and cockpit locally with hot-reload
# while workspace containers provide the same SSH/SFTP environment as
# production (Docker Compose stack or Kubernetes).
#
# Quick start:
#   1. cp .env.example .env              # Fill in API keys
#   2. podman-compose -f docker-compose.dev.yaml up -d
#   3. cd orchestrator && uvicorn main:app --reload --port 8085
#   4. python agent.py --port 8001
#   5. cd cockpit && npm start
#
# WORKSPACE_HOSTS and SSH_KEY_PATH are auto-detected by the orchestrator
# when the dev compose SSH key (.dev/ssh-keys/id_ed25519) exists on disk.
# No manual exports needed — see DockerProvisioner.connect().
#
# The orchestrator auto-detects Docker Compose mode (k8s API unreachable)
# and assigns workspace containers from the pool defined by WORKSPACE_HOSTS.
# Agents SSH into them using the shared key at SSH_KEY_PATH — identical to
# the production remote backend path.
#
# VPN services publish ports to the host so locally-running agents can reach
# the LLM cluster and research proxy.  Set these in .env for local dev:
#   LLM_BASE_URL=http://localhost:8080/v1
#   WORKSTATION_BASE_URL=http://localhost:8090/v1  (embeddings, vision, whisper, TTS)
#   RESEARCH_PROXY_TYPE=socks5
#   RESEARCH_PROXY_HOST=localhost
#   RESEARCH_PROXY_PORT=1080
#
# Start only databases (no workspaces):
#   podman-compose -f docker-compose.dev.yaml up -d postgres postgres-vector mongodb
#
# Start databases + MCP:
#   podman-compose -f docker-compose.dev.yaml up -d postgres postgres-vector mongodb mcp
#
# Start Codex OAuth proxy (for codex/* models via ChatGPT subscription):
#   podman-compose -f docker-compose.dev.yaml up -d codex-proxy
#   # First run: authenticate via SSH tunnel + browser (see docs)
#
# =============================================================================

name: superhuman-remote-worker

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg15
    container_name: srw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srw_password}
      POSTGRES_DB: ${POSTGRES_DB:-srw}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./orchestrator/database/init_sso_dbs.sh:/docker-entrypoint-initdb.d/000_init_sso_dbs.sh:Z
      - ./orchestrator/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:Z
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-vector:
    image: docker.io/pgvector/pgvector:pg15
    container_name: srw-postgres-vector
    environment:
      POSTGRES_USER: ${VECTOR_POSTGRES_USER:-srw}
      POSTGRES_PASSWORD: ${VECTOR_POSTGRES_PASSWORD:-srw_password}
      POSTGRES_DB: ${VECTOR_POSTGRES_DB:-srw_vector}
    volumes:
      - postgres_vector_dev_data:/var/lib/postgresql/data
      - ./orchestrator/database/vector_schema.sql:/docker-entrypoint-initdb.d/001_vector_schema.sql:Z
    ports:
      - "${VECTOR_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_POSTGRES_USER:-srw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: docker.io/library/mongo:7
    container_name: srw-mongodb
    environment:
      MONGO_INITDB_DATABASE: srw_logs
    volumes:
      - mongodb_dev_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: srw-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@srw.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: docker.io/library/neo4j:5
    container_name: srw-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_dev_data:/data
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:-neo4j}", "-p", "${NEO4J_PASSWORD:-neo4j_password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: docker.io/library/mongo-express:latest
    container_name: srw-mongo-express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  nats:
    image: docker.io/nats:2.10-alpine
    container_name: srw-nats
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_dev_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gitea:
    image: docker.io/gitea/gitea:1.22-rootless
    container_name: srw-gitea
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /var/lib/gitea/data/gitea.db
      GITEA__server__ROOT_URL: http://localhost:3000
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "false"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__service__ENABLE_CAPTCHA: "false"
      GITEA__service__AUTO_WATCH_NEW_REPOS: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__UPDATE_EXISTING: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      # Bootstrap env vars (used by entrypoint wrapper)
      GITEA_ADMIN_USER: "${GITEA_ADMIN_USER:-srw}"
      GITEA_ADMIN_PASSWORD: "${GITEA_ADMIN_PASSWORD:-srw_gitea}"
      GITEA_OIDC_CLIENT_SECRET: "${GITEA_OIDC_CLIENT_SECRET:-gitea-client-secret}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Start Gitea in the background
        /usr/local/bin/docker-entrypoint.sh &
        GITEA_PID=$$!
        # Wait for Gitea to be ready
        until wget -qO- http://localhost:3000/api/v1/version >/dev/null 2>&1; do sleep 2; done
        # Create admin user (idempotent)
        gitea admin user create --admin \
          --username "$$GITEA_ADMIN_USER" \
          --password "$$GITEA_ADMIN_PASSWORD" \
          --email "$${GITEA_ADMIN_USER}@srw.local" \
          --must-change-password=false 2>/dev/null || true
        # Wait for Keycloak to be reachable before OIDC setup
        until wget -qO- http://srw-keycloak:8080/realms/srw/.well-known/openid-configuration >/dev/null 2>&1; do sleep 3; done
        # Register Keycloak OIDC if not already present
        if ! gitea admin auth list 2>/dev/null | grep -q "Keycloak"; then
          KI="http://srw-keycloak:8080"
          KP="http://localhost:${KEYCLOAK_PORT:-8180}"
          R="srw"
          gitea admin auth add-oauth \
            --name "Keycloak" --provider "openidConnect" \
            --key "gitea" --secret "$$GITEA_OIDC_CLIENT_SECRET" \
            --auto-discover-url "$${KI}/realms/$${R}/.well-known/openid-configuration" \
            --use-custom-urls \
            --custom-auth-url "$${KP}/realms/$${R}/protocol/openid-connect/auth" \
            --custom-token-url "$${KI}/realms/$${R}/protocol/openid-connect/token" \
            --custom-profile-url "$${KI}/realms/$${R}/protocol/openid-connect/userinfo" \
            --group-claim-name "groups" --admin-group "admin" \
            --skip-local-2fa 2>/dev/null || true
        fi
        # Wait for Gitea process
        wait $$GITEA_PID
    volumes:
      - gitea_dev_data:/var/lib/gitea
    ports:
      - "${GITEA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: srw-keycloak
    command: start-dev --import-realm
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Hostname — front-channel URLs use localhost so the browser can reach them.
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC allows container-to-container backchannel
      # requests (e.g. Gitea token exchange) to use the internal hostname.
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      # Admin console credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # SMTP — Proton Bridge on host machine (set in .env)
      SMTP_HOST: "${SMTP_HOST:-host.containers.internal}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    volumes:
      # Copy realm-export.json.example to realm-export.json and edit credentials.
      # See docker/keycloak/realm-export.json.example for the template.
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/srw-realm.json:ro,Z
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  nextcloud:
    image: docker.io/library/nextcloud:31-apache
    container_name: srw-nextcloud
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      SQLITE_DATABASE: nextcloud
      OVERWRITEPROTOCOL: https
      # OIDC + init hook configuration
      NEXTCLOUD_OIDC_CLIENT_SECRET: "${NEXTCLOUD_OIDC_CLIENT_SECRET:-nextcloud-client-secret}"
      NEXTCLOUD_OIDC_DISCOVERY_URI: "http://keycloak:8080/realms/srw/.well-known/openid-configuration"
      NEXTCLOUD_AGENT_PASSWORD: "${NEXTCLOUD_AGENT_PASSWORD:-agent-service-dev}"
    volumes:
      - nextcloud_dev_data:/var/www/html
      - ./docker/nextcloud/setup-nextcloud.sh:/docker-entrypoint-hooks.d/before-starting/setup-nextcloud.sh:ro
    ports:
      - "${NEXTCLOUD_PORT:-8800}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    image: srw-mcp:dev
    container_name: srw-mcp
    network_mode: host
    environment:
      COCKPIT_API_URL: http://localhost:8085
      MCP_TRANSPORT: http
      MCP_PORT: ${MCP_PORT:-8055}
      MCP_INTERNAL_KEY: ${MCP_INTERNAL_KEY:-dev-internal-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MCP_PORT:-8055}/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  vpn-cluster:
    build:
      context: docker/vpn
      dockerfile: Dockerfile
    image: srw-vpn:dev
    container_name: srw-vpn-cluster
    cap_add:
      - NET_ADMIN
    security_opt:
      - label:disable
    devices:
      - /dev/ppp:/dev/ppp
    ports:
      - "${VPN_LLM_PORT:-8080}:8080"
    environment:
      SOCKS_PORT: 1080
      FORWARD_PORT: 8080
      FORWARD_TARGET: ${VPN_CLUSTER_LLM_ENDPOINT:-}
      VPN_HOST: ${VPN_CLUSTER_HOST:-}
      VPN_PORT: ${VPN_CLUSTER_PORT:-443}
      VPN_REALM: ${VPN_CLUSTER_REALM:-}
      VPN_USER: ${VPN_CLUSTER_USER:-}
      VPN_PASS: ${VPN_CLUSTER_PASS:-}
      VPN_TRUSTED_CERT: ${VPN_CLUSTER_TRUSTED_CERT:-}
    healthcheck:
      test: ps aux | grep -q '[o]penfortivpn' && ps aux | grep -q '[m]icrosocks'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  vpn-research:
    build:
      context: docker/vpn
      dockerfile: Dockerfile
    image: srw-vpn:dev
    container_name: srw-vpn-research
    cap_add:
      - NET_ADMIN
    security_opt:
      - label:disable
    devices:
      - /dev/ppp:/dev/ppp
    ports:
      - "${VPN_SOCKS_PORT:-1080}:1080"
    environment:
      SOCKS_PORT: 1080
      VPN_HOST: ${VPN_RESEARCH_HOST:-}
      VPN_PORT: ${VPN_RESEARCH_PORT:-443}
      VPN_REALM: ${VPN_RESEARCH_REALM:-}
      VPN_USER: ${VPN_RESEARCH_USER:-}
      VPN_PASS: ${VPN_RESEARCH_PASS:-}
      VPN_TRUSTED_CERT: ${VPN_RESEARCH_TRUSTED_CERT:-}
    healthcheck:
      test: ps aux | grep -q '[o]penfortivpn' && ps aux | grep -q '[m]icrosocks'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  vpn-workstation:
    build:
      context: docker/vpn
      dockerfile: Dockerfile
    image: srw-vpn:dev
    container_name: srw-vpn-workstation
    cap_add:
      - NET_ADMIN
    security_opt:
      - label:disable
    devices:
      - /dev/ppp:/dev/ppp
    ports:
      - "${VPN_WORKSTATION_PORT_HOST:-8090}:8080"
    environment:
      SOCKS_PORT: 1080
      FORWARD_PORT: 8080
      FORWARD_TARGET: ${VPN_WORKSTATION_ENDPOINT:-10.18.2.105:8090}
      VPN_HOST: ${VPN_WORKSTATION_HOST:-}
      VPN_PORT: ${VPN_WORKSTATION_PORT:-443}
      VPN_REALM: ${VPN_WORKSTATION_REALM:-}
      VPN_USER: ${VPN_WORKSTATION_USER:-}
      VPN_PASS: ${VPN_WORKSTATION_PASS:-}
      VPN_TRUSTED_CERT: ${VPN_WORKSTATION_TRUSTED_CERT:-}
    healthcheck:
      test: ps aux | grep -q '[o]penfortivpn' && ps aux | grep -q '[m]icrosocks'
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # S3-compatible object store (MinIO) — VM snapshots + IDE sessions
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: srw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-srw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-srw_password}
    volumes:
      - minio_dev_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Workspace containers (Docker Compose mode)
  # ---------------------------------------------------------------------------
  # Pre-provisioned workspaces that the locally-running orchestrator assigns
  # to jobs via DockerProvisioner.  SSH ports are published to the host so
  # the locally-running agent can reach them.
  #
  # Set in .env or export before starting the orchestrator:
  #   WORKSPACE_HOSTS=localhost:2201,localhost:2202,localhost:2203
  #   SSH_KEY_PATH=.dev/ssh-keys/id_ed25519
  ssh-keygen:
    image: docker.io/library/alpine:3
    container_name: srw-ssh-keygen
    command: >
      sh -c '
        if [ ! -f /keys/id_ed25519 ]; then
          apk add --no-cache openssh-keygen &&
          ssh-keygen -t ed25519 -f /keys/id_ed25519 -N "" -C "agent@srw" &&
          cat /keys/id_ed25519.pub > /keys/authorized_keys &&
          cp /keys/id_ed25519.pub /keys/ssh-publickey &&
          chmod 600 /keys/id_ed25519 &&
          chmod 644 /keys/authorized_keys /keys/ssh-publickey;
        fi
      '
    volumes:
      - ./.dev/ssh-keys:/keys
    restart: "no"

  workspace-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace
    image: srw-workspace:dev
    container_name: srw-workspace-1
    environment:
      WORKSPACE_ID: "1"
    volumes:
      - ./.dev/ssh-keys:/tmp/ssh-pubkey:ro
    ports:
      - "${WORKSPACE_1_SSH_PORT:-2201}:22"
      - "${WORKSPACE_1_IDE_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  workspace-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace
    image: srw-workspace:dev
    container_name: srw-workspace-2
    environment:
      WORKSPACE_ID: "2"
    volumes:
      - ./.dev/ssh-keys:/tmp/ssh-pubkey:ro
    ports:
      - "${WORKSPACE_2_SSH_PORT:-2202}:22"
      - "${WORKSPACE_2_IDE_PORT:-18082}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  workspace-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace
    image: srw-workspace:dev
    container_name: srw-workspace-3
    environment:
      WORKSPACE_ID: "3"
    volumes:
      - ./.dev/ssh-keys:/tmp/ssh-pubkey:ro
    ports:
      - "${WORKSPACE_3_SSH_PORT:-2203}:22"
      - "${WORKSPACE_3_IDE_PORT:-18083}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # QEMU VMs (optional, Linux only — requires /dev/kvm)
  # ---------------------------------------------------------------------------
  # Uncomment to enable VM workspaces via QEMU-in-Docker.  Requires:
  #   - Linux host with /dev/kvm (hardware virtualization)
  #   - agent-vm-base.qcow2 built by Packer (docker/agent-vm-base/)
  #   - VM_HOSTS=localhost:2211 in .env (or exported before starting orchestrator)
  #
  # Build the image first:
  #   cd docker/agent-vm-base && packer build agent-vm-base.pkr.hcl
  #
  # agent-vm-1:
  #   image: qemux/qemu
  #   container_name: srw-agent-vm-1
  #   devices:
  #     - /dev/kvm
  #     - /dev/net/tun
  #   cap_add:
  #     - NET_ADMIN
  #   environment:
  #     BOOT: /disk/agent-vm-base.qcow2
  #     RAM_SIZE: ${VM_RAM:-4G}
  #     CPU_CORES: ${VM_CPUS:-4}
  #     DISK_FMT: qcow2
  #     DISK_IO: native
  #     DISK_CACHE: none
  #   volumes:
  #     - ./docker/agent-vm-base/output/agent-vm-base.qcow2:/disk/agent-vm-base.qcow2:ro
  #     - vm_1_dev_disk:/storage
  #   ports:
  #     - "${VM_1_SSH_PORT:-2211}:22"
  #   healthcheck:
  #     test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  #     start_period: 60s
  #   stop_grace_period: 2m
  #   restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Container log viewer (Dozzle)
  # ---------------------------------------------------------------------------
  # Socket path varies by runtime:
  #   Rootless Podman: /run/user/<UID>/podman/podman.sock  (default below)
  #   Rootful Podman:  /run/podman/podman.sock
  #   Docker:          /var/run/docker.sock
  codex-proxy:
    image: docker.io/eceasy/cli-proxy-api:latest
    pull_policy: always
    container_name: srw-codex-proxy
    environment:
      MANAGEMENT_PASSWORD: ${CODEX_MANAGEMENT_KEY:-}
    ports:
      - "${CODEX_PROXY_PORT:-8317}:8317"
      - "${CODEX_OAUTH_PORT:-1455}:1455"
    volumes:
      - ./docker/codex-proxy/config.yaml:/CLIProxyAPI/config.yaml:Z
      - codex_proxy_auths:/root/.cli-proxy-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8317/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  dozzle:
    image: docker.io/amir20/dozzle:latest
    container_name: srw-dozzle
    security_opt:
      - label:disable
    environment:
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /run/user/${HOST_UID:-1000}/podman/podman.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    restart: unless-stopped

volumes:
  postgres_dev_data:
    name: srw_postgres_dev_data
  postgres_vector_dev_data:
    name: srw_postgres_vector_dev_data
  mongodb_dev_data:
    name: srw_mongodb_dev_data
  neo4j_dev_data:
    name: srw_neo4j_dev_data
  nats_dev_data:
    name: srw_nats_dev_data
  gitea_dev_data:
