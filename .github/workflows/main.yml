name: main

# Full CI/CD pipeline for the main branch.
#
# Every push to main runs ALL lint, tests, and builds (not change-based).
# Lint and test failures block builds. On success: all images are rebuilt
# with :sha, :latest, and :vX.Y.Z tags, the Helm chart is published to
# OCI under its real name (superhuman-remote-worker), and a git tag is pushed.
#
# PRs to main run the full pipeline INCLUDING image builds, but skip the
# registry push (no login, no version tagging, no chart release). This
# catches Dockerfile / Packer breakages before they reach main and block
# the release process. Trade-off: PR feedback is slower, but a broken
# build post-merge is far more expensive than waiting for the build pre-merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Lowercased repo path for GHCR cache refs. github.repository preserves
  # GitHub's case-sensitive name (e.g. Knaeckebrothero/Uni-Projekt-Graph-RAG),
  # but GHCR rejects uppercase image paths. docker/metadata-action handles
  # this for production tags; YAML expressions can't lowercase, so we hardcode.
  # Update this if the repo is renamed.
  REPO_LOWER: knaeckebrothero/uni-projekt-graph-rag

jobs:
  # ---------------------------------------------------------------------------
  # Lint — blocking on main (code should already be formatted from develop)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.14.10
      - name: Ruff lint
        run: ruff check src/ orchestrator/ tests/
      - name: Ruff format check
        run: ruff format --check src/ orchestrator/ tests/
      - name: Verify Playwright pin consistency
        run: |
          PIN=$(tr -d '[:space:]' < .playwright-version)
          test -n "$PIN" || { echo "::error::.playwright-version is empty"; exit 1; }
          grep -q "^playwright==${PIN}\b" requirements.txt \
            || { echo "::error::playwright pin in requirements.txt does not match .playwright-version (${PIN})"; exit 1; }
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Helm lint (home cluster scenario)
        run: helm lint helm/ -f helm/ci/test-values.yaml
      - name: Helm lint (customer external-services scenario)
        run: helm lint helm/ -f helm/ci/customer-external-values.yaml

  # ---------------------------------------------------------------------------
  # CodeQL — static analysis for security vulnerabilities
  # NOTE: CodeQL upload requires GitHub Advanced Security on private repos.
  # continue-on-error keeps the pipeline green until the repo is public.
  # ---------------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Dependency audit
  # ---------------------------------------------------------------------------
  dependency-audit:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Install pip-audit
        run: uv pip install --system pip-audit
      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt
      - name: Audit Python dependencies
        run: >-
          pip-audit --desc
          --ignore-vuln CVE-2026-4539
          --ignore-vuln CVE-2026-25645
          --ignore-vuln CVE-2026-3219
      - name: Audit npm dependencies
        working-directory: cockpit
        run: |
          npm audit --json | python3 -c "
          import json, sys
          IGNORE_ADVISORIES = {'GHSA-r5fr-rjxr-66jc', 'GHSA-f23m-r3pf-42rh'}
          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {})

          ignored_pkgs = set()
          changed = True
          while changed:
              changed = False
              for name, vuln in vulns.items():
                  if name in ignored_pkgs:
                      continue
                  dominated = True
                  for v in vuln.get('via', []):
                      if isinstance(v, dict):
                          ghsa = v.get('url', '').split('/')[-1]
                          if ghsa not in IGNORE_ADVISORIES:
                              dominated = False
                              break
                      elif isinstance(v, str) and v not in ignored_pkgs:
                          dominated = False
                          break
                  if dominated:
                      ignored_pkgs.add(name)
                      changed = True

          found = 0
          for name, vuln in vulns.items():
              if name in ignored_pkgs:
                  continue
              if vuln.get('severity') in ('high', 'critical'):
                  found += 1
                  print(f'{name}: {vuln[\"severity\"]}')
          if found:
              print(f'{found} unignored high/critical vulnerabilities')
              sys.exit(1)
          print('npm audit passed (ignored advisories: ' + ', '.join(IGNORE_ADVISORIES) + ')')
          "

  # ---------------------------------------------------------------------------
  # Python tests — always run on main (not change-based)
  # ---------------------------------------------------------------------------
  test-python:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r orchestrator/requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -x -q --tb=short

  # ---------------------------------------------------------------------------
  # Cockpit (Angular) tests — always run on main
  # ---------------------------------------------------------------------------
  test-cockpit:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Install dependencies
        working-directory: cockpit
        run: npm ci
      - name: Check i18n parity
        working-directory: cockpit
        run: npm run i18n:check
      - name: Run tests
        working-directory: cockpit
        run: npm test

  # ---------------------------------------------------------------------------
  # Auto patch-bump version from last git v-tag
  # ---------------------------------------------------------------------------
  resolve-version:
    needs: [lint, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next patch version
        id: bump
        run: |
          git fetch --tags --force
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST" ]; then
            LAST="v0.0.0"
          fi
          MAJOR=$(echo "${LAST#v}" | cut -d. -f1)
          MINOR=$(echo "${LAST#v}" | cut -d. -f2)
          PATCH=$(echo "${LAST#v}" | cut -d. -f3)
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "Last tag: $LAST -> next: v$NEW"

  # ---------------------------------------------------------------------------
  # Image builds — run on main pushes AND on PRs to main.
  # On push: build + push (sha + latest + version tags), full release flow.
  # On PR: build only — no docker login, no version tag, no registry push.
  # The Packer / Dockerfile invocations themselves still execute, which is
  # the whole point: we catch broken builds before merge instead of after.
  # All require lint + dep-audit + tests to pass.
  # ---------------------------------------------------------------------------
  build-agent:
    needs: [lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
      - id: short_sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.agent
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true
          build-args: |
            BUILD_SHA=${{ steps.short_sha.outputs.sha }}

  build-orchestrator:
    needs: [lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.orchestrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-orchestrator:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-orchestrator:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-cockpit:
    needs: [lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cockpit
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.cockpit
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-cockpit:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-cockpit:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-mcp:
    needs: [lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mcp
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.mcp
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-mcp:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-mcp:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-workspace:
    needs: [lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-workspace
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
      - name: Read Playwright version
        id: pw
        run: echo "version=$(tr -d '[:space:]' < .playwright-version)" >> "$GITHUB_OUTPUT"
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.workspace
          build-args: |
            PLAYWRIGHT_VERSION=${{ steps.pw.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-workspace:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-workspace:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-sudo-gate:
    needs: [lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build sudo-gated (Go daemon)
        working-directory: vm/sudo-daemon
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=sha-${GITHUB_SHA::7}" \
            -o sudo-gated ./cmd/sudo-gated/
          file sudo-gated
          ls -lh sudo-gated
      - name: Build sudo_gate.so (C plugin)
        working-directory: vm/sudo-plugin
        run: |
          gcc -fPIC -shared -Wall -Wextra -Werror -O2 -I./include \
            -o sudo_gate.so sudo_gate.c json_util.c
          file sudo_gate.so
          ls -lh sudo_gate.so
      - name: Upload sudo gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudo-gate-binaries
          path: |
            vm/sudo-daemon/sudo-gated
            vm/sudo-plugin/sudo_gate.so
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 1: heavy, stable provisioning. On main, runs on push only — PR
  # validation re-uses the existing GHCR :latest stage1 image, which makes PRs
  # to main much faster (only stage2 rebuilds). Cron refresh runs in
  # stage1-rebuild.yml so the baseline never drifts more than a week.
  # ---------------------------------------------------------------------------
  build-agent-vm-base-stage1:
    needs: [lint, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      - name: Compute cloud image cache key
        id: img-key
        run: echo "key=ubuntu-noble-cloudimg-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Ubuntu cloud image
        id: cloud-image-cache
        uses: actions/cache@v4
        with:
          path: docker/agent-vm-base/input/noble-server-cloudimg-amd64.img
          key: ${{ steps.img-key.outputs.key }}
      - name: Download Ubuntu cloud image
        if: steps.cloud-image-cache.outputs.cache-hit != 'true'
        working-directory: docker/agent-vm-base
        run: |
          mkdir -p input
          wget -q https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img \
            -O input/noble-server-cloudimg-amd64.img
      - name: Verify Ubuntu cloud image
        working-directory: docker/agent-vm-base
        run: qemu-img info input/noble-server-cloudimg-amd64.img
      - name: Packer init (stage1)
        working-directory: docker/agent-vm-base
        run: packer init stage1.pkr.hcl
      - name: Packer build (stage1)
        working-directory: docker/agent-vm-base
        run: |
          PW_VERSION=$(tr -d '[:space:]' < ../../.playwright-version)
          test -n "$PW_VERSION" || { echo "::error::.playwright-version is empty"; exit 1; }
          for attempt in 1 2; do
            if packer build -var "playwright_version=${PW_VERSION}" stage1.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage1 packer build attempt ${attempt} failed"
            rm -rf output-stage1
          done
          echo "::error::Stage1 packer build failed after 2 attempts"
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push stage1 containerDisk
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1" | tr '[:upper:]' '[:lower:]')
          TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}" "${IMAGE}:latest")
          BUILD_ARGS=()
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk-stage1 .
          for T in "${TAGS[@]}"; do docker push "$T"; done
          printf 'Pushed stage1:\n'; printf '  %s\n' "${TAGS[@]}"

  # ---------------------------------------------------------------------------
  # Stage 2: light per-commit layer. Pulls the stage1 containerDisk from GHCR
  # (skipped on PRs — uses existing :latest), extracts the qcow2, and layers
  # stage2 on top via stage2.pkr.hcl. ~5-10 min wall-clock.
  # ---------------------------------------------------------------------------
  build-agent-vm-base:
    needs: [lint, dependency-audit, test-python, test-cockpit, build-sudo-gate, resolve-version, build-agent-vm-base-stage1]
    if: >-
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      needs.build-sudo-gate.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped') &&
      (needs.build-agent-vm-base-stage1.result == 'success' || needs.build-agent-vm-base-stage1.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fail if sudo-gate build failed
        if: needs.build-sudo-gate.result == 'failure'
        run: |
          echo "::error::build-sudo-gate failed — refusing to build VM image without gate binaries"
          exit 1
      - uses: actions/checkout@v4
      - name: Download sudo gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: sudo-gate-binaries
          path: docker/agent-vm-base/files/
        continue-on-error: true
      - name: Prepare sudo gate binaries for Packer
        working-directory: docker/agent-vm-base
        run: |
          if [ -f files/vm/sudo-daemon/sudo-gated ]; then
            mv files/vm/sudo-daemon/sudo-gated files/sudo-gated-bin
            echo "sudo-gated binary ready ($(wc -c < files/sudo-gated-bin) bytes)"
          else
            touch files/sudo-gated-bin
            echo "sudo-gated binary not available — creating empty placeholder"
          fi
          if [ -f files/vm/sudo-plugin/sudo_gate.so ]; then
            mv files/vm/sudo-plugin/sudo_gate.so files/sudo_gate.so
            echo "sudo_gate.so ready ($(wc -c < files/sudo_gate.so) bytes)"
          else
            touch files/sudo_gate.so
            echo "sudo_gate.so not available — creating empty placeholder"
          fi
          ls -la files/
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      # Login is unconditional here — needed to PULL the stage1 containerDisk
      # from GHCR even on PR validation runs. Push of the final image still
      # gates on push events below.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull stage1 containerDisk and extract qcow2
        working-directory: docker/agent-vm-base
        run: |
          STAGE1_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1:latest" | tr '[:upper:]' '[:lower:]')
          docker pull "$STAGE1_IMAGE"
          # FROM scratch images have no shell so a real CMD doesn't matter — we
          # never start the container, just create-then-cp.
          CID=$(docker create "$STAGE1_IMAGE" /noop 2>/dev/null || docker create "$STAGE1_IMAGE")
          mkdir -p input
          docker cp "$CID":/disk/agent-vm-base-stage1.qcow2 input/agent-vm-base-stage1.qcow2
          docker rm "$CID"
          qemu-img info input/agent-vm-base-stage1.qcow2
      - name: Packer init (stage2)
        working-directory: docker/agent-vm-base
        run: packer init stage2.pkr.hcl
      - name: Packer build (stage2)
        working-directory: docker/agent-vm-base
        run: |
          for attempt in 1 2; do
            if packer build stage2.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage2 packer build attempt ${attempt} failed"
            rm -rf output
          done
          echo "::error::Stage2 packer build failed after 2 attempts"
          exit 1
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }} containerDisk image
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR validation: build with a single throwaway tag, no push.
            TAGS=("${IMAGE}:pr-validate-${GITHUB_SHA::7}")
          else
            TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}" "${IMAGE}:latest" "${IMAGE}:${{ needs.resolve-version.outputs.tag }}")
          fi
          BUILD_ARGS=()
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for T in "${TAGS[@]}"; do docker push "$T"; done
            printf 'Pushed:\n'; printf '  %s\n' "${TAGS[@]}"
          else
            printf 'Built (PR validation, not pushed):\n'; printf '  %s\n' "${TAGS[@]}"
          fi

  build-vm-controller:
    needs: [lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vm-controller
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: ./vm/controller
          file: ./vm/controller/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  # ---------------------------------------------------------------------------
  # Package and publish Helm chart at the auto-bumped version.
  # Git tag goes LAST so a failed chart push doesn't leave dangling tags.
  # ---------------------------------------------------------------------------
  release-chart:
    name: Package and publish Helm chart
    needs: [resolve-version, build-agent, build-orchestrator, build-cockpit, build-mcp, build-workspace, build-vm-controller, build-agent-vm-base]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.resolve-version.result == 'success' &&
      needs.build-agent.result == 'success' &&
      needs.build-orchestrator.result == 'success' &&
      needs.build-cockpit.result == 'success' &&
      needs.build-mcp.result == 'success' &&
      needs.build-agent-vm-base.result == 'success' &&
      !contains(needs.build-workspace.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Package both charts
        run: |
          mkdir -p dist
          for chart_dir in helm helm-vm-cluster; do
            helm package "${chart_dir}/" \
              --version "${{ needs.resolve-version.outputs.version }}" \
              --app-version "${{ needs.resolve-version.outputs.version }}" \
              --destination ./dist
          done
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push both charts to OCI registry
        run: |
          # Chart names are stable; use them directly to find the .tgz
          # produced by `helm package` (named <chart-name>-<version>.tgz).
          for chart_name in superhuman-remote-worker superhuman-remote-worker-vm-cluster; do
            helm push "./dist/${chart_name}-${{ needs.resolve-version.outputs.version }}.tgz" \
              oci://ghcr.io/knaeckebrothero/charts
          done
      - name: Push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.resolve-version.outputs.tag }}" \
            -m "Release ${{ needs.resolve-version.outputs.tag }}"
          git push origin "${{ needs.resolve-version.outputs.tag }}"
