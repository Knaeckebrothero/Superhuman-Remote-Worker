# CloudNativePG operand image (PostgreSQL + pgvector).
#
# Deliberately NOT part of develop.yml's per-commit image matrix. `imageName`
# is part of the CloudNativePG Cluster spec, so publishing a new tag on every
# push and pointing the chart at it would trigger a rolling restart of every
# Postgres cluster in the fleet on every merge.
#
# It therefore builds only when its Dockerfile changes, or on demand, and it
# publishes a fixed version tag rather than sha-*. Bumping the PostgreSQL
# version is a deliberate act: edit the Dockerfile AND the tag below AND
# databases.*.cnpgImage in helm/values.yaml, together, in one commit.
name: postgres-image

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - docker/Dockerfile.postgres
      - .github/workflows/postgres-image.yml
  pull_request:
    paths:
      - docker/Dockerfile.postgres
      - .github/workflows/postgres-image.yml

env:
  REGISTRY: ghcr.io
  # Must equal the tag in docker/Dockerfile.postgres' base image and the pin in
  # helm/values.yaml. CNPG parses this as a PostgreSQL version and refuses
  # downgrades on it, so it must be the real version inside the image.
  OPERAND_TAG: "16.15"

jobs:
  build-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.postgres
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/knaeckebrothero/superhuman-remote-worker-postgres:${{ env.OPERAND_TAG }}

      # A tag that lies is worse than no tag: CNPG refuses downgrades based on
      # it, and an operand whose real major differs from the claim will fail in
      # ways that look like operator bugs. Check the image, not the Dockerfile.
      - name: Verify the tag matches the PostgreSQL inside, and the operand contract holds
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${REGISTRY}/knaeckebrothero/superhuman-remote-worker-postgres:${OPERAND_TAG}"
          ACTUAL=$(docker run --rm "$IMAGE" postgres --version | awk '{print $3}')
          echo "tag=${OPERAND_TAG} image=${ACTUAL}"
          [ "$ACTUAL" = "$OPERAND_TAG" ] || {
            echo "::error::tag ${OPERAND_TAG} does not match PostgreSQL ${ACTUAL} in the image"
            exit 1
          }
          for binary in initdb postgres pg_ctl pg_controldata pg_basebackup du; do
            docker run --rm "$IMAGE" sh -c "command -v $binary" >/dev/null || {
              echo "::error::CloudNativePG operand contract needs $binary on PATH"
              exit 1
            }
          done
          docker run --rm "$IMAGE" sh -c \
            'cat /usr/share/postgresql/*/extension/vector.control' | grep -q default_version || {
            echo "::error::pgvector is missing from the operand image"
            exit 1
          }
