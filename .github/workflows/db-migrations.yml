name: db-migrations

# Gate for changes under orchestrator/database/migrations/**.
#
# Runs three jobs in parallel:
#   1. squawk      — static lint of the SQL diff (lock safety, missing
#                    NOT VALID, non-concurrent indexes, etc.)
#   2. dry-run     — apply every migration to a fresh pgvector/pgvector:pg16
#                    service container (transactional pass rolls back; non-tx
#                    migrations are skipped under --dry-run)
#   3. uniqueness  — refuse duplicate NNNN_ prefixes within each migrations
#                    subdirectory
#
# Design rationale: see docs/db_migration.md §Testing & CI.

on:
  push:
    branches: [develop, main]
    paths:
      - 'orchestrator/database/migrations/**.sql'
      - 'orchestrator/database/migrate.py'
      - '.github/workflows/db-migrations.yml'
      - '.squawk.toml'
  pull_request:
    paths:
      - 'orchestrator/database/migrations/**.sql'
      - 'orchestrator/database/migrate.py'
      - '.github/workflows/db-migrations.yml'
      - '.squawk.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Squawk's GitHub Action posts findings as PR comments, which requires
# write access to issues/pull-requests on top of the default read-only
# token. Granted at the workflow level so the comment-posting step doesn't
# 403 on PR runs (and to avoid having to repeat it per job).
permissions:
  contents: read
  pull-requests: write

jobs:
  squawk:
    name: lint (squawk)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Until the first real migration lands as 0002_*.sql, the only files
      # matching the action's glob are the two 0001_initial.sql snapshots,
      # which `.squawk.toml` excludes. Squawk then errors with "Failed to
      # find files for provided patterns" and exits 1. Its TOML doesn't
      # expose a knob for this and the v2 action doesn't pass through CLI
      # flags, so short-circuit here when there's nothing to lint.
      - name: Detect lintable migrations
        id: detect
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=()
          for f in orchestrator/database/migrations/**/*.sql; do
            [[ "$(basename "$f")" == 0001_initial.sql ]] && continue
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No non-snapshot migrations present; skipping squawk."
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi
      # `.squawk.toml` at repo root is auto-discovered by squawk by walking
      # up from the cwd — no `config` input needed (and the v2 action
      # doesn't accept one anyway).
      - uses: sbdchd/squawk-action@v2
        if: steps.detect.outputs.has_files == 'true'
        with:
          pattern: "orchestrator/database/migrations/**/*.sql"
          version: "latest"
          fail-on-violations: true

  dry-run:
    name: dry-run on pgvector/pgvector:pg16
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # pgvector/pgvector:pg16 is the canonical "Postgres 16 + pgvector"
      # build. The vector DB's 0001_initial.sql declares vector(4096) on
      # source_embeddings, so the stock postgres:16 image fails on
      # CREATE EXTENSION vector. This image bundles the extension.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: ci_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet asyncpg
      - name: Create the vector database
        env:
          PGPASSWORD: ci
        run: |
          # 0001_initial.sql declares its own CREATE EXTENSION statements
          # (uuid-ossp on both DBs, vector on the vector DB), so we only
          # need to ensure the second database exists.
          psql -h localhost -U ci -d ci_app -c "CREATE DATABASE ci_vector;"
      - name: Dry-run app migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_app
        run: |
          python orchestrator/database/migrate.py \
            --dir orchestrator/database/migrations/app \
            --dry-run
      - name: Dry-run vector migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_vector
        run: |
          python orchestrator/database/migrate.py \
            --dir orchestrator/database/migrations/vector \
            --dry-run

  uniqueness:
    name: unique NNNN_ prefixes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: No duplicate migration prefixes
        run: |
          set -euo pipefail
          fail=0
          for d in orchestrator/database/migrations/*/; do
            if ls "$d"*.sql >/dev/null 2>&1; then
              dupes=$(ls "$d"*.sql | xargs -n1 basename | awk -F_ '{print $1}' | sort | uniq -d)
              if [ -n "$dupes" ]; then
                echo "ERROR: duplicate prefix(es) in $d: $dupes"
                fail=1
              fi
            fi
          done
          exit $fail
