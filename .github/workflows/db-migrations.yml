name: db-migrations

# Gate for changes under orchestrator/database/migrations/** (plus the schema
# artifacts, the runner and its import surface, and the squawk config).
#
# The trigger list carries database/__init__.py and database/postgres.py even
# though neither is a migration: `python -m database.migrate` loads the package
# __init__, which eagerly imports postgres.py, so a module-scope import there of
# anything outside the runner's install set (asyncpg + cryptography) breaks the
# dry-run and artifact jobs before a single statement reaches Postgres. A
# module-scope `security.access` import — which pulls in FastAPI — did exactly
# that on 2026-08-20. Listing the two files makes that breakage surface on the
# commit that causes it instead of reddening the next, unrelated migration PR.
# postgres.py is large and changes often, so this deliberately trades CI minutes
# for the runner staying importable.
#
# Runs four jobs in parallel:
#   1. squawk      — static lint of the migrations ADDED/MODIFIED by this push
#                    or PR (lock safety, missing NOT VALID, non-concurrent
#                    indexes, etc.). It never re-lints the frozen, already-
#                    applied history: those files can't be edited (the runner's
#                    checksum guard rejects drift), so their findings are
#                    unactionable and would keep the job permanently red.
#   2. dry-run     — dry-run every migration, then really apply the app chain
#                    and exercise the Canvas viewer credential lifecycle on a
#                    fresh pgvector/pgvector:pg15 service container (transactional
#                    dry-run pass rolls back; non-tx migrations are skipped
#                    under --dry-run and included in the real apply)
#   3. artifact    — regenerate the *_current.sql schema artifacts (real apply,
#                    all three families) and fail if they drift from committed
#   4. uniqueness  — refuse duplicate NNNN_ prefixes within each migrations
#                    subdirectory
#
# Design rationale: see knowledge-base/knowledge/db_migration.md §Testing & CI.

on:
  push:
    branches: [develop, main]
    paths:
      - 'orchestrator/database/migrations/**.sql'
      - 'orchestrator/database/migrate.py'
      # Runner import surface, not migrations — see the header note.
      - 'orchestrator/database/__init__.py'
      - 'orchestrator/database/postgres.py'
      - 'orchestrator/database/*_current.sql'
      - 'orchestrator/services/canvas*.py'
      - 'helm/files/canvas-viewer-role.sql'
      - 'scripts/provision-canvas-gateway-database.sh'
      - 'tests/test_canvas_gateway_operator_provision.py'
      - 'tests/test_canvas_gateway_role_sql.py'
      - 'tests/test_canvas_viewer_postgres_integration.py'
      - 'scripts/schema-snapshot.sh'
      - '.github/workflows/db-migrations.yml'
      - '.squawk.toml'
  pull_request:
    paths:
      - 'orchestrator/database/migrations/**.sql'
      - 'orchestrator/database/migrate.py'
      # Runner import surface, not migrations — see the header note.
      - 'orchestrator/database/__init__.py'
      - 'orchestrator/database/postgres.py'
      - 'orchestrator/database/*_current.sql'
      - 'orchestrator/services/canvas*.py'
      - 'helm/files/canvas-viewer-role.sql'
      - 'scripts/provision-canvas-gateway-database.sh'
      - 'tests/test_canvas_gateway_operator_provision.py'
      - 'tests/test_canvas_gateway_role_sql.py'
      - 'tests/test_canvas_viewer_postgres_integration.py'
      - 'scripts/schema-snapshot.sh'
      - '.github/workflows/db-migrations.yml'
      - '.squawk.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repo. squawk now runs the pinned binary directly
# (findings surface in the job log, not as PR comments), so no write scope is
# needed.
permissions:
  contents: read

jobs:
  squawk:
    name: lint (squawk)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Lint ONLY the migrations this push/PR adds or modifies — never the
      # whole frozen history. Applied migrations can't be edited (the runner's
      # checksum guard rejects any drift), so re-linting them just accumulates
      # unactionable findings and keeps the job permanently red. New migrations
      # still get the full rule set before they ever land.
      - name: Lint changed migrations
        env:
          SQUAWK_VERSION: v2.59.0
        run: |
          set -euo pipefail

          # Diff base: the PR's base, or the previous tip of the pushed branch.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Fall back to the parent commit when base is missing / empty / the
          # all-zero sentinel (first push of a branch, force-push, dispatch).
          if [ -z "${base:-}" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse -q --verify HEAD~1 || git rev-parse HEAD)"
          fi

          # Added/Modified migration files only, minus the 0001 bootstrap
          # snapshots (they lint like ALTERs on a hot table but are empty-DB
          # bootstraps; also pinned in .squawk.toml's excluded_paths).
          mapfile -t files < <(
            git diff --name-only --diff-filter=AM "$base" "${{ github.sha }}" \
              -- 'orchestrator/database/migrations/**/*.sql' \
              | grep -v '/0001_initial\.sql$' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No added/modified migrations in this change — nothing to lint."
            exit 0
          fi
          echo "Linting ${#files[@]} changed migration(s):"
          printf '  %s\n' "${files[@]}"

          # Pinned squawk binary (the same tool sbdchd/squawk-action wraps).
          # Invoked directly so we control exactly which files are linted;
          # .squawk.toml at the repo root is auto-discovered.
          curl -fsSL -o /tmp/squawk \
            "https://github.com/sbdchd/squawk/releases/download/${SQUAWK_VERSION}/squawk-linux-x64"
          chmod +x /tmp/squawk
          /tmp/squawk "${files[@]}"

  dry-run:
    name: dry-run on pgvector/pgvector:pg15
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # pgvector/pgvector:pg15 matches the PROD major for the app + vector DBs
      # (helm/values.yaml pins both to pg15). pg_dump/DDL behaviour is
      # major-sensitive, so the gate must run the same major prod does. The
      # vector DB's 0001_initial.sql declares vector(4096) on source_embeddings,
      # so the stock postgres:15 image fails on CREATE EXTENSION vector; this
      # image bundles the extension. (The audit DB is postgres:16 in prod and
      # is covered by the `artifact` job below, which pins each family's major.)
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: ci_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # asyncpg drives the runner; cryptography is pulled in transitively
      # via security.crypto (AESGCM) when database/__init__.py loads postgres.py.
      - run: pip install --quiet asyncpg cryptography 'pydantic>=2.10' pytest pytest-asyncio
      - name: Create the vector database
        env:
          PGPASSWORD: ci
        run: |
          # 0001_initial.sql declares its own CREATE EXTENSION statements
          # (uuid-ossp on both DBs, vector on the vector DB), so we only
          # need to ensure the second database exists.
          psql -h localhost -U ci -d ci_app -c "CREATE DATABASE ci_vector;"
      # Mirror production's import root: Dockerfile.orchestrator copies the
      # contents of orchestrator/ into /app/, so the package treats orchestrator/
      # as the top of sys.path (e.g. `from security.crypto import ...`,
      # `from utils.db_url import ...`). Run the migration runner the same way.
      #
      # That same /app also holds the repository-root `src/` tree (the
      # Dockerfile copies it to /app/src/), so in production ONE sys.path entry
      # resolves both roots. Here they are two directories, and
      # database/__init__.py -> postgres.py imports `src.shared.*` at module
      # scope, so orchestrator/ alone raises ModuleNotFoundError: No module
      # named 'src'. Carrying the workspace in PYTHONPATH reunites the two
      # halves of production's single root — the same reason
      # scripts/schema-snapshot.sh passes REPO_ROOT to its own invocation.
      - name: Dry-run app migrations
        working-directory: orchestrator
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_app
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m database.migrate \
            --dir database/migrations/app \
            --dry-run
      - name: Dry-run vector migrations
        working-directory: orchestrator
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_vector
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m database.migrate \
            --dir database/migrations/vector \
            --dry-run
      - name: Apply app migrations for Canvas viewer lifecycle test
        working-directory: orchestrator
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_app
          PYTHONPATH: ${{ github.workspace }}
        run: python -m database.migrate --dir database/migrations/app
      - name: Exercise Canvas viewer lifecycle against PostgreSQL
        env:
          CANVAS_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_app
          PYTHONPATH: orchestrator:.
        run: >-
          pytest -q
          tests/test_canvas_viewer_postgres_integration.py
          tests/test_canvas_gateway_role_sql.py
          tests/test_canvas_gateway_operator_provision.py

  artifact:
    # The keystone drift gate (HF-1): regenerate the canonical *_current.sql
    # schema artifacts by replaying every migration from zero and fail if they
    # differ from what's committed. Unlike `dry-run`, this does a REAL apply
    # (so the .notx.sql CONCURRENTLY files execute), covers ALL THREE families
    # including audit (net-new — no audit dry-run exists), and pins each
    # family's prod major. See knowledge-base/knowledge/features/database_roadmap.md Phase 2.
    name: schema artifacts fresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The migration runner (driven from the host by schema-snapshot.sh) needs
      # asyncpg; cryptography comes in transitively via security.crypto (AESGCM)
      # when database/__init__.py loads postgres.py.
      - run: pip install --quiet asyncpg cryptography
      # Docker is preinstalled on ubuntu-latest; the script auto-detects it and
      # spins up one throwaway container per family (pgvector:pg15 x2,
      # postgres:16), migrates from zero, and dumps inside the container.
      - name: Regenerate schema artifacts
        run: scripts/schema-snapshot.sh
      # Fail if regeneration changed anything: a migration altered the schema
      # without the author re-running the snapshot, or an artifact was
      # hand-edited (regeneration overwrites hand edits -> diff). `git add -A`
      # first so a brand-new artifact (untracked) is caught too, not just edits.
      - name: Fail on stale or hand-edited artifacts
        run: |
          git add -A orchestrator/database/*_current.sql
          if git diff --cached --quiet -- orchestrator/database/*_current.sql; then
            echo "Schema artifacts are up to date."
          else
            echo "::error::Schema artifacts are stale or hand-edited. Regenerate with: scripts/schema-snapshot.sh && git add -A orchestrator/database/*_current.sql, then commit."
            git --no-pager diff --cached -- orchestrator/database/*_current.sql
            exit 1
          fi

  uniqueness:
    name: unique NNNN_ prefixes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: No duplicate migration prefixes
        run: |
          set -euo pipefail
          fail=0
          for d in orchestrator/database/migrations/*/; do
            if ls "$d"*.sql >/dev/null 2>&1; then
              dupes=$(ls "$d"*.sql | xargs -n1 basename | awk -F_ '{print $1}' | sort | uniq -d)
              if [ -n "$dupes" ]; then
                echo "ERROR: duplicate prefix(es) in $d: $dupes"
                fail=1
              fi
            fi
          done
          exit $fail
