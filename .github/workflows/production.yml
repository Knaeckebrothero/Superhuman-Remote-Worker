name: Production

# Branch model:
#   develop -> CI builds :sha-xxx + :experimental images, updates
#              deployment/values-experimental.yaml, Fleet rolls out to the
#              homelab cluster.
#   main    -> CI auto patch-bumps the last v-tag, builds ALL components with
#              :vX.Y.Z + :latest, packages the Helm chart at that version,
#              pushes chart to OCI, creates the git tag.
#   PRs     -> lint + tests only.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# One pipeline per branch — prevents two back-to-back main pushes from racing
# on the auto-version bump.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.14.10
      - name: Ruff lint
        run: ruff check src/ orchestrator/ tests/
      - name: Ruff format check
        run: ruff format --check src/ orchestrator/ tests/
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Helm lint (home cluster scenario)
        run: helm lint helm/ -f helm/ci/test-values.yaml
      - name: Helm lint (customer external-services scenario)
        run: helm lint helm/ -f helm/ci/customer-external-values.yaml

  # ---------------------------------------------------------------------------
  # CodeQL — static analysis for security vulnerabilities
  # Results appear in the GitHub Security tab
  # NOTE: CodeQL upload requires GitHub Advanced Security on private repos.
  # `continue-on-error` keeps the pipeline green until the repo is public again
  # or we migrate to a self-hosted SAST (e.g. Semgrep on Gitea).
  # ---------------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Dependency audit — check for known CVEs in Python and JS dependencies
  # ---------------------------------------------------------------------------
  dependency-audit:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Install pip-audit
        run: uv pip install --system pip-audit
      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt
      - name: Audit Python dependencies
        # CVE-2026-4539: pygments ReDoS in AdlLexer — local-only, no fix released
        # CVE-2026-25645: requests extract_zipped_paths() temp path — we don't call it;
        #   arxiv pins requests<2.33.0 so we can't upgrade until arxiv releases a fix
        run: >-
          pip-audit --desc
          --ignore-vuln CVE-2026-4539
          --ignore-vuln CVE-2026-25645
      - name: Audit npm dependencies
        working-directory: cockpit
        # lodash-es 4.17.23 is the latest release; no fix available.
        # Transitive via mermaid → langium → chevrotain → lodash-es.
        # GHSA-r5fr-rjxr-66jc: Code Injection via _.template (high)
        # GHSA-f23m-r3pf-42rh: Prototype Pollution via _.unset/_.omit (moderate)
        run: |
          npm audit --json | python3 -c "
          import json, sys
          IGNORE_ADVISORIES = {'GHSA-r5fr-rjxr-66jc', 'GHSA-f23m-r3pf-42rh'}
          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {})

          # Mark packages whose only root-cause advisories are all ignored
          ignored_pkgs = set()
          changed = True
          while changed:
              changed = False
              for name, vuln in vulns.items():
                  if name in ignored_pkgs:
                      continue
                  dominated = True
                  for v in vuln.get('via', []):
                      if isinstance(v, dict):
                          ghsa = v.get('url', '').split('/')[-1]
                          if ghsa not in IGNORE_ADVISORIES:
                              dominated = False
                              break
                      elif isinstance(v, str) and v not in ignored_pkgs:
                          dominated = False
                          break
                  if dominated:
                      ignored_pkgs.add(name)
                      changed = True

          found = 0
          for name, vuln in vulns.items():
              if name in ignored_pkgs:
                  continue
              if vuln.get('severity') in ('high', 'critical'):
                  found += 1
                  print(f'{name}: {vuln[\"severity\"]}')
          if found:
              print(f'{found} unignored high/critical vulnerabilities')
              sys.exit(1)
          print('npm audit passed (ignored advisories: ' + ', '.join(IGNORE_ADVISORIES) + ')')
          "

  # ---------------------------------------------------------------------------
  # Python tests
  # ---------------------------------------------------------------------------
  test-python:
    needs: [lint, changes]
    if: needs.changes.outputs.python-changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r orchestrator/requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -x -q --tb=short

  # ---------------------------------------------------------------------------
  # Cockpit (Angular) tests
  # ---------------------------------------------------------------------------
  test-cockpit:
    needs: [lint, changes]
    if: needs.changes.outputs.cockpit-changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Install dependencies
        working-directory: cockpit
        run: npm ci
      - name: Run tests
        working-directory: cockpit
        run: npm test

  # ---------------------------------------------------------------------------
  # Detect which components changed — build jobs only run when needed
  # workflow_dispatch always builds everything
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.check.outputs.agent }}
      orchestrator: ${{ steps.check.outputs.orchestrator }}
      cockpit: ${{ steps.check.outputs.cockpit }}
      mcp: ${{ steps.check.outputs.mcp }}
      vpn: ${{ steps.check.outputs.vpn }}
      vm-base: ${{ steps.check.outputs.vm-base }}
      vm-controller: ${{ steps.check.outputs.vm-controller }}
      sudo-gate: ${{ steps.check.outputs.sudo-gate }}
      workspace: ${{ steps.check.outputs.workspace }}
      python-changed: ${{ steps.test-paths.outputs.python }}
      cockpit-changed: ${{ steps.test-paths.outputs.cockpit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect test-relevant changes
        id: test-paths
        run: |
          # For PRs, diff against base; for pushes, diff against parent commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif git rev-parse HEAD~1 &>/dev/null; then
            BASE="HEAD~1"
          else
            # Initial commit — run everything
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "cockpit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Python tests: agent code, orchestrator code, test code, configs, deps
          if git diff --name-only "$BASE" HEAD -- \
            'src/' 'orchestrator/' 'tests/' 'config/' 'agent.py' \
            'requirements.txt' 'orchestrator/requirements.txt' \
            | grep -q .; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          # Cockpit tests: Angular source code
          if git diff --name-only "$BASE" HEAD -- 'cockpit/' | grep -q .; then
            echo "cockpit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cockpit=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Test path detection: python=$(grep python "$GITHUB_OUTPUT" | tail -1) cockpit=$(grep cockpit "$GITHUB_OUTPUT" | tail -1)"

      - name: Detect changes against last deployed SHA per component
        id: check
        run: |
          # Extract the deployed image SHA for a component from the Helm values
          # file. Returns the 7-char commit hash, or empty if tag is `latest`
          # or the key is missing — both of which force a rebuild.
          extract_sha() {
            local component="$1"
            grep -A1 "^  ${component}:" deployment/values-experimental.yaml 2>/dev/null \
              | grep -oP 'tag:\s*sha-\K[0-9a-f]{7}' | head -1 || echo ""
          }

          # VM-side images still live in raw manifests (separate bundle).
          extract_sha_raw() {
            local file="$1" component="$2"
            grep -oP "superhuman-remote-worker-${component}:sha-\K[0-9a-f]{7}" "$file" 2>/dev/null | head -1 || echo ""
          }

          # Check whether any of the given paths changed between the deployed
          # SHA and HEAD.  Returns "true" if a rebuild is needed.
          has_changes() {
            local sha="$1"
            shift
            local paths=("$@")

            # No deployed SHA found (first build or tag is "latest") — rebuild
            if [ -z "$sha" ]; then
              echo "true"
              return
            fi

            # SHA not in local history (force-push, squash, etc.) — rebuild
            if ! git cat-file -t "$sha" &>/dev/null; then
              echo "true"
              return
            fi

            # Check each path pattern for changes since last deployment
            for path in "${paths[@]}"; do
              if [ -n "$(git diff --name-only "$sha" HEAD -- "$path")" ]; then
                echo "true"
                return
              fi
            done
            echo "false"
          }

          # --- Extract last-deployed SHAs ----------------------------------
          # Chart components live in deployment/values-experimental.yaml.
          SHA_AGENT=$(extract_sha agent)
          SHA_ORCHESTRATOR=$(extract_sha orchestrator)
          SHA_COCKPIT=$(extract_sha cockpit)
          SHA_MCP=$(extract_sha mcp)
          SHA_VPN=$(extract_sha vpn)
          SHA_WORKSPACE=$(extract_sha workspace)
          # VM-side images live in raw manifests (separate bundle).
          SHA_VM_CONTROLLER=$(extract_sha_raw deployment-vms/srw-vm-controller/vm-controller.yaml vm-controller)
          SHA_VM_BASE=$(extract_sha_raw deployment-vms/srw-vm-controller/vm-controller.yaml agent-vm-base)

          echo "Deployed SHAs:"
          echo "  agent=$SHA_AGENT  orchestrator=$SHA_ORCHESTRATOR  cockpit=$SHA_COCKPIT"
          echo "  mcp=$SHA_MCP  vpn=$SHA_VPN  workspace=$SHA_WORKSPACE"
          echo "  vm-controller=$SHA_VM_CONTROLLER  vm-base=$SHA_VM_BASE"

          # --- Per-component change detection ---------------------------------
          AGENT=$(has_changes "$SHA_AGENT" \
            src/ config/ agent.py requirements.txt docker/Dockerfile.agent)

          ORCHESTRATOR=$(has_changes "$SHA_ORCHESTRATOR" \
            orchestrator/ config/ docker/Dockerfile.orchestrator)

          COCKPIT=$(has_changes "$SHA_COCKPIT" \
            cockpit/ docker/Dockerfile.cockpit)

          MCP=$(has_changes "$SHA_MCP" \
            orchestrator/mcp/ orchestrator/services/formatters.py \
            orchestrator/services/__init__.py docker/Dockerfile.mcp)

          VPN=$(has_changes "$SHA_VPN" \
            docker/vpn/)

          WORKSPACE=$(has_changes "$SHA_WORKSPACE" \
            docker/Dockerfile.workspace docker/workspace-entrypoint.sh)

          VM_CONTROLLER=$(has_changes "$SHA_VM_CONTROLLER" \
            vm/controller/)

          VM_BASE=$(has_changes "$SHA_VM_BASE" \
            docker/agent-vm-base/)

          # sudo-gate artifacts are baked into the VM base image
          SUDO_GATE=$(has_changes "$SHA_VM_BASE" \
            vm/sudo-daemon/ vm/sudo-plugin/)

          echo ""
          echo "Change detection results:"
          echo "  agent=$AGENT  orchestrator=$ORCHESTRATOR  cockpit=$COCKPIT"
          echo "  mcp=$MCP  vpn=$VPN  workspace=$WORKSPACE"
          echo "  vm-controller=$VM_CONTROLLER  vm-base=$VM_BASE  sudo-gate=$SUDO_GATE"

          # --- Write outputs --------------------------------------------------
          {
            echo "agent=$AGENT"
            echo "orchestrator=$ORCHESTRATOR"
            echo "cockpit=$COCKPIT"
            echo "mcp=$MCP"
            echo "vpn=$VPN"
            echo "workspace=$WORKSPACE"
            echo "vm-controller=$VM_CONTROLLER"
            echo "vm-base=$VM_BASE"
            echo "sudo-gate=$SUDO_GATE"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Auto patch-bump on main pushes. Reads the last v-tag and outputs the next
  # patch version (v0.1.1 -> v0.1.2). The git tag itself is NOT pushed here —
  # release-chart creates it at the end, after the chart publishes successfully,
  # so failed builds don't leave half-baked tags in the repo.
  # ---------------------------------------------------------------------------
  resolve-version:
    needs: [lint, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next patch version
        id: bump
        run: |
          git fetch --tags --force
          LAST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST" ]; then
            LAST="v0.0.0"
          fi
          MAJOR=$(echo "${LAST#v}" | cut -d. -f1)
          MINOR=$(echo "${LAST#v}" | cut -d. -f2)
          PATCH=$(echo "${LAST#v}" | cut -d. -f3)
          NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "Last tag: $LAST -> next: v$NEW"

  build-agent:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.agent == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure') &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          echo "=== After cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Agent
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Compute short SHA for build arg
        id: short_sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=max,ignore-error=true
          build-args: |
            BUILD_SHA=${{ steps.short_sha.outputs.sha }}

      - name: Inspect pushed image
        if: success()
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent:sha-${GITHUB_SHA::7}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE"

  build-orchestrator:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.orchestrator == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure') &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Orchestrator
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.orchestrator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Inspect pushed image
        if: success()
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator:sha-${GITHUB_SHA::7}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE"

  build-cockpit:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.cockpit == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure') &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Cockpit
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cockpit
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Cockpit image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.cockpit
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Inspect pushed image
        if: success()
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cockpit:sha-${GITHUB_SHA::7}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE"

  build-mcp:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.mcp == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure') &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for MCP Server
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mcp
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.resolve-version.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push MCP Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Inspect pushed image
        if: success()
        run: |
