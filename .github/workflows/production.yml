  # ---------------------------------------------------------------------------
  # Develop-only: update image tags in deployment/values-experimental.yaml so
  # Fleet renders the chart with the newly built images and rolls them out to
  # the homelab cluster.
  # ---------------------------------------------------------------------------
  update-experimental-deployment:
    needs: [lint, dependency-audit, test-python, test-cockpit, build-agent, build-orchestrator, build-cockpit, build-mcp, build-vpn, build-workspace, build-vm-controller, build-agent-vm-base]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      needs.lint.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure') &&
      needs.dependency-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Compute image tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Update orchestrator tag
        if: needs.build-orchestrator.result == 'success'
        run: yq -i '.image.orchestrator.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update agent tag
        if: needs.build-agent.result == 'success'
        run: yq -i '.image.agent.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update cockpit tag
        if: needs.build-cockpit.result == 'success'
        run: yq -i '.image.cockpit.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update MCP tag
        if: needs.build-mcp.result == 'success'
        run: yq -i '.image.mcp.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update VPN tag
        if: needs.build-vpn.result == 'success'
        run: yq -i '.image.vpn.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update workspace tag
        if: needs.build-workspace.result == 'success'
        run: yq -i '.image.workspace.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update VM controller image tag (separate bundle, still SHA-pinned)
        if: needs.build-vm-controller.result == 'success'
        run: |
          sed -i 's|superhuman-remote-worker-vm-controller:[a-zA-Z0-9_.-]*|superhuman-remote-worker-vm-controller:${{ steps.tag.outputs.sha }}|g' \
            deployment-vms/srw-vm-controller/vm-controller.yaml

      - name: Update agent VM base image tag (separate bundle)
        if: needs.build-agent-vm-base.result == 'success'
        run: |
          sed -i 's|superhuman-remote-worker-agent-vm-base:[a-zA-Z0-9_.-]*|superhuman-remote-worker-agent-vm-base:${{ steps.tag.outputs.sha }}|g' \
            deployment-vms/srw-vm-controller/vm-controller.yaml

      - name: Commit and push
        run: |
          git diff --quiet && { echo "No changes to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/values-experimental.yaml deployment-vms/ || true
          git commit -m "deploy(experimental): update image tags to ${{ steps.tag.outputs.sha }}"
          git push

  # ---------------------------------------------------------------------------
  # Main-only: package the Helm chart at the auto-bumped version, push to OCI,
  # then push the git tag. The git tag goes LAST so a failed chart push doesn't
  # leave dangling tags.
  # ---------------------------------------------------------------------------
  release-chart:
    name: Package and publish Helm chart
    needs: [resolve-version, build-agent, build-orchestrator, build-cockpit, build-mcp, build-vpn, build-workspace, build-vm-controller]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.resolve-version.result == 'success' &&
      needs.build-agent.result == 'success' &&
      needs.build-orchestrator.result == 'success' &&
      needs.build-cockpit.result == 'success' &&
      needs.build-mcp.result == 'success' &&
      !contains(needs.build-vpn.result, 'failure') &&
      !contains(needs.build-workspace.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Package chart
        run: |
          mkdir -p dist
          helm package helm/ \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --app-version "${{ needs.resolve-version.outputs.version }}" \
            --destination ./dist

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to OCI registry
        run: |
          helm push ./dist/superhuman-remote-worker-${{ needs.resolve-version.outputs.version }}.tgz \
            oci://ghcr.io/knaeckebrothero/charts

      # Tag pushed LAST so a failed chart push doesn't leave a dangling git tag.
      - name: Push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.resolve-version.outputs.tag }}" \
            -m "Release ${{ needs.resolve-version.outputs.tag }}"
          git push origin "${{ needs.resolve-version.outputs.tag }}"

