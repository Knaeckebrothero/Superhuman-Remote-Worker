  build-sudo-gate:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit, resolve-version]
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.sudo-gate == 'true' || needs.changes.outputs.vm-base == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.lint.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure') &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build sudo-gated (Go daemon)
        working-directory: vm/sudo-daemon
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=sha-${GITHUB_SHA::7}" \
            -o sudo-gated ./cmd/sudo-gated/
          file sudo-gated
          ls -lh sudo-gated

      - name: Build sudo_gate.so (C plugin)
        working-directory: vm/sudo-plugin
        run: |
          gcc -fPIC -shared -Wall -Wextra -Werror -O2 -I./include \
            -o sudo_gate.so sudo_gate.c json_util.c
          file sudo_gate.so
          ls -lh sudo_gate.so

      - name: Upload sudo gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudo-gate-binaries
          path: |
            vm/sudo-daemon/sudo-gated
            vm/sudo-plugin/sudo_gate.so
          retention-days: 7

  build-agent-vm-base:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit, build-sudo-gate, resolve-version]
    # Rebuild when vm-base OR sudo-gate changes (sudo gate binaries are baked into the image)
    if: >-
      always() && github.event_name != 'pull_request' && (
        needs.changes.outputs.vm-base == 'true' ||
        needs.changes.outputs.sudo-gate == 'true' ||
        github.ref == 'refs/heads/main' ||
        github.event_name == 'workflow_dispatch'
      ) &&
      (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fail if sudo-gate build failed
        # If sudo-gate was supposed to run (changes detected) but failed,
        # don't publish a VM image missing the gate binaries
        if: needs.build-sudo-gate.result == 'failure'
        run: |
          echo "::error::build-sudo-gate failed — refusing to build VM image without gate binaries"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download sudo gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: sudo-gate-binaries
          path: docker/agent-vm-base/files/
        # Allowed to fail when build-sudo-gate was skipped (no changes)
        continue-on-error: true

      - name: Prepare sudo gate binaries for Packer
        working-directory: docker/agent-vm-base
        run: |
          # Move binaries from artifact layout to where Packer expects them.
          # If artifacts weren't downloaded (build-sudo-gate was skipped),
          # create empty placeholders so Packer's file provisioner doesn't fail.
          # provision.sh uses -s (non-empty check) to skip installation.
          if [ -f files/vm/sudo-daemon/sudo-gated ]; then
            mv files/vm/sudo-daemon/sudo-gated files/sudo-gated-bin
            echo "sudo-gated binary ready ($(wc -c < files/sudo-gated-bin) bytes)"
          else
            touch files/sudo-gated-bin
            echo "sudo-gated binary not available — creating empty placeholder"
          fi
          if [ -f files/vm/sudo-plugin/sudo_gate.so ]; then
            mv files/vm/sudo-plugin/sudo_gate.so files/sudo_gate.so
            echo "sudo_gate.so ready ($(wc -c < files/sudo_gate.so) bytes)"
          else
            touch files/sudo_gate.so
            echo "sudo_gate.so not available — creating empty placeholder"
          fi
          ls -la files/

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          echo "=== After cleanup ==="
          df -h /

      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Download Ubuntu cloud image
        working-directory: docker/agent-vm-base
        run: |
          mkdir -p input
          wget -q https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img \
            -O input/noble-server-cloudimg-amd64.img
          qemu-img info input/noble-server-cloudimg-amd64.img

      - name: Packer init
        working-directory: docker/agent-vm-base
        run: packer init agent-vm-base.pkr.hcl

      - name: Packer build
        working-directory: docker/agent-vm-base
        run: packer build agent-vm-base.pkr.hcl

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push containerDisk image
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base" | tr '[:upper:]' '[:lower:]')
          # Base tag: SHA (always). Extras depend on branch.
          TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}")
          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            TAGS+=("${IMAGE}:experimental")
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS+=("${IMAGE}:latest" "${IMAGE}:${{ needs.resolve-version.outputs.tag }}")
          fi
          BUILD_ARGS=()
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk .
          for T in "${TAGS[@]}"; do docker push "$T"; done
          printf 'Pushed:\n'; printf '  %s\n' "${TAGS[@]}"

