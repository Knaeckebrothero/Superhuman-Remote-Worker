name: Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.14.10
      - name: Ruff lint
        run: ruff check src/ orchestrator/ tests/
      - name: Ruff format check
        run: ruff format --check src/ orchestrator/ tests/

  # ---------------------------------------------------------------------------
  # CodeQL — static analysis for security vulnerabilities
  # Results appear in the GitHub Security tab
  # ---------------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Dependency audit — check for known CVEs in Python and JS dependencies
  # ---------------------------------------------------------------------------
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Install pip-audit
        run: uv pip install --system pip-audit
      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt
      - name: Audit Python dependencies
        # CVE-2026-4539: pygments ReDoS in AdlLexer — local-only, no fix released
        # CVE-2026-25645: requests extract_zipped_paths() temp path — we don't call it;
        #   arxiv pins requests<2.33.0 so we can't upgrade until arxiv releases a fix
        run: >-
          pip-audit --desc
          --ignore-vuln CVE-2026-4539
          --ignore-vuln CVE-2026-25645
      - name: Audit npm dependencies
        working-directory: cockpit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Python tests
  # ---------------------------------------------------------------------------
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r orchestrator/requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -x -q --tb=short

  # ---------------------------------------------------------------------------
  # Cockpit (Angular) tests
  # ---------------------------------------------------------------------------
  test-cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Install dependencies
        working-directory: cockpit
        run: npm ci
      - name: Run tests
        working-directory: cockpit
        run: npm test

  # ---------------------------------------------------------------------------
  # Detect which components changed — build jobs only run when needed
  # workflow_dispatch always builds everything
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      cockpit: ${{ steps.filter.outputs.cockpit }}
      mcp: ${{ steps.filter.outputs.mcp }}
      vpn: ${{ steps.filter.outputs.vpn }}
      vm-base: ${{ steps.filter.outputs.vm-base }}
      vm-controller: ${{ steps.filter.outputs.vm-controller }}
      sudo-gate: ${{ steps.filter.outputs.sudo-gate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent:
              - 'src/**'
              - 'config/**'
              - 'agent.py'
              - 'requirements.txt'
              - 'docker/Dockerfile.agent'
            orchestrator:
              - 'orchestrator/**'
              - 'config/**'
              - 'docker/Dockerfile.orchestrator'
            cockpit:
              - 'cockpit/**'
              - 'docker/Dockerfile.cockpit'
            mcp:
              - 'orchestrator/mcp/**'
              - 'orchestrator/services/formatters.py'
              - 'orchestrator/services/__init__.py'
              - 'docker/Dockerfile.mcp'
            vpn:
              - 'docker/vpn/**'
            vm-base:
              - 'docker/agent-vm-base/**'
            vm-controller:
              - 'vm/controller/**'
            sudo-gate:
              - 'vm/sudo-daemon/**'
              - 'vm/sudo-plugin/**'

  build-agent:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          echo "=== After cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Agent
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.agent
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Inspect pushed image
        if: success()
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent:latest" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE"

  build-orchestrator:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.orchestrator == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Orchestrator
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.orchestrator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Inspect pushed image
        if: success()
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator:latest" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE"

  build-cockpit:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.cockpit == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Cockpit
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cockpit
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Cockpit image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.cockpit
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Inspect pushed image
        if: success()
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cockpit:latest" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE"

  build-mcp:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.mcp == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for MCP Server
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mcp
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push MCP Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Inspect pushed image
        if: success()
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mcp:latest" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE"

  build-vpn:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.vpn == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for VPN Sidecar
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vpn
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push VPN Sidecar image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/vpn
          file: ./docker/vpn/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Inspect pushed image
        if: success()
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vpn:latest" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE"

  build-sudo-gate:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.sudo-gate == 'true' || needs.changes.outputs.vm-base == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build sudo-gated (Go daemon)
        working-directory: vm/sudo-daemon
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=sha-${GITHUB_SHA::7}" \
            -o sudo-gated ./cmd/sudo-gated/
          file sudo-gated
          ls -lh sudo-gated

      - name: Build sudo_gate.so (C plugin)
        working-directory: vm/sudo-plugin
        run: |
          gcc -fPIC -shared -Wall -Wextra -Werror -O2 -I./include \
            -o sudo_gate.so sudo_gate.c json_util.c
          file sudo_gate.so
          ls -lh sudo_gate.so

      - name: Upload sudo gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudo-gate-binaries
          path: |
            vm/sudo-daemon/sudo-gated
            vm/sudo-plugin/sudo_gate.so
          retention-days: 7

  build-agent-vm-base:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit, build-sudo-gate]
    # Rebuild when vm-base OR sudo-gate changes (sudo gate binaries are baked into the image)
    if: >-
      always() && github.event_name != 'pull_request' && (
        needs.changes.outputs.vm-base == 'true' ||
        needs.changes.outputs.sudo-gate == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fail if sudo-gate build failed
        # If sudo-gate was supposed to run (changes detected) but failed,
        # don't publish a VM image missing the gate binaries
        if: needs.build-sudo-gate.result == 'failure'
        run: |
          echo "::error::build-sudo-gate failed — refusing to build VM image without gate binaries"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download sudo gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: sudo-gate-binaries
          path: docker/agent-vm-base/files/
        # Allowed to fail when build-sudo-gate was skipped (no changes)
        continue-on-error: true

      - name: Prepare sudo gate binaries for Packer
        working-directory: docker/agent-vm-base
        run: |
          # Move binaries from artifact layout to where Packer expects them.
          # If artifacts weren't downloaded (build-sudo-gate was skipped),
          # create empty placeholders so Packer's file provisioner doesn't fail.
          # provision.sh uses -s (non-empty check) to skip installation.
          if [ -f files/vm/sudo-daemon/sudo-gated ]; then
            mv files/vm/sudo-daemon/sudo-gated files/sudo-gated-bin
            echo "sudo-gated binary ready ($(wc -c < files/sudo-gated-bin) bytes)"
          else
            touch files/sudo-gated-bin
            echo "sudo-gated binary not available — creating empty placeholder"
          fi
          if [ -f files/vm/sudo-plugin/sudo_gate.so ]; then
            mv files/vm/sudo-plugin/sudo_gate.so files/sudo_gate.so
            echo "sudo_gate.so ready ($(wc -c < files/sudo_gate.so) bytes)"
          else
            touch files/sudo_gate.so
            echo "sudo_gate.so not available — creating empty placeholder"
          fi
          ls -la files/

      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
          echo "=== After cleanup ==="
          df -h /

      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Download Ubuntu cloud image
        working-directory: docker/agent-vm-base
        run: |
          mkdir -p input
          wget -q https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img \
            -O input/noble-server-cloudimg-amd64.img
          qemu-img info input/noble-server-cloudimg-amd64.img

      - name: Packer init
        working-directory: docker/agent-vm-base
        run: packer init agent-vm-base.pkr.hcl

      - name: Packer build
        working-directory: docker/agent-vm-base
        run: packer build agent-vm-base.pkr.hcl

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push containerDisk image
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base" | tr '[:upper:]' '[:lower:]')
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:sha-${GITHUB_SHA::7}" -f Dockerfile.containerDisk .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA::7}"
          echo "Pushed ${IMAGE}:latest"

  build-vm-controller:
    needs: [changes, lint, dependency-audit, test-python, test-cockpit]
    if: github.event_name != 'pull_request' && (needs.changes.outputs.vm-controller == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for VM Controller
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vm-controller
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push VM Controller image
        uses: docker/build-push-action@v5
        with:
          context: ./vm/controller
          file: ./vm/controller/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Inspect pushed image
        if: success()
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vm-controller:latest" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools inspect "$IMAGE"

  # ---------------------------------------------------------------------------
  # Update deployment manifests with new image SHA tags
  # Fleet detects the git change and rolls out updated pods automatically
  # ---------------------------------------------------------------------------
  deploy:
    needs: [lint, codeql, dependency-audit, test-python, test-cockpit, build-agent, build-orchestrator, build-cockpit, build-mcp, build-vpn, build-vm-controller, build-agent-vm-base]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      needs.lint.result == 'success' &&
      needs.test-python.result == 'success' &&
      needs.test-cockpit.result == 'success' &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.codeql.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: deploy-manifests
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute image tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Update orchestrator image tag
        if: needs.build-orchestrator.result == 'success'
        run: |
          sed -i 's|superhuman-remote-worker-orchestrator:[a-zA-Z0-9_.-]*|superhuman-remote-worker-orchestrator:${{ steps.tag.outputs.sha }}|g' \
            deployment/20-orchestrator.yaml

      - name: Update agent image tag
        if: needs.build-agent.result == 'success'
        run: |
          sed -i 's|superhuman-remote-worker-agent:[a-zA-Z0-9_.-]*|superhuman-remote-worker-agent:${{ steps.tag.outputs.sha }}|g' \
            deployment/21-agent.yaml

      - name: Update cockpit image tag
        if: needs.build-cockpit.result == 'success'
        run: |
          sed -i 's|superhuman-remote-worker-cockpit:[a-zA-Z0-9_.-]*|superhuman-remote-worker-cockpit:${{ steps.tag.outputs.sha }}|g' \
            deployment/22-cockpit.yaml

      - name: Update MCP image tag
        if: needs.build-mcp.result == 'success'
        run: |
          sed -i 's|superhuman-remote-worker-mcp:[a-zA-Z0-9_.-]*|superhuman-remote-worker-mcp:${{ steps.tag.outputs.sha }}|g' \
            deployment/23-mcp.yaml

      - name: Update VPN image tag
        if: needs.build-vpn.result == 'success'
        run: |
          sed -i 's|superhuman-remote-worker-vpn:[a-zA-Z0-9_.-]*|superhuman-remote-worker-vpn:${{ steps.tag.outputs.sha }}|g' \
            deployment/15-vpn.yaml

      - name: Update VM controller image tag
        if: needs.build-vm-controller.result == 'success'
        run: |
          sed -i 's|superhuman-remote-worker-vm-controller:[a-zA-Z0-9_.-]*|superhuman-remote-worker-vm-controller:${{ steps.tag.outputs.sha }}|g' \
            deployment-vms/srw-vm-controller/vm-controller.yaml

      - name: Update agent VM base image tag
        if: needs.build-agent-vm-base.result == 'success'
        run: |
          sed -i 's|superhuman-remote-worker-agent-vm-base:[a-zA-Z0-9_.-]*|superhuman-remote-worker-agent-vm-base:${{ steps.tag.outputs.sha }}|g' \
            deployment-vms/srw-vm-controller/vm-controller.yaml

      - name: Commit and push updated manifests
        run: |
          git diff --quiet && { echo "No manifest changes to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/ deployment-vms/
          git commit -m "deploy: update image tags to ${{ steps.tag.outputs.sha }}"
          git push
