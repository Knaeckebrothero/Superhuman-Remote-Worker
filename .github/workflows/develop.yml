  build-sudo-gate:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.sudo-gate == 'true' || needs.changes.outputs.vm-base == 'true' || needs.changes.outputs.vm-base-stage1 == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build sudo-gated (Go daemon)
        working-directory: vm/sudo-daemon
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=sha-${GITHUB_SHA::7}" \
            -o sudo-gated ./cmd/sudo-gated/
          file sudo-gated
          ls -lh sudo-gated
      - name: Build sudo_gate.so (C plugin)
        working-directory: vm/sudo-plugin
        run: |
          gcc -fPIC -shared -Wall -Wextra -Werror -O2 -I./include \
            -o sudo_gate.so sudo_gate.c json_util.c
          file sudo_gate.so
          ls -lh sudo_gate.so
      - name: Upload sudo gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudo-gate-binaries
          path: |
            vm/sudo-daemon/sudo-gated
            vm/sudo-plugin/sudo_gate.so
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 1: heavy, stable provisioning (apt + datasource clients + Tailscale +
  # Playwright + Node). Rebuilds only when stage1 inputs change. Published as
  # ghcr.io/<repo>-agent-vm-base-stage1; stage2 pulls and layers on top.
  # ---------------------------------------------------------------------------
  build-agent-vm-base-stage1:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.vm-base-stage1 == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # Hosted runners have ~14 GiB free and these jobs need more. Self-hosted
        # runners do not need it, and the heavy variants below delete
        # /opt/hostedtoolcache, which is where setup-* install. Guarded rather
        # than deleted so the hosted fallback (gh variable delete CI_RUNNER_LABEL)
        # still works.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM (hosted runner udev rule)
        # Hosted runners ship /dev/kvm as root:kvm with no world access, so this
        # udev rule is how the runner user reaches it. Inside a container there is
        # no udevd: the rule file goes nowhere and `udevadm control` fails. There,
        # access comes from the pod spec instead — privileged + a /dev/kvm
        # CharDevice hostPath, see HomeLab deployments_managed/arc-runners-kvm/.
        # (Measured on node4: /dev/kvm is gid 36, mode 0666.)
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM is usable
        # Runs on BOTH runner types, unconditionally. stage1.pkr.hcl and
        # stage2.pkr.hcl set accelerator = "kvm", and without acceleration packer
        # does not fail — it silently falls back to TCG and burns the entire
        # 75-90 minute timeout. Fail in five seconds instead.
        #
        # KVM_GET_API_VERSION = _IO(KVMIO=0xAE, 0) = 0xAE00. Opening the device
        # and getting an answer proves the permissions AND that the host kernel's
        # KVM subsystem is reachable from in here, which `ls` alone does not.
        run: |
          set -euo pipefail
          ls -la /dev/kvm
          id
          python3 -c "import fcntl,os;fd=os.open('/dev/kvm',os.O_RDWR);print('KVM_GET_API_VERSION =',fcntl.ioctl(fd,0xAE00,0))"
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      - name: Compute cloud image cache key
        id: img-key
        run: echo "key=ubuntu-noble-cloudimg-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Ubuntu cloud image
        id: cloud-image-cache
        uses: actions/cache@v4
        with:
          path: docker/agent-vm-base/input/noble-server-cloudimg-amd64.img
          key: ${{ steps.img-key.outputs.key }}
      - name: Download Ubuntu cloud image
        if: steps.cloud-image-cache.outputs.cache-hit != 'true'
        working-directory: docker/agent-vm-base
        run: |
          mkdir -p input
          wget -q https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img \
            -O input/noble-server-cloudimg-amd64.img
      - name: Verify Ubuntu cloud image
        working-directory: docker/agent-vm-base
        run: qemu-img info input/noble-server-cloudimg-amd64.img
      - name: Packer init (stage1)
        working-directory: docker/agent-vm-base
        run: packer init stage1.pkr.hcl
      - name: Packer build (stage1)
        working-directory: docker/agent-vm-base
        run: |
          PW_VERSION=$(tr -d '[:space:]' < ../../.playwright-version)
          test -n "$PW_VERSION" || { echo "::error::.playwright-version is empty"; exit 1; }
          for attempt in 1 2; do
            if packer build -var "playwright_version=${PW_VERSION}" stage1.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage1 packer build attempt ${attempt} failed"
            rm -rf output-stage1
          done
          echo "::error::Stage1 packer build failed after 2 attempts"
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }} stage1 containerDisk
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS=("${IMAGE}:pr-validate-${GITHUB_SHA::7}")
          else
            # develop owns the :experimental stage1 tag; :latest belongs to main
            # (main.yml + the stage1-rebuild cron). Pushing :latest from develop
            # would clobber main's prod base image, and — worse — a main-built
            # :latest that lacks develop-only base changes (e.g. browser_use)
            # would then fail develop's own stage2 gate.
            TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}" "${IMAGE}:experimental")
          fi
          BUILD_ARGS=(
            --build-arg "SRW_SOURCE_REVISION=${GITHUB_SHA}"
            --build-arg "SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}"
            --build-arg "SRW_RELEASE_VERSION=${{ env.SRW_RELEASE_VERSION }}"
            --build-arg "SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}"
          )
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk-stage1 .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for T in "${TAGS[@]}"; do docker push "$T"; done
            printf 'Pushed stage1:\n'; printf '  %s\n' "${TAGS[@]}"
          else
            printf 'Built stage1 (PR validation, not pushed):\n'; printf '  %s\n' "${TAGS[@]}"
          fi

  # ---------------------------------------------------------------------------
  # Stage 2: light per-commit layer (user setup, SSH config, daemon, sudo gate).
  # Pulls the stage1 containerDisk from GHCR, extracts the qcow2, and layers
  # stage2 on top via stage2.pkr.hcl. Should finish in ~5-10 min.
  # ---------------------------------------------------------------------------
  build-agent-vm-base:
    needs: [changes, dependency-audit, test-python, test-cockpit, build-sudo-gate, build-agent-vm-base-stage1]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.vm-base == 'true' || needs.changes.outputs.vm-base-stage1 == 'true' || needs.changes.outputs.sudo-gate == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled' &&
      needs.build-sudo-gate.result == 'success' &&
      (needs.build-agent-vm-base-stage1.result == 'success' || needs.build-agent-vm-base-stage1.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fail if sudo-gate build failed
        if: needs.build-sudo-gate.result == 'failure'
        run: |
          echo "::error::build-sudo-gate failed — refusing to build VM image without gate binaries"
          exit 1
      - uses: actions/checkout@v4
      - name: Download sudo gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: sudo-gate-binaries
          path: docker/agent-vm-base/files/
        continue-on-error: true
      - name: Prepare sudo gate binaries for Packer
        working-directory: docker/agent-vm-base
        # upload-artifact@v4 roots the archive at the LONGEST COMMON ANCESTOR
        # of its paths (vm/), so the artifact extracts as sudo-daemon/... and
        # sudo-plugin/... — no vm/ prefix. This step checked files/vm/... and
        # silently shipped empty placeholders (VM images had no sudo gate).
        run: |
          if [ -f files/sudo-daemon/sudo-gated ]; then
            mv files/sudo-daemon/sudo-gated files/sudo-gated-bin
            echo "sudo-gated binary ready ($(wc -c < files/sudo-gated-bin) bytes)"
          else
            touch files/sudo-gated-bin
            echo "sudo-gated binary not available — creating empty placeholder"
          fi
          if [ -f files/sudo-plugin/sudo_gate.so ]; then
            mv files/sudo-plugin/sudo_gate.so files/sudo_gate.so
            echo "sudo_gate.so ready ($(wc -c < files/sudo_gate.so) bytes)"
          else
            touch files/sudo_gate.so
            echo "sudo_gate.so not available — creating empty placeholder"
          fi
          ls -la files/
      - name: Free disk space
        # Hosted runners have ~14 GiB free and these jobs need more. Self-hosted
        # runners do not need it, and the heavy variants below delete
        # /opt/hostedtoolcache, which is where setup-* install. Guarded rather
        # than deleted so the hosted fallback (gh variable delete CI_RUNNER_LABEL)
        # still works.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM (hosted runner udev rule)
        # Hosted runners ship /dev/kvm as root:kvm with no world access, so this
        # udev rule is how the runner user reaches it. Inside a container there is
        # no udevd: the rule file goes nowhere and `udevadm control` fails. There,
        # access comes from the pod spec instead — privileged + a /dev/kvm
        # CharDevice hostPath, see HomeLab deployments_managed/arc-runners-kvm/.
        # (Measured on node4: /dev/kvm is gid 36, mode 0666.)
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM is usable
        # Runs on BOTH runner types, unconditionally. stage1.pkr.hcl and
        # stage2.pkr.hcl set accelerator = "kvm", and without acceleration packer
        # does not fail — it silently falls back to TCG and burns the entire
        # 75-90 minute timeout. Fail in five seconds instead.
        #
        # KVM_GET_API_VERSION = _IO(KVMIO=0xAE, 0) = 0xAE00. Opening the device
        # and getting an answer proves the permissions AND that the host kernel's
        # KVM subsystem is reachable from in here, which `ls` alone does not.
        run: |
          set -euo pipefail
          ls -la /dev/kvm
          id
          python3 -c "import fcntl,os;fd=os.open('/dev/kvm',os.O_RDWR);print('KVM_GET_API_VERSION =',fcntl.ioctl(fd,0xAE00,0))"
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      # Login is unconditional here — needed to PULL the stage1 containerDisk
      # from GHCR even on PR validation runs. Push of the final image still
      # gates on push events below.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull stage1 containerDisk and extract qcow2
        working-directory: docker/agent-vm-base
        run: |
          # develop layers stage2 on its OWN stage1 base (:experimental), NOT the
          # shared :latest that main's cron also writes. Otherwise a main-built
          # :latest lacking develop-only base changes (browser_use) fails develop's
          # stage2 gate. Contract: main.yml pulls :latest, develop pulls :experimental.
          STAGE1_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1:experimental" | tr '[:upper:]' '[:lower:]')
          docker pull "$STAGE1_IMAGE"
          # FROM scratch images have no shell so a real CMD doesn't matter — we
          # never start the container, just create-then-cp.
          CID=$(docker create "$STAGE1_IMAGE" /noop 2>/dev/null || docker create "$STAGE1_IMAGE")
          mkdir -p input
          docker cp "$CID":/disk/agent-vm-base-stage1.qcow2 input/agent-vm-base-stage1.qcow2
          docker rm "$CID"
          qemu-img info input/agent-vm-base-stage1.qcow2
      - name: Packer init (stage2)
        working-directory: docker/agent-vm-base
        run: packer init stage2.pkr.hcl
      - name: Packer build (stage2)
        working-directory: docker/agent-vm-base
        run: |
          for attempt in 1 2; do
            if packer build stage2.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage2 packer build attempt ${attempt} failed"
            rm -rf output
          done
          echo "::error::Stage2 packer build failed after 2 attempts"
          exit 1
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }} containerDisk image
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR validation: build with a single throwaway tag, no push.
            TAGS=("${IMAGE}:pr-validate-${GITHUB_SHA::7}")
          else
            TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}" "${IMAGE}:experimental")
          fi
          BUILD_ARGS=(
            --build-arg "SRW_SOURCE_REVISION=${GITHUB_SHA}"
            --build-arg "SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}"
            --build-arg "SRW_RELEASE_VERSION=${{ env.SRW_RELEASE_VERSION }}"
            --build-arg "SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}"
          )
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for T in "${TAGS[@]}"; do docker push "$T"; done
            printf 'Pushed:\n'; printf '  %s\n' "${TAGS[@]}"
          else
            printf 'Built (PR validation, not pushed):\n'; printf '  %s\n' "${TAGS[@]}"
          fi

  build-vm-controller:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.vm-controller == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vm-controller
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: ./vm/controller
          file: ./vm/controller/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ env.SRW_SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.SRW_RELEASE_VERSION }}
            org.opencontainers.image.documentation=${{ env.SRW_DOCUMENTATION_URL }}
            io.srw.component=vm-controller
          provenance: false
          build-args: |
            SRW_SOURCE_REVISION=${{ github.sha }}
            SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}
            SRW_RELEASE_VERSION=${{ env.SRW_RELEASE_VERSION }}
            SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  # ---------------------------------------------------------------------------
  # Publish dev Helm chart + update deployment config for Fleet.
  #
  # Publishes the chart as "srw-dev" with a semver pre-release version
  # (0.0.0-dev.sha-<hash>), then updates fleet.yaml with the chart version
  # and values-experimental.yaml with the new image tags, all in one commit.
  # ---------------------------------------------------------------------------
  deploy-experimental:
    needs:
      - changes
      - dependency-audit
      - test-python
      - test-cockpit
      - build-agent
      - build-orchestrator
      - build-cockpit
      - build-mcp
      - build-workspace
      - build-vm-controller
      - build-agent-vm-base
      - chart-test
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled' &&
      needs.chart-test.result != 'failure' && needs.chart-test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          # Full history: the staleness guard below compares commit ancestry.
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tag
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Note: hyphen (not dot) before the SHA so the segment stays
          # alphanumeric — a purely-numeric segment like "0439848" would be
          # rejected by semver as a numeric identifier with a leading zero.
          echo "chart_version=0.0.0-dev.sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # -- Publish dev chart (only when helm/ changed or any build succeeded) --
      - name: Package and push dev chart
        if: >-
          needs.changes.outputs.chart == 'true' ||
          needs.build-agent.result == 'success' ||
          needs.build-orchestrator.result == 'success' ||
          needs.build-cockpit.result == 'success' ||
          needs.build-mcp.result == 'success'
        run: |
          helm repo add collabora https://collaboraonline.github.io/online --force-update
          helm dependency build helm/
          # Override chart name for dev channel
          yq -i '.name = "srw-dev"' helm/Chart.yaml
          mkdir -p dist
          helm package helm/ \
            --version "${{ steps.tag.outputs.chart_version }}" \
            --app-version "${{ steps.tag.outputs.sha }}" \
            --destination ./dist
          helm push ./dist/srw-dev-${{ steps.tag.outputs.chart_version }}.tgz \
            oci://ghcr.io/knaeckebrothero/charts
          # Restore Chart.yaml (don't commit the name override)
          git checkout helm/Chart.yaml

      # -- Publish dev VM-cluster chart (parallel to srw-dev). Re-publish for
      # chart sources or any image consumed by this chart, including the
      # independently versioned orchestrator image used by remote collectors. --
      - name: Package and push dev vm-cluster chart
        if: >-
          needs.changes.outputs.chart == 'true' ||
          needs.build-orchestrator.result == 'success' ||
          needs.build-vm-controller.result == 'success' ||
          needs.build-agent-vm-base.result == 'success'
        run: |
          # Override chart name for dev channel
          yq -i '.name = "srw-dev-vm-cluster"' helm-vm-cluster/Chart.yaml
          mkdir -p dist
          helm package helm-vm-cluster/ \
            --version "${{ steps.tag.outputs.chart_version }}" \
            --app-version "${{ steps.tag.outputs.sha }}" \
            --destination ./dist
          helm push ./dist/srw-dev-vm-cluster-${{ steps.tag.outputs.chart_version }}.tgz \
            oci://ghcr.io/knaeckebrothero/charts
          git checkout helm-vm-cluster/Chart.yaml

      # -- Update fleet.yaml chart version (orchestrator chart) --
      - name: Update fleet.yaml chart version
        if: >-
          needs.changes.outputs.chart == 'true' ||
          needs.build-agent.result == 'success' ||
          needs.build-orchestrator.result == 'success' ||
          needs.build-cockpit.result == 'success' ||
          needs.build-mcp.result == 'success'
        run: >-
          yq -i '.helm.version = "${{ steps.tag.outputs.chart_version }}"'
          deployment/fleet.yaml

      # -- Update vm-cluster bundle's chart version --
      - name: Update vm-cluster fleet.yaml chart version
        if: >-
          needs.changes.outputs.chart == 'true' ||
          needs.build-orchestrator.result == 'success' ||
          needs.build-vm-controller.result == 'success' ||
          needs.build-agent-vm-base.result == 'success'
        run: >-
          yq -i '.helm.version = "${{ steps.tag.outputs.chart_version }}"'
          deployment-vms/srw-vm-controller/fleet.yaml

      # -- Update image tags in values-experimental.yaml --
      # Each component is stamped with ITS OWN identity (newest commit that
      # touched its build inputs, from the changes job) — never the push
      # HEAD. Rebuilds from unchanged inputs rewrite identical values, the
      # final git-diff gate sees no delta, and no deploy commit — so no
      # stale-image drain of the agent fleet — happens without a real
      # content change. Fallback to GITHUB_SHA mirrors the build jobs.
      - name: Update orchestrator tag
        if: needs.build-orchestrator.result == 'success'
        env:
          COMPONENT_SHA: ${{ needs.changes.outputs.orchestrator-sha }}
        run: |
          : "${COMPONENT_SHA:=$GITHUB_SHA}"
          # Staleness guard — knowledge-base/knowledge/issues/ci_deploy_race_reverts_image_tags.md.
          # Overlapping runs each derive this identity from their own checkout, so
          # the run that finishes LAST can otherwise write an older sha over a
          # newer one and silently revert a verified deploy. Skip only when the
          # recorded revision is known AND is not an ancestor of ours; an unknown
          # revision (this branch is rebased often) falls through and writes.
          CURRENT_SHA=$(yq -r '.provenance.components.orchestrator.sourceRevision // ""' \
            deployment/values-experimental.yaml)
          if [ -n "$CURRENT_SHA" ] \
             && git cat-file -e "${CURRENT_SHA}^{commit}" 2>/dev/null \
             && ! git merge-base --is-ancestor "$CURRENT_SHA" "$COMPONENT_SHA"; then
            echo "::notice::skipping stale orchestrator tag: deployed $CURRENT_SHA is not an ancestor of $COMPONENT_SHA"
            exit 0
          fi
          export COMPONENT_TAG="sha-${COMPONENT_SHA::7}"
          export COMPONENT_VERSION="0.0.0-dev.sha-${COMPONENT_SHA}"
          yq -i '
            .image.orchestrator.tag = strenv(COMPONENT_TAG) |
            .provenance.releaseVersion = strenv(COMPONENT_VERSION) |
            .provenance.components.orchestrator.sourceRevision = strenv(COMPONENT_SHA) |
            .provenance.components.orchestrator.releaseVersion = strenv(COMPONENT_VERSION)
          ' deployment/values-experimental.yaml
          yq -i '
            .helm.values.image.orchestrator.tag = strenv(COMPONENT_TAG) |
            .helm.values.image.orchestrator.digest = ""
          ' deployment-vms/srw-vm-controller/fleet.yaml

      - name: Update agent tag
        if: needs.build-agent.result == 'success'
        env:
          COMPONENT_SHA: ${{ needs.changes.outputs.agent-sha }}
        run: |
          : "${COMPONENT_SHA:=$GITHUB_SHA}"
          # Staleness guard — knowledge-base/knowledge/issues/ci_deploy_race_reverts_image_tags.md.
          # Overlapping runs each derive this identity from their own checkout, so
          # the run that finishes LAST can otherwise write an older sha over a
          # newer one and silently revert a verified deploy. Skip only when the
          # recorded revision is known AND is not an ancestor of ours; an unknown
          # revision (this branch is rebased often) falls through and writes.
          CURRENT_SHA=$(yq -r '.provenance.components.agent.sourceRevision // ""' \
            deployment/values-experimental.yaml)
          if [ -n "$CURRENT_SHA" ] \
             && git cat-file -e "${CURRENT_SHA}^{commit}" 2>/dev/null \
             && ! git merge-base --is-ancestor "$CURRENT_SHA" "$COMPONENT_SHA"; then
            echo "::notice::skipping stale agent tag: deployed $CURRENT_SHA is not an ancestor of $COMPONENT_SHA"
            exit 0
          fi
          export COMPONENT_TAG="sha-${COMPONENT_SHA::7}"
          export COMPONENT_VERSION="0.0.0-dev.sha-${COMPONENT_SHA}"
          yq -i '
            .image.agent.tag = strenv(COMPONENT_TAG) |
            .provenance.components.agent.sourceRevision = strenv(COMPONENT_SHA) |
            .provenance.components.agent.releaseVersion = strenv(COMPONENT_VERSION)
          ' deployment/values-experimental.yaml

      - name: Update cockpit tag
        if: needs.build-cockpit.result == 'success'
        env:
          COMPONENT_SHA: ${{ needs.changes.outputs.cockpit-sha }}
        run: |
          : "${COMPONENT_SHA:=$GITHUB_SHA}"
          # Staleness guard — knowledge-base/knowledge/issues/ci_deploy_race_reverts_image_tags.md.
          # Overlapping runs each derive this identity from their own checkout, so
          # the run that finishes LAST can otherwise write an older sha over a
          # newer one and silently revert a verified deploy. Skip only when the
          # recorded revision is known AND is not an ancestor of ours; an unknown
          # revision (this branch is rebased often) falls through and writes.
          CURRENT_SHA=$(yq -r '.provenance.components.cockpit.sourceRevision // ""' \
            deployment/values-experimental.yaml)
          if [ -n "$CURRENT_SHA" ] \
             && git cat-file -e "${CURRENT_SHA}^{commit}" 2>/dev/null \
             && ! git merge-base --is-ancestor "$CURRENT_SHA" "$COMPONENT_SHA"; then
            echo "::notice::skipping stale cockpit tag: deployed $CURRENT_SHA is not an ancestor of $COMPONENT_SHA"
            exit 0
          fi
          export COMPONENT_TAG="sha-${COMPONENT_SHA::7}"
          export COMPONENT_VERSION="0.0.0-dev.sha-${COMPONENT_SHA}"
          yq -i '
            .image.cockpit.tag = strenv(COMPONENT_TAG) |
            .provenance.components.cockpit.sourceRevision = strenv(COMPONENT_SHA) |
            .provenance.components.cockpit.releaseVersion = strenv(COMPONENT_VERSION)
          ' deployment/values-experimental.yaml

      - name: Update MCP tag
        if: needs.build-mcp.result == 'success'
        env:
          COMPONENT_SHA: ${{ needs.changes.outputs.mcp-sha }}
          COMPONENT_DIGEST: ${{ needs.build-mcp.outputs.digest }}
        run: |
          : "${COMPONENT_SHA:=$GITHUB_SHA}"
          # Staleness guard — knowledge-base/knowledge/issues/ci_deploy_race_reverts_image_tags.md.
          # Overlapping runs each derive this identity from their own checkout, so
          # the run that finishes LAST can otherwise write an older sha over a
          # newer one and silently revert a verified deploy. Skip only when the
          # recorded revision is known AND is not an ancestor of ours; an unknown
          # revision (this branch is rebased often) falls through and writes.
          CURRENT_SHA=$(yq -r '.provenance.components.mcp.sourceRevision // ""' \
            deployment/values-experimental.yaml)
          if [ -n "$CURRENT_SHA" ] \
             && git cat-file -e "${CURRENT_SHA}^{commit}" 2>/dev/null \
             && ! git merge-base --is-ancestor "$CURRENT_SHA" "$COMPONENT_SHA"; then
            echo "::notice::skipping stale mcp tag: deployed $CURRENT_SHA is not an ancestor of $COMPONENT_SHA"
            exit 0
          fi
          test -n "$COMPONENT_DIGEST"
          case "$COMPONENT_DIGEST" in sha256:*) ;; *) exit 1 ;; esac
          export COMPONENT_TAG="sha-${COMPONENT_SHA::7}"
          export COMPONENT_VERSION="0.0.0-dev.sha-${COMPONENT_SHA}"
          yq -i '
            .image.mcp.tag = strenv(COMPONENT_TAG) |
            .image.mcp.digest = strenv(COMPONENT_DIGEST) |
            .provenance.components.mcp.sourceRevision = strenv(COMPONENT_SHA) |
            .provenance.components.mcp.releaseVersion = strenv(COMPONENT_VERSION)
          ' deployment/values-experimental.yaml

      - name: Update workspace tag
        if: needs.build-workspace.result == 'success'
        env:
          COMPONENT_SHA: ${{ needs.changes.outputs.workspace-sha }}
        run: |
          : "${COMPONENT_SHA:=$GITHUB_SHA}"
          # Staleness guard — knowledge-base/knowledge/issues/ci_deploy_race_reverts_image_tags.md.
          # Overlapping runs each derive this identity from their own checkout, so
          # the run that finishes LAST can otherwise write an older sha over a
          # newer one and silently revert a verified deploy. Skip only when the
          # recorded revision is known AND is not an ancestor of ours; an unknown
          # revision (this branch is rebased often) falls through and writes.
          CURRENT_SHA=$(yq -r '.provenance.components.workspace.sourceRevision // ""' \
            deployment/values-experimental.yaml)
          if [ -n "$CURRENT_SHA" ] \
             && git cat-file -e "${CURRENT_SHA}^{commit}" 2>/dev/null \
             && ! git merge-base --is-ancestor "$CURRENT_SHA" "$COMPONENT_SHA"; then
            echo "::notice::skipping stale workspace tag: deployed $CURRENT_SHA is not an ancestor of $COMPONENT_SHA"
            exit 0
          fi
          export COMPONENT_TAG="sha-${COMPONENT_SHA::7}"
          export COMPONENT_VERSION="0.0.0-dev.sha-${COMPONENT_SHA}"
          yq -i '
            .image.workspace.tag = strenv(COMPONENT_TAG) |
            .provenance.components.workspace.sourceRevision = strenv(COMPONENT_SHA) |
            .provenance.components.workspace.releaseVersion = strenv(COMPONENT_VERSION)
          ' deployment/values-experimental.yaml

      - name: Update VM controller image tag
        if: needs.build-vm-controller.result == 'success'
        run: >-
          yq -i '.helm.values.image.vmController.tag = "${{ steps.tag.outputs.sha }}"'
          deployment-vms/srw-vm-controller/fleet.yaml

      - name: Update agent VM base image tag
        if: needs.build-agent-vm-base.result == 'success'
        run: >-
          yq -i '.helm.values.vmController.defaultVmImage = "ghcr.io/knaeckebrothero/superhuman-remote-worker-agent-vm-base:${{ steps.tag.outputs.sha }}"'
          deployment-vms/srw-vm-controller/fleet.yaml

      - name: Commit and push
        run: |
          git diff --quiet && { echo "No changes to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/fleet.yaml deployment/values-experimental.yaml deployment-vms/ || true
          git commit -m "deploy: update image tags to ${{ steps.tag.outputs.sha }}"
          git push
