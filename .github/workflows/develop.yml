name: develop

# Lightweight CI for the develop branch.
#
# Key differences from the main (Production) pipeline:
#   - Lint is non-blocking — ruff format auto-commits fixes on push
#   - Tests and builds are change-based (only run when relevant files change)
#   - Images get SHA + :experimental tags (no version tags)
#   - Helm chart published as "srw-dev" with 0.0.0-dev.sha-<hash> versions
#   - deploy-experimental updates fleet.yaml chart version + image tags
#   - Container image tags are per-component identities: sha of the newest
#     commit that touched the component's build inputs (NOT the push HEAD),
#     so a push that doesn't change a component never moves its tag and the
#     lifecycle reconciler never drains agents over a no-op retag
#
# PR vs push behavior:
#   - PR to develop: change-based image builds run with `push: false` —
#     no docker login, no :experimental tag, no chart publish, no fleet
#     update. Purely Dockerfile/Packer validation so a broken build is
#     caught before merge instead of after. Docs-only PRs still pay nothing
#     since change-detection skips the build jobs entirely.
#   - Push to develop: same change-based builds, but `push: true` with
#     SHA + :experimental tags, followed by deploy-experimental.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Lowercased repo path for GHCR cache refs. github.repository preserves
  # GitHub's case-sensitive name (e.g. Knaeckebrothero/Uni-Projekt-Graph-RAG),
  # but GHCR rejects uppercase image paths. docker/metadata-action handles
  # this for production tags; YAML expressions can't lowercase, so we hardcode.
  # Update this if the repo is renamed.
  REPO_LOWER: knaeckebrothero/uni-projekt-graph-rag
  SRW_SOURCE_URL: https://github.com/knaeckebrothero/Superhuman-Remote-Worker
  SRW_DOCUMENTATION_URL: https://github.com/knaeckebrothero/Superhuman-Remote-Worker/tree/main/docs
  SRW_RELEASE_VERSION: 0.0.0-dev.sha-${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # Auto-format + lint (non-blocking — failures don't gate builds)
  # On push: auto-commits ruff format fixes so develop stays clean.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.14.10

      - name: Auto-format and commit
        if: github.event_name == 'push'
        run: |
          ruff format src/ orchestrator/ tests/
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ orchestrator/ tests/
            git commit -m "style: ruff auto-format"
            git push
          fi

      - name: Ruff lint check
        run: ruff check src/ orchestrator/ tests/
        continue-on-error: true

      - name: Ruff format check
        run: ruff format --check src/ orchestrator/ tests/
        continue-on-error: true

      - name: Verify Playwright pin consistency
        run: |
          # The agent image has no Playwright; the pin only feeds the
          # workspace/VM builds (.playwright-version is the source of truth,
          # passed as a build-arg). Guard the two fallback copies against drift.
          PIN=$(tr -d '[:space:]' < .playwright-version)
          test -n "$PIN" || { echo "::error::.playwright-version is empty"; exit 1; }
          grep -q "^ARG PLAYWRIGHT_VERSION=${PIN}$" docker/Dockerfile.workspace \
            || { echo "::error::ARG PLAYWRIGHT_VERSION default in docker/Dockerfile.workspace does not match .playwright-version (${PIN})"; exit 1; }
          grep -q "^PLAYWRIGHT_VERSION=${PIN}$" .env.example \
            || { echo "::error::PLAYWRIGHT_VERSION in .env.example does not match .playwright-version (${PIN})"; exit 1; }
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Chart correctness gates (Phase 1) — render matrix + schema validation.
  # Runs only when helm/ changed. Lint is advisory (soft); render + kubeconform
  # are HARD — a chart that won't render or validate is deploy-breaking, and
  # this branch publishes + deploys the srw-dev chart.
  #
  # The installer-* scenarios are the self-host config generator's verbatim
  # output. The generator moved to the private srw-cloud repo on 2026-08-15;
  # these fixtures are the half of the contract that stays here, so a chart
  # change that breaks the installer fails in the repo that caused it rather
  # than days later in srw-cloud's CI. Regenerate them from that repo's
  # www/test/generator.drift.test.mjs CASES if the generator changes.
  # ---------------------------------------------------------------------------
  chart-test:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - test
          - customer-external
          - eval
          - vm
          - installer-evaluation
          - installer-production
          - installer-production-vms
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Build Helm dependencies
        run: |
          helm repo add collabora https://collaboraonline.github.io/online --force-update
          helm dependency build helm/

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Helm lint (${{ matrix.scenario }})
        run: helm lint helm/ -f helm/ci/${{ matrix.scenario }}-values.yaml
        continue-on-error: true

      - name: Render + kubeconform (${{ matrix.scenario }})
        run: |
          helm template srw helm/ -f helm/ci/${{ matrix.scenario }}-values.yaml \
            | kubeconform \
                -kubernetes-version 1.28.0 \
                -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -summary

      - name: Verify chart-created Secret contract
        if: matrix.scenario == 'eval'
        run: bash scripts/check-chart-created-secret.sh

  # ---------------------------------------------------------------------------
  # Schema negative test — proves values.schema.json rejects bad input. A
  # deliberately-invalid values file MUST make `helm template` fail. Hard gate.
  # ---------------------------------------------------------------------------
  chart-schema-negative:
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Build Helm dependencies
        run: |
          helm repo add collabora https://collaboraonline.github.io/online --force-update
          helm dependency build helm/

      - name: Assert invalid values are rejected by the schema
        run: |
          if helm template srw helm/ -f helm/ci/invalid-values.yaml >/dev/null 2>&1; then
            echo "::error::helm/ci/invalid-values.yaml rendered successfully — values.schema.json is not rejecting it. The schema has stopped validating."
            exit 1
          fi
          echo "OK: invalid-values.yaml was correctly rejected by values.schema.json"

  # ---------------------------------------------------------------------------
  # CodeQL — static analysis for security vulnerabilities
  # ---------------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Dependency audit — blocking (rarely fails, catches real CVEs)
  # ---------------------------------------------------------------------------
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Upgrade pip
        # CVE-2026-6357: pip < 26.1 runs self-update import after wheel install
        run: uv pip install --system --upgrade 'pip>=26.1'
      - name: Install pip-audit
        run: uv pip install --system pip-audit
      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt
      - name: Audit Python dependencies
        # CVE-2026-4539: pygments ReDoS in AdlLexer — local-only, no fix released
        # CVE-2026-25645: requests extract_zipped_paths() temp path — we don't call it;
        #   arxiv pins requests<2.33.0 so we can't upgrade until arxiv releases a fix
        # CVE-2026-3219: pip treats concatenated tar+ZIP files as ZIP — no fix released;
        #   requires a maliciously crafted package, not exposed via our install flow
        # CVE-2026-44405: paramiko rsakey.py allows SHA-1 — no released fix yet (only on
        #   master at commit a448945). Exploitation requires MITM on the SSH channel; our
        #   connections are cluster-internal to controlled workspace pods/VMs.
        #
        # PYSEC-2024-277 (joblib): disputed by upstream; NumpyArrayWrapper is only used
        #   while caching trusted content. No fix released.
        # PYSEC-2024-278 (langchain-community): TFIDFRetriever.load_local SSRF — the
        #   advisory itself says "Upgrading to version 0.0.27 is able to address this"
        #   and we resolve to 0.4.1. OSV metadata lacks a fixed-version field so
        #   pip-audit still flags it.
        # PYSEC-2025-144/145/146/147, PYSEC-2026-101/102 (ollama): every advisory targets
        #   the Ollama Go server (Modelfile parsing, /api/pull, fs/ggml/gguf.go). We use
        #   the `ollama` PyPI package as a thin HTTP client against in-cluster endpoints;
        #   the affected server binary isn't shipped by our images.
        # PYSEC-2025-183 (pyjwt): disputed; the "weak encryption" claim depends on
        #   caller-chosen key length, which is enforced by Keycloak in our deployment.
        # PYSEC-2025-189..197, 210, PYSEC-2026-139, CVE-2025-3000 (torch): all require
        #   loading an attacker-supplied checkpoint or running torch.jit on attacker
        #   code. Agents only pull torch transitively via sentence-transformers against
        #   pinned, vetted embedding models. Most have no fix released.
        # PYSEC-2025-211..218 (transformers): deserialization of untrusted model files
        #   (X-CLIP, GLM4, Perceiver, Transformer-XL, megatron_gpt2, SEW/SEW-D/HuBERT
        #   convert_config). Same threat model — we don't convert or load attacker-
        #   supplied checkpoints, and no fix versions are listed upstream.
        run: >-
          pip-audit --desc
          --ignore-vuln CVE-2026-4539
          --ignore-vuln CVE-2026-25645
          --ignore-vuln CVE-2026-3219
          --ignore-vuln CVE-2026-44405
          --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2024-278
          --ignore-vuln PYSEC-2025-144
          --ignore-vuln PYSEC-2025-145
          --ignore-vuln PYSEC-2025-146
          --ignore-vuln PYSEC-2025-147
          --ignore-vuln PYSEC-2026-101
          --ignore-vuln PYSEC-2026-102
          --ignore-vuln PYSEC-2025-183
          --ignore-vuln PYSEC-2025-189
          --ignore-vuln PYSEC-2025-190
          --ignore-vuln PYSEC-2025-191
          --ignore-vuln PYSEC-2025-192
          --ignore-vuln PYSEC-2025-193
          --ignore-vuln PYSEC-2025-194
          --ignore-vuln PYSEC-2025-195
          --ignore-vuln PYSEC-2025-196
          --ignore-vuln PYSEC-2025-197
          --ignore-vuln PYSEC-2025-210
          --ignore-vuln PYSEC-2026-139
          --ignore-vuln CVE-2025-3000
          --ignore-vuln PYSEC-2025-211
          --ignore-vuln PYSEC-2025-212
          --ignore-vuln PYSEC-2025-213
          --ignore-vuln PYSEC-2025-214
          --ignore-vuln PYSEC-2025-215
          --ignore-vuln PYSEC-2025-216
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2025-218
      - name: Audit npm dependencies
        working-directory: cockpit
        # lodash-es 4.17.23 is the latest release; no fix available.
        # Transitive via mermaid → langium → chevrotain → lodash-es.
        # GHSA-r5fr-rjxr-66jc: Code Injection via _.template (high)
        # GHSA-f23m-r3pf-42rh: Prototype Pollution via _.unset/_.omit (moderate)
        #
        # esbuild 0.27.3 is exact-pinned by @angular/build@21; vite pins ^0.27,
        # so the patched 0.28.1 is unreachable without breaking the Angular 21
        # toolchain. Neither advisory applies to our usage (npm/Linux build, no
        # dev server exposed). Ignoring esbuild's advisories propagates up the
        # via-chain to vite → @vitejs/plugin-basic-ssl → @angular/build.
        # GHSA-gv7w-rqvm-qjhr: RCE via the esbuild Deno module + NPM_CONFIG_REGISTRY
        #   (Deno-only loader — unused here) (high)
        # GHSA-g7r4-m6w7-qqqr: arbitrary file read in the dev server on Windows
        #   (dev-server + Windows only; CI/prod run `ng build` on Linux) (high)
        run: |
          npm audit --json | python3 -c "
          import json, sys
          IGNORE_ADVISORIES = {
              'GHSA-r5fr-rjxr-66jc', 'GHSA-f23m-r3pf-42rh',
              'GHSA-gv7w-rqvm-qjhr', 'GHSA-g7r4-m6w7-qqqr',
          }
          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {})

          # Mark packages whose only root-cause advisories are all ignored
          ignored_pkgs = set()
          changed = True
          while changed:
              changed = False
              for name, vuln in vulns.items():
                  if name in ignored_pkgs:
                      continue
                  dominated = True
                  for v in vuln.get('via', []):
                      if isinstance(v, dict):
                          ghsa = v.get('url', '').split('/')[-1]
                          if ghsa not in IGNORE_ADVISORIES:
                              dominated = False
                              break
                      elif isinstance(v, str) and v not in ignored_pkgs:
                          dominated = False
                          break
                  if dominated:
                      ignored_pkgs.add(name)
                      changed = True

          found = 0
          for name, vuln in vulns.items():
              if name in ignored_pkgs:
                  continue
              if vuln.get('severity') in ('high', 'critical'):
                  found += 1
                  print(f'{name}: {vuln[\"severity\"]}')
          if found:
              print(f'{found} unignored high/critical vulnerabilities')
              sys.exit(1)
          print('npm audit passed (ignored advisories: ' + ', '.join(IGNORE_ADVISORIES) + ')')
          "

      # --- Third-party license policy gate (blocking) -----------------------
      # Fails the build if a bundled dependency carries a denied license
      # (GPL/AGPL/SSPL/BSL/...). Server images the chart pulls (Neo4j/Postgres/
      # Mongo) are out of scope — we reference, not convey them — but their
      # bundled *client drivers* (neo4j/psycopg/pymongo) ARE covered. Lives in
      # this already-required job so it gates every build without per-job edits.
      # Source of truth: scripts/check_licenses.py.
      - name: Install license tooling + full bundled dep set
        run: >-
          uv pip install --system pip-licenses
          -r orchestrator/requirements.txt
          -r orchestrator/mcp/requirements.txt
      - name: Check third-party licenses
        # Python: installed metadata via pip-licenses. Frontend: read straight
        # from cockpit/package-lock.json (no npm install / node_modules needed).
        run: python scripts/check_licenses.py --check

  # ---------------------------------------------------------------------------
  # Regenerate THIRD_PARTY_LICENSES.md and auto-commit on develop (mirrors the
  # lint job's ruff auto-format-and-commit). Non-blocking — the dependency-audit
  # job is the blocking gate. Push-only; PRs are covered by that gate.
  # ---------------------------------------------------------------------------
  license-inventory:
    needs: [lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies + license tooling
        # No Node step / npm ci: backend needs the installed Python deps for
        # pip-licenses; the frontend inventory is read from package-lock.json.
        run: >-
          uv pip install --system pip-licenses
          -r requirements.txt
          -r orchestrator/requirements.txt
          -r orchestrator/mcp/requirements.txt
      - name: Regenerate THIRD_PARTY_LICENSES.md
        # --write also runs the gate; never block the docs commit here (the
        # dependency-audit job blocks the build), so swallow a nonzero exit.
        run: python scripts/check_licenses.py --write || true
      - name: Commit if changed
        run: |
          if git diff --quiet THIRD_PARTY_LICENSES.md; then
            echo "THIRD_PARTY_LICENSES.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_LICENSES.md
          git commit -m "docs: regenerate THIRD_PARTY_LICENSES.md [skip ci]"
          git push

  # ---------------------------------------------------------------------------
  # Detect which components changed — build jobs only run when needed
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.check.outputs.agent }}
      orchestrator: ${{ steps.check.outputs.orchestrator }}
      cockpit: ${{ steps.check.outputs.cockpit }}
      mcp: ${{ steps.check.outputs.mcp }}
      vm-base: ${{ steps.check.outputs.vm-base }}
      vm-base-stage1: ${{ steps.check.outputs.vm-base-stage1 }}
      vm-controller: ${{ steps.check.outputs.vm-controller }}
      sudo-gate: ${{ steps.check.outputs.sudo-gate }}
      workspace: ${{ steps.check.outputs.workspace }}
      # Per-component image identity: full sha of the newest commit that
      # touched the component's build inputs. Consumed by the build jobs
      # (image tag + baked BUILD_SHA/provenance) and deploy-experimental
      # (values-experimental.yaml tag + provenance identity).
      agent-sha: ${{ steps.check.outputs.agent-sha }}
      orchestrator-sha: ${{ steps.check.outputs.orchestrator-sha }}
      cockpit-sha: ${{ steps.check.outputs.cockpit-sha }}
      mcp-sha: ${{ steps.check.outputs.mcp-sha }}
      workspace-sha: ${{ steps.check.outputs.workspace-sha }}
      chart: ${{ steps.check.outputs.chart }}
      python-changed: ${{ steps.test-paths.outputs.python }}
      cockpit-changed: ${{ steps.test-paths.outputs.cockpit }}
      # Space-separated test files for pytest, or `tests/` for the whole suite.
      pytest-target: ${{ steps.select.outputs.pytest-target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect test-relevant changes
        id: test-paths
        # Change-based testing: the full suite is large, so a docs-only or
        # chart-only push should not pay for it. The base has to be the whole
        # PUSH, not its tip commit.
        #
        # Granularity, so the name does not oversell it: these two outputs gate
        # whole JOBS, not tests. `python=true` runs the ENTIRE pytest suite and
        # `python=false` runs none of it — one line touched under src/ costs
        # exactly what five hundred do. There is no per-test or per-file
        # selection anywhere in this pipeline. The saving is only for pushes that
        # touch no watched path at all.
        #
        # The diff itself is two-dot (`git diff BASE HEAD`), so it compares tree
        # SNAPSHOTS rather than walking commits: a file changed and reverted
        # inside one push reads as unchanged, which is the intent.
        #
        # `HEAD~1` was the base until 2026-08-04, and it silently under-tested
        # every multi-commit push: only the last commit decided. A push of six
        # commits ending in a dependency bump reported "no Python changed" and
        # skipped the suite while shipping Python — observed twice on 08-03/04,
        # both times with a green tick, both times deployed. `HEAD~1` was also
        # wrong in the dangerous DIRECTION: unresolvable base fell through to
        # skipping. Every unknown here now runs the tests.
        #
        # Note the sibling `check` step deliberately keeps a different base —
        # the last DEPLOYED sha — because it decides image rebuilds and tags,
        # where re-running is churn (agent drains) rather than cheap insurance.
        # Tests are the opposite trade, so the two bases differ on purpose.
        run: |
          RUN_ALL=""
          case "${{ github.event_name }}" in
            pull_request)
              BASE="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              # The branch tip before this push — covers every commit pushed.
              BASE="${{ github.event.before }}"
              case "$BASE" in
                ''|0000000000000000000000000000000000000000)
                  # Branch created by this push: no previous tip to diff.
                  RUN_ALL="branch-created"
                  ;;
                *)
                  if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                    # Force-push rewrote history and the old tip is gone.
                    RUN_ALL="before-sha-unreachable"
                  elif ! git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
                    # Force-push: the old tip is not in this history, so a diff
                    # would report unrelated files in both directions.
                    RUN_ALL="history-rewritten"
                  fi
                  ;;
              esac
              ;;
            *)
              # workflow_dispatch and anything else: someone asked for a run on
              # purpose, and there is no push range to narrow it to.
              #
              # `test-python` and `test-cockpit` already OR in
              # `github.event_name == 'workflow_dispatch'` at the job level, so
              # a dispatch has always forced BOTH suites whatever this step
              # decided. This branch makes the step agree with them instead of
              # contradicting them — and it is not purely cosmetic: `chart-test`
              # has no such escape, so a dispatch could not force it before and
              # can now.
              RUN_ALL="event-${{ github.event_name }}"
              ;;
          esac

          if [ -n "$RUN_ALL" ]; then
            echo "Test path detection: running everything ($RUN_ALL)"
            # Empty = "no usable range"; the chart check in the next
            # step read this and fail open on an empty value.
            echo "RANGE_BASE=" >> "$GITHUB_ENV"
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "cockpit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Shared by the chart detection in the next step, so the
          # push-range rule is stated once rather than copied.
          echo "RANGE_BASE=$BASE" >> "$GITHUB_ENV"

          echo "Test path detection: diffing $BASE..HEAD ($(git rev-list --count "$BASE..HEAD") commit(s))"

          if git diff --name-only "$BASE" HEAD -- \
            'src/' 'orchestrator/' 'tests/' 'config/' 'agent.py' \
            'cockpit/angular.json' 'docker/cockpit-nginx.conf' \
            'docker/Dockerfile.cockpit' \
            'requirements.txt' 'orchestrator/requirements.txt' 'requirements-dev.txt' \
            | grep -q .; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only "$BASE" HEAD -- 'cockpit/' | grep -q .; then
            echo "cockpit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cockpit=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Test path detection: $(grep -E '^(python|cockpit)=' "$GITHUB_OUTPUT" | tr '\n' ' ')"

      - name: Select affected test files
        id: select
        # Which TESTS to run, as opposed to whether to run any. The selector is a
        # static import graph plus data-file edges; scripts/select_affected_tests.py
        # documents why a filename rule was rejected, and
        # tests/test_select_affected_tests.py pins it against a real change whose
        # failures it must not miss.
        #
        # Three ways this lands on the whole suite, all deliberate: no usable push
        # range, the selector printing ALL (it fails open on anything ambiguous),
        # or a selection so wide that narrowing buys nothing.
        run: |
          TOTAL=$(find tests -name 'test_*.py' | wc -l)

          if [ -z "${RANGE_BASE:-}" ]; then
            echo "Test selection: whole suite (no usable push range)"
            echo "pytest-target=tests/" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Via a file, not `mapfile < <(...)`: process substitution does not
          # propagate the command's exit status to mapfile, so a crashing selector
          # would look like an empty selection rather than a failure. The empty
          # check below would still fall open, but silently and for the wrong
          # stated reason.
          if ! python3 scripts/select_affected_tests.py \
                 --repo . --base "$RANGE_BASE" --head HEAD > /tmp/selected.txt; then
            echo "Test selection: whole suite (selector exited non-zero)"
            echo "pytest-target=tests/" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t picked < /tmp/selected.txt

          if [ "${#picked[@]}" -eq 0 ] || [ "${picked[0]}" = "ALL" ]; then
            echo "Test selection: whole suite (selector said ALL)"
            echo "pytest-target=tests/" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Above ~70% the remaining saving is not worth a 400-argument command
          # line, and a hub-adjacent edit reaching most of the suite is a signal
          # to just run it.
          if [ "$(( ${#picked[@]} * 100 / TOTAL ))" -ge 70 ]; then
            echo "Test selection: whole suite (${#picked[@]}/$TOTAL selected, over threshold)"
            echo "pytest-target=tests/" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Test selection: ${#picked[@]}/$TOTAL test file(s)"
          printf '  %s\n' "${picked[@]}"
          echo "pytest-target=${picked[*]}" >> "$GITHUB_OUTPUT"

      - name: Detect changes against last deployed SHA per component
        id: check
        run: |
          extract_sha() {
            local component="$1"
            grep -A1 "^  ${component}:" deployment/values-experimental.yaml 2>/dev/null \
              | grep -oP 'tag:\s*sha-\K[0-9a-f]{7}' | head -1 || echo ""
          }

          has_changes() {
            local sha="$1"
            shift
            local paths=("$@")
            if [ -z "$sha" ]; then
              echo "true"
              return
            fi
            if ! git cat-file -t "$sha" &>/dev/null; then
              echo "true"
              return
            fi
            for path in "${paths[@]}"; do
              if [ -n "$(git diff --name-only "$sha" HEAD -- "$path")" ]; then
                echo "true"
                return
              fi
            done
            echo "false"
          }

          # Newest commit that touched a component's build inputs — the
          # component's image identity (tag + provenance), instead of the
          # push HEAD. A rebuild from unchanged inputs (catch-up after a
          # blocked run, or a batched push whose HEAD is unrelated — e.g.
          # docs) reproduces the SAME identity, so values-experimental.yaml
          # only moves — and the lifecycle reconciler only drains agent pods
          # — when the component's content actually changed.
          last_input_sha() {
            local sha
            sha=$(git log -1 --format=%H HEAD -- "$@")
            echo "${sha:-$GITHUB_SHA}"
          }

          SHA_AGENT=$(extract_sha agent)
          SHA_ORCHESTRATOR=$(extract_sha orchestrator)
          SHA_COCKPIT=$(extract_sha cockpit)
          SHA_MCP=$(extract_sha mcp)
          SHA_WORKSPACE=$(extract_sha workspace)
          # VM image SHAs live in fleet.yaml — vmController as a bare tag
          # (image.vmController.tag), agent-vm-base embedded in the
          # defaultVmImage URL (vmController.defaultVmImage).
          #
          # An EMPTY result is fail-open on purpose: it means nothing is deployed
          # yet, and has_changes correctly treats that as "rebuild". A MISSING
          # TOOL is not the same thing, but `yq ... 2>/dev/null` makes the two
          # indistinguishable — so on a runner without yq, every VM job would
          # rebuild on every run, silently and expensively. yq is preinstalled on
          # ubuntu-latest and baked into the self-hosted runner image
          # (docker/Dockerfile.ci-runner); if it is absent, something is broken
          # and we want to hear about it rather than pay for it.
          command -v yq >/dev/null 2>&1 || {
            echo "::error::yq not found on this runner. It is preinstalled on ubuntu-latest and baked into docker/Dockerfile.ci-runner — if you see this, the runner image is broken."
            exit 1
          }
          VM_FLEET=deployment-vms/srw-vm-controller/fleet.yaml
          test -f "$VM_FLEET" || {
            echo "::error::$VM_FLEET is missing — cannot resolve deployed VM SHAs."
            exit 1
          }
          SHA_VM_CONTROLLER=$(yq '.helm.values.image.vmController.tag' "$VM_FLEET" | grep -oP 'sha-\K[0-9a-f]{7}' | head -1)
          SHA_VM_BASE=$(yq '.helm.values.vmController.defaultVmImage' "$VM_FLEET" | grep -oP 'sha-\K[0-9a-f]{7}' | head -1)

          echo "Deployed SHAs:"
          echo "  agent=$SHA_AGENT  orchestrator=$SHA_ORCHESTRATOR  cockpit=$SHA_COCKPIT"
          echo "  mcp=$SHA_MCP  workspace=$SHA_WORKSPACE"
          echo "  vm-controller=$SHA_VM_CONTROLLER  vm-base=$SHA_VM_BASE"

          # Build-input path lists — single source for BOTH the rebuild
          # predicate (has_changes) and the image identity (last_input_sha),
          # so a component's tag can only ever move to a commit that touched
          # its inputs. Lists mirror the Dockerfiles' COPY statements:
          # Dockerfile.orchestrator copies src/, Dockerfile.cockpit copies
          # docker/cockpit-canvas-env.sh, Dockerfile.mcp copies
          # orchestrator/security/__init__.py — keep them in sync.
          AGENT_PATHS=(src/ config/ agent.py requirements.txt
            docker/Dockerfile.agent)
          ORCHESTRATOR_PATHS=(orchestrator/ src/ config/
            docker/Dockerfile.orchestrator)
          COCKPIT_PATHS=(cockpit/ docker/Dockerfile.cockpit
            docker/cockpit-nginx.conf docker/cockpit-canvas-env.sh)
          MCP_PATHS=(orchestrator/mcp/ src/shared/
            orchestrator/security/__init__.py
            orchestrator/security/anti_framing.py docker/Dockerfile.mcp)
          # docker/browser-exec is COPY'd into the workspace image at build time
          # (see Dockerfile.workspace §2c), so changes to it must rebuild the
          # workspace image. Missing this path caused a0ce92d2's browser-exec
          # fix to sit unbuilt while sha-310acc2 (the broken first cut) stayed
          # deployed. See knowledge-base/knowledge/features/browser_workspace_executor.md.
          WORKSPACE_PATHS=(docker/Dockerfile.workspace
            docker/workspace-entrypoint.sh
            docker/browser-exec docker/check-browser-stream.py
            docker/assert-browser-stack.sh
            .playwright-version)

          AGENT=$(has_changes "$SHA_AGENT" "${AGENT_PATHS[@]}")
          AGENT_SHA=$(last_input_sha "${AGENT_PATHS[@]}")

          ORCHESTRATOR=$(has_changes "$SHA_ORCHESTRATOR" "${ORCHESTRATOR_PATHS[@]}")
          ORCHESTRATOR_SHA=$(last_input_sha "${ORCHESTRATOR_PATHS[@]}")

          COCKPIT=$(has_changes "$SHA_COCKPIT" "${COCKPIT_PATHS[@]}")
          COCKPIT_SHA=$(last_input_sha "${COCKPIT_PATHS[@]}")

          MCP=$(has_changes "$SHA_MCP" "${MCP_PATHS[@]}")
          MCP_SHA=$(last_input_sha "${MCP_PATHS[@]}")

          WORKSPACE=$(has_changes "$SHA_WORKSPACE" "${WORKSPACE_PATHS[@]}")
          WORKSPACE_SHA=$(last_input_sha "${WORKSPACE_PATHS[@]}")

          VM_CONTROLLER=$(has_changes "$SHA_VM_CONTROLLER" \
            vm/controller/)

          # Stage1 rebuilds on changes to the heavy provisioning script, the
          # Packer template that drives it, .playwright-version, the cloud-init
          # seed, or the stage1 containerDisk wrapper. Otherwise the existing
          # GHCR :latest is reused — stage2 just pulls it.
          #
          # docker/assert-browser-stack.sh is the SHARED browser-stack contract
          # asserted at the end of stage2 but satisfied largely by stage1 (it
          # requires browser_use, playwright, and agent-chromium, all installed
          # in provision-stage1.sh). It lives here, in the STAGE1 list, so a
          # stricter gate forces a stage1 rebuild — otherwise stage2 runs the new
          # gate against a stale stage1 that lacks the newly-required capability
          # and fails every build. That is exactly what happened when 9fe74797
          # added the browser_use requirement: stage1 was never rebuilt (VM jobs
          # were skipped on the red-test-python runs), so stage2's gate rejected
          # the pre-browser_use stage1. Since stage2 also rebuilds whenever stage1
          # does (VM_BASE_STAGE1 is an OR-trigger for build-agent-vm-base), gate
          # requirements that are actually stage2-side stay covered too.
          VM_BASE_STAGE1=$(has_changes "$SHA_VM_BASE" \
            docker/agent-vm-base/scripts/provision-stage1.sh \
            docker/agent-vm-base/scripts/cleanup-stage1.sh \
            docker/agent-vm-base/stage1.pkr.hcl \
            docker/agent-vm-base/Dockerfile.containerDisk-stage1 \
            docker/agent-vm-base/cloud-init/ \
            docker/assert-browser-stack.sh \
            .playwright-version)

          # Stage2 (the per-commit image) rebuilds on changes to its provisioning
          # script, Packer template, cleanup script, daemon/sudo-gate config
          # files, or the containerDisk wrapper. Sudo-gate binary changes also
          # trigger this via SUDO_GATE below.
          #
          # docker/browser-exec is uploaded (stage2.pkr.hcl, `../browser-exec`)
          # and installed into the stage2 layer by provision-stage2.sh, so a
          # change to it needs only the cheap stage2 rebuild — the same reason it
          # is watched for the container workspace under WORKSPACE above. Missing
          # it here would let a browser-exec fix sit unbuilt in the VM image while
          # the container image shipped it, the same silent-drift bug the
          # WORKSPACE comment records for a0ce92d2.
          VM_BASE=$(has_changes "$SHA_VM_BASE" \
            docker/agent-vm-base/scripts/provision-stage2.sh \
            docker/agent-vm-base/scripts/cleanup.sh \
            docker/agent-vm-base/stage2.pkr.hcl \
            docker/agent-vm-base/Dockerfile.containerDisk \
            docker/agent-vm-base/files/ \
            docker/browser-exec docker/check-browser-stream.py)

          SUDO_GATE=$(has_changes "$SHA_VM_BASE" \
            vm/sudo-daemon/ vm/sudo-plugin/)

          # Chart changes (helm/ = main chart, helm-vm-cluster/ = vm-cluster
          # chart). Watch the chart-created Secret verifier too so changes to
          # that CI contract cannot skip the job that executes it. Both charts
          # must remain watched: a helm-vm-cluster/-only change otherwise skips
          # the vm-cluster chart publish + fleet bump.
          # Same push-range base the test-path step resolved (RANGE_BASE), so a
          # chart edit five commits below the tip is not missed. This one is
          # sharper than the test case: a false negative here skips the chart
          # PUBLISH and the fleet bump, so dev keeps running the old chart with
          # a green tick. Empty means "no usable range" and falls open below.
          CHART_BASE="${RANGE_BASE:-}"
          if [ -z "$CHART_BASE" ] || [ -n "$(git diff --name-only "$CHART_BASE" HEAD -- 'helm/' 'helm-vm-cluster/' 'scripts/check-chart-created-secret.sh')" ]; then
            CHART="true"
          else
            CHART="false"
          fi

          echo ""
          echo "Change detection results:"
          echo "  agent=$AGENT  orchestrator=$ORCHESTRATOR  cockpit=$COCKPIT"
          echo "  mcp=$MCP  workspace=$WORKSPACE"
          echo "  vm-controller=$VM_CONTROLLER  vm-base=$VM_BASE  vm-base-stage1=$VM_BASE_STAGE1  sudo-gate=$SUDO_GATE"
          echo "  chart=$CHART"
          echo "  input shas: agent=${AGENT_SHA::7} orchestrator=${ORCHESTRATOR_SHA::7} cockpit=${COCKPIT_SHA::7} mcp=${MCP_SHA::7} workspace=${WORKSPACE_SHA::7}"

          {
            echo "agent=$AGENT"
            echo "orchestrator=$ORCHESTRATOR"
            echo "cockpit=$COCKPIT"
            echo "mcp=$MCP"
            echo "workspace=$WORKSPACE"
            echo "agent-sha=$AGENT_SHA"
            echo "orchestrator-sha=$ORCHESTRATOR_SHA"
            echo "cockpit-sha=$COCKPIT_SHA"
            echo "mcp-sha=$MCP_SHA"
            echo "workspace-sha=$WORKSPACE_SHA"
            echo "vm-controller=$VM_CONTROLLER"
            echo "vm-base=$VM_BASE"
            echo "vm-base-stage1=$VM_BASE_STAGE1"
            echo "sudo-gate=$SUDO_GATE"
            echo "chart=$CHART"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Python tests (change-based)
  # ---------------------------------------------------------------------------
  test-python:
    needs: [changes]
    if: needs.changes.outputs.python-changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The chart render contract tests in tests/test_canvas_slice3_infra.py
      # shell out to `helm template`. ubuntu-latest ships Helm, so their
      # `which("helm")` skip guard never fires here; without the subchart
      # vendored they fail on the Collabora dependency instead of skipping.
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Build Helm dependencies
        run: |
          helm repo add collabora https://collaboraonline.github.io/online --force-update
          helm dependency build helm/
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r orchestrator/requirements.txt -r orchestrator/mcp/requirements.txt -r requirements-dev.txt pytest pytest-asyncio
      # `changes` narrowed this to the test files the diff can reach; the fallback
      # covers a dispatch, where selection is skipped on purpose, and any path
      # where the output is unset. loadfile keeps each selected file on one worker.
      - name: Run tests
        run: ./scripts/pytest-fast.sh ${{ needs.changes.outputs.pytest-target || 'tests/' }} -x -q --tb=short

  # ---------------------------------------------------------------------------
  # Cockpit unit + production-browser conformance tests (change-based)
  # ---------------------------------------------------------------------------
  test-cockpit:
    needs: [changes]
    if: needs.changes.outputs.cockpit-changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The engines and every system library they need are baked into this image
    # at /ms-playwright. The step this replaces (`playwright install --with-deps
    # chromium firefox webkit`) pulled 181 apt packages / 114 MB from
    # azure.archive.ubuntu.com on every cockpit change. That normally cost ~35 s,
    # but when the mirror degraded on 2026-08-18 it ran 18m40s, blew the job's
    # wall clock, and surfaced as a bare "The operation was canceled" that looked
    # like a test failure (run 32157390228). Engines no longer touch apt.
    # PLAYWRIGHT_VERSION must match this tag; the guard step below enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.59.0-noble
    env:
      PLAYWRIGHT_VERSION: 1.59.0
      # A container job runs as root with HOME=/github/home, a runner-owned
      # bind mount (pwuser inside this image). Firefox refuses to launch when
      # $HOME belongs to another user ("Running Nightly as root in a regular
      # user's session is not supported"), so all 11 firefox specs died at
      # browser launch on the first cockpit push after the image switch, while
      # chromium and webkit passed. /root is owned by the user this job
      # actually runs as. This is Playwright's documented workaround; drop it
      # only if the job stops running as root.
      HOME: /root
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The image ships Node 24; pin to 22 so unit tests, the production build,
      # and the conformance run all use the same Node as every other job.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Install dependencies
        working-directory: cockpit
        run: npm ci
      # Engines come from the image, so a @playwright/test bump that forgets the
      # container tag would otherwise surface minutes later as a confusing
      # "Executable doesn't exist". Bump the tag and PLAYWRIGHT_VERSION together.
      - name: Verify Playwright matches the container image
        working-directory: cockpit
        run: |
          HAVE=$(node -p "require('@playwright/test/package.json').version")
          if [ "$HAVE" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::@playwright/test is $HAVE but this job runs mcr.microsoft.com/playwright:v$PLAYWRIGHT_VERSION-noble."
            echo "::error::Bump the container image tag and PLAYWRIGHT_VERSION in this workflow to v$HAVE-noble."
            exit 1
          fi
          echo "Playwright $HAVE matches the container image."
      - name: Check i18n parity
        working-directory: cockpit
        run: npm run i18n:check
      # Step-level caps so a hung step names itself instead of silently eating
      # the job budget. Healthy times are ~70 s / ~25 s / ~75 s.
      - name: Run tests
        working-directory: cockpit
        timeout-minutes: 10
        run: npm test
      - name: Build production Cockpit
        working-directory: cockpit
        timeout-minutes: 10
        run: npm run build
      - name: Run Dynamic Canvas browser conformance
        working-directory: cockpit
        timeout-minutes: 10
        run: npm run test:e2e:canvas:no-build
      - name: Upload Dynamic Canvas browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-browser-report-develop-${{ github.run_attempt }}
          path: |
            cockpit/playwright-report/
            cockpit/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Image builds — change-based, SHA + :experimental tags only
  # Lint is NOT required (non-blocking on develop).
  # ---------------------------------------------------------------------------
  build-agent:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # Hosted runners have ~14 GiB free and these jobs need more. Self-hosted
        # runners do not need it, and the heavy variants below delete
        # /opt/hostedtoolcache, which is where setup-* install. Guarded rather
        # than deleted so the hosted fallback (gh variable delete CI_RUNNER_LABEL)
        # still works.
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image identity = newest commit touching this component's build inputs
      # (computed in the changes job), NOT the push HEAD — docs-HEAD pushes
      # and catch-up rebuilds reproduce the same tag for unchanged inputs.
      # The tag suffix must stay equal to the baked BUILD_SHA below: the
      # lifecycle reconciler drains agents whose reported BUILD_SHA differs
      # from the sha in the configured image tag.
      - name: Resolve component identity
        id: ident
        run: |
          FULL="${{ needs.changes.outputs.agent-sha }}"
          : "${FULL:=$GITHUB_SHA}"
          {
            echo "full=$FULL"
            echo "short=${FULL::7}"
            echo "version=0.0.0-dev.sha-${FULL}"
          } >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent
          tags: |
            type=raw,value=sha-${{ steps.ident.outputs.short }}
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.agent
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ env.SRW_SOURCE_URL }}
            org.opencontainers.image.revision=${{ steps.ident.outputs.full }}
            org.opencontainers.image.version=${{ steps.ident.outputs.version }}
            org.opencontainers.image.documentation=${{ env.SRW_DOCUMENTATION_URL }}
            io.srw.component=agent
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true
          build-args: |
            BUILD_SHA=${{ steps.ident.outputs.short }}
            SRW_SOURCE_REVISION=${{ steps.ident.outputs.full }}
            SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}
            SRW_RELEASE_VERSION=${{ steps.ident.outputs.version }}
            SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}

  build-orchestrator:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.orchestrator == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image identity = newest input commit, not push HEAD (see build-agent).
      - name: Resolve component identity
        id: ident
        run: |
          FULL="${{ needs.changes.outputs.orchestrator-sha }}"
          : "${FULL:=$GITHUB_SHA}"
          {
            echo "full=$FULL"
            echo "short=${FULL::7}"
            echo "version=0.0.0-dev.sha-${FULL}"
          } >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator
          tags: |
            type=raw,value=sha-${{ steps.ident.outputs.short }}
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.orchestrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=${{ env.SRW_SOURCE_URL }}
            org.opencontainers.image.revision=${{ steps.ident.outputs.full }}
            org.opencontainers.image.version=${{ steps.ident.outputs.version }}
            org.opencontainers.image.documentation=${{ env.SRW_DOCUMENTATION_URL }}
            io.srw.component=orchestrator
          provenance: false
          build-args: |
            SRW_SOURCE_REVISION=${{ steps.ident.outputs.full }}
            SRW_SOURCE_URL=${{ env.SRW_SOURCE_URL }}
            SRW_RELEASE_VERSION=${{ steps.ident.outputs.version }}
            SRW_DOCUMENTATION_URL=${{ env.SRW_DOCUMENTATION_URL }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-orchestrator:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-orchestrator:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-cockpit:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.cockpit == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      needs.test-python.result != 'failure' && needs.test-python.result != 'cancelled' &&
      needs.test-cockpit.result != 'failure' && needs.test-cockpit.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image identity = newest input commit, not push HEAD (see build-agent).
