name: develop

# Lightweight CI for the develop branch.
#
# Key differences from the main (Production) pipeline:
#   - Lint is non-blocking — ruff format auto-commits fixes on push
#   - Tests and builds are change-based (only run when relevant files change)
#   - Images get SHA + :experimental tags (no version tags)
#   - Helm chart published as "srw-dev" with 0.0.0-dev.sha-<hash> versions
#   - deploy-experimental updates fleet.yaml chart version + image tags
#
# PR vs push behavior:
#   - PR to develop: change-based image builds run with `push: false` —
#     no docker login, no :experimental tag, no chart publish, no fleet
#     update. Purely Dockerfile/Packer validation so a broken build is
#     caught before merge instead of after. Docs-only PRs still pay nothing
#     since change-detection skips the build jobs entirely.
#   - Push to develop: same change-based builds, but `push: true` with
#     SHA + :experimental tags, followed by deploy-experimental.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Lowercased repo path for GHCR cache refs. github.repository preserves
  # GitHub's case-sensitive name (e.g. Knaeckebrothero/Uni-Projekt-Graph-RAG),
  # but GHCR rejects uppercase image paths. docker/metadata-action handles
  # this for production tags; YAML expressions can't lowercase, so we hardcode.
  # Update this if the repo is renamed.
  REPO_LOWER: knaeckebrothero/uni-projekt-graph-rag

jobs:
  # ---------------------------------------------------------------------------
  # Auto-format + lint (non-blocking — failures don't gate builds)
  # On push: auto-commits ruff format fixes so develop stays clean.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.14.10

      - name: Auto-format and commit
        if: github.event_name == 'push'
        run: |
          ruff format src/ orchestrator/ tests/
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ orchestrator/ tests/
            git commit -m "style: ruff auto-format"
            git push
          fi

      - name: Ruff lint check
        run: ruff check src/ orchestrator/ tests/
        continue-on-error: true

      - name: Ruff format check
        run: ruff format --check src/ orchestrator/ tests/
        continue-on-error: true

      - name: Verify Playwright pin consistency
        run: |
          # The agent image has no Playwright; the pin only feeds the
          # workspace/VM builds (.playwright-version is the source of truth,
          # passed as a build-arg). Guard the two fallback copies against drift.
          PIN=$(tr -d '[:space:]' < .playwright-version)
          test -n "$PIN" || { echo "::error::.playwright-version is empty"; exit 1; }
          grep -q "^ARG PLAYWRIGHT_VERSION=${PIN}$" docker/Dockerfile.workspace \
            || { echo "::error::ARG PLAYWRIGHT_VERSION default in docker/Dockerfile.workspace does not match .playwright-version (${PIN})"; exit 1; }
          grep -q "^PLAYWRIGHT_VERSION=${PIN}$" .env.example \
            || { echo "::error::PLAYWRIGHT_VERSION in .env.example does not match .playwright-version (${PIN})"; exit 1; }
        continue-on-error: true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Helm lint (home cluster scenario)
        run: helm lint helm/ -f helm/ci/test-values.yaml
        continue-on-error: true

      - name: Helm lint (customer external-services scenario)
        run: helm lint helm/ -f helm/ci/customer-external-values.yaml
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # CodeQL — static analysis for security vulnerabilities
  # ---------------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # Dependency audit — blocking (rarely fails, catches real CVEs)
  # ---------------------------------------------------------------------------
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Upgrade pip
        # CVE-2026-6357: pip < 26.1 runs self-update import after wheel install
        run: uv pip install --system --upgrade 'pip>=26.1'
      - name: Install pip-audit
        run: uv pip install --system pip-audit
      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt
      - name: Audit Python dependencies
        # CVE-2026-4539: pygments ReDoS in AdlLexer — local-only, no fix released
        # CVE-2026-25645: requests extract_zipped_paths() temp path — we don't call it;
        #   arxiv pins requests<2.33.0 so we can't upgrade until arxiv releases a fix
        # CVE-2026-3219: pip treats concatenated tar+ZIP files as ZIP — no fix released;
        #   requires a maliciously crafted package, not exposed via our install flow
        # CVE-2026-44405: paramiko rsakey.py allows SHA-1 — no released fix yet (only on
        #   master at commit a448945). Exploitation requires MITM on the SSH channel; our
        #   connections are cluster-internal to controlled workspace pods/VMs.
        #
        # PYSEC-2024-277 (joblib): disputed by upstream; NumpyArrayWrapper is only used
        #   while caching trusted content. No fix released.
        # PYSEC-2024-278 (langchain-community): TFIDFRetriever.load_local SSRF — the
        #   advisory itself says "Upgrading to version 0.0.27 is able to address this"
        #   and we resolve to 0.4.1. OSV metadata lacks a fixed-version field so
        #   pip-audit still flags it.
        # PYSEC-2025-144/145/146/147, PYSEC-2026-101/102 (ollama): every advisory targets
        #   the Ollama Go server (Modelfile parsing, /api/pull, fs/ggml/gguf.go). We use
        #   the `ollama` PyPI package as a thin HTTP client against in-cluster endpoints;
        #   the affected server binary isn't shipped by our images.
        # PYSEC-2025-183 (pyjwt): disputed; the "weak encryption" claim depends on
        #   caller-chosen key length, which is enforced by Keycloak in our deployment.
        # PYSEC-2025-189..197, 210, PYSEC-2026-139, CVE-2025-3000 (torch): all require
        #   loading an attacker-supplied checkpoint or running torch.jit on attacker
        #   code. Agents only pull torch transitively via sentence-transformers against
        #   pinned, vetted embedding models. Most have no fix released.
        # PYSEC-2025-211..218 (transformers): deserialization of untrusted model files
        #   (X-CLIP, GLM4, Perceiver, Transformer-XL, megatron_gpt2, SEW/SEW-D/HuBERT
        #   convert_config). Same threat model — we don't convert or load attacker-
        #   supplied checkpoints, and no fix versions are listed upstream.
        run: >-
          pip-audit --desc
          --ignore-vuln CVE-2026-4539
          --ignore-vuln CVE-2026-25645
          --ignore-vuln CVE-2026-3219
          --ignore-vuln CVE-2026-44405
          --ignore-vuln PYSEC-2024-277
          --ignore-vuln PYSEC-2024-278
          --ignore-vuln PYSEC-2025-144
          --ignore-vuln PYSEC-2025-145
          --ignore-vuln PYSEC-2025-146
          --ignore-vuln PYSEC-2025-147
          --ignore-vuln PYSEC-2026-101
          --ignore-vuln PYSEC-2026-102
          --ignore-vuln PYSEC-2025-183
          --ignore-vuln PYSEC-2025-189
          --ignore-vuln PYSEC-2025-190
          --ignore-vuln PYSEC-2025-191
          --ignore-vuln PYSEC-2025-192
          --ignore-vuln PYSEC-2025-193
          --ignore-vuln PYSEC-2025-194
          --ignore-vuln PYSEC-2025-195
          --ignore-vuln PYSEC-2025-196
          --ignore-vuln PYSEC-2025-197
          --ignore-vuln PYSEC-2025-210
          --ignore-vuln PYSEC-2026-139
          --ignore-vuln CVE-2025-3000
          --ignore-vuln PYSEC-2025-211
          --ignore-vuln PYSEC-2025-212
          --ignore-vuln PYSEC-2025-213
          --ignore-vuln PYSEC-2025-214
          --ignore-vuln PYSEC-2025-215
          --ignore-vuln PYSEC-2025-216
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2025-218
      - name: Audit npm dependencies
        working-directory: cockpit
        # lodash-es 4.17.23 is the latest release; no fix available.
        # Transitive via mermaid → langium → chevrotain → lodash-es.
        # GHSA-r5fr-rjxr-66jc: Code Injection via _.template (high)
        # GHSA-f23m-r3pf-42rh: Prototype Pollution via _.unset/_.omit (moderate)
        run: |
          npm audit --json | python3 -c "
          import json, sys
          IGNORE_ADVISORIES = {'GHSA-r5fr-rjxr-66jc', 'GHSA-f23m-r3pf-42rh'}
          data = json.load(sys.stdin)
          vulns = data.get('vulnerabilities', {})

          # Mark packages whose only root-cause advisories are all ignored
          ignored_pkgs = set()
          changed = True
          while changed:
              changed = False
              for name, vuln in vulns.items():
                  if name in ignored_pkgs:
                      continue
                  dominated = True
                  for v in vuln.get('via', []):
                      if isinstance(v, dict):
                          ghsa = v.get('url', '').split('/')[-1]
                          if ghsa not in IGNORE_ADVISORIES:
                              dominated = False
                              break
                      elif isinstance(v, str) and v not in ignored_pkgs:
                          dominated = False
                          break
                  if dominated:
                      ignored_pkgs.add(name)
                      changed = True

          found = 0
          for name, vuln in vulns.items():
              if name in ignored_pkgs:
                  continue
              if vuln.get('severity') in ('high', 'critical'):
                  found += 1
                  print(f'{name}: {vuln[\"severity\"]}')
          if found:
              print(f'{found} unignored high/critical vulnerabilities')
              sys.exit(1)
          print('npm audit passed (ignored advisories: ' + ', '.join(IGNORE_ADVISORIES) + ')')
          "

  # ---------------------------------------------------------------------------
  # Detect which components changed — build jobs only run when needed
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.check.outputs.agent }}
      orchestrator: ${{ steps.check.outputs.orchestrator }}
      cockpit: ${{ steps.check.outputs.cockpit }}
      mcp: ${{ steps.check.outputs.mcp }}
      vm-base: ${{ steps.check.outputs.vm-base }}
      vm-base-stage1: ${{ steps.check.outputs.vm-base-stage1 }}
      vm-controller: ${{ steps.check.outputs.vm-controller }}
      sudo-gate: ${{ steps.check.outputs.sudo-gate }}
      workspace: ${{ steps.check.outputs.workspace }}
      chart: ${{ steps.check.outputs.chart }}
      python-changed: ${{ steps.test-paths.outputs.python }}
      cockpit-changed: ${{ steps.test-paths.outputs.cockpit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect test-relevant changes
        id: test-paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif git rev-parse HEAD~1 &>/dev/null; then
            BASE="HEAD~1"
          else
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "cockpit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" HEAD -- \
            'src/' 'orchestrator/' 'tests/' 'config/' 'agent.py' \
            'requirements.txt' 'orchestrator/requirements.txt' \
            | grep -q .; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only "$BASE" HEAD -- 'cockpit/' | grep -q .; then
            echo "cockpit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cockpit=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Test path detection: python=$(grep python "$GITHUB_OUTPUT" | tail -1) cockpit=$(grep cockpit "$GITHUB_OUTPUT" | tail -1)"

      - name: Detect changes against last deployed SHA per component
        id: check
        run: |
          extract_sha() {
            local component="$1"
            grep -A1 "^  ${component}:" deployment/values-experimental.yaml 2>/dev/null \
              | grep -oP 'tag:\s*sha-\K[0-9a-f]{7}' | head -1 || echo ""
          }

          has_changes() {
            local sha="$1"
            shift
            local paths=("$@")
            if [ -z "$sha" ]; then
              echo "true"
              return
            fi
            if ! git cat-file -t "$sha" &>/dev/null; then
              echo "true"
              return
            fi
            for path in "${paths[@]}"; do
              if [ -n "$(git diff --name-only "$sha" HEAD -- "$path")" ]; then
                echo "true"
                return
              fi
            done
            echo "false"
          }

          SHA_AGENT=$(extract_sha agent)
          SHA_ORCHESTRATOR=$(extract_sha orchestrator)
          SHA_COCKPIT=$(extract_sha cockpit)
          SHA_MCP=$(extract_sha mcp)
          SHA_WORKSPACE=$(extract_sha workspace)
          # VM image SHAs live in fleet.yaml — vmController as a bare tag
          # (image.vmController.tag), agent-vm-base embedded in the
          # defaultVmImage URL (vmController.defaultVmImage). yq is preinstalled
          # on ubuntu-latest. Empty result → has_changes treats as "rebuild",
          # which is the safe default.
          SHA_VM_CONTROLLER=$(yq '.helm.values.image.vmController.tag' deployment-vms/srw-vm-controller/fleet.yaml 2>/dev/null | grep -oP 'sha-\K[0-9a-f]{7}' | head -1)
          SHA_VM_BASE=$(yq '.helm.values.vmController.defaultVmImage' deployment-vms/srw-vm-controller/fleet.yaml 2>/dev/null | grep -oP 'sha-\K[0-9a-f]{7}' | head -1)

          echo "Deployed SHAs:"
          echo "  agent=$SHA_AGENT  orchestrator=$SHA_ORCHESTRATOR  cockpit=$SHA_COCKPIT"
          echo "  mcp=$SHA_MCP  workspace=$SHA_WORKSPACE"
          echo "  vm-controller=$SHA_VM_CONTROLLER  vm-base=$SHA_VM_BASE"

          AGENT=$(has_changes "$SHA_AGENT" \
            src/ config/ agent.py requirements.txt docker/Dockerfile.agent)

          ORCHESTRATOR=$(has_changes "$SHA_ORCHESTRATOR" \
            orchestrator/ config/ docker/Dockerfile.orchestrator)

          COCKPIT=$(has_changes "$SHA_COCKPIT" \
            cockpit/ docker/Dockerfile.cockpit)

          MCP=$(has_changes "$SHA_MCP" \
            orchestrator/mcp/ orchestrator/services/formatters.py \
            orchestrator/services/__init__.py docker/Dockerfile.mcp)

          # docker/browser-exec is COPY'd into the workspace image at build time
          # (see Dockerfile.workspace §2c), so changes to it must rebuild the
          # workspace image. Missing this path caused a0ce92d2's browser-exec
          # fix to sit unbuilt while sha-310acc2 (the broken first cut) stayed
          # deployed. See docs/features/browser_workspace_executor.md.
          WORKSPACE=$(has_changes "$SHA_WORKSPACE" \
            docker/Dockerfile.workspace docker/workspace-entrypoint.sh \
            docker/browser-exec .playwright-version)

          VM_CONTROLLER=$(has_changes "$SHA_VM_CONTROLLER" \
            vm/controller/)

          # Stage1 rebuilds on changes to the heavy provisioning script, the
          # Packer template that drives it, .playwright-version, the cloud-init
          # seed, or the stage1 containerDisk wrapper. Otherwise the existing
          # GHCR :latest is reused — stage2 just pulls it.
          VM_BASE_STAGE1=$(has_changes "$SHA_VM_BASE" \
            docker/agent-vm-base/scripts/provision-stage1.sh \
            docker/agent-vm-base/scripts/cleanup-stage1.sh \
            docker/agent-vm-base/stage1.pkr.hcl \
            docker/agent-vm-base/Dockerfile.containerDisk-stage1 \
            docker/agent-vm-base/cloud-init/ \
            .playwright-version)

          # Stage2 (the per-commit image) rebuilds on changes to its provisioning
          # script, Packer template, cleanup script, daemon/sudo-gate config
          # files, or the containerDisk wrapper. Sudo-gate binary changes also
          # trigger this via SUDO_GATE below.
          VM_BASE=$(has_changes "$SHA_VM_BASE" \
            docker/agent-vm-base/scripts/provision-stage2.sh \
            docker/agent-vm-base/scripts/cleanup.sh \
            docker/agent-vm-base/stage2.pkr.hcl \
            docker/agent-vm-base/Dockerfile.containerDisk \
            docker/agent-vm-base/files/)

          SUDO_GATE=$(has_changes "$SHA_VM_BASE" \
            vm/sudo-daemon/ vm/sudo-plugin/)

          # Chart changes (helm/ directory)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHART_BASE="${{ github.event.pull_request.base.sha }}"
          elif git rev-parse HEAD~1 &>/dev/null; then
            CHART_BASE="HEAD~1"
          else
            CHART_BASE=""
          fi
          if [ -z "$CHART_BASE" ] || [ -n "$(git diff --name-only "$CHART_BASE" HEAD -- 'helm/')" ]; then
            CHART="true"
          else
            CHART="false"
          fi

          echo ""
          echo "Change detection results:"
          echo "  agent=$AGENT  orchestrator=$ORCHESTRATOR  cockpit=$COCKPIT"
          echo "  mcp=$MCP  workspace=$WORKSPACE"
          echo "  vm-controller=$VM_CONTROLLER  vm-base=$VM_BASE  vm-base-stage1=$VM_BASE_STAGE1  sudo-gate=$SUDO_GATE"
          echo "  chart=$CHART"

          {
            echo "agent=$AGENT"
            echo "orchestrator=$ORCHESTRATOR"
            echo "cockpit=$COCKPIT"
            echo "mcp=$MCP"
            echo "workspace=$WORKSPACE"
            echo "vm-controller=$VM_CONTROLLER"
            echo "vm-base=$VM_BASE"
            echo "vm-base-stage1=$VM_BASE_STAGE1"
            echo "sudo-gate=$SUDO_GATE"
            echo "chart=$CHART"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Python tests (change-based)
  # ---------------------------------------------------------------------------
  test-python:
    needs: [changes]
    if: needs.changes.outputs.python-changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r orchestrator/requirements.txt pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -x -q --tb=short

  # ---------------------------------------------------------------------------
  # Cockpit (Angular) tests (change-based)
  # ---------------------------------------------------------------------------
  test-cockpit:
    needs: [changes]
    if: needs.changes.outputs.cockpit-changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - name: Install dependencies
        working-directory: cockpit
        run: npm ci
      - name: Check i18n parity
        working-directory: cockpit
        run: npm run i18n:check
      - name: Run tests
        working-directory: cockpit
        run: npm test

  # ---------------------------------------------------------------------------
  # Image builds — change-based, SHA + :experimental tags only
  # Lint is NOT required (non-blocking on develop).
  # ---------------------------------------------------------------------------
  build-agent:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - id: short_sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.agent
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-agent:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true
          build-args: |
            BUILD_SHA=${{ steps.short_sha.outputs.sha }}

  build-orchestrator:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.orchestrator == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-orchestrator
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.orchestrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-orchestrator:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-orchestrator:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-cockpit:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.cockpit == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cockpit
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.cockpit
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-cockpit:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-cockpit:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-mcp:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.mcp == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mcp
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.mcp
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-mcp:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-mcp:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-workspace:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.workspace == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-workspace
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Read Playwright version
        id: pw
        run: echo "version=$(tr -d '[:space:]' < .playwright-version)" >> "$GITHUB_OUTPUT"
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.workspace
          build-args: |
            PLAYWRIGHT_VERSION=${{ steps.pw.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-workspace:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-workspace:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  build-sudo-gate:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.sudo-gate == 'true' || needs.changes.outputs.vm-base == 'true' || needs.changes.outputs.vm-base-stage1 == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build sudo-gated (Go daemon)
        working-directory: vm/sudo-daemon
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X main.version=sha-${GITHUB_SHA::7}" \
            -o sudo-gated ./cmd/sudo-gated/
          file sudo-gated
          ls -lh sudo-gated
      - name: Build sudo_gate.so (C plugin)
        working-directory: vm/sudo-plugin
        run: |
          gcc -fPIC -shared -Wall -Wextra -Werror -O2 -I./include \
            -o sudo_gate.so sudo_gate.c json_util.c
          file sudo_gate.so
          ls -lh sudo_gate.so
      - name: Upload sudo gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sudo-gate-binaries
          path: |
            vm/sudo-daemon/sudo-gated
            vm/sudo-plugin/sudo_gate.so
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 1: heavy, stable provisioning (apt + datasource clients + Tailscale +
  # Playwright + Node). Rebuilds only when stage1 inputs change. Published as
  # ghcr.io/<repo>-agent-vm-base-stage1; stage2 pulls and layers on top.
  # ---------------------------------------------------------------------------
  build-agent-vm-base-stage1:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.vm-base-stage1 == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      - name: Compute cloud image cache key
        id: img-key
        run: echo "key=ubuntu-noble-cloudimg-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Ubuntu cloud image
        id: cloud-image-cache
        uses: actions/cache@v4
        with:
          path: docker/agent-vm-base/input/noble-server-cloudimg-amd64.img
          key: ${{ steps.img-key.outputs.key }}
      - name: Download Ubuntu cloud image
        if: steps.cloud-image-cache.outputs.cache-hit != 'true'
        working-directory: docker/agent-vm-base
        run: |
          mkdir -p input
          wget -q https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img \
            -O input/noble-server-cloudimg-amd64.img
      - name: Verify Ubuntu cloud image
        working-directory: docker/agent-vm-base
        run: qemu-img info input/noble-server-cloudimg-amd64.img
      - name: Packer init (stage1)
        working-directory: docker/agent-vm-base
        run: packer init stage1.pkr.hcl
      - name: Packer build (stage1)
        working-directory: docker/agent-vm-base
        run: |
          PW_VERSION=$(tr -d '[:space:]' < ../../.playwright-version)
          test -n "$PW_VERSION" || { echo "::error::.playwright-version is empty"; exit 1; }
          for attempt in 1 2; do
            if packer build -var "playwright_version=${PW_VERSION}" stage1.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage1 packer build attempt ${attempt} failed"
            rm -rf output-stage1
          done
          echo "::error::Stage1 packer build failed after 2 attempts"
          exit 1
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }} stage1 containerDisk
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS=("${IMAGE}:pr-validate-${GITHUB_SHA::7}")
          else
            TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}" "${IMAGE}:latest" "${IMAGE}:experimental")
          fi
          BUILD_ARGS=()
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk-stage1 .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for T in "${TAGS[@]}"; do docker push "$T"; done
            printf 'Pushed stage1:\n'; printf '  %s\n' "${TAGS[@]}"
          else
            printf 'Built stage1 (PR validation, not pushed):\n'; printf '  %s\n' "${TAGS[@]}"
          fi

  # ---------------------------------------------------------------------------
  # Stage 2: light per-commit layer (user setup, SSH config, daemon, sudo gate).
  # Pulls the stage1 containerDisk from GHCR, extracts the qcow2, and layers
  # stage2 on top via stage2.pkr.hcl. Should finish in ~5-10 min.
  # ---------------------------------------------------------------------------
  build-agent-vm-base:
    needs: [changes, dependency-audit, test-python, test-cockpit, build-sudo-gate, build-agent-vm-base-stage1]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.vm-base == 'true' || needs.changes.outputs.vm-base-stage1 == 'true' || needs.changes.outputs.sudo-gate == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure') &&
      needs.build-sudo-gate.result == 'success' &&
      (needs.build-agent-vm-base-stage1.result == 'success' || needs.build-agent-vm-base-stage1.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fail if sudo-gate build failed
        if: needs.build-sudo-gate.result == 'failure'
        run: |
          echo "::error::build-sudo-gate failed — refusing to build VM image without gate binaries"
          exit 1
      - uses: actions/checkout@v4
      - name: Download sudo gate artifacts
        uses: actions/download-artifact@v4
        with:
          name: sudo-gate-binaries
          path: docker/agent-vm-base/files/
        continue-on-error: true
      - name: Prepare sudo gate binaries for Packer
        working-directory: docker/agent-vm-base
        run: |
          if [ -f files/vm/sudo-daemon/sudo-gated ]; then
            mv files/vm/sudo-daemon/sudo-gated files/sudo-gated-bin
            echo "sudo-gated binary ready ($(wc -c < files/sudo-gated-bin) bytes)"
          else
            touch files/sudo-gated-bin
            echo "sudo-gated binary not available — creating empty placeholder"
          fi
          if [ -f files/vm/sudo-plugin/sudo_gate.so ]; then
            mv files/vm/sudo-plugin/sudo_gate.so files/sudo_gate.so
            echo "sudo_gate.so ready ($(wc -c < files/sudo_gate.so) bytes)"
          else
            touch files/sudo_gate.so
            echo "sudo_gate.so not available — creating empty placeholder"
          fi
          ls -la files/
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/chromium \
            /usr/share/swift /usr/local/julia* /opt/hostedtoolcache
      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - uses: hashicorp/setup-packer@main
        with:
          version: latest
      # Login is unconditional here — needed to PULL the stage1 containerDisk
      # from GHCR even on PR validation runs. Push of the final image still
      # gates on push events below.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull stage1 containerDisk and extract qcow2
        working-directory: docker/agent-vm-base
        run: |
          STAGE1_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base-stage1:latest" | tr '[:upper:]' '[:lower:]')
          docker pull "$STAGE1_IMAGE"
          # FROM scratch images have no shell so a real CMD doesn't matter — we
          # never start the container, just create-then-cp.
          CID=$(docker create "$STAGE1_IMAGE" /noop 2>/dev/null || docker create "$STAGE1_IMAGE")
          mkdir -p input
          docker cp "$CID":/disk/agent-vm-base-stage1.qcow2 input/agent-vm-base-stage1.qcow2
          docker rm "$CID"
          qemu-img info input/agent-vm-base-stage1.qcow2
      - name: Packer init (stage2)
        working-directory: docker/agent-vm-base
        run: packer init stage2.pkr.hcl
      - name: Packer build (stage2)
        working-directory: docker/agent-vm-base
        run: |
          for attempt in 1 2; do
            if packer build stage2.pkr.hcl; then
              exit 0
            fi
            echo "::warning::Stage2 packer build attempt ${attempt} failed"
            rm -rf output
          done
          echo "::error::Stage2 packer build failed after 2 attempts"
          exit 1
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }} containerDisk image
        working-directory: docker/agent-vm-base
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-agent-vm-base" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR validation: build with a single throwaway tag, no push.
            TAGS=("${IMAGE}:pr-validate-${GITHUB_SHA::7}")
          else
            TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}" "${IMAGE}:experimental")
          fi
          BUILD_ARGS=()
          for T in "${TAGS[@]}"; do BUILD_ARGS+=(-t "$T"); done
          docker build "${BUILD_ARGS[@]}" -f Dockerfile.containerDisk .
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for T in "${TAGS[@]}"; do docker push "$T"; done
            printf 'Pushed:\n'; printf '  %s\n' "${TAGS[@]}"
          else
            printf 'Built (PR validation, not pushed):\n'; printf '  %s\n' "${TAGS[@]}"
          fi

  build-vm-controller:
    needs: [changes, dependency-audit, test-python, test-cockpit]
    if: >-
      always() && !cancelled() &&
      (needs.changes.outputs.vm-controller == 'true' || github.event_name == 'workflow_dispatch') &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-vm-controller
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=experimental,enable=${{ github.event_name != 'pull_request' }}
      - name: Build${{ github.event_name == 'pull_request' && ' (PR validation, no push)' || ' and push' }}
        uses: docker/build-push-action@v5
        with:
          context: ./vm/controller
          file: ./vm/controller/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-develop
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-vm-controller:buildcache-develop,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

  # ---------------------------------------------------------------------------
  # Publish dev Helm chart + update deployment config for Fleet.
  #
  # Publishes the chart as "srw-dev" with a semver pre-release version
  # (0.0.0-dev.sha-<hash>), then updates fleet.yaml with the chart version
  # and values-experimental.yaml with the new image tags, all in one commit.
  # ---------------------------------------------------------------------------
  deploy-experimental:
    needs:
      - changes
      - dependency-audit
      - test-python
      - test-cockpit
      - build-agent
      - build-orchestrator
      - build-cockpit
      - build-mcp
      - build-workspace
      - build-vm-controller
      - build-agent-vm-base
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' &&
      needs.dependency-audit.result == 'success' &&
      !contains(needs.test-python.result, 'failure') &&
      !contains(needs.test-cockpit.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Install tools
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tag
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Note: hyphen (not dot) before the SHA so the segment stays
          # alphanumeric — a purely-numeric segment like "0439848" would be
          # rejected by semver as a numeric identifier with a leading zero.
          echo "chart_version=0.0.0-dev.sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # -- Publish dev chart (only when helm/ changed or any build succeeded) --
      - name: Package and push dev chart
        if: >-
          needs.changes.outputs.chart == 'true' ||
          needs.build-agent.result == 'success' ||
          needs.build-orchestrator.result == 'success' ||
          needs.build-cockpit.result == 'success' ||
          needs.build-mcp.result == 'success'
        run: |
          # Override chart name for dev channel
          yq -i '.name = "srw-dev"' helm/Chart.yaml
          mkdir -p dist
          helm package helm/ \
            --version "${{ steps.tag.outputs.chart_version }}" \
            --app-version "${{ steps.tag.outputs.sha }}" \
            --destination ./dist
          helm push ./dist/srw-dev-${{ steps.tag.outputs.chart_version }}.tgz \
            oci://ghcr.io/knaeckebrothero/charts
          # Restore Chart.yaml (don't commit the name override)
          git checkout helm/Chart.yaml

      # -- Publish dev VM-cluster chart (parallel to srw-dev). Same trigger:
      # any chart-source change OR any image build success. The vm-controller
      # image build is the most common trigger here. --
      - name: Package and push dev vm-cluster chart
        if: >-
          needs.changes.outputs.chart == 'true' ||
          needs.build-vm-controller.result == 'success' ||
          needs.build-agent-vm-base.result == 'success'
        run: |
          # Override chart name for dev channel
          yq -i '.name = "srw-dev-vm-cluster"' helm-vm-cluster/Chart.yaml
          mkdir -p dist
          helm package helm-vm-cluster/ \
            --version "${{ steps.tag.outputs.chart_version }}" \
            --app-version "${{ steps.tag.outputs.sha }}" \
            --destination ./dist
          helm push ./dist/srw-dev-vm-cluster-${{ steps.tag.outputs.chart_version }}.tgz \
            oci://ghcr.io/knaeckebrothero/charts
          git checkout helm-vm-cluster/Chart.yaml

      # -- Update fleet.yaml chart version (orchestrator chart) --
      - name: Update fleet.yaml chart version
        if: >-
          needs.changes.outputs.chart == 'true' ||
          needs.build-agent.result == 'success' ||
          needs.build-orchestrator.result == 'success' ||
          needs.build-cockpit.result == 'success' ||
          needs.build-mcp.result == 'success'
        run: >-
          yq -i '.helm.version = "${{ steps.tag.outputs.chart_version }}"'
          deployment/fleet.yaml

      # -- Update vm-cluster bundle's chart version --
      - name: Update vm-cluster fleet.yaml chart version
        if: >-
          needs.changes.outputs.chart == 'true' ||
          needs.build-vm-controller.result == 'success' ||
          needs.build-agent-vm-base.result == 'success'
        run: >-
          yq -i '.helm.version = "${{ steps.tag.outputs.chart_version }}"'
          deployment-vms/srw-vm-controller/fleet.yaml

      # -- Update image tags in values-experimental.yaml --
      - name: Update orchestrator tag
        if: needs.build-orchestrator.result == 'success'
        run: yq -i '.image.orchestrator.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update agent tag
        if: needs.build-agent.result == 'success'
        run: yq -i '.image.agent.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update cockpit tag
        if: needs.build-cockpit.result == 'success'
        run: yq -i '.image.cockpit.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update MCP tag
        if: needs.build-mcp.result == 'success'
        run: yq -i '.image.mcp.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update workspace tag
        if: needs.build-workspace.result == 'success'
        run: yq -i '.image.workspace.tag = "${{ steps.tag.outputs.sha }}"' deployment/values-experimental.yaml

      - name: Update VM controller image tag
        if: needs.build-vm-controller.result == 'success'
        run: >-
          yq -i '.helm.values.image.vmController.tag = "${{ steps.tag.outputs.sha }}"'
          deployment-vms/srw-vm-controller/fleet.yaml

      - name: Update agent VM base image tag
        if: needs.build-agent-vm-base.result == 'success'
        run: >-
          yq -i '.helm.values.vmController.defaultVmImage = "ghcr.io/knaeckebrothero/superhuman-remote-worker-agent-vm-base:${{ steps.tag.outputs.sha }}"'
          deployment-vms/srw-vm-controller/fleet.yaml

      - name: Commit and push
        run: |
          git diff --quiet && { echo "No changes to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/fleet.yaml deployment/values-experimental.yaml deployment-vms/ || true
          git commit -m "deploy: update image tags to ${{ steps.tag.outputs.sha }}"
          git push
