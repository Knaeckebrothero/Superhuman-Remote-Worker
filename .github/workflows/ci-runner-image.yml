name: ci-runner-image

# Builds the self-hosted Actions runner image (docker/Dockerfile.ci-runner).
#
# PINNED to ubuntu-latest for every job, permanently. Building the runner image
# on a runner running that image is a bootstrap cycle: a bad push would mean the
# fix cannot be built. scripts/check_ci_runners.py enforces the pin via
# Policy(hosted_only=True).
#
# Build order is deliberate: build -> load -> PROVE THE FORK GUARD -> push. The
# image is only ever published after job-started-guard.sh has demonstrated it
# still refuses pull-request work. That guard is the one control a fork PR cannot
# edit, so it gets a real test rather than a code review.
#
# The weekly cron is not cosmetic: apt security updates and the upstream
# actions-runner base both move, and nothing else would ever rebuild this.

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.ci-runner'
      - 'docker/ci-runner/**'
      - '.github/workflows/ci-runner-image.yml'
      - '.playwright-version'
  pull_request:
    paths:
      - 'docker/Dockerfile.ci-runner'
      - 'docker/ci-runner/**'
      - '.github/workflows/ci-runner-image.yml'
      - '.playwright-version'
  schedule:
    # Mondays 04:00 UTC — two hours before stage1-rebuild.yml, so the KVM runner
    # image is fresh before the longest job in the repo goes to use it.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Lowercased repo path for GHCR cache refs — see the note in develop.yml.
  REPO_LOWER: knaeckebrothero/uni-projekt-graph-rag

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: base
            suffix: ci-runner
          - target: kvm
            suffix: ci-runner-kvm
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Playwright pin
        id: pw
        run: echo "version=$(tr -d '[:space:]' < .playwright-version)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.suffix }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      # Always `load`, never `push` here. The push happens after the guard
      # self-test below, so a runner image whose fork guard has regressed can
      # never reach the registry.
      - name: Build (load only — push is gated on the guard self-test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.ci-runner
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PLAYWRIGHT_VERSION=${{ steps.pw.outputs.version }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.srw.component=ci-runner
          provenance: false
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-${{ matrix.suffix }}:buildcache-main
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-${{ matrix.suffix }}:buildcache-main,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,ignore-error=true

      - name: Verify the baked toolchain
        # Each of these exists because a job assumed ubuntu-latest provided it.
        # A missing yq in particular fails OPEN at runtime, so assert it here.
        run: |
          set -euo pipefail
          IMG="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm --entrypoint /bin/bash "$IMG" -c '
            set -euo pipefail
            yq --version
            helm version --short
            kubeconform -v
            psql --version
            gcc --version | head -1
            docker --version
            jq --version
            sudo -n true && echo "PASSWORDLESS_SUDO_OK"
            test -n "$ACTIONS_RUNNER_HOOK_JOB_STARTED" || { echo "hook env unset"; exit 1; }
            test -x "$ACTIONS_RUNNER_HOOK_JOB_STARTED" || { echo "hook not executable"; exit 1; }
            echo "TOOLCHAIN_OK"
          '

      - name: Prove the fork guard refuses untrusted jobs
        # The guard is the only fork control a pull request cannot edit, so it is
        # tested rather than reviewed. Runs on PRs too, so a weakened guard is
        # caught before it is ever published.
        run: |
          set -euo pipefail
          IMG="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          HOOK=/opt/ci/job-started-guard.sh
          REPO=Knaeckebrothero/Superhuman-Remote-Worker

          run_guard() { docker run --rm --entrypoint /bin/bash "$@" "$IMG" "$HOOK"; }

          accept() {
            if run_guard -e "GITHUB_REPOSITORY=$REPO" "$@" >/dev/null 2>&1; then
              echo "accept ok  : $*"
            else
              echo "::error::fork guard REFUSED a job it must accept: $*"; exit 1
            fi
          }
          refuse() {
            if run_guard "$@" >/dev/null 2>&1; then
              echo "::error::fork guard ACCEPTED a job it must refuse: $*"; exit 1
            fi
            echo "refuse ok  : $*"
          }

          echo "--- must ACCEPT (3) ---"
          accept -e GITHUB_EVENT_NAME=push              -e GITHUB_REF=refs/heads/develop
          accept -e GITHUB_EVENT_NAME=schedule          -e GITHUB_REF=refs/heads/main
          accept -e GITHUB_EVENT_NAME=workflow_dispatch -e GITHUB_REF=refs/heads/main

          echo "--- must REFUSE (7) ---"
          refuse -e "GITHUB_REPOSITORY=$REPO" -e GITHUB_EVENT_NAME=pull_request        -e GITHUB_REF=refs/pull/1/merge
          refuse -e "GITHUB_REPOSITORY=$REPO" -e GITHUB_EVENT_NAME=pull_request_target -e GITHUB_REF=refs/heads/develop
          refuse -e "GITHUB_REPOSITORY=$REPO" -e GITHUB_EVENT_NAME=workflow_run        -e GITHUB_REF=refs/heads/develop
          refuse -e "GITHUB_REPOSITORY=$REPO" -e GITHUB_EVENT_NAME=merge_group         -e GITHUB_REF=refs/heads/develop
          # Event name laundered to `push`, but the ref and head-ref still betray it:
          refuse -e "GITHUB_REPOSITORY=$REPO" -e GITHUB_EVENT_NAME=push -e GITHUB_REF=refs/pull/1/merge
          refuse -e "GITHUB_REPOSITORY=$REPO" -e GITHUB_EVENT_NAME=push -e GITHUB_REF=refs/heads/develop -e GITHUB_HEAD_REF=attacker/patch-1
          # And a job from a different repository entirely:
          refuse -e GITHUB_REPOSITORY=attacker/evil -e GITHUB_EVENT_NAME=push -e GITHUB_REF=refs/heads/main

          echo "fork guard behaved correctly on all 10 cases"

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.meta.outputs.tags }}' | while read -r T; do
            [ -n "$T" ] || continue
            docker push "$T"
            echo "pushed $T"
          done
