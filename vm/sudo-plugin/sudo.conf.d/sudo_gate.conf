# Sudo Approval Gate Plugin
#
# This line registers the approval plugin with sudo.
# Append to /etc/sudo.conf or place in /etc/sudo.conf.d/ if supported.
#
# Options:
#   socket_path  — Unix socket to the sudo-gated daemon
#   timeout      — Seconds to wait for approval (should be > daemon's NATS timeout)
#   fail_mode    — "deny" (production) or "open" (development)
#
# Production:
Plugin sudo_gate_approval sudo_gate.so socket_path=/run/sudo-gated/sudo-gated.sock timeout=305 fail_mode=deny
#
# Development (approve on daemon error):
# Plugin sudo_gate_approval sudo_gate.so socket_path=/run/sudo-gated/sudo-gated.sock timeout=305 fail_mode=open
