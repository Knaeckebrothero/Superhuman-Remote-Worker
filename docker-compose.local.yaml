# =============================================================================
# Superhuman Remote Worker - Local Build Stack
# =============================================================================
#
# Same as docker-compose.yaml but builds all custom images locally instead of
# pulling from GHCR. Use this for faster iteration on containerization.
#
# Usage:
#   podman-compose -f docker-compose.local.yaml build          # Build all images
#   podman-compose -f docker-compose.local.yaml up -d          # Start all services
#   podman-compose -f docker-compose.local.yaml up -d --scale agent=5
#   podman-compose -f docker-compose.local.yaml down           # Stop services
#   podman-compose -f docker-compose.local.yaml down -v        # Stop and remove all data
#   podman-compose -f docker-compose.local.yaml logs -f agent  # Follow agent logs
#
# Prerequisites:
#   - Copy .env.example to .env and configure API keys
#     (including the OIDC_CLIENT_SECRET values — compose fails fast if unset)
#
# Exposed ports:
#   - 8085: Orchestrator API
#   - 8055: MCP Server (Claude Code)
#   - 4000: Cockpit Frontend
#   - 8180: Keycloak SSO
#   - 3000: Gitea
#
# =============================================================================

name: superhuman-remote-worker

services:
  # ---------------------------------------------------------------------------
  # Databases
  # ---------------------------------------------------------------------------
  postgres:
    image: docker.io/library/postgres:15
    container_name: srw-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srw_password}
      POSTGRES_DB: ${POSTGRES_DB:-srw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./orchestrator/database/init_sso_dbs.sh:/docker-entrypoint-initdb.d/000_init_sso_dbs.sh:Z
      - ./orchestrator/database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srw}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-vector:
    image: docker.io/pgvector/pgvector:pg15
    container_name: srw-postgres-vector
    environment:
      POSTGRES_USER: ${VECTOR_POSTGRES_USER:-srw}
      POSTGRES_PASSWORD: ${VECTOR_POSTGRES_PASSWORD:-srw_password}
      POSTGRES_DB: ${VECTOR_POSTGRES_DB:-srw_vector}
    volumes:
      - postgres_vector_data:/var/lib/postgresql/data
      - ./orchestrator/database/vector_schema.sql:/docker-entrypoint-initdb.d/001_vector_schema.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VECTOR_POSTGRES_USER:-srw}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: docker.io/library/mongo:7
    container_name: srw-mongodb
    environment:
      MONGO_INITDB_DATABASE: srw_logs
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: docker.io/library/neo4j:5
    container_name: srw-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:-neo4j}", "-p", "${NEO4J_PASSWORD:-neo4j_password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Identity & Storage
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: srw-keycloak
    command: start-dev --import-realm
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Hostname — front-channel URLs use localhost so the browser can reach them.
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC allows container-to-container backchannel
      # requests (e.g. Gitea token exchange) to use the internal hostname.
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      # Admin console credentials
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # SMTP — Proton Bridge on host machine (Podman: host.containers.internal).
      # (Current realm-export.json has SMTP hardcoded; these are unused until
      # the realm JSON is converted to ${SMTP_HOST}/${SMTP_USER}/${SMTP_PASSWORD}
      # placeholders. Left here as forward-compat hooks.)
      SMTP_HOST: "${SMTP_HOST:-host.containers.internal}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      # OIDC client secrets — realm JSON references these as ${*_OIDC_CLIENT_SECRET}
      # placeholders and Keycloak resolves them from these env vars at realm
      # import time. (Keycloak 26's placeholder syntax is ${VAR}, NOT ${env.VAR}
      # — the env. prefix is legacy and silently fails to substitute.)
      # `:?` fails fast if any is unset so silent "invalid_client_credentials"
      # / "client_not_found" misconfigurations surface at `up` time instead
      # of at the first OAuth redirect.
      GITEA_OIDC_CLIENT_SECRET: "${GITEA_OIDC_CLIENT_SECRET:?GITEA_OIDC_CLIENT_SECRET required for Keycloak realm import}"
      NEXTCLOUD_OIDC_CLIENT_SECRET: "${NEXTCLOUD_OIDC_CLIENT_SECRET:?NEXTCLOUD_OIDC_CLIENT_SECRET required}"
      PGADMIN_OIDC_CLIENT_SECRET: "${PGADMIN_OIDC_CLIENT_SECRET:?PGADMIN_OIDC_CLIENT_SECRET required}"
      MCP_OIDC_CLIENT_SECRET: "${MCP_OIDC_CLIENT_SECRET:?MCP_OIDC_CLIENT_SECRET required}"
      OPENCLOUD_KEYCLOAK_CLIENT_SECRET: "${OPENCLOUD_KEYCLOAK_CLIENT_SECRET:?OPENCLOUD_KEYCLOAK_CLIENT_SECRET required}"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/srw-realm.json:ro,Z
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  gitea:
    image: docker.io/gitea/gitea:1.22-rootless
    container_name: srw-gitea
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /var/lib/gitea/data/gitea.db
      GITEA__server__ROOT_URL: "http://localhost:${GITEA_PORT:-3000}"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "false"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__service__ENABLE_CAPTCHA: "false"
      GITEA__service__AUTO_WATCH_NEW_REPOS: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: preferred_username
      GITEA__oauth2_client__UPDATE_EXISTING: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      # Bootstrap env vars (used by entrypoint wrapper)
      GITEA_ADMIN_USER: "${GITEA_ADMIN_USER:-srw}"
      GITEA_ADMIN_PASSWORD: "${GITEA_ADMIN_PASSWORD:-srw_gitea}"
      GITEA_OIDC_CLIENT_SECRET: "${GITEA_OIDC_CLIENT_SECRET:?GITEA_OIDC_CLIENT_SECRET required}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Start Gitea in the background
        /usr/local/bin/docker-entrypoint.sh &
        GITEA_PID=$$!
        # Wait for Gitea to be ready
        until wget -qO- http://localhost:3000/api/v1/version >/dev/null 2>&1; do sleep 2; done
        # Create admin user (idempotent)
        gitea admin user create --admin \
          --username "$$GITEA_ADMIN_USER" \
          --password "$$GITEA_ADMIN_PASSWORD" \
          --email "$${GITEA_ADMIN_USER}@srw.local" \
          --must-change-password=false 2>/dev/null || true
        # Wait for Keycloak to be reachable before OIDC setup
        until wget -qO- http://srw-keycloak:8080/realms/srw/.well-known/openid-configuration >/dev/null 2>&1; do sleep 3; done
        # Register Keycloak OIDC if not already present
        if ! gitea admin auth list 2>/dev/null | grep -q "Keycloak"; then
          KI="http://srw-keycloak:8080"
          KP="http://localhost:${KEYCLOAK_PORT:-8180}"
          R="srw"
          gitea admin auth add-oauth \
            --name "Keycloak" --provider "openidConnect" \
            --key "gitea" --secret "$$GITEA_OIDC_CLIENT_SECRET" \
            --auto-discover-url "$${KI}/realms/$${R}/.well-known/openid-configuration" \
            --use-custom-urls \
            --custom-auth-url "$${KP}/realms/$${R}/protocol/openid-connect/auth" \
            --custom-token-url "$${KI}/realms/$${R}/protocol/openid-connect/token" \
            --custom-profile-url "$${KI}/realms/$${R}/protocol/openid-connect/userinfo" \
            --group-claim-name "groups" --admin-group "admin" \
            --skip-local-2fa 2>/dev/null || true
        fi
        # Wait for Gitea process
        wait $$GITEA_PID
    volumes:
      - gitea_data:/var/lib/gitea
    ports:
      - "${GITEA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nextcloud is opt-in under COMPOSE_PROFILES=nextcloud since Phase 3.
  # OpenCloud is the greenfield default and has its own service entry below.
  nextcloud:
    profiles: ["nextcloud"]
    image: docker.io/library/nextcloud:31-apache
    container_name: srw-nextcloud
    environment:
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-admin}
      SQLITE_DATABASE: nextcloud
      OVERWRITEPROTOCOL: https
      NEXTCLOUD_OIDC_CLIENT_SECRET: "${NEXTCLOUD_OIDC_CLIENT_SECRET:-}"
      NEXTCLOUD_OIDC_DISCOVERY_URI: "${NEXTCLOUD_OIDC_DISCOVERY_URI:-http://keycloak:8080/realms/srw/.well-known/openid-configuration}"
      NEXTCLOUD_AGENT_PASSWORD: "${NEXTCLOUD_AGENT_PASSWORD:-}"
    volumes:
      - nextcloud_data:/var/www/html
      - ./docker/nextcloud/setup-nextcloud.sh:/docker-entrypoint-hooks.d/before-starting/setup-nextcloud.sh:ro
    ports:
      - "${NEXTCLOUD_PORT:-8800}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # OpenCloud — greenfield main-cloud default since Phase 3.
  opencloud:
    image: docker.io/opencloudeu/opencloud:latest
    container_name: srw-opencloud
    # podman-compose splits YAML block scalars into separate argv elements,
    # which breaks `sh -c <script>` patterns. Inline as a single string.
    entrypoint:
      - /bin/sh
      - -c
      - "/usr/bin/opencloud init || true; /docker-entrypoint-hooks/setup-opencloud.sh || true; exec /usr/bin/opencloud server"
    environment:
      OC_URL: "${OPENCLOUD_URL:-http://localhost:9200}"
      OC_INSECURE: "true"
      PROXY_ENABLE_BASIC_AUTH: "false"
      PROXY_USER_OIDC_CLAIM: "sub"
      OC_EXCLUDE_RUN_SERVICES: "idp"
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      PROXY_ROLE_ASSIGNMENT_DRIVER: "oidc"
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: "groups"
      WEB_OIDC_CLIENT_ID: "opencloud-web"
      WEB_OIDC_METADATA_URL: "${OPENCLOUD_OIDC_DISCOVERY_URI:-http://keycloak:8080/realms/srw/.well-known/openid-configuration}"
      OC_OIDC_ISSUER: "${OPENCLOUD_OIDC_ISSUER:-http://keycloak:8080/realms/srw}"
      OC_OIDC_ENDPOINT_URL: "${OPENCLOUD_OIDC_ISSUER:-http://keycloak:8080/realms/srw}"
      OC_LOG_LEVEL: "${OPENCLOUD_LOG_LEVEL:-info}"
      OC_ADMIN_USER_ID: "${OPENCLOUD_ADMIN_USER_ID:-admin}"
    volumes:
      - opencloud_data:/var/lib/opencloud
      - opencloud_config:/etc/opencloud
      - ./docker/opencloud/setup-opencloud.sh:/docker-entrypoint-hooks/setup-opencloud.sh:ro
    ports:
      - "${OPENCLOUD_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://localhost:9200/status.php"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    image: srw-orchestrator:local
    container_name: srw-orchestrator
    environment:
      PORT: 8085
      # Core databases
      DATABASE_URL: postgresql://${POSTGRES_USER:-srw}:${POSTGRES_PASSWORD:-srw_password}@postgres:5432/${POSTGRES_DB:-srw}
      VECTOR_DB_URL: postgresql://${VECTOR_POSTGRES_USER:-srw}:${VECTOR_POSTGRES_PASSWORD:-srw_password}@postgres-vector:5432/${VECTOR_POSTGRES_DB:-srw_vector}
      MONGODB_URL: mongodb://mongodb:27017/srw_logs
      WORKSPACE_PATH: /workspace
      # Gitea
      GITEA_URL: http://gitea:3000
      GITEA_INTERNAL_URL: http://gitea:3000
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-srw}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-srw_gitea}
      GITEA_OIDC_CLIENT_SECRET: ${GITEA_OIDC_CLIENT_SECRET:-}
      # Keycloak SSO
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: "http://localhost:${KEYCLOAK_PORT:-8180}"
      KEYCLOAK_REALM: srw
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # CORS
      CORS_ORIGINS: "http://localhost:${COCKPIT_PORT:-4000}"
      COCKPIT_EXTERNAL_URL: "http://localhost:${COCKPIT_PORT:-4000}"
      # Admin user
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@srw.dev}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # MCP token verification
      MCP_INTERNAL_KEY: ${MCP_INTERNAL_KEY:-dev-internal-key}
      # AES-GCM encryption at rest for stored credentials
      # (user_api_keys / project_api_keys / system_api_keys / llm_endpoints)
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY required — generate with: python -c 'import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())'}"
      # Instruction Builder
      BUILDER_API_KEY: ${BUILDER_API_KEY:-${OPENAI_API_KEY:-}}
      BUILDER_MODEL: ${BUILDER_MODEL:-gpt-4o}
      BUILDER_LLM_PROVIDER: ${BUILDER_LLM_PROVIDER:-openai}
      # Notification — SMTP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TRUST_SELF_SIGNED: ${SMTP_TRUST_SELF_SIGNED:-true}
      SMTP_FROM: ${SMTP_FROM:-noreply@superhuman-remote-worker.com}
      # Notification — IMAP (inbound email replies)
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-1143}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_USE_SSL: ${IMAP_USE_SSL:-false}
      IMAP_TRUST_SELF_SIGNED: ${IMAP_TRUST_SELF_SIGNED:-true}
      IMAP_POLL_INTERVAL: ${IMAP_POLL_INTERVAL:-30}
      AGENT_EMAIL: ${AGENT_EMAIL:-agent@superhuman-remote-worker.com}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-superhuman-remote-worker.com}
      # Notification — Webhooks
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      # Default datasources — Neo4j
      DEFAULT_DS_NEO4J_URL: bolt://neo4j:7687
      DEFAULT_DS_NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      DEFAULT_DS_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
      DEFAULT_DS_NEO4J_NAME: "Default Neo4j"
      DEFAULT_DS_NEO4J_READ_ONLY: "false"
      # Default datasources — WebDAV (Nextcloud)
      # Default WebDAV datasource — opt-in since Phase 3. Unset by default;
      # the main-cloud adapter injects per-project datasources at creation time.
      DEFAULT_DS_WEBDAV_URL: ${DEFAULT_DS_WEBDAV_URL:-}
      DEFAULT_DS_WEBDAV_USERNAME: ${DEFAULT_DS_WEBDAV_USERNAME:-}
      DEFAULT_DS_WEBDAV_PASSWORD: ${DEFAULT_DS_WEBDAV_PASSWORD:-}
      DEFAULT_DS_WEBDAV_NAME: "Nextcloud"
      DEFAULT_DS_WEBDAV_READ_ONLY: "false"
      # S3 / MinIO
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-srw}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-srw_password}
      S3_BUCKET: ${S3_BUCKET:-srw-snapshots}
      S3_REGION: ${S3_REGION:-us-east-1}
      SNAPSHOT_MAX_SIZE_GB: ${SNAPSHOT_MAX_SIZE_GB:-10}
      SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-90}
      # IDE sessions
      IDE_SESSION_IDLE_TIMEOUT: ${IDE_SESSION_IDLE_TIMEOUT:-30}
      IDE_SESSION_MAX_LIFETIME: ${IDE_SESSION_MAX_LIFETIME:-240}
      IDE_MAX_CONCURRENT_PER_USER: ${IDE_MAX_CONCURRENT_PER_USER:-2}
      CODE_SERVER_IMAGE: ${CODE_SERVER_IMAGE:-codercom/code-server:latest}
      # VM lifecycle (optional)
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      # Docker Compose mode — workspace/VM pool (ignored when k8s is available)
      WORKSPACE_HOSTS: ${WORKSPACE_HOSTS:-workspace-1,workspace-2,workspace-3,workspace-4,workspace-5}
      VM_HOSTS: ${VM_HOSTS:-}
      # Orchestrator settings
      AUTO_ASSIGN_ENABLED: ${AUTO_ASSIGN_ENABLED:-true}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - workspace_data:/workspace:z
    ports:
      - "${ORCHESTRATOR_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      args:
        CITATION_ENGINE_PATH: CitationEngine
    image: srw-agent:local
    environment:
      AGENT_CONFIG: ${AGENT_CONFIG:-defaults}
      AGENT_PORT: 8001
      # Core databases
      DATABASE_URL: postgresql://${POSTGRES_USER:-srw}:${POSTGRES_PASSWORD:-srw_password}@postgres:5432/${POSTGRES_DB:-srw}
      VECTOR_DB_URL: postgresql://${VECTOR_POSTGRES_USER:-srw}:${VECTOR_POSTGRES_PASSWORD:-srw_password}@postgres-vector:5432/${VECTOR_POSTGRES_DB:-srw_vector}
      MONGODB_URL: mongodb://mongodb:27017/srw_logs
      ORCHESTRATOR_URL: http://orchestrator:8085
      WORKSPACE_PATH: /workspace
      # LLM routing
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      KEY_COOLDOWN_SECONDS: ${KEY_COOLDOWN_SECONDS:-3600}
      # LLM provider keys — set in .env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      # Vision model (for text-only agents)
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o-mini}
      # Audio transcription (Whisper)
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      # Browser automation
      BROWSER_LLM_MODEL: ${BROWSER_LLM_MODEL:-gpt-4o-mini}
      BROWSER_LLM_BASE_URL: ${BROWSER_LLM_BASE_URL:-}
      # Citation Engine
      CITATION_DB_URL: postgresql://${VECTOR_POSTGRES_USER:-srw}:${VECTOR_POSTGRES_PASSWORD:-srw_password}@postgres-vector:5432/${VECTOR_POSTGRES_DB:-srw_vector}
      CITATION_LLM_URL: ${CITATION_LLM_URL:-}
      CITATION_LLM_MODEL: ${CITATION_LLM_MODEL:-gpt-4o}
      CITATION_REASONING_LEVEL: ${CITATION_REASONING_LEVEL:-high}
      CITATION_EMBEDDING_MODEL: ${CITATION_EMBEDDING_MODEL:-qwen3-embedding-8b}
      CITATION_EMBEDDING_URL: ${CITATION_EMBEDDING_URL:-}
      CITATION_EMBEDDING_KEY: ${CITATION_EMBEDDING_KEY:-}
      # Embedding routing
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-8b}
      # Research
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
      # Neo4j (local instance)
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
      # Gitea
      GITEA_URL: http://gitea:3000
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run:rw,noexec,nosuid,size=16m
    volumes:
      - workspace_data:/workspace:z
      - agent_home:/home/srw
      - ssh_keys:/run/secrets/ssh:ro
    deploy:
      replicas: ${AGENT_REPLICAS:-5}
      resources:
        limits:
          pids: 256
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      ssh-keygen:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Workspace containers (Docker Compose mode)
  # ---------------------------------------------------------------------------
  ssh-keygen:
    image: docker.io/library/alpine:3
    container_name: srw-ssh-keygen
    command: >
      sh -c '
        if [ ! -f /keys/id_ed25519 ]; then
          apk add --no-cache openssh-keygen &&
          ssh-keygen -t ed25519 -f /keys/id_ed25519 -N "" -C "agent@srw" &&
          cat /keys/id_ed25519.pub > /keys/authorized_keys &&
          cp /keys/id_ed25519.pub /keys/ssh-publickey &&
          chmod 600 /keys/id_ed25519 &&
          chmod 644 /keys/authorized_keys /keys/ssh-publickey;
        fi
      '
    volumes:
      - ssh_keys:/keys
    restart: "no"

  workspace-1:
    image: srw-workspace:local
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace
    container_name: srw-workspace-1
    environment:
      WORKSPACE_ID: "1"
    volumes:
      - ssh_keys:/tmp/ssh-pubkey:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  workspace-2:
    image: srw-workspace:local
    container_name: srw-workspace-2
    environment:
      WORKSPACE_ID: "2"
    volumes:
      - ssh_keys:/tmp/ssh-pubkey:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  workspace-3:
    image: srw-workspace:local
    container_name: srw-workspace-3
    environment:
      WORKSPACE_ID: "3"
    volumes:
      - ssh_keys:/tmp/ssh-pubkey:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  workspace-4:
    image: srw-workspace:local
    container_name: srw-workspace-4
    environment:
      WORKSPACE_ID: "4"
    volumes:
      - ssh_keys:/tmp/ssh-pubkey:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  workspace-5:
    image: srw-workspace:local
    container_name: srw-workspace-5
    environment:
      WORKSPACE_ID: "5"
    volumes:
      - ssh_keys:/tmp/ssh-pubkey:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/22"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ssh-keygen:
        condition: service_completed_successfully
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    image: srw-mcp:local
    container_name: srw-mcp
    environment:
      COCKPIT_API_URL: http://orchestrator:8085
      MCP_TRANSPORT: http
      MCP_PORT: 8055
      MCP_INTERNAL_KEY: ${MCP_INTERNAL_KEY:-dev-internal-key}
    ports:
      - "${MCP_PORT:-8055}:8055"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8055/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cockpit:
    build:
      context: .
      dockerfile: docker/Dockerfile.cockpit
    image: srw-cockpit:local
    container_name: srw-cockpit
    environment:
      PORT: 4000
    ports:
      - "${COCKPIT_PORT:-4000}:4000"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Messaging (optional — required for VM lifecycle)
  # ---------------------------------------------------------------------------
  nats:
    image: docker.io/nats:2.10-alpine
    container_name: srw-nats
    command: ["--jetstream", "--store_dir", "/data"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Object Storage (optional — for VM snapshots + IDE sessions)
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: srw-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-srw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-srw_password}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Admin UIs & Utilities
  # ---------------------------------------------------------------------------
  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: srw-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@srw.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-express:
    image: docker.io/library/mongo-express:latest
    container_name: srw-mongo-express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Codex OAuth Proxy (optional — for codex/* models via ChatGPT subscription)
  # ---------------------------------------------------------------------------
  codex-proxy:
    image: docker.io/eceasy/cli-proxy-api:latest
    pull_policy: always
    container_name: srw-codex-proxy
    environment:
      MANAGEMENT_PASSWORD: ${CODEX_MANAGEMENT_KEY:-}
    ports:
      - "${CODEX_PROXY_PORT:-8317}:8317"
      - "${CODEX_OAUTH_PORT:-1455}:1455"
    volumes:
      - ./docker/codex-proxy/config.yaml:/CLIProxyAPI/config.yaml:Z
      - codex_proxy_auths:/root/.cli-proxy-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8317/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Container log viewer (optional)
  # ---------------------------------------------------------------------------
  #   Rootless Podman: /run/user/<UID>/podman/podman.sock  (default below)
  #   Rootful Podman:  /run/podman/podman.sock
  #   Docker:          /var/run/docker.sock
  dozzle:
    image: docker.io/amir20/dozzle:latest
    container_name: srw-dozzle
    security_opt:
      - label:disable
    environment:
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /run/user/${HOST_UID:-1000}/podman/podman.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: srw_postgres_data
  postgres_vector_data:
    name: srw_postgres_vector_data
  mongodb_data:
    name: srw_mongodb_data
  neo4j_data:
    name: srw_neo4j_data
  nats_data:
    name: srw_nats_data
  gitea_data:
    name: srw_gitea_data
  nextcloud_data:
    name: srw_nextcloud_data
  opencloud_data:
    name: srw_opencloud_data
  opencloud_config:
    name: srw_opencloud_config
  minio_data:
    name: srw_minio_data
  workspace_data:
    name: srw_workspace_data
  agent_home:
    name: srw_agent_home
  ssh_keys:
    name: srw_ssh_keys
  codex_proxy_auths:
    name: srw_codex_proxy_auths
