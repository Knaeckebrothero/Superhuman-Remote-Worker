apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-api-key
  namespace: agent-vms
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: headscale-api-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: homelab/agent-vms/headscale-api-key
