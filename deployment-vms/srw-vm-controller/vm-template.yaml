# KubeVirt VM Template for Agent VMs
#
# Loaded by the vm-controller's render_template() which performs
# string substitution on ${PLACEHOLDER} values before YAML parsing.
# This allows placeholders to work in both string and numeric contexts
# (e.g., cores: ${CPU_CORES} becomes cores: 2 after substitution).
#
# Also embedded in the vm-template ConfigMap in vm-controller.yaml
# so Fleet manages it automatically.

apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: agent-vm-${JOB_ID}
  labels:
    vm.kubevirt.io/name: agent-vm-${JOB_ID}
    job-id: ${JOB_ID}
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      labels:
        vm.kubevirt.io/name: agent-vm-${JOB_ID}
        job-id: ${JOB_ID}
    spec:
      domain:
        cpu:
          cores: ${CPU_CORES}
        memory:
          guest: ${MEMORY}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloud-init
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        machine:
          type: q35
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          containerDisk:
            image: ${VM_IMAGE}
        - name: cloud-init
          cloudInitNoCloud:
            userData: |
              #cloud-config
              write_files:
                - path: /etc/default/management-daemon
                  permissions: '0644'
                  content: |
                    NATS_URL=${NATS_URL}
                    JOB_ID=${JOB_ID}
                - path: /run/agent/job-config.json
                  permissions: '0644'
                  content: |
                    {
                      "job_id": "${JOB_ID}",
                      "agent_config": "${AGENT_CONFIG}",
                      "vm_image": "${VM_IMAGE}",
                      "cpu_cores": ${CPU_CORES},
                      "memory": "${MEMORY}",
                      "description": "${DESCRIPTION}",
                      "nats_url": "${NATS_URL}"
                    }
                - path: /etc/default/sudo-gated
                  permissions: '0644'
                  content: |
                    NATS_URL=${NATS_URL}
                    JOB_ID=${JOB_ID}
                    VM_ID=agent-vm-${JOB_ID}
              runcmd:
                - mkdir -p /run/agent
                - chmod 755 /run/agent
                - systemctl daemon-reload
                - systemctl enable management-daemon.service
                - systemctl start management-daemon.service
                - systemctl restart sudo-gated.socket
