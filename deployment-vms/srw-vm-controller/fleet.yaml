defaultNamespace: agent-vms
helm:
  takeOwnership: true
dependsOn: []
# Restrict to the VMs cluster only. The named target is defined in the
# SRW GitRepo CR (HomeLab/rancher_cluster/fleet-gitrepo-srw.yaml).
# targetRestrictions filters by NAME, not by clusterSelector — using a
# clusterSelector here is a no-op and lets the bundle leak onto main.
targetRestrictions:
  - name: vms
