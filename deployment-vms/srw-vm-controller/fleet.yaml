defaultNamespace: agent-vms
# Render the srw-dev-vm-cluster Helm chart from the OCI registry. CI on
# the develop branch publishes chart updates and updates the version below.
#
# For OCI charts, the full oci:// URL goes in `chart` (no separate `repo`).
helm:
  releaseName: srw-vm
  chart: "oci://ghcr.io/knaeckebrothero/charts/srw-dev-vm-cluster"
  version: "0.0.0-dev.sha-ad39de5"
  takeOwnership: true
  values:
    license:
      acceptTerms: true
    # Pin the release-name prefix so resources stay short and predictable.
    fullnameOverride: srw-vm
    # `agent-vms` is externally managed (existed before this chart took over).
    # Don't try to create or own it from the chart.
    namespace:
      create: false
    # Identifies this controller instance for NATS subject scoping. Matches
    # the dev orchestrator's release identity.
    orchestratorId: srw-dev
    # Hub the in-cluster NATS leaf dials into. The hub is the shared
    # homelab NATS instance on the main cluster (HomeLab repo:
    # deployments_managed/nats/), exposed via a MetalLB LoadBalancer
    # Service at 10.0.51.14. Stable across node reboots / drains.
    nats:
      hubUrl: "nats-leaf://10.0.51.14:7422"
    # Authorized into VMs at boot. Same key the dev orchestrator's agent
    # pods hold the private side of (matches the previously-hardcoded value
    # in the old deployment-vms/srw-vm-controller/vm-controller.yaml).
    ssh:
      publicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM1hi+I86ZtC8OOmv2dEUtUbXTgtgvWuSWtszPsts5bY srw-agent-vm-access"
    # Headscale API access — pulled from Vault by ESO (same path the old
    # standalone ExternalSecret in 01-eso.yaml used).
    headscale:
      url: "https://headscale.h4ll.app"
      user: srw
      apiKeyVaultPath: "homelab/agent-vms/headscale-api-key"
    externalSecrets:
      enabled: true
      refreshInterval: "1h"
      secretStoreRef: "vault-backend"
      secretStoreKind: "ClusterSecretStore"
    # Image tags overridden by CI on each develop push. Defaults left as
    # placeholders; the workflow's image-tag update steps rewrite these
    # in-place via yq.
    image:
      orchestrator:
        # Independently-built component identity; CI updates this from
        # changes.outputs.orchestrator-sha, never the VM chart AppVersion.
        tag: "sha-ff17803"
        digest: ""
      vmController:
        tag: "sha-7d3ec47"
    # Pre-wire the observed private ingestion route while every collector gate
    # remains dark. These values render no resources until an inventory gate is
    # explicitly enabled, but preserve api.srw.works as the TLS SNI hostname.
    infrastructureMetering:
      vmInventoryEnabled: false
      pvcInventoryEnabled: false
      pvInventoryEnabled: false
      ingestionSecretName: "srw-infra-metering-vmi-ingestion"
      storageIngestionSecretName: "srw-infra-metering-vm-storage-ingestion"
      volumeIdentitySecretName: "srw-infra-metering-volume-identity"
      volumeIdentityKeyVersion: "storage-v1"
      # Select only metering properties from the shared SRW Vault record into
      # dedicated VM-cluster Secrets; never extract the full application bundle
      # into this cluster. Lifecycle authentication remains unbound until its
      # active command-path rollout is coordinated across both clusters.
      externalSecrets:
        enabled: true
        vaultPath: "homelab/superhuman-remote-worker/srw-secrets"
      orchestratorUrl: "https://api.srw.works"
      orchestratorHostAliases:
        - ip: "10.0.51.11"
          hostnames:
            - api.srw.works
      networkPolicy:
        orchestratorCidrs:
          - "10.0.51.11/32"
    vmController:
      defaultVmImage: "ghcr.io/knaeckebrothero/superhuman-remote-worker-agent-vm-base:sha-7d3ec47"
      # Golden-image boot acceleration: import the VM base image ONCE into a
      # per-digest golden PVC, then clone per-VM rootdisks from it (CDI
      # host-assisted on local-path) instead of a ~10-min GHCR registry
      # import per VM. See knowledge-base/knowledge/features/vm_golden_image_boot_acceleration.md.
      goldenImage:
        enabled: true
      # Persistent rootdisks: create each VM's root disk as a STANDALONE
      # DataVolume instead of a spec.dataVolumeTemplates entry, so it carries
      # no ownerRef and survives VM deletion. A recreate reattaches it by name
      # — files intact, and the ~3m27s clone skipped entirely, which makes
      # crash recovery faster than a fresh start.
      # See knowledge-base/knowledge/features/vm_persistent_rootdisk.md.
      #
      # The orchestrator has its own copy of this flag
      # (deployment/values-experimental.yaml → VM_PERSISTENT_ROOTDISK) which
      # decides whether VM suspend may proceed without a snapshot. ENABLE THIS
      # ONE FIRST: orchestrator-on against a controller that still
      # cascade-deletes disks would suspend sessions into nothing. This order
      # is harmless — the controller just keeps disks nobody asks it to keep.
      # (Attempt 1 on 2026-07-29 hit a CDI webhook 422 — a standalone
      # DataVolume requires spec.source.pvc.namespace, which a templated one
      # may omit. Fixed in daec8704, and the fixed manifest was validated
      # against the live webhook with `kubectl apply --dry-run=server` before
      # this re-enable. Live-gate log:
      # knowledge-base/knowledge/features/vm_workspace_persistence_reconciliation.md.)
      persistentRootdisk:
        enabled: true
dependsOn: []
# Cluster targeting handled by the dedicated GitRepo
# (HomeLab/rancher_cluster/fleet-gitrepo-srw-vms.yaml) whose spec.targets
# pins to the vms cluster. Two GitRepos is the canonical Fleet pattern
# for per-cluster monorepo dispatch — targetRestrictions in fleet.yaml
# is additive with GitRepo targets and cannot narrow them.
