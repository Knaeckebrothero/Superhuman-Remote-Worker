defaultNamespace: agent-vms
helm:
  takeOwnership: true
dependsOn: []
ignorePaths:
  - "vm-template.yaml"
# Deploy only to the VMs cluster — targetRestrictions prevents GitRepo default merge
targets:
  - clusterSelector:
      matchLabels:
        management.cattle.io/cluster-display-name: vms
targetRestrictions:
  - clusterSelector:
      matchLabels:
        management.cattle.io/cluster-display-name: vms
