# VM Controller — Agent Cluster
#
# Manages KubeVirt VM lifecycle via NATS.
# Deployed to the AGENT cluster (not the main cluster).
# Namespace: agent-vms (must exist on the agent cluster).
#
# Prerequisites:
#   - NATS leaf deployed on agent cluster (see deployment/nats/nats-leaf-values.yaml)
#   - KubeVirt installed on agent cluster (see docs/features/vm_agent_cluster_setup.md)
#
# The vm-template ConfigMap is defined below and managed by Fleet.
#
# Image build:
#   cd vm-controller
#   podman build -t ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller:sha-f1cee08<coresponding_hash> .
#   podman push ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller:sha-f1cee08<coresponding_hash>

---
# Namespace (idempotent — already created during agent cluster setup)
apiVersion: v1
kind: Namespace
metadata:
  name: agent-vms
  labels:
    app.kubernetes.io/part-of: superhuman-remote-worker

---
# ServiceAccount for the VM Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-controller
  namespace: agent-vms
  labels:
    app: srw-vm-controller

---
# Role: KubeVirt CRD access scoped to agent-vms namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-controller
  namespace: agent-vms
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
# Bind the role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-controller
  namespace: agent-vms
subjects:
  - kind: ServiceAccount
    name: vm-controller
    namespace: agent-vms
roleRef:
  kind: Role
  name: vm-controller
  apiGroup: rbac.authorization.k8s.io

---
# VM template — loaded by controller's render_template() for string substitution
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-template
  namespace: agent-vms
data:
  vm-template.yaml: |
    apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    metadata:
      name: agent-vm-${JOB_ID}
      labels:
        vm.kubevirt.io/name: agent-vm-${JOB_ID}
        job-id: ${JOB_ID}
    spec:
      runStrategy: RerunOnFailure
      dataVolumeTemplates:
        - metadata:
            name: agent-vm-${JOB_ID}-rootdisk
          spec:
            storage:
              accessModes:
                - ReadWriteOnce
              storageClassName: ${VM_STORAGE_CLASS}
              resources:
                requests:
                  storage: ${VM_DISK_SIZE}
            source:
              registry:
                url: docker://${VM_IMAGE}
      template:
        metadata:
          labels:
            vm.kubevirt.io/name: agent-vm-${JOB_ID}
            job-id: ${JOB_ID}
            # Fleet-wide selector for the unified workspace NetworkPolicy.
            # MUST live here (VMI template), not on the top-level VM metadata
            # — only template labels propagate to the virt-launcher pod.
            srw.io/component: agent-workspace
        spec:
          domain:
            cpu:
              cores: ${CPU_CORES}
            memory:
              guest: ${MEMORY}
            devices:
              disks:
                - name: rootdisk
                  disk:
                    bus: virtio
                - name: cloud-init
                  disk:
                    bus: virtio
              interfaces:
                - name: default
                  masquerade: {}
            machine:
              type: q35
          networks:
            - name: default
              pod: {}
          volumes:
            - name: rootdisk
              dataVolume:
                name: agent-vm-${JOB_ID}-rootdisk
            - name: cloud-init
              cloudInitNoCloud:
                userData: |
                  #cloud-config
                  write_files:
                    - path: /etc/default/management-daemon
                      permissions: '0644'
                      content: |
                        NATS_URL=${NATS_URL}
                        JOB_ID=${JOB_ID}
                    - path: /run/agent/job-config.json
                      permissions: '0644'
                      content: |
                        {
                          "job_id": "${JOB_ID}",
                          "agent_config": "${AGENT_CONFIG}",
                          "vm_image": "${VM_IMAGE}",
                          "cpu_cores": ${CPU_CORES},
                          "memory": "${MEMORY}",
                          "description": "${DESCRIPTION}",
                          "nats_url": "${NATS_URL}"
                        }
                    - path: /etc/default/sudo-gated
                      permissions: '0644'
                      content: |
                        NATS_URL=${NATS_URL}
                        JOB_ID=${JOB_ID}
                        VM_ID=agent-vm-${JOB_ID}
                    - path: /home/agent-host/.ssh/authorized_keys
                      permissions: '0600'
                      owner: agent-host:agent-host
                      content: |
                        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM1hi+I86ZtC8OOmv2dEUtUbXTgtgvWuSWtszPsts5bY srw-agent-vm-access
                  runcmd:
                    - mkdir -p /run/agent
                    - chmod 755 /run/agent
                    - systemctl daemon-reload
                    - systemctl enable management-daemon.service
                    - systemctl start management-daemon.service
                    - systemctl restart sudo-gated.socket
                    - 'if [ -n "${TAILSCALE_AUTH_KEY}" ]; then tailscale up --auth-key=${TAILSCALE_AUTH_KEY} --login-server=${HEADSCALE_URL} --hostname=vm-${JOB_ID} --accept-routes=false --timeout=120s & fi'

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-vm-controller
  namespace: agent-vms
  labels:
    app: srw-vm-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-vm-controller
  template:
    metadata:
      labels:
        app: srw-vm-controller
    spec:
      serviceAccountName: vm-controller
      containers:
        - name: vm-controller
          # Image tag managed by CI/CD — do not edit manually
          image: ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller:sha-f1cee08
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: "nats://nats-leaf.nats.svc.cluster.local:4222"
            - name: VM_TEMPLATE_PATH
              value: "/config/vm-template.yaml"
            - name: VM_NAMESPACE
              value: "agent-vms"
            # Image tag managed by CI/CD — do not edit manually
            - name: DEFAULT_VM_IMAGE
              value: "ghcr.io/knaeckebrothero/superhuman-remote-worker-agent-vm-base:sha-2e27285"
            - name: DEFAULT_CPU
              value: "2"
            - name: DEFAULT_MEMORY
              value: "4Gi"
            # CDI DataVolume storage (persistent VM disks)
            - name: VM_STORAGE_CLASS
              value: "local-path"
            - name: VM_DISK_SIZE
              value: "20Gi"
            # Headscale mesh VPN (auth key generation for VMs)
            - name: HEADSCALE_URL
              value: "https://headscale.h4ll.app"
            - name: HEADSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: headscale-api-key
                  key: api-key
            - name: HEADSCALE_USER
              value: "srw"
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: vm-template
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # No HTTP endpoints — communication is via NATS only.
          # Use a simple exec probe to verify the process is running.
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.getpid()"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: vm-template
          configMap:
            name: vm-template
