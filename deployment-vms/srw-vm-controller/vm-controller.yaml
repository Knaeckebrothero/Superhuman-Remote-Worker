# VM Controller — Agent Cluster
#
# Manages KubeVirt VM lifecycle via NATS.
# Deployed to the AGENT cluster (not the main cluster).
# Namespace: agent-vms (must exist on the agent cluster).
#
# Prerequisites:
#   - NATS leaf deployed on agent cluster (see deployment/nats/nats-leaf-values.yaml)
#   - KubeVirt installed on agent cluster (see docs/features/vm_agent_cluster_setup.md)
#
# The vm-template ConfigMap is defined below and managed by Fleet.
#
# Image build:
#   cd vm-controller
#   podman build -t ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller:sha-a63027b .
#   podman push ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller:sha-a63027b

---
# Namespace (idempotent — already created during agent cluster setup)
apiVersion: v1
kind: Namespace
metadata:
  name: agent-vms
  labels:
    app.kubernetes.io/part-of: superhuman-remote-worker

---
# ServiceAccount for the VM Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-controller
  namespace: agent-vms
  labels:
    app: srw-vm-controller

---
# Role: KubeVirt CRD access scoped to agent-vms namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vm-controller
  namespace: agent-vms
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
# Bind the role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-controller
  namespace: agent-vms
subjects:
  - kind: ServiceAccount
    name: vm-controller
    namespace: agent-vms
roleRef:
  kind: Role
  name: vm-controller
  apiGroup: rbac.authorization.k8s.io

---
# VM template — loaded by controller's render_template() for string substitution
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-template
  namespace: agent-vms
data:
  vm-template.yaml: |
    apiVersion: kubevirt.io/v1
    kind: VirtualMachine
    metadata:
      name: agent-vm-${JOB_ID}
      labels:
        vm.kubevirt.io/name: agent-vm-${JOB_ID}
        job-id: ${JOB_ID}
    spec:
      runStrategy: RerunOnFailure
      template:
        metadata:
          labels:
            vm.kubevirt.io/name: agent-vm-${JOB_ID}
            job-id: ${JOB_ID}
        spec:
          domain:
            cpu:
              cores: ${CPU_CORES}
            memory:
              guest: ${MEMORY}
            devices:
              disks:
                - name: rootdisk
                  disk:
                    bus: virtio
                - name: cloud-init
                  disk:
                    bus: virtio
              interfaces:
                - name: default
                  masquerade: {}
            machine:
              type: q35
          networks:
            - name: default
              pod: {}
          volumes:
            - name: rootdisk
              containerDisk:
                image: ${VM_IMAGE}
            - name: cloud-init
              cloudInitNoCloud:
                userData: |
                  #cloud-config
                  write_files:
                    - path: /etc/default/management-daemon
                      permissions: '0644'
                      content: |
                        NATS_URL=${NATS_URL}
                        JOB_ID=${JOB_ID}
                    - path: /run/agent/job-config.json
                      permissions: '0644'
                      content: |
                        {
                          "job_id": "${JOB_ID}",
                          "agent_config": "${AGENT_CONFIG}",
                          "vm_image": "${VM_IMAGE}",
                          "cpu_cores": ${CPU_CORES},
                          "memory": "${MEMORY}",
                          "description": "${DESCRIPTION}",
                          "nats_url": "${NATS_URL}"
                        }
                    - path: /etc/default/sudo-gated
                      permissions: '0644'
                      content: |
                        NATS_URL=${NATS_URL}
                        JOB_ID=${JOB_ID}
                        VM_ID=agent-vm-${JOB_ID}
                  runcmd:
                    - mkdir -p /run/agent
                    - chmod 755 /run/agent
                    - 'if [ -n "${TAILSCALE_AUTH_KEY}" ]; then tailscale up --auth-key=${TAILSCALE_AUTH_KEY} --login-server=${HEADSCALE_URL} --hostname=vm-${JOB_ID} --accept-routes=false --ssh; fi'
                    - systemctl daemon-reload
                    - systemctl enable management-daemon.service
                    - systemctl start management-daemon.service
                    - systemctl restart sudo-gated.socket

---
# Headscale API key — used by the VM controller to generate pre-auth keys.
# Create this secret manually on the agent cluster:
#   kubectl --context vms -n agent-vms create secret generic headscale-api-key \
#     --from-literal=api-key=<your-headscale-api-key>
# Or manage via ExternalSecrets/Vault if ESO is deployed on this cluster.
apiVersion: v1
kind: Secret
metadata:
  name: headscale-api-key
  namespace: agent-vms
  labels:
    app: srw-vm-controller
type: Opaque
stringData:
  api-key: "REPLACE_ME"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-vm-controller
  namespace: agent-vms
  labels:
    app: srw-vm-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-vm-controller
  template:
    metadata:
      labels:
        app: srw-vm-controller
    spec:
      serviceAccountName: vm-controller
      containers:
        - name: vm-controller
          image: ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller:sha-a63027b
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: "nats://nats-leaf.nats.svc.cluster.local:4222"
            - name: VM_TEMPLATE_PATH
              value: "/config/vm-template.yaml"
            - name: VM_NAMESPACE
              value: "agent-vms"
            - name: DEFAULT_VM_IMAGE
              value: "ghcr.io/knaeckebrothero/superhuman-remote-worker-agent-vm-base:sha-a63027b"
            - name: DEFAULT_CPU
              value: "2"
            - name: DEFAULT_MEMORY
              value: "4Gi"
            # Headscale mesh VPN (auth key generation for VMs)
            - name: HEADSCALE_URL
              value: "https://headscale.superhuman-remote-worker.com"
            - name: HEADSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: headscale-api-key
                  key: api-key
            - name: HEADSCALE_USER
              value: "srw"
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: vm-template
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # No HTTP endpoints — communication is via NATS only.
          # Use a simple exec probe to verify the process is running.
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.getpid()"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: vm-template
          configMap:
            name: vm-template
