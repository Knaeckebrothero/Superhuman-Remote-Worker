defaultNamespace: kubevirt
helm:
  takeOwnership: true
dependsOn: []
targets:
  - clusterSelector:
      matchLabels:
        # Rancher would not let us rename the imported cluster to the
        # historic "vms" naming used elsewhere; selector pinned to the
        # actual display name.
        management.cattle.io/cluster-display-name: vm
targetRestrictions:
  - clusterSelector:
      matchLabels:
        # Rancher would not let us rename the imported cluster to the
        # historic "vms" naming used elsewhere; selector pinned to the
        # actual display name.
        management.cattle.io/cluster-display-name: vm
