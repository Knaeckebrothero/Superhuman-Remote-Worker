apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srwvm.vmControllerName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  replicas: {{ .Values.vmController.replicas }}
  selector:
    matchLabels:
      {{- include "srwvm.componentSelectorLabels" (dict "context" . "component" "vm-controller") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srwvm.componentSelectorLabels" (dict "context" . "component" "vm-controller") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "srwvm.vmControllerName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait for the in-cluster NATS leaf to accept connections before
        # starting the controller (it subscribes to subjects on startup).
        - name: wait-for-nats
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "srwvm.natsLeafName" . }} 4222; do
                echo "waiting for NATS leaf..."
                sleep 2
              done
      containers:
        - name: vm-controller
          image: "{{ .Values.image.vmController.repository }}:{{ include "srwvm.imageTag" (dict "tag" .Values.image.vmController.tag "context" .) }}"
          imagePullPolicy: {{ .Values.image.vmController.pullPolicy }}
          env:
            - name: NATS_URL
              value: "nats://{{ include "srwvm.natsLeafName" . }}:4222"
            - name: VM_TEMPLATE_PATH
              value: "/config/vm-template.yaml"
            - name: VM_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: DEFAULT_VM_IMAGE
              value: {{ include "srwvm.defaultVmImage" . | quote }}
            - name: DEFAULT_CPU
              value: {{ .Values.vmController.defaultCpu | quote }}
            - name: DEFAULT_MEMORY
              value: {{ .Values.vmController.defaultMemory | quote }}
            - name: VM_STORAGE_CLASS
              value: {{ .Values.vmController.vmStorageClass | quote }}
            - name: VM_DISK_SIZE
              value: {{ .Values.vmController.vmDiskSize | quote }}
            - name: HEADSCALE_URL
              value: {{ .Values.headscale.url | quote }}
            - name: HEADSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srwvm.headscaleApiKeySecretName" . }}
                  key: api-key
            - name: HEADSCALE_USER
              value: {{ .Values.headscale.user | quote }}
            {{- if .Values.ssh.publicKeyVaultPath }}
            # When the public key is synced from Vault, the controller reads
            # it at runtime and substitutes ${SSH_AUTHORIZED_KEY} in the
            # template ConfigMap.
            - name: SSH_AUTHORIZED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srwvm.sshPubKeySecretName" . }}
                  key: ssh-publickey
            {{- end }}
            {{- if .Values.tailscale.enabled }}
            - name: TAILSCALE_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srwvm.tailscaleAuthKeySecretName" . }}
                  key: TAILSCALE_AUTH_KEY
            {{- end }}
            - name: ORCHESTRATOR_ID
              value: {{ .Values.orchestratorId | quote }}
            - name: LOG_LEVEL
              value: "INFO"
          volumeMounts:
            - name: vm-template
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.vmController.resources | nindent 12 }}
          # No HTTP endpoints — communication is via NATS only. Use a
          # simple exec probe to verify the process is running.
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.getpid()"]
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: vm-template
          configMap:
            name: {{ include "srwvm.vmControllerName" . }}-template
