apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "srwvm.vmControllerName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
---
# KubeVirt RBAC scoped to this release namespace. The controller can manage
# VMs only here — not cluster-wide, not in adjacent namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "srwvm.vmControllerName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "srwvm.vmControllerName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "srwvm.vmControllerName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "srwvm.vmControllerName" . }}
  apiGroup: rbac.authorization.k8s.io
