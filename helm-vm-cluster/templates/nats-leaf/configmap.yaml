apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srwvm.natsLeafName" . }}-config
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "nats-leaf") | nindent 4 }}
data:
  nats.conf: |
    # NATS leaf — relays vm.* and agent.* subjects to the hub on the
    # orchestrator cluster (chart 1's nats.leafNodePort). No JetStream,
    # no clustering — pure relay.

    server_name: {{ include "srwvm.natsLeafName" . }}-0
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    leafnodes {
      remotes = [
        { url: {{ .Values.nats.hubUrl | quote }} }
      ]
    }
