{{- $metering := .Values.infrastructureMetering | default dict -}}
{{- $sync := $metering.externalSecrets | default dict -}}
{{- if ($sync.enabled | default false) }}
{{- $vaultPath := $sync.vaultPath -}}
{{- if $metering.ingestionSecretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $metering.ingestionSecretName | quote }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vmi-metering") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | quote }}
    kind: {{ .Values.externalSecrets.secretStoreKind | quote }}
  target:
    name: {{ $metering.ingestionSecretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $metering.ingestionSecretKey | quote }}
      remoteRef:
        key: {{ $vaultPath | quote }}
        property: {{ $sync.vmiIngestionProperty | quote }}
{{- end }}
