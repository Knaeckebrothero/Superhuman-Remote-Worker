{{- if .Values.externalSecrets.enabled }}
{{- /*
The chart syncs three Secrets from Vault. Each one has two possible
sources:

  Layout A — dedicated paths.
    Set per-knob (headscale.apiKeyVaultPath, ssh.publicKeyVaultPath,
    tailscale.authKeyVaultPath). Each path holds *just* the field its
    consumer expects (`api-key`, `ssh-publickey`, `TAILSCALE_AUTH_KEY`).
    The chart copies the path verbatim with `dataFrom + extract`.

  Layout B — single bundle (the recommended layout for new
    deployments). Leave the per-knob paths empty and put all values in
    `externalSecrets.vaultPath` under env-var-style names:
      HEADSCALE_API_KEY, VM_SSH_PUBLIC_KEY, TAILSCALE_AUTH_KEY
    The chart renders ESO `data:` arrays with explicit `property:`
    mappings so the K8s Secret still presents the field names the
    consumers (vm-controller deployment) expect.

The two layouts can be mixed (e.g. headscale dedicated, ssh in the
bundle), though there's rarely a reason to.
*/ -}}

{{- /* ---------- Per-controller bundle (Layout B source path) ---------- */ -}}
{{- if .Values.externalSecrets.vaultPath }}
# ---------------------------------------------------------------
# Per-controller secrets bundle. Holds all three credentials when
# Layout B is in use. Always synced when externalSecrets.vaultPath is
# set so future per-controller secrets (e.g. NATS auth) have a home.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.fullname" . }}
  labels:
    {{- include "srwvm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.fullname" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.vaultPath }}
{{- end }}

{{- /* ---------- Headscale API key ---------- */ -}}
{{- if .Values.headscale.apiKeyVaultPath }}
---
# ---------------------------------------------------------------
# Headscale API key — read by the vm-controller to register VMs.
# Layout A: dedicated path holds `api-key` directly.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.headscaleApiKeySecretName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.headscaleApiKeySecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.headscale.apiKeyVaultPath }}
{{- else if .Values.externalSecrets.vaultPath }}
---
# ---------------------------------------------------------------
# Headscale API key — Layout B: extracted from the per-controller
# bundle. The bundle stores it under HEADSCALE_API_KEY (env-var
# style); the synced K8s Secret renames it to `api-key` so the
# vm-controller deployment's env reference doesn't have to change.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.headscaleApiKeySecretName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.headscaleApiKeySecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: HEADSCALE_API_KEY
{{- end }}

{{- /* ---------- SSH public key ---------- */ -}}
{{- if .Values.ssh.publicKeyVaultPath }}
---
# ---------------------------------------------------------------
# SSH public key — authorized into VMs at boot. Layout A: dedicated
# path holds `ssh-publickey` directly.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.sshPubKeySecretName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.sshPubKeySecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.ssh.publicKeyVaultPath }}
{{- else if and (not .Values.ssh.publicKey) .Values.externalSecrets.vaultPath }}
---
# ---------------------------------------------------------------
# SSH public key — Layout B: extracted from the per-controller
# bundle under VM_SSH_PUBLIC_KEY, surfaced as `ssh-publickey` so
# the vm-controller deployment's env reference stays unchanged.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.sshPubKeySecretName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.sshPubKeySecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: ssh-publickey
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: VM_SSH_PUBLIC_KEY
{{- end }}

{{- /* ---------- Tailscale auth key ---------- */ -}}
{{- if .Values.tailscale.enabled }}
{{- if .Values.tailscale.authKeyVaultPath }}
---
# ---------------------------------------------------------------
# Tailscale auth key — Layout A: dedicated path holds
# TAILSCALE_AUTH_KEY directly.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.tailscaleAuthKeySecretName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.tailscaleAuthKeySecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.tailscale.authKeyVaultPath }}
{{- else if .Values.externalSecrets.vaultPath }}
---
# ---------------------------------------------------------------
# Tailscale auth key — Layout B: extracted from the per-controller
# bundle. Field name TAILSCALE_AUTH_KEY in both bundle and target.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.tailscaleAuthKeySecretName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.tailscaleAuthKeySecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: TAILSCALE_AUTH_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: TAILSCALE_AUTH_KEY
{{- end }}
{{- end }}
{{- end }}
