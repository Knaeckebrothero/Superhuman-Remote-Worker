{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.vaultPath }}
# ---------------------------------------------------------------
# Per-controller secrets bundle (optional, reserved for future use —
# e.g. NATS auth credentials when the hub gets NKey auth).
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.fullname" . }}
  labels:
    {{- include "srwvm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.fullname" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.vaultPath }}
{{- end }}
{{- if .Values.headscale.apiKeyVaultPath }}
---
# ---------------------------------------------------------------
# Headscale API key — read by the vm-controller to register VMs.
# Vault path must contain key `api-key`.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.headscaleApiKeySecretName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.headscaleApiKeySecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.headscale.apiKeyVaultPath }}
{{- end }}
{{- if .Values.ssh.publicKeyVaultPath }}
---
# ---------------------------------------------------------------
# SSH public key — authorized into VMs at boot. The matching private
# key is held by the orchestrator (chart 1's vm-ssh-key Secret).
# Vault path must contain key `ssh-publickey`.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.sshPubKeySecretName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.sshPubKeySecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.ssh.publicKeyVaultPath }}
{{- end }}
{{- if and .Values.tailscale.enabled .Values.tailscale.authKeyVaultPath }}
---
# ---------------------------------------------------------------
# Tailscale auth key — injected into VMs at boot so they join the
# headscale tailnet. Vault path must contain key `TAILSCALE_AUTH_KEY`.
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srwvm.tailscaleAuthKeySecretName" . }}
  labels:
    {{- include "srwvm.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srwvm.tailscaleAuthKeySecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.tailscale.authKeyVaultPath }}
{{- end }}
{{- end }}
