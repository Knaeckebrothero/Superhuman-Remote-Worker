# Squawk linter config for orchestrator/database/migrations/**.sql.
# Wired into CI by .github/workflows/db-migrations.yml; design rationale
# and the rule list this complements live in docs/db_migration.md
# §Testing & CI.

# Match the orchestrator's deployed Postgres version. Squawk uses this to
# decide which rules apply (e.g. PG 11+ skips table rewrites for ADD COLUMN
# with a constant default; PG 12+ tightens NOT NULL behaviour).
pg_version = "16.0"

# Stylistic rules disabled across all migrations — too noisy in practice
# and orthogonal to the lock-safety / breakage rules we actually care about.
excluded_rules = [
    "prefer-bigint-over-int",
    "prefer-text-field",
    # Unsatisfiable for our runner model. `.notx.sql` migrations
    # (CREATE/DROP INDEX CONCURRENTLY) must be a SINGLE statement: the runner
    # sends each file as one simple-query, so a multi-statement file would put
    # CONCURRENTLY inside an implicit transaction and fail. That makes it
    # impossible to precede the op with `SET lock_timeout` / `SET
    # statement_timeout` in-file. Timeout safety is instead a deploy-model
    # concern (serialized, advisory-locked runner; moderate table sizes).
    # Revisit if we ever alter hot, high-volume tables online.
    "require-timeout-settings",
]

# Files excluded from lint coverage. Two categories:
#
#   1. 0001_initial.sql (both DBs) — snapshot of the cutover state, not a
#      hand-written migration. Trips rules appropriate for ALTERs on a hot
#      prod table but irrelevant for an empty-DB bootstrap.
#
#   2. Already-applied migrations whose lint findings can't be acted on
#      without tripping the migration runner's checksum guard. The
#      underlying advice (prefer IDENTITY over BIGSERIAL, NOT VALID on
#      new CHECK constraints, CREATE INDEX CONCURRENTLY in .notx.sql) is
#      documented in docs/db_migration.md and applies to all NEW migrations.
#      Files here shipped before squawk caught them; rewriting in place
#      would re-execute against a DB that's already at the target state.
#        - 0004 / 0006: BIGSERIAL primary keys (fixed forward by 0007).
#        - 0008: ADD CHECK without NOT VALID and CREATE INDEX without
#                CONCURRENTLY on threads. Already applied 2026-05-13.
excluded_paths = [
    "orchestrator/database/migrations/app/0001_initial.sql",
    "orchestrator/database/migrations/vector/0001_initial.sql",
    "orchestrator/database/migrations/app/0004_thread_events.sql",
    "orchestrator/database/migrations/app/0006_headless_notifications.sql",
    "orchestrator/database/migrations/app/0008_thread_awaiting_user.sql",
]
