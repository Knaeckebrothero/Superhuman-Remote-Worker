[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superhuman-remote-worker"
version = "0.0.0"
description = "Superhuman Remote Worker application packages"
requires-python = ">=3.11"
# Images install their existing, separate requirements before --no-deps -e .
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "agent", "agent.*",
  "orchestrator", "orchestrator.*",
  "mcp_server", "mcp_server.*",
  "vm_controller", "vm_controller.*",
  "shared", "shared.*",
]
namespaces = false

[tool.setuptools.package-data]
orchestrator = [
  "database/*.sql",
  "database/migrations/*/*.sql",
  "database/queries/*.sql",
  "database/queries/**/*.sql",
  "config/*.yaml",
  "config/prompts/*.md",
]
mcp_server = ["templates/*.html"]
shared = ["**/*.sql"]

[tool.ruff]
# Preserve the formatter/linter target used before packaging metadata existed.
target-version = "py310"

[tool.importlinter]
root_packages = ["agent", "orchestrator", "mcp_server", "vm_controller", "shared"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Applications and shared code use canonical package names"
type = "forbidden"
source_modules = ["agent", "orchestrator", "mcp_server", "vm_controller", "shared"]
forbidden_modules = [
  "src", "database", "services", "security", "models", "main", "auth",
  "routers", "utils", "graph_routes", "logging_config", "uploads", "seed",
  "operator_cli", "ssh_gateway", "canvas_gateway", "controller",
  "headscale_client", "lifecycle_auth",
]

[[tool.importlinter.contracts]]
name = "Applications are independent"
type = "independence"
modules = ["agent", "orchestrator", "mcp_server", "vm_controller"]

[[tool.importlinter.contracts]]
name = "Shared code does not depend on applications"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["agent", "orchestrator", "mcp_server", "vm_controller"]

[[tool.importlinter.contracts]]
name = "Lightweight shared modules do not depend on shared runtime"
type = "forbidden"
# Import Linter 2.13 skips the overlapping shared.runtime source/target pair.
# Every other current or future shared child remains covered as a package.
source_modules = ["shared.*"]
forbidden_modules = ["shared.runtime"]

[[tool.importlinter.contracts]]
name = "Contacts router does not import application startup"
type = "forbidden"
source_modules = ["orchestrator.routers.contacts"]
forbidden_modules = ["orchestrator.main"]
# Legacy security helpers still resolve some app services through main. This
# pilot protects the extracted router's direct boundary while those are migrated.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Tables router does not import application startup"
type = "forbidden"
source_modules = ["orchestrator.routers.tables"]
forbidden_modules = ["orchestrator.main"]
# Existing auth helpers retain indirect composition lookups, as for contacts.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Preferences domain does not import application startup"
type = "forbidden"
source_modules = [
    "orchestrator.routers.preferences",
    "orchestrator.services.preference_defaults",
    "orchestrator.services.session_workspace_policy",
]
forbidden_modules = ["orchestrator.main"]
# Existing auth helpers retain indirect composition lookups, as for contacts.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Job creation schemas and ingress policy do not import application startup"
type = "forbidden"
source_modules = ["orchestrator.schemas.job_create", "orchestrator.services.job_create_ingress", "orchestrator.services.job_admission_scope", "orchestrator.services.job_admission_config", "orchestrator.services.job_admission_officer", "orchestrator.services.job_admission_workspace", "orchestrator.services.job_admission", "orchestrator.services.job_admission_datasources", "orchestrator.services.job_admission_delivery", "orchestrator.services.job_admission_creation", "orchestrator.services.job_admission_creator", "orchestrator.services.datasource_policy_errors", "orchestrator.services.officer_metadata"]
forbidden_modules = ["orchestrator.main"]

[[tool.importlinter.contracts]]
name = "Job read router does not import application startup"
type = "forbidden"
source_modules = [
    "orchestrator.routers.job_reads",
    "orchestrator.routers.job_inspection",
    "orchestrator.routers.job_audit",
    "orchestrator.routers.job_artifacts",
]
forbidden_modules = ["orchestrator.main"]
# Existing authorization helpers retain indirect composition lookups.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Job read services do not import application startup"
type = "forbidden"
source_modules = [
    "orchestrator.services.job_queries",
    "orchestrator.services.job_projection",
    "orchestrator.services.job_reads",
]
forbidden_modules = ["orchestrator.main"]

[[tool.importlinter.contracts]]
name = "Catalogue and inspection operations and schemas do not import application startup"
type = "forbidden"
source_modules = [
    "orchestrator.schemas",
    "orchestrator.services.catalogue_resources",
    "orchestrator.services.expert_catalog_contracts",
    "orchestrator.services.expert_catalog",
    "orchestrator.services.expert_authoring",
    "orchestrator.services.provider_catalog",
    "orchestrator.services.model_catalog",
    "orchestrator.services.config_catalog",
    "orchestrator.services.job_inspection",
    "orchestrator.services.job_audit",
    "orchestrator.services.job_artifacts",
    "orchestrator.services.diagnostics",
    "orchestrator.services.subagent_projection",
    "orchestrator.routers.expert_catalog",
    "orchestrator.routers.provider_catalog",
    "orchestrator.routers.model_catalog",
    "orchestrator.routers.config_catalog",
    "orchestrator.routers.diagnostics",
]
forbidden_modules = ["orchestrator.main"]

[[tool.importlinter.contracts]]
name = "Reporting, identity and operational administration do not import application startup"
type = "forbidden"
source_modules = [
    "orchestrator.services.infrastructure_activation_policy",
    "orchestrator.services.usage_reporting",
    "orchestrator.services.infrastructure_admin",
    "orchestrator.services.identity",
    "orchestrator.services.access_tokens",
    "orchestrator.services.ssh_access",
    "orchestrator.services.provider_credentials",
    "orchestrator.services.subscription_management",
    "orchestrator.services.voice",
    "orchestrator.services.system_settings",
    "orchestrator.services.user_administration",
    "orchestrator.services.job_diagnostics",
    "orchestrator.routers.usage_reporting",
    "orchestrator.routers.infrastructure_admin",
    "orchestrator.routers.identity",
    "orchestrator.routers.access_tokens",
    "orchestrator.routers.ssh_access",
    "orchestrator.routers.provider_credentials",
    "orchestrator.routers.subscription_management",
    "orchestrator.routers.voice",
    "orchestrator.routers.system_settings",
    "orchestrator.routers.user_administration",
    "orchestrator.routers.job_diagnostics",
]
forbidden_modules = ["orchestrator.main"]
# This contract passed the synthetic tree in tests/test_import_boundaries.py but
# has been BROKEN against the real source since it was written: every router
# here imports orchestrator.security.access, which reaches main indirectly
# through services.sudo_gate -> services.session_wake. No B02 module imports
# main directly. Ignoring the exact ledgered edges keeps every other transitive
# path checked; the real fix is B06/B07/B10 closing their own callers, at which
# point these entries can come off.
ignore_imports = [
    "orchestrator.services.session_wake -> orchestrator.main",
    "orchestrator.services.session_lifecycle -> orchestrator.main",
    "orchestrator.services.sitrep -> orchestrator.main",
    "orchestrator.services.project_backlog -> orchestrator.main",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "Projects, datasources, knowledge and citations do not import application startup"
type = "forbidden"
source_modules = [
    "orchestrator.services.datasource_config",
    "orchestrator.services.datasources",
    "orchestrator.services.kb_task_registry",
    "orchestrator.services.knowledge_index",
    "orchestrator.services.knowledge_projection",
    "orchestrator.services.knowledge_operations",
    "orchestrator.services.citations",
    "orchestrator.services.projects",
    "orchestrator.services.project_provisioning",
    "orchestrator.routers.datasources",
    "orchestrator.routers.knowledge",
    "orchestrator.routers.citations",
    "orchestrator.routers.media",
    "orchestrator.routers.projects",
    "orchestrator.schemas.media",
]
forbidden_modules = ["orchestrator.main"]
# Two *indirect* chains reach main from here, both through a module another
# batch owns and both already recorded in the caller ledger. Ignoring the two
# exact edges — rather than setting `allow_indirect_imports` — keeps every
# other transitive path checked, so a new one would still fail this contract.
# No B03 module imports main directly; that is what the poisoned-import cases
# in tests/test_import_boundaries.py exercise.
ignore_imports = [
    # B10 owns this one (services/session_wake.py:919, a lazy import inside a
    # function). Reached from every router through orchestrator.security.access
    # -> services.sudo_gate.
    "orchestrator.services.session_wake -> orchestrator.main",
    # B07 owns this one (services/project_backlog.py:427,546). Reached from the
    # datasource and knowledge services through kb_datasources -> kb_reindex ->
    # kb_materialize.
    "orchestrator.services.project_backlog -> orchestrator.main",
    # B06 owns this one (services/session_lifecycle.py:48). Reached the same way
    # as session_wake, through security.access -> sudo_gate -> session_wake.
    "orchestrator.services.session_lifecycle -> orchestrator.main",
    # B07 owns this one (services/sitrep.py:115,128).
    "orchestrator.services.sitrep -> orchestrator.main",
]
# tests/test_import_boundaries.py lints a synthetic tree that contains only the
# stub modules a contract names, so none of the four edges above exists there.
# Warn rather than error on an unmatched ignore, or the poisoned-import cases
# could never run. The real-tree run is what these entries are for.
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "Workspace access, files, IDE proxy and cloud do not import application startup"
type = "forbidden"
source_modules = [
    "orchestrator.services.ide_proxy_gateway",
    "orchestrator.services.workspace_access",
    "orchestrator.services.thread_files",
    "orchestrator.services.job_repo_reads",
    "orchestrator.services.job_diff_review",
    "orchestrator.services.job_export",
    "orchestrator.services.job_review_session",
    "orchestrator.services.cloud_stage_authority",
    "orchestrator.services.cloud_task_registry",
    "orchestrator.services.agent_cloud_mounts",
    "orchestrator.services.protected_cloud_engage",
    "orchestrator.services.thread_cloud_diff",
    "orchestrator.services.main_cloud_settings",
    "orchestrator.routers.ide",
    "orchestrator.routers.workspace_access",
    "orchestrator.routers.thread_files",
    "orchestrator.routers.job_repo",
    "orchestrator.routers.job_diff",
    "orchestrator.routers.job_review",
    "orchestrator.routers.agent_cloud_stage",
    "orchestrator.routers.thread_cloud_diff",
    "orchestrator.routers.main_cloud_settings",
    "orchestrator.schemas.workspace_access",
]
forbidden_modules = ["orchestrator.main"]
# No B04 module imports main directly. The indirect edges below are the same
# ones B02/B03 recorded, reached from every router through
# orchestrator.security.access -> services.sudo_gate. Each exact edge is ignored
# rather than setting `allow_indirect_imports`, so any NEW transitive path to
# main would still break this contract.
ignore_imports = [
    # B10 owns this one (services/session_wake.py, a lazy import in a function).
    "orchestrator.services.session_wake -> orchestrator.main",
    # B06 owns this one (services/session_lifecycle.py).
    "orchestrator.services.session_lifecycle -> orchestrator.main",
    # B07 owns these two.
    "orchestrator.services.project_backlog -> orchestrator.main",
    "orchestrator.services.sitrep -> orchestrator.main",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "Shared initializer stays lightweight"
type = "forbidden"
# Check the root initializer separately without including its child packages.
source_modules = ["shared"]
forbidden_modules = ["shared.runtime", "shared.runtime.**"]
as_packages = false

[[tool.importlinter.contracts]]
name = "MCP and VM controller do not depend on shared runtime"
type = "forbidden"
source_modules = ["mcp_server", "vm_controller"]
forbidden_modules = ["shared.runtime"]
