ignore_imports = [
    # B10 owns this one (services/session_wake.py, a lazy import in a function).
    "orchestrator.services.session_wake -> orchestrator.main",
    # B07 owns these two.
    "orchestrator.services.project_backlog -> orchestrator.main",
