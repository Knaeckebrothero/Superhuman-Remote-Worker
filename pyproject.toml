    "orchestrator.services.thread_datasource_authorization",
    "orchestrator.services.thread_project_authorization",
    "orchestrator.services.unit_claim_bundle",
]
forbidden_modules = ["orchestrator.main"]
# No B06 module imports main directly. The indirect edges below are the same
# ones B02-B05 recorded, reached through orchestrator.security.access ->
# services.sudo_gate. Each exact edge is ignored rather than setting
# `allow_indirect_imports`, so a NEW transitive path to main still breaks this.
# B06's own two edges are now closed: session_lifecycle takes the caller's
# store and provision_or_assign takes a constructed
# ProvisionOrAssignDependencies, so neither reaches main any more.
#
# One indirect edge remains, and it is B10's: every module here imports
# orchestrator.security.access, which reaches main through
# services.sudo_gate -> services.session_wake. B02-B05 all ledger that same
# edge; this contract was written without it and so was BROKEN against the
# real tree from the day it landed (tests/test_import_boundaries.py lints a
# synthetic tree, which is why it stayed green there). Ignoring the exact
# edge rather than setting `allow_indirect_imports` keeps a NEW path to main
# breaking the contract.
ignore_imports = [
    # B10 owns this one (services/session_wake.py:919, a lazy import in a
    # function). Comes off when B10 closes its caller.
    "orchestrator.services.session_wake -> orchestrator.main",
    # B07 owns these two, reached from the registration and child-thread
    # services through managed_repository_authority -> security.access ->
    # sudo_gate -> session_wake -> sitrep -> officer_backlog.
    "orchestrator.services.sitrep -> orchestrator.main",
    "orchestrator.services.project_backlog -> orchestrator.main",
]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
