[[tool.importlinter.contracts]]
name = "Job creation schemas and ingress policy do not import application startup"
type = "forbidden"
source_modules = ["orchestrator.schemas.job_create", "orchestrator.services.job_create_ingress", "orchestrator.services.job_admission_scope", "orchestrator.services.job_admission_config", "orchestrator.services.job_admission_officer", "orchestrator.services.job_admission_workspace", "orchestrator.services.job_admission", "orchestrator.services.job_admission_datasources", "orchestrator.services.job_admission_delivery", "orchestrator.services.job_admission_creation", "orchestrator.services.job_admission_creator", "orchestrator.services.datasource_policy_errors", "orchestrator.services.officer_metadata"]
forbidden_modules = ["orchestrator.main"]
ignore_imports = [
    # B10 owns this one (services/session_wake.py:919, a lazy import inside a
    # function). Reached from the workspace selection path through
    # manifest_workspace_selection -> manifest_authority -> security.access ->
    # sudo_gate -> session_wake, the same shape the registration and
    # child-thread services reach it by via managed_repository_authority.
    "orchestrator.services.session_wake -> orchestrator.main",
    # B07 owns these two, reached onward from session_wake through sitrep.
    "orchestrator.services.sitrep -> orchestrator.main",
    "orchestrator.services.project_backlog -> orchestrator.main",
]
unmatched_ignore_imports_alerting = "warn"

