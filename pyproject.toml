[[tool.importlinter.contracts]]
name = "Agent authority, child APIs, session admission and claim bundles do not import application startup"
type = "forbidden"
source_modules = [
    "orchestrator.routers.agent_child_threads",
    "orchestrator.routers.agent_registration",
    "orchestrator.routers.agent_thread_status",
    "orchestrator.routers.officer_runtime_verification",
