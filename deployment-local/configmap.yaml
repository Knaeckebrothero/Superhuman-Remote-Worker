# Local ConfigMap — replaces 02-configmap.yaml for K3s dev
# All service URLs point to in-cluster K8s service names.
# External-facing URLs use localhost for browser access.
apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-config
  namespace: superhuman-remote-worker
data:
  # PostgreSQL (App DB)
  POSTGRES_DB: "srw"

  # Vector DB
  VECTOR_POSTGRES_DB: "srw_vector"

  # MongoDB
  MONGODB_URL: "mongodb://srw-mongodb:27017/srw_logs"

  # Gitea
  GITEA_URL: "http://srw-gitea:3000"
  GITEA_INTERNAL_URL: "http://srw-gitea:3000"

  # Orchestrator
  ORCHESTRATOR_URL: "http://srw-orchestrator:8085"

  # Workspace
  WORKSPACE_PATH: "/workspace"

  # Agent
  AGENT_CONFIG: "defaults"
  AGENT_PORT: "8001"
  PERSISTENT_AGENT_CONFIG: "interactive"

  # Keycloak SSO
  KEYCLOAK_URL: "http://srw-keycloak:8080"
  KEYCLOAK_ISSUER_URL: "http://localhost:8180"
  KEYCLOAK_REALM: "srw"

  # CORS (localhost cockpit)
  CORS_ORIGINS: "http://localhost:4000,http://localhost:4200"

  # Cockpit external URL
  COCKPIT_EXTERNAL_URL: "http://localhost:4000"

  # LLM routing (via VPN sidecar to GPU cluster)
  # If VPN credentials are not set, sidecars will crash-loop and these URLs
  # won't resolve. Override to "" to fall back to direct API access.
  LLM_BASE_URL: "http://srw-vpn-cluster:8080/v1"
  KEY_COOLDOWN_SECONDS: "3600"

  # Vision model
  VISION_MODEL: "gpt-4o-mini"

  # Browser automation (via VPN sidecar)
  BROWSER_LLM_MODEL: "gpt-4o-mini"
  BROWSER_LLM_BASE_URL: "http://srw-vpn-cluster:8080/v1"

  # Research proxy (via VPN sidecar SOCKS5)
  RESEARCH_PROXY_TYPE: "socks5"
  RESEARCH_PROXY_HOST: "srw-vpn-research"
  RESEARCH_PROXY_PORT: "1080"

  # Citation Engine (via VPN sidecar)
  CITATION_LLM_URL: "http://srw-vpn-cluster:8080/v1"
  CITATION_LLM_MODEL: "gpt-4o-mini"
  CITATION_REASONING_LEVEL: "high"
  CITATION_EMBEDDING_MODEL: "qwen3-embedding-8b"
  CITATION_EMBEDDING_URL: "http://srw-vpn-workstation:8080/v1"

  # Embedding model (via workstation VPN)
  EMBEDDING_MODEL: "qwen3-embedding-8b"
  EMBEDDING_BASE_URL: "http://srw-vpn-workstation:8080/v1"

  # Codex proxy
  CODEX_BASE_URL: "http://srw-codex-proxy:8317/v1"

  # Instruction Builder
  BUILDER_MODEL: "gpt-4o-mini"
  BUILDER_LLM_PROVIDER: "openai"

  # Orchestrator settings
  AUTO_ASSIGN_ENABLED: "true"

  # Neo4j
  NEO4J_URL: "bolt://srw-neo4j:7687"
  DEFAULT_DS_NEO4J_URL: "bolt://srw-neo4j:7687"
  DEFAULT_DS_NEO4J_NAME: "Default Neo4j"
  DEFAULT_DS_NEO4J_READ_ONLY: "false"

  # S3 / MinIO (local instance)
  S3_ENDPOINT: "http://srw-minio:9000"
  S3_BUCKET: "srw-snapshots"
  S3_REGION: "us-east-1"
  SNAPSHOT_MAX_SIZE_GB: "10"
  SNAPSHOT_RETENTION_DAYS: "90"

  # IDE sessions
  IDE_SESSION_IDLE_TIMEOUT: "30"
  IDE_SESSION_MAX_LIFETIME: "240"
  IDE_MAX_CONCURRENT_PER_USER: "2"
  CODE_SERVER_IMAGE: "codercom/code-server:latest"
  IDE_PROXY_BASE_URL: "http://localhost:8085"

  # Notification — SMTP disabled locally
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USE_TLS: "false"
  SMTP_TRUST_SELF_SIGNED: "false"
  SMTP_FROM: "noreply@srw.local"

  # Notification — IMAP disabled locally
  IMAP_HOST: ""
  IMAP_PORT: "993"
  IMAP_USE_SSL: "false"
  IMAP_TRUST_SELF_SIGNED: "false"
  IMAP_POLL_INTERVAL: "30"
  AGENT_EMAIL: ""
  MAIL_DOMAIN: ""

  # Notification — Ntfy disabled
  NTFY_URL: ""
  NTFY_TOPIC: ""

  # Nextcloud / WebDAV
  DEFAULT_DS_WEBDAV_URL: "http://srw-nextcloud/remote.php/dav/files/admin/"
  DEFAULT_DS_WEBDAV_NAME: "Nextcloud"
  DEFAULT_DS_WEBDAV_READ_ONLY: "false"

  # Workstation API (via VPN sidecar)
  WORKSTATION_BASE_URL: "http://srw-vpn-workstation:8080/v1"

  # VPN — non-secret config (ports only; credentials in srw-secrets)
  VPN_CLUSTER_PORT: "443"
  VPN_RESEARCH_PORT: "443"
  VPN_WORKSTATION_PORT: "443"

  # Workspace containers (K3s can provision these locally)
  # Built locally via dev-redeploy.sh — no GHCR pull secret needed.
  WORKSPACE_IMAGE: "ghcr.io/knaeckebrothero/superhuman-remote-worker-workspace:local"
  WORKSPACE_NAMESPACE: "superhuman-remote-worker"
  WORKSPACE_STORAGE_CLASS: "local-path"

  # Persistent agent pods (reuses the locally built agent image)
  PERSISTENT_AGENT_IMAGE: "ghcr.io/knaeckebrothero/superhuman-remote-worker-agent:local"

  # Logging
  LOG_LEVEL: "DEBUG"
