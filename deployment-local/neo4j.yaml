# Simplified Neo4j for local K3s — no TLS, no LoadBalancer, no cert-manager
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srw-neo4j-data
  namespace: superhuman-remote-worker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-neo4j
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: srw-neo4j
  template:
    metadata:
      labels:
        app: srw-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: NEO4J_AUTH
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*"
            - name: NEO4J_dbms_security_procedures_allowlist
              value: "apoc.*"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: srw-neo4j-data
---
apiVersion: v1
kind: Service
metadata:
  name: srw-neo4j
  namespace: superhuman-remote-worker
spec:
  type: NodePort
  ports:
    - name: http
      port: 7474
      targetPort: 7474
      nodePort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
      nodePort: 7687
  selector:
    app: srw-neo4j
