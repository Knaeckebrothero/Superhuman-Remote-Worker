# Headscale Bootstrap Job
#
# One-time job that creates the initial user, API key, and agent pre-auth key.
#
# Run after Headscale StatefulSet is ready:
#   kubectl apply -f manual/headscale-bootstrap.yaml
#
# The job automatically:
#   - Creates the 'srw' user in Headscale
#   - Generates an API key (365-day expiry)
#   - Generates a reusable agent pre-auth key (365-day, tag:agent)
#   - Stores the agent auth key directly in superhuman-remote-worker namespace
#     (where agent pods read it — no Vault round-trip needed)
#   - Stores the API key in headscale namespace for retrieval
#
# After the job completes, ONE manual step remains:
#   Copy the API key to the vms cluster (different cluster, can't automate):
#
#   API_KEY=$(kubectl -n headscale get secret headscale-bootstrap-keys -o jsonpath='{.data.api-key}' | base64 -d)
#   kubectl --context vms -n agent-vms create secret generic headscale-api-key --from-literal=api-key="$API_KEY"
#
# This job is idempotent — safe to re-run (user creation tolerates "already exists").

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headscale-bootstrap
  namespace: headscale

---
# RBAC for headscale namespace (exec into pod, store API key)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-bootstrap
  namespace: headscale
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-bootstrap
  namespace: headscale
subjects:
  - kind: ServiceAccount
    name: headscale-bootstrap
    namespace: headscale
roleRef:
  kind: Role
  name: headscale-bootstrap
  apiGroup: rbac.authorization.k8s.io

---
# RBAC for superhuman-remote-worker namespace (write agent auth key Secret)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headscale-bootstrap
  namespace: superhuman-remote-worker
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headscale-bootstrap
  namespace: superhuman-remote-worker
subjects:
  - kind: ServiceAccount
    name: headscale-bootstrap
    namespace: headscale
roleRef:
  kind: Role
  name: headscale-bootstrap
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: batch/v1
kind: Job
metadata:
  name: headscale-bootstrap
  namespace: headscale
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: headscale-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for headscale-0 to be ready..."
              kubectl wait --for=condition=ready pod/headscale-0 -n headscale --timeout=120s

              echo "Creating user 'srw'..."
              kubectl exec headscale-0 -n headscale -- headscale users create srw 2>&1 || echo "(user may already exist)"

              echo "Creating API key..."
              API_KEY=$(kubectl exec headscale-0 -n headscale -- headscale apikeys create --expiration 365d 2>&1)
              echo "API key created."

              echo "Creating agent pre-auth key (reusable, tag:agent)..."
              AUTH_KEY=$(kubectl exec headscale-0 -n headscale -- headscale preauthkeys create --user srw --reusable --expiration 365d --tags tag:agent 2>&1)
              echo "Auth key created."

              echo "Storing API key in headscale namespace..."
              kubectl create secret generic headscale-bootstrap-keys \
                -n headscale \
                --from-literal=api-key="$API_KEY" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "Storing agent auth key in superhuman-remote-worker namespace..."
              kubectl create secret generic tailscale-auth \
                -n superhuman-remote-worker \
                --from-literal=TAILSCALE_AUTH_KEY="$AUTH_KEY" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo ""
              echo "=== Bootstrap complete ==="
              echo "Agent auth key written to secret tailscale-auth in superhuman-remote-worker namespace."
              echo ""
              echo "One manual step: copy the API key to the vms cluster:"
              echo "  API_KEY=\$(kubectl -n headscale get secret headscale-bootstrap-keys -o jsonpath='{.data.api-key}' | base64 -d)"
              echo "  kubectl --context vms -n agent-vms create secret generic headscale-api-key --from-literal=api-key=\"\$API_KEY\""
