apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: srw-agent-egress
  namespace: superhuman-remote-worker
spec:
  podSelector:
    matchLabels:
      app: srw-agent
  policyTypes:
    - Egress
  egress:
    # DNS resolution (kube-dns / CoreDNS)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Orchestrator API
    - to:
        - podSelector:
            matchLabels:
              app: srw-orchestrator
      ports:
        - protocol: TCP
          port: 8085
    # VPN sidecars (LLM routing, browser, research proxy)
    - to:
        - podSelector:
            matchLabels:
              app: srw-vpn-cluster
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: srw-vpn-research
      ports:
        - protocol: TCP
          port: 1080
    - to:
        - podSelector:
            matchLabels:
              app: srw-vpn-workstation
      ports:
        - protocol: TCP
          port: 8080
    # PostgreSQL (App DB)
    - to:
        - podSelector:
            matchLabels:
              app: srw-postgres
      ports:
        - protocol: TCP
          port: 5432
    # PostgreSQL (Vector DB)
    - to:
        - podSelector:
            matchLabels:
              app: srw-postgres-vector
      ports:
        - protocol: TCP
          port: 5432
    # MongoDB (audit logs)
    - to:
        - podSelector:
            matchLabels:
              app: srw-mongodb
      ports:
        - protocol: TCP
          port: 27017
    # Neo4j
    - to:
        - podSelector:
            matchLabels:
              app: srw-neo4j
      ports:
        - protocol: TCP
          port: 7687
    # Gitea (workspace git repos)
    - to:
        - podSelector:
            matchLabels:
              app: srw-gitea
      ports:
        - protocol: TCP
          port: 3000
    # Headscale coordination server (Tailscale sidecar)
    # Direct internal access (health checks, key exchange)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: headscale
          podSelector:
            matchLabels:
              app: headscale
      ports:
        - protocol: TCP
          port: 8080
    # Headscale via Traefik Ingress (Noise protocol requires TLS)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 443
    # WireGuard direct peer connections (Tailscale mesh VPN to VMs)
    - ports:
        - protocol: UDP
          port: 41641
