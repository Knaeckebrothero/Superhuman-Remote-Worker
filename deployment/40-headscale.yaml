# Headscale — Self-hosted Tailscale Coordination Server
#
# Provides mesh VPN connectivity between agent pods (main cluster) and
# KubeVirt VMs (agent cluster). Replaces NodePort-based SSH access.
#
# Deployed as a single-replica StatefulSet because Headscale uses SQLite
# (only supported backend — PostgreSQL is deprecated). Multiple replicas
# cause database corruption.
#
# Prerequisites:
#   - DNS record for headscale.superhuman-remote-worker.com (Cloudflare tunnel)
#
# After deployment, run the bootstrap job to create user + keys:
#   kubectl apply -f deployment/41-headscale-bootstrap.yaml
# Then store the generated keys in Vault (see bootstrap job comments).
#
# See docs/features/headscale_mesh.md for the full design.

---
apiVersion: v1
kind: Namespace
metadata:
  name: headscale
  labels:
    app.kubernetes.io/part-of: superhuman-remote-worker

---
# Headscale server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
data:
  config.yaml: |
    server_url: https://headscale.superhuman-remote-worker.com
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    private_key_path: /var/lib/headscale/private.key
    noise:
      private_key_path: /var/lib/headscale/noise_private.key
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
    derp:
      server:
        enabled: true
        private_key_path: /var/lib/headscale/derp_server_private.key
        stun_listen_addr: 0.0.0.0:3478
    ephemeral_node_inactivity_timeout: 30m
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
    dns:
      magic_dns: false
      override_local_dns: false
    policy:
      path: /etc/headscale/acl.hujson

---
# ACL policy — agents can SSH to VMs, nothing else
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-acl
  namespace: headscale
data:
  # HuJSON format (JSON with comments and trailing commas)
  acl.hujson: |
    {
      // Tag owners — empty arrays mean only pre-auth keys can assign these tags
      "tagOwners": {
        "tag:agent": [],
        "tag:vm": [],
      },
      // Deny-by-default when acls array is non-empty
      "acls": [
        {
          "action": "accept",
          "src": ["tag:agent"],
          "dst": ["tag:vm:22"],
        },
      ],
    }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: headscale
  namespace: headscale
  labels:
    app: headscale
spec:
  serviceName: headscale
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:0.28.0
          command: ["headscale", "serve"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
            - name: grpc
              containerPort: 50443
            - name: stun
              containerPort: 3478
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /var/lib/headscale
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
            - name: acl
              mountPath: /etc/headscale/acl.hujson
              subPath: acl.hujson
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: acl
          configMap:
            name: headscale-acl
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi

---
# ClusterIP service — exposed externally via Ingress
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: headscale
  labels:
    app: headscale
spec:
  type: ClusterIP
  selector:
    app: headscale
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: noise
      port: 443
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090

---
# NodePort for STUN (UDP — cannot go through HTTP Ingress)
apiVersion: v1
kind: Service
metadata:
  name: headscale-stun
  namespace: headscale
  labels:
    app: headscale
spec:
  type: NodePort
  selector:
    app: headscale
  ports:
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP

---
# Ingress — Tailscale clients connect here for coordination
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headscale-ingress
  namespace: headscale
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-dns-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - headscale.superhuman-remote-worker.com
      secretName: headscale-tls
  rules:
    - host: headscale.superhuman-remote-worker.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headscale
                port:
                  number: 8080
