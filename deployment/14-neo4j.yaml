apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srw-neo4j-data
  namespace: superhuman-remote-worker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-neo4j
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: srw-neo4j
  template:
    metadata:
      labels:
        app: srw-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7688
              name: bolt
          env:
            - name: NEO4J_AUTH
              value: "neo4j/CHANGE_ME"
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*"
            - name: NEO4J_dbms_security_procedures_allowlist
              value: "apoc.*"
            - name: NEO4J_server_bolt_listen__address
              value: ":7688"
            - name: NEO4J_server_bolt_advertised__address
              value: "bolt-neo4j.superhuman-remote-worker.com:7688"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: srw-neo4j-data
---
# ClusterIP for internal access (orchestrator, agents)
apiVersion: v1
kind: Service
metadata:
  name: srw-neo4j
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7688
      targetPort: 7688
  selector:
    app: srw-neo4j
---
# MetalLB LoadBalancer for Bolt access from home network
# Point internal DNS: bolt-neo4j.superhuman-remote-worker.com -> auto-assigned MetalLB IP
apiVersion: v1
kind: Service
metadata:
  name: srw-neo4j-lb
  namespace: superhuman-remote-worker
  annotations:
    svccontroller.k3s.cattle.io/enablelb: "false"
spec:
  type: LoadBalancer
  ports:
    - name: bolt
      port: 7688
      targetPort: 7688
      protocol: TCP
  selector:
    app: srw-neo4j
