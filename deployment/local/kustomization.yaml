# =============================================================================
# Kustomize overlay for local K3s development
# =============================================================================
#
# Deploys the full SRW stack to a local K3s cluster. Differences from production:
#   - No Fleet/GitOps (manual kubectl apply)
#   - No Vault/ESO (secrets from .env via create-secrets.sh)
#   - local-path storage instead of Longhorn
#   - No Headscale or NATS (single-cluster, no mesh VPN)
#   - No TLS ingress (services accessed via port-forward or NodePort)
#   - Simplified Neo4j (no TLS, no LoadBalancer)
#   - Single agent replica, no Tailscale sidecar
#   - VPN sidecars included (require credentials in .env)
#
# Usage:
#   ./deployment/local/create-secrets.sh    # One-time: create K8s secrets from .env
#   kubectl apply -k deployment/local/      # Deploy everything
#   kubectl delete -k deployment/local/     # Tear down
#
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: superhuman-remote-worker

# =============================================================================
# Image overrides — use locally built images instead of GHCR SHA tags
# =============================================================================
# Run `./deployment/local/dev-redeploy.sh` to build and import these images.
# Comment out this section to fall back to pulling from GHCR.
images:
  - name: ghcr.io/knaeckebrothero/superhuman-remote-worker-orchestrator
    newTag: local
  - name: ghcr.io/knaeckebrothero/superhuman-remote-worker-agent
    newTag: local
  - name: ghcr.io/knaeckebrothero/superhuman-remote-worker-cockpit
    newTag: local
  - name: ghcr.io/knaeckebrothero/superhuman-remote-worker-mcp
    newTag: local
  - name: ghcr.io/knaeckebrothero/superhuman-remote-worker-vpn
    newTag: local

resources:
  # --- Namespace ---
  - ../00-namespace.yaml

  # --- Databases ---
  - ../10-postgres.yaml
  - ../10b-postgres-vector.yaml
  - ../11-mongodb.yaml

  # --- Supporting services ---
  - ../12-gitea.yaml
  - ../13-workspace-pvc.yaml
  - ../18-keycloak.yaml
  - ../19-nextcloud.yaml
  - minio.yaml

  # --- Admin tools ---
  - ../16-pgadmin.yaml
  - ../17-mongo-express.yaml
  - ../24-dozzle.yaml
  - ../25-codex-proxy.yaml

  # --- RBAC & policies ---
  - ../20b-orchestrator-rbac.yaml
  - ../21b-agent-pdb.yaml
  - ../21d-workspace-network-policy.yaml

  # --- VPN sidecars (cluster, research, workstation) ---
  - ../15-vpn.yaml

  # --- Application services ---
  - ../20-orchestrator.yaml
  - ../21-agent.yaml
  - ../22-cockpit.yaml
  - ../23-mcp.yaml

  # --- Local replacements (not in base) ---
  - configmap.yaml
  - neo4j.yaml

# NOT included (production-only):
#   01-eso.yaml          — replaced by create-secrets.sh
#   02-configmap.yaml    — replaced by configmap.yaml above
#   03-reloader.yaml     — not needed locally
#   14-neo4j.yaml        — replaced by neo4j.yaml above
#   30-ingress.yaml      — use port-forward instead
#   40-headscale.yaml    — no mesh VPN locally
#   nats/                — no cross-cluster messaging locally

# =============================================================================
# Patches
# =============================================================================

patches:
  # --- Storage: longhorn -> local-path for all PVCs ---
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: local-path

  # --- Workspace PVC: ReadWriteMany -> ReadWriteOnce (local-path limitation) ---
  # Single-node K3s: both orchestrator and agent land on same node, RWO works fine
  - target:
      kind: PersistentVolumeClaim
      name: srw-workspace
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: ["ReadWriteOnce"]

  # --- Keycloak: local hostname, remove ProtonMail Bridge init containers ---
  - path: patches/keycloak.yaml

  # --- Gitea: local URLs ---
  - path: patches/gitea.yaml

  # --- Agent: remove Tailscale sidecar, single replica ---
  - path: patches/agent.yaml

  # --- Cockpit: local env.js URLs ---
  - path: patches/cockpit-env.yaml

  # --- Orchestrator: mount fixed schema.sql (workaround until image rebuild) ---
  - path: patches/orchestrator-schema.yaml

  # --- Orchestrator: imagePullPolicy ---
  - target:
      kind: Deployment
      name: srw-orchestrator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # --- Cockpit: imagePullPolicy ---
  - target:
      kind: Deployment
      name: srw-cockpit
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # --- Agent: imagePullPolicy ---
  - target:
      kind: Deployment
      name: srw-agent
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # --- MCP: imagePullPolicy ---
  - target:
      kind: Deployment
      name: srw-mcp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # --- VPN sidecars: imagePullPolicy ---
  - target:
      kind: Deployment
      name: srw-vpn-cluster
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: srw-vpn-research
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: srw-vpn-workstation
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # =========================================================================
  # NodePort patches — expose services on localhost for development
  # =========================================================================
  # Prerequisite: extend K3s NodePort range (one-time):
  #   echo 'kube-apiserver-arg:
  #     - "service-node-port-range=3000-32767"' | sudo tee /etc/rancher/k3s/config.yaml
  #   sudo systemctl restart k3s
  #
  # Services use the same ports as the existing localhost URLs in configmap,
  # cockpit-env, and Keycloak realm — no URL changes needed.
  # =========================================================================

  # --- Cockpit: localhost:4000 ---
  - target:
      kind: Service
      name: srw-cockpit
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 4000

  # --- Orchestrator API: localhost:8085 ---
  - target:
      kind: Service
      name: srw-orchestrator
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 8085

  # --- Keycloak SSO: localhost:8180 (container runs on 8080) ---
  - target:
      kind: Service
      name: srw-keycloak
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 8180

  # --- Gitea: localhost:3000 ---
  - target:
      kind: Service
      name: srw-gitea
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 3000

  # --- MCP: localhost:8055 ---
  - target:
      kind: Service
      name: srw-mcp
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 8055

  # --- PgAdmin: localhost:5050 ---
  - target:
      kind: Service
      name: srw-pgadmin
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 5050

  # --- Mongo Express: localhost:8081 ---
  - target:
      kind: Service
      name: srw-mongo-express
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 8081

  # --- Dozzle: localhost:9999 ---
  - target:
      kind: Service
      name: srw-dozzle
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 9999

  # --- Nextcloud: localhost:8800 (container runs on 80) ---
  - target:
      kind: Service
      name: srw-nextcloud
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 8800
