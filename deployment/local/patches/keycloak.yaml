# Keycloak local patch:
# - Change KC_HOSTNAME to localhost
# - Remove ProtonMail Bridge init containers (no bridge locally)
# - Remove bridge-cert volume and JAVA_OPTS_APPEND
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-keycloak
  namespace: superhuman-remote-worker
spec:
  template:
    spec:
      initContainers:
        # Keep wait-for-postgres, delete the bridge cert containers
        - name: extract-bridge-cert
          $patch: delete
        - name: import-bridge-cert
          $patch: delete
      containers:
        - name: keycloak
          env:
            - name: KC_HOSTNAME
              value: "http://localhost:8180"
            # Remove proxy headers (no reverse proxy locally)
            - name: KC_PROXY_HEADERS
              $patch: delete
            # Remove JVM truststore override (no bridge cert)
            - name: JAVA_OPTS_APPEND
              $patch: delete
          volumeMounts:
            # Remove bridge-cert mount
            - mountPath: /opt/keycloak/certs
              $patch: delete
      volumes:
        - name: bridge-cert
          $patch: delete
