# Agent local patch:
# - Single replica (no need for 2 locally)
# - Remove Tailscale sidecar (no mesh VPN locally)
# - Remove tailscale-state volume
# - imagePullPolicy: IfNotPresent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-agent
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: agent
          imagePullPolicy: IfNotPresent
        - name: tailscale
          $patch: delete
      volumes:
        - name: tailscale-state
          $patch: delete
