# Proton Mail Bridge — SMTP/IMAP for agent email (superhuman-remote-worker.com)
#
# Credentials (GPG keyring, password-store, bridge config) are stored as a
# base64 tarball in Vault at srw-secrets/PROTONMAIL_BRIDGE_CREDS.
# An init container unpacks them into an emptyDir before the bridge starts.
#
# To update credentials after re-authentication:
#   1. Run locally with Podman, authenticate, then:
#      tar czf /tmp/creds.tar.gz --exclude='S.gpg-agent*' -C /data .gnupg .password-store .config
#      base64 /tmp/creds.tar.gz > /tmp/creds.b64
#   2. Update Vault:
#      vault kv patch secret/homelab/superhuman-remote-worker/srw-secrets \
#        PROTONMAIL_BRIDGE_CREDS="$(cat /tmp/creds.b64)"
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-protonmail-bridge
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: srw-protonmail-bridge
  template:
    metadata:
      labels:
        app: srw-protonmail-bridge
    spec:
      initContainers:
        - name: unpack-creds
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              echo "$PROTONMAIL_BRIDGE_CREDS" | base64 -d | tar xzf - -C /data
              chown -R 1000:1000 /data
              chmod 700 /data/.gnupg
              echo "Bridge credentials unpacked"
          env:
            - name: PROTONMAIL_BRIDGE_CREDS
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: PROTONMAIL_BRIDGE_CREDS
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: protonmail-bridge
          image: knaeckebrothero/protonmail-bridge:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2143
              name: imap
              protocol: TCP
            - containerPort: 2025
              name: smtp
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 2143
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 2025
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: srw-protonmail-bridge
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 1143
      targetPort: 2143
      protocol: TCP
      name: imap
    - port: 1025
      targetPort: 2025
      protocol: TCP
      name: smtp
  selector:
    app: srw-protonmail-bridge
