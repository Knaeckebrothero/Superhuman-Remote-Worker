# Proton Mail Bridge — SMTP/IMAP for agent email (superhuman-remote-worker.com)
#
# Credentials persist on PVC (srw-protonmail-bridge-data). The bridge maintains
# its own OAuth refresh tokens on disk across pod restarts.
#
# First-time setup (or after PVC loss):
#   1. Wait for pod to start (entrypoint initializes GPG + pass store)
#   2. Login interactively:
#      kubectl exec -it -n superhuman-remote-worker deploy/srw-protonmail-bridge \
#        -- /bin/bash /entrypoint-override/entrypoint.sh cli
#      > login
#      > <email>
#      > <password>
#      > info           # note the SMTP/IMAP bridge password
#      > exit
#   3. Update Vault with the bridge password:
#      vault kv patch secret/homelab/superhuman-remote-worker/srw-secrets \
#        PROTON_BRIDGE_PASSWORD="<bridge-password-from-info>"
#   4. Restart consumers (Keycloak, orchestrator) to pick up new password.
#
# If the refresh token expires (password change, session revoke):
#   Repeat the login steps above — the PVC retains everything else.
#
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srw-protonmail-bridge-data
  namespace: superhuman-remote-worker
  labels:
    app: srw-protonmail-bridge
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# Entrypoint — initializes credential store on first run, then starts bridge + socat.
apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-protonmail-bridge-entrypoint
  namespace: superhuman-remote-worker
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e

    export HOME=/data
    export GNUPGHOME=/data/.gnupg
    export PASSWORD_STORE_DIR=/data/.password-store

    # Initialize GPG key and pass store on first run
    if [ ! -d "$GNUPGHOME" ]; then
        echo "First run: initializing credential store..."
        mkdir -p "$GNUPGHOME"
        chmod 700 "$GNUPGHOME"
        gpg --batch --passphrase '' --quick-gen-key 'ProtonMail Bridge' default default never
        KEY_ID=$(gpg --list-keys --with-colons 2>/dev/null | grep fpr | head -1 | cut -d: -f10)
        pass init "$KEY_ID"
        echo "Credential store initialized."
        echo ""
        echo "*** No account configured. Login manually: ***"
        echo "  kubectl exec -it -n superhuman-remote-worker deploy/srw-protonmail-bridge \\"
        echo "    -- /bin/bash /entrypoint-override/entrypoint.sh cli"
    fi

    # CLI mode (for manual login: kubectl exec ... -- /bin/bash /entrypoint-override/entrypoint.sh cli)
    if [ "${1}" = "cli" ]; then
        find /data -name "*.lock" -delete 2>/dev/null || true
        exec protonmail-bridge --cli
    fi

    # --- Start bridge ---
    cleanup() {
        kill "$BRIDGE_PID" 2>/dev/null
        wait "$BRIDGE_PID" 2>/dev/null
    }
    trap cleanup SIGTERM SIGINT

    protonmail-bridge --noninteractive &
    BRIDGE_PID=$!

    echo "Waiting for Proton Bridge to start..."
    for i in $(seq 1 30); do
        if ss -tlnp 2>/dev/null | grep -q ":1143"; then
            break
        fi
        if ! kill -0 "$BRIDGE_PID" 2>/dev/null; then
            echo "Bridge process exited unexpectedly."
            exit 1
        fi
        sleep 2
    done

    # Bridge only binds 127.0.0.1 — socat exposes on all interfaces
    socat TCP-LISTEN:2143,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:1143 &
    socat TCP-LISTEN:2025,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:1025 &

    echo "Proton Bridge ready."
    echo "  IMAP: 0.0.0.0:2143 -> 127.0.0.1:1143"
    echo "  SMTP: 0.0.0.0:2025 -> 127.0.0.1:1025"

    wait $BRIDGE_PID
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-protonmail-bridge
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: srw-protonmail-bridge
  template:
    metadata:
      labels:
        app: srw-protonmail-bridge
    spec:
      containers:
        - name: protonmail-bridge
          image: knaeckebrothero/protonmail-bridge:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "/entrypoint-override/entrypoint.sh"]
          ports:
            - containerPort: 2143
              name: imap
              protocol: TCP
            - containerPort: 2025
              name: smtp
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: entrypoint
              mountPath: /entrypoint-override
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 2143
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 2025
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: srw-protonmail-bridge-data
        - name: entrypoint
          configMap:
            name: srw-protonmail-bridge-entrypoint
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: srw-protonmail-bridge
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 1143
      targetPort: 2143
      protocol: TCP
      name: imap
    - port: 1025
      targetPort: 2025
      protocol: TCP
      name: smtp
  selector:
    app: srw-protonmail-bridge
