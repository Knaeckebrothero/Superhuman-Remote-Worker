# Temporary, explicit maintenance overlay for the 0185/0186 runtime-authority
# cutover. The drain used replicas: 0; this migration phase restores only the
# new orchestrator under the one-shot acknowledgement while the warm pool
# stays at zero until every writer runs post-0185 code.
orchestrator:
  replicas: 2
  runtimeAuthorityMigrationMaintenanceAck: true

agent:
  pool:
    minAgents: "0"
    buffer: "0"
