apiVersion: v1
kind: ServiceAccount
metadata:
  name: srw-reloader
  namespace: superhuman-remote-worker
  labels:
    app: srw-reloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: srw-reloader
  namespace: superhuman-remote-worker
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["list", "get", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list", "get", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: srw-reloader
  namespace: superhuman-remote-worker
subjects:
  - kind: ServiceAccount
    name: srw-reloader
    namespace: superhuman-remote-worker
roleRef:
  kind: Role
  name: srw-reloader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-reloader
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-reloader
  template:
    metadata:
      labels:
        app: srw-reloader
    spec:
      serviceAccountName: srw-reloader
      containers:
        - name: reloader
          image: stakater/reloader:v1.3.0
          args:
            - --namespaces-to-watch=superhuman-remote-worker
            - --reload-strategy=annotations
          ports:
            - containerPort: 9090
              name: metrics
          livenessProbe:
            httpGet:
              path: /live
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "256Mi"
              cpu: "100m"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
