# Keycloak SSO — Identity provider for all SRW services
#
# Secrets injected via env vars (Vault → ESO → srw-secrets):
#   GITEA_OIDC_CLIENT_SECRET, NEXTCLOUD_OIDC_CLIENT_SECRET,
#   OPENCLOUD_KEYCLOAK_CLIENT_SECRET, PGADMIN_OIDC_CLIENT_SECRET,
#   MCP_OIDC_CLIENT_SECRET, KC_REALM_ADMIN_PASSWORD, SMTP_PASSWORD
#
# The realm-export.json uses ${env.VAR} placeholders — Keycloak resolves
# them at import time from the container's environment.
#
# Post-deploy:
#   - OpenCloud clients are auto-created by the postStart hook (no manual step)
#   - Run docker/keycloak/setup-gitea-oidc.sh to configure Gitea as OIDC client
#   - Run docker/keycloak/setup-nextcloud-oidc.sh if deploying Nextcloud
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-keycloak-realm
  namespace: superhuman-remote-worker
data:
  srw-realm.json: |
    {
      "realm": "srw",
      "enabled": true,
      "displayName": "Superhuman Remote Worker",
      "displayNameHtml": "<strong>Superhuman Remote Worker</strong>",
      "registrationAllowed": true,
      "registrationEmailAsUsername": false,
      "verifyEmail": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "sslRequired": "none",
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 5,
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "Full system access, user management",
            "composite": false
          },
          {
            "name": "user",
            "description": "Standard access to cockpit, Gitea repos, own project files",
            "composite": false
          },
          {
            "name": "viewer",
            "description": "Read-only access for stakeholder dashboards",
            "composite": false
          }
        ]
      },
      "clients": [
        {
          "clientId": "cockpit",
          "name": "SRW Cockpit",
          "description": "Angular frontend (SPA, public client with PKCE)",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "http://localhost:4200/*",
            "http://localhost:4000/*",
            "https://superhuman-remote-worker.com/*"
          ],
          "webOrigins": [
            "http://localhost:4200",
            "http://localhost:4000",
            "https://superhuman-remote-worker.com"
          ],
          "protocol": "openid-connect",
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "http://localhost:4200/*##http://localhost:4000/*##https://superhuman-remote-worker.com/*"
          },
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "roles"
          ],
          "optionalClientScopes": [
            "offline_access"
          ],
          "protocolMappers": [
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "config": {
                "introspection.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "orchestrator-api",
          "name": "SRW Orchestrator API",
          "description": "FastAPI backend — validates tokens, never initiates login",
          "enabled": true,
          "bearerOnly": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "roles"
          ]
        },
        {
          "clientId": "gitea",
          "name": "Gitea",
          "description": "Git repository service (confidential client)",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "secret": "${env.GITEA_OIDC_CLIENT_SECRET}",
          "redirectUris": [
            "http://localhost:3000/user/oauth2/Keycloak/callback",
            "https://git.superhuman-remote-worker.com/user/oauth2/Keycloak/callback"
          ],
          "webOrigins": [
            "http://localhost:3000",
            "https://git.superhuman-remote-worker.com"
          ],
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "email",
            "groups"
          ],
          "protocolMappers": [
            {
              "name": "gitea-username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "given-name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "firstName",
                "claim.name": "given_name",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "family-name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "lastName",
                "claim.name": "family_name",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            }
          ]
        },
        {
          "clientId": "nextcloud",
          "name": "Nextcloud",
          "description": "Cloud storage",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "secret": "${env.NEXTCLOUD_OIDC_CLIENT_SECRET}",
          "redirectUris": [
            "http://localhost:8800/apps/user_oidc/code",
            "https://cloud.superhuman-remote-worker.com/apps/user_oidc/code"
          ],
          "webOrigins": [
            "http://localhost:8800",
            "https://cloud.superhuman-remote-worker.com"
          ],
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "groups"
          ]
        },
        {
          "clientId": "pgadmin",
          "name": "pgAdmin",
          "description": "Database administration UI (optional)",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "secret": "${env.PGADMIN_OIDC_CLIENT_SECRET}",
          "redirectUris": [
            "http://localhost:5050/oauth2/authorize",
            "https://pgadmin.superhuman-remote-worker.com/oauth2/authorize"
          ],
          "webOrigins": [
            "http://localhost:5050",
            "https://pgadmin.superhuman-remote-worker.com"
          ],
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "profile",
            "email"
          ]
        },
        {
          "clientId": "mcp-server",
          "name": "MCP OAuth Bridge",
          "description": "MCP server OAuth proxy — enables Claude.ai, ChatGPT, and other OAuth-based AI platforms to connect via OIDC",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "secret": "${env.MCP_OIDC_CLIENT_SECRET}",
          "redirectUris": [
            "http://localhost:8055/auth/callback",
            "https://mcp.superhuman-remote-worker.com/auth/callback"
          ],
          "webOrigins": [
            "http://localhost:8055",
            "https://mcp.superhuman-remote-worker.com"
          ],
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "openid",
            "profile",
            "email",
            "roles"
          ]
        }
      ],
      "users": [
        {
          "username": "test",
          "email": "admin@superhuman-remote-worker.com",
          "emailVerified": true,
          "enabled": true,
          "firstName": "Test",
          "lastName": "User",
          "attributes": {
            "gitea_username": ["srw-admin"]
          },
          "realmRoles": [
            "admin",
            "user",
            "default-roles-srw"
          ],
          "credentials": [
            {
              "type": "password",
              "value": "${env.KC_REALM_ADMIN_PASSWORD}",
              "temporary": false
            }
          ]
        }
      ],
      "scopeMappings": [
        {
          "clientScope": "roles",
          "roles": [
            "admin",
            "user",
            "viewer"
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "email",
          "protocol": "openid-connect",
          "description": "OpenID Connect built-in scope: email",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true",
            "consent.screen.text": "Your email address"
          },
          "protocolMappers": [
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "email",
                "claim.name": "email",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "email verified",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "emailVerified",
                "claim.name": "email_verified",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "boolean"
              }
            }
          ]
        },
        {
          "name": "roles",
          "protocol": "openid-connect",
          "description": "Realm and client role mappings",
          "attributes": {
            "include.in.token.scope": "false",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "realm roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "multivalued": "true",
                "claim.name": "realm_access.roles",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            },
            {
              "name": "client roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-client-role-mapper",
              "config": {
                "multivalued": "true",
                "claim.name": "resource_access.${client_id}.roles",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "jsonType.label": "String"
              }
            }
          ]
        },
        {
          "name": "groups",
          "protocol": "openid-connect",
          "description": "User group memberships for project access control",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true",
            "consent.screen.text": "Your group memberships"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            }
          ]
        }
      ],
      "smtpServer": {
        "host": "${env.SMTP_HOST}",
        "port": "1025",
        "from": "noreply@superhuman-remote-worker.com",
        "fromDisplayName": "Superhuman Remote Worker",
        "ssl": "false",
        "starttls": "true",
        "envelopeFrom": "noreply@superhuman-remote-worker.com",
        "auth": "true",
        "user": "${env.SMTP_USER}",
        "password": "${env.SMTP_PASSWORD}"
      },
      "internationalizationEnabled": false,
      "loginTheme": "keycloak",
      "accountTheme": "keycloak.v3"
    }
---
# Keycloak SSO — Deployment
#
# The 'keycloak' database must exist on srw-postgres. This is handled
# automatically by ensure_sso_databases() in orchestrator/init.py,
# or by init_sso_dbs.sh on fresh postgres starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-keycloak
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-keycloak
  template:
    metadata:
      labels:
        app: srw-keycloak
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z srw-postgres 5432; do sleep 2; done"]
        - name: extract-bridge-cert
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              apk add --no-cache openssl >/dev/null 2>&1
              echo "Waiting for ProtonMail Bridge SMTP..."
              for i in $(seq 1 30); do
                if echo | openssl s_client -starttls smtp \
                    -connect protonmail-bridge.protonmail-bridge.svc:1025 \
                    2>/dev/null | openssl x509 -outform PEM \
                    > /certs/bridge-cert.pem 2>/dev/null \
                  && [ -s /certs/bridge-cert.pem ]; then
                  echo "Bridge cert extracted."
                  exit 0
                fi
                sleep 2
              done
              echo "WARNING: Could not extract bridge cert — SMTP STARTTLS may fail."
          volumeMounts:
            - name: bridge-cert
              mountPath: /certs
        - name: import-bridge-cert
          image: quay.io/keycloak/keycloak:26.2
          command:
            - sh
            - -c
            - |
              cp /etc/pki/java/cacerts /certs/cacerts && chmod 644 /certs/cacerts
              if [ -s /certs/bridge-cert.pem ]; then
                keytool -importcert -noprompt -alias protonmail-bridge \
                  -file /certs/bridge-cert.pem -keystore /certs/cacerts \
                  -storepass changeit
                echo "Bridge cert imported into JVM truststore."
              else
                echo "No bridge cert found, using default truststore."
              fi
          volumeMounts:
            - name: bridge-cert
              mountPath: /certs
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.2
          args:
            - start-dev
            - --import-realm
            - --health-enabled=true
            - --tls-hostname-verifier=ANY
          ports:
            - containerPort: 8080
          env:
            # Database
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://srw-postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: KC_DB_PASSWORD
            # Hostname — must match what the browser sees
            - name: KC_HOSTNAME
              value: "https://auth.superhuman-remote-worker.com"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            # Trust ProtonMail Bridge self-signed cert for SMTP STARTTLS.
            # KC_TRUSTSTORE_PATHS only applies to Quarkus HTTP clients, not Jakarta Mail.
            # We override the JVM truststore with a copy that includes the bridge cert.
            # --tls-hostname-verifier=ANY makes DefaultEmailSenderProvider set
            # mail.smtp.ssl.checkserveridentity=false (fix from keycloak#28095),
            # so the cert CN=127.0.0.1 vs service hostname mismatch is ignored.
            - name: JAVA_OPTS_APPEND
              value: "-Djavax.net.ssl.trustStore=/opt/keycloak/certs/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
            # Admin credentials (Keycloak server admin)
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: KEYCLOAK_ADMIN_USER
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            # Realm import secrets (resolved via ${env.VAR} in realm JSON)
            - name: KC_REALM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: KC_REALM_ADMIN_PASSWORD
            - name: GITEA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: GITEA_OIDC_CLIENT_SECRET
            - name: NEXTCLOUD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: NEXTCLOUD_OIDC_CLIENT_SECRET
            - name: PGADMIN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: PGADMIN_OIDC_CLIENT_SECRET
            - name: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
                  optional: true
            - name: OPENCLOUD_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: srw-config
                  key: OPENCLOUD_PUBLIC_URL
                  optional: true
            - name: MCP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: MCP_OIDC_CLIENT_SECRET
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: srw-config
                  key: SMTP_HOST
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: SMTP_PASSWORD
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Sync OIDC client config from env vars into Keycloak DB.
                    # Realm import resolves ${env.VAR} only on first boot; if the
                    # realm already exists the placeholders are stored literally
                    # and protocol mapper configs can be empty. This hook runs on
                    # every start and ensures secrets + mappers are correct.
                    KC="/opt/keycloak/bin/kcadm.sh"
                    until (echo > /dev/tcp/localhost/9000) 2>/dev/null; do sleep 3; done
                    $KC config credentials --server http://localhost:8080 \
                      --realm master --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" 2>/dev/null || exit 0
                    # --- Set realm admin password ---
                    # ${env.VAR} substitution in realm import doesn't resolve for
                    # credentials, so set the password explicitly on every start.
                    $KC set-password -r srw --username test --new-password "$KC_REALM_ADMIN_PASSWORD" 2>/dev/null
                    # --- Sync client secrets ---
                    for pair in "gitea:$GITEA_OIDC_CLIENT_SECRET" \
                                "nextcloud:$NEXTCLOUD_OIDC_CLIENT_SECRET" \
                                "opencloud-orchestrator:$OPENCLOUD_KEYCLOAK_CLIENT_SECRET" \
                                "pgadmin:$PGADMIN_OIDC_CLIENT_SECRET" \
                                "mcp-server:$MCP_OIDC_CLIENT_SECRET"; do
                      CID="${pair%%:*}"; SEC="${pair#*:}"
                      [ -z "$SEC" ] && continue
                      ID=$($KC get clients -r srw -q "clientId=$CID" --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      [ -z "$ID" ] && continue
                      $KC update "clients/$ID" -r srw -s "secret=$SEC" 2>/dev/null
                    done
                    # --- Ensure OpenCloud clients + group ---
                    # Idempotent: creates only if missing. Mirrors setup-opencloud-client.sh.
                    if [ -n "$OPENCLOUD_KEYCLOAK_CLIENT_SECRET" ]; then
                      OC_URL="${OPENCLOUD_PUBLIC_URL:-https://cloud.superhuman-remote-worker.com}"
                      # opencloudAdmin group (role mapping for OpenCloud admin access)
                      OCGRP=$($KC get groups -r srw -q search=opencloudAdmin --fields id,name 2>/dev/null \
                        | grep -B1 '"opencloudAdmin"' | grep '"id"' | sed 's/.*"id" : "//;s/".*//' || true)
                      [ -z "$OCGRP" ] && OCGRP=$($KC create groups -r srw -s name=opencloudAdmin -i 2>/dev/null)
                      # opencloud-web (public client — browser OIDC login)
                      if ! $KC get clients -r srw -q clientId=opencloud-web 2>/dev/null | grep -q '"opencloud-web"'; then
                        $KC create clients -r srw \
                          -s clientId=opencloud-web -s name="OpenCloud Web" \
                          -s enabled=true -s publicClient=true -s standardFlowEnabled=true \
                          -s "redirectUris=[\"$OC_URL/*\"]" -s "webOrigins=[\"$OC_URL\"]" \
                          -s 'attributes={"pkce.code.challenge.method":"S256"}' 2>/dev/null
                      fi
                      # opencloud-orchestrator (service-account client)
                      OCID=$($KC get clients -r srw -q clientId=opencloud-orchestrator --fields id --format csv --noquotes 2>/dev/null | tail -1)
                      if [ -z "$OCID" ]; then
                        OCID=$($KC create clients -r srw \
                          -s clientId=opencloud-orchestrator -s name="OpenCloud Orchestrator" \
                          -s enabled=true -s publicClient=false \
                          -s standardFlowEnabled=false -s directAccessGrantsEnabled=false \
                          -s serviceAccountsEnabled=true -s "secret=$OPENCLOUD_KEYCLOAK_CLIENT_SECRET" -i 2>/dev/null)
                      fi
                      # Add service account to opencloudAdmin group + populate profile
                      if [ -n "$OCID" ] && [ -n "$OCGRP" ]; then
                        SAID=$($KC get "clients/$OCID/service-account-user" -r srw --fields id --format csv --noquotes 2>/dev/null | tail -1)
                        if [ -n "$SAID" ]; then
                          $KC update "users/$SAID/groups/$OCGRP" -r srw \
                            -s realm=srw -s userId="$SAID" -s groupId="$OCGRP" -n 2>/dev/null
                          $KC update "users/$SAID" -r srw \
                            -s firstName=OpenCloud -s lastName=Orchestrator -s email=orchestrator@srw.local 2>/dev/null
                        fi
                      fi
                      # Attach default client scopes (profile, email, groups + openid for web)
                      for CNAME in opencloud-orchestrator opencloud-web; do
                        CCID=$($KC get clients -r srw -q "clientId=$CNAME" --fields id --format csv --noquotes 2>/dev/null | tail -1)
                        [ -z "$CCID" ] && continue
                        SCOPES="profile email groups"
                        [ "$CNAME" = "opencloud-web" ] && SCOPES="openid profile email groups"
                        for SNAME in $SCOPES; do
                          SID=$($KC get client-scopes -r srw --fields id,name 2>/dev/null \
                            | grep -B1 "\"name\" : \"$SNAME\"" | grep '"id"' | head -1 | sed 's/.*"id" : "//;s/".*//' || true)
                          [ -n "$SID" ] && $KC update "clients/$CCID/default-client-scopes/$SID" -r srw 2>/dev/null
                        done
                      done
                    fi
                    # --- Ensure Gitea protocol mappers have config ---
                    # (realm import sometimes stores empty config objects)
                    GID=$($KC get clients -r srw -q clientId=gitea --fields id --format csv --noquotes 2>/dev/null | tail -1)
                    if [ -n "$GID" ]; then
                      ensure_mapper() {
                        NAME="$1"; ATTR="$2"; CLAIM="$3"; JTYPE="$4"
                        MID=$($KC get "clients/$GID/protocol-mappers/models" -r srw 2>/dev/null \
                          | grep -B1 "\"name\" : \"$NAME\"" | grep '"id"' | sed 's/.*: "//;s/".*//')
                        [ -n "$MID" ] && $KC delete "clients/$GID/protocol-mappers/models/$MID" -r srw 2>/dev/null
                        $KC create "clients/$GID/protocol-mappers/models" -r srw -f - 2>/dev/null <<MAPPER
                    {"name":"$NAME","protocol":"openid-connect","protocolMapper":"oidc-usermodel-attribute-mapper","config":{"user.attribute":"$ATTR","claim.name":"$CLAIM","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true","jsonType.label":"$JTYPE"}}
                    MAPPER
                      }
                      ensure_mapper "gitea-username" "username" "preferred_username" "String"
                      ensure_mapper "given-name" "firstName" "given_name" "String"
                      ensure_mapper "family-name" "lastName" "family_name" "String"
                    fi
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: bridge-cert
              mountPath: /opt/keycloak/certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: realm-import
          configMap:
            name: srw-keycloak-realm
        - name: bridge-cert
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: srw-keycloak
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: srw-keycloak
