# =============================================================================
# Local development overlay — GITIGNORED, contains credentials
# =============================================================================
# Purpose: run the production helm chart on a local k3d cluster.
# Only overrides what's genuinely different locally:
#   - Secrets (no Vault — chart-managed from this file)
#   - Domain (srw.localdev, not the real prod domain)
#   - TLS off (Stage 1; Stage 2 adds mkcert + cert-manager CAIssuer)
#   - Agent pool: no warm/buffer slots (spin up on demand, dev-only)
#   - Slightly trimmed resource limits (single-dev cluster, not serving 50 users)
#
# Install:
#   helm install srw ./helm -n srw --create-namespace -f deployment/values-local.yaml
# Upgrade after edits:
#   helm upgrade srw ./helm -n srw -f deployment/values-local.yaml
# =============================================================================

license:
  acceptTerms: true

fullnameOverride: srw

# No image overrides — cockpit/agent/mcp pull from GHCR `:latest`.
# When running with Tilt (`tilt up`), the orchestrator image is overridden
# by the Tiltfile via helm_resource's image_keys (see Tiltfile at repo root).
# When running standalone (`helm install` without Tilt), all four components
# pull from GHCR.
#
# If you need to pin to a locally-built image temporarily (e.g. GHCR :latest
# lags develop HEAD), uncomment the relevant block:
#
# image:
#   orchestrator: { repository: docker.io/library/srw-orchestrator, tag: local-fix, pullPolicy: IfNotPresent }
#   cockpit:      { repository: docker.io/library/srw-cockpit,      tag: local-fix, pullPolicy: IfNotPresent }
#   agent:        { repository: docker.io/library/srw-agent,        tag: local-fix, pullPolicy: IfNotPresent }

global:
  domain: "localhost"
  # imagePullSecrets:
  #   - name: ghcr-pull-secret   # uncomment if your GHCR packages are private

# -----------------------------------------------------------------------------
# Cockpit BFF — HTTPS via mkcert CAIssuer, cookies are Secure. Domain left
# empty = host-only cookies on `api.localhost`. Browsers reject `Domain=.localhost`
# as a "public suffix"-ish edge case; host-only works fine here because cockpit
# fetches the API with credentials:'include' which sends host-only cookies on
# cross-origin XHR to `api.localhost` anyway.
# -----------------------------------------------------------------------------
auth:
  bff:
    cookieSecure: "1"
    cookieDomain: ""
    # Same-origin path routing on the cockpit ingress. The cockpit and the
    # orchestrator BFF share an origin → the session cookie is first-party →
    # works in Brave/Firefox without disabling their 3rd-party cookie blockers.
    sameOriginApi: true
    # samesite=lax is enough now (same-origin); "none" was only needed when
    # the cockpit XHR'd cross-site to api.localhost.
    cookieSamesite: "lax"

# -----------------------------------------------------------------------------
# Secrets — chart-managed (dev only). APP_ENCRYPTION_KEY is set explicitly so
# encrypted DB data survives across `helm upgrade` cycles even if `lookup` misbehaves.
# Generated with: openssl rand -base64 32
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: false

secrets:
  create: true
  values:
    # --- Crypto root — DO NOT regenerate without re-seeding DBs ---
    APP_ENCRYPTION_KEY: "B9THPyad3JGXoycrYu4vn90FUogTP+URXFQxPQLB3CU="

    # --- LLM provider keys (fill in at least one for the agent to work) ---
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    GROQ_API_KEY: ""
    # OpenRouter gateway — serves the DeepSeek V4 family (deepseek-v4-pro /
    # deepseek-v4-flash) on Western infra. Add the provider key in Admin →
    # Providers (or paste it here for local), then register the two models in
    # Admin → Models with family "deepseek".
    OPENROUTER_API_KEY: ""

    # --- Web search (Tavily) — a search engine, not an LLM, so it is NOT
    # seeded into system_api_keys. It rides as a plain env var: this value
    # lands in the `srw` Secret and every agent pod picks it up via envFrom
    # (agent_provisioner.py). Get a key at https://app.tavily.com, paste it
    # below, then `helm upgrade`. See docs/api_key_resolution.md.
    TAVILY_API_KEY: "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"

    # --- App DBs ---
    POSTGRES_USER: "srw"
    POSTGRES_PASSWORD: "dev_pg_password"
    VECTOR_POSTGRES_USER: "srw"
    VECTOR_POSTGRES_PASSWORD: "dev_pgvector_password"
    NEO4J_USERNAME: "neo4j"
    NEO4J_PASSWORD: "dev_neo4j_password_noslash"

    # --- Keycloak ---
    KEYCLOAK_ADMIN_USER: "admin"
    KEYCLOAK_ADMIN_PASSWORD: "dev_kc_admin"
    KC_ADMIN_USER: "admin"
    KC_ADMIN_PASSWORD: "dev_kc_admin"
    KC_DB_PASSWORD: "dev_kc_db_password"
    # The Keycloak postStart hook sets the `test` user's password to this
    # value on every pod restart. Use "test" so devs can log in with test/test
    # straight after `helm install` with no further setup.
    KC_REALM_ADMIN_PASSWORD: "test"
    KC_CLIENT_SECRET: "dev_kc_client_secret"

    # --- Gitea admin (bootstrapped on first start) ---
    GITEA_ADMIN_USER: "srw-admin"
    GITEA_ADMIN_PASSWORD: "dev_gitea_admin"

    # --- OIDC client secrets — realm-export references ALL of these
    #     regardless of which services are enabled. Stubs required. ---
    GITEA_OIDC_CLIENT_SECRET: "dev_gitea_oidc_secret"
    NEXTCLOUD_OIDC_CLIENT_SECRET: "dev_nextcloud_oidc_secret"
    PGADMIN_OIDC_CLIENT_SECRET: "dev_pgadmin_oidc_secret"
    MCP_OIDC_CLIENT_SECRET: "dev_mcp_oidc_secret"
    OPENCLOUD_KEYCLOAK_CLIENT_SECRET: "dev_opencloud_oidc"

    # --- OpenCloud service account (agent's cloud user) ---
    CLOUD_SERVICE_USER: "agent"
    CLOUD_SERVICE_PASSWORD: "dev_cloud_password"

    # --- Nextcloud (main-cloud backend on local k3d — see nextcloud: block below) ---
    # Real values: the same Secret feeds both the Nextcloud pod (its setup hook
    # creates the agent-service user with NEXTCLOUD_AGENT_PASSWORD) and the
    # orchestrator (admin = OCS/groupfolders, agent = WebDAV). They MUST match.
    NEXTCLOUD_ADMIN_PASSWORD: "dev_nc_admin"
    NEXTCLOUD_AGENT_PASSWORD: "dev_nc_agent"
    # S3 keys unused while nextcloud.objectStore.enabled=false (filesystem on PVC).
    NEXTCLOUD_S3_ACCESS_KEY: "stub"
    NEXTCLOUD_S3_SECRET_KEY: "stub"

    # --- S3 (snapshot service — no real S3 yet, stubs) ---
    S3_ACCESS_KEY: "minioadmin"
    S3_SECRET_KEY: "minioadmin_secret"

    # --- Email (disabled but Keycloak references SMTP env vars unconditionally) ---
    SMTP_USER: "stub"
    SMTP_PASSWORD: "stub"
    IMAP_USER: "stub"
    IMAP_PASSWORD: "stub"

    # --- Notifications (disabled, stubs) ---
    DISCORD_WEBHOOK_URL: ""
    SLACK_WEBHOOK_URL: ""
    NTFY_TOKEN: ""

    # --- Default WebDAV datasource (off by default, stubs) ---
    DEFAULT_DS_WEBDAV_USERNAME: ""
    DEFAULT_DS_WEBDAV_PASSWORD: ""

    # --- Codex proxy (disabled, stub) ---
    CODEX_MANAGEMENT_KEY: "dev_codex_key"

    # --- Internal API keys ---
    MCP_INTERNAL_KEY: "dev_mcp_internal_key"

# -----------------------------------------------------------------------------
# Ingress — Stage 1: TLS off (access via port-forward). Stage 2 flips to true
# with `ingress.tls.issuerName: mkcert-issuer`.
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    issuerName: mkcert-issuer

# -----------------------------------------------------------------------------
# Agent pool — no warm/buffer slots. Agents spin up on demand only.
# Cap maxAgents so a runaway provisioner can't eat the dev box.
# -----------------------------------------------------------------------------
agent:
  # Phase D verification: apply DB config overrides (config_overrides table) to jobs.
  configDbOverridesEnabled: "true"
  pool:
    minAgents: "0"
    buffer: "0"
    reservedSessionSlots: "0"
    reservedJobSlots: "0"
    maxAgents: "3"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# -----------------------------------------------------------------------------
# Resource trims — only the components that meaningfully oversize for one dev
# Everything else keeps chart defaults.
# -----------------------------------------------------------------------------
orchestrator:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

databases:
  postgres:
    storageSize: "5Gi"
  vector:
    storageSize: "5Gi"
  mongodb:
    storageSize: "2Gi"
  neo4j:
    storageSize: "5Gi"
  keycloak:
    storageSize: "2Gi"

# -----------------------------------------------------------------------------
# Workspace PVC — single-node local-path is RWO-only, override the prod default
# -----------------------------------------------------------------------------
workspace:
  accessMode: "ReadWriteOnce"
  storageSize: "10Gi"
  networkPolicy:
    # In-cluster Traefik hairpin: OpenCloud's ocdav forwards uploads (tus
    # PATCH + plain PUT bodies) to the PUBLIC data-gateway URL
    # (https://cloud.localhost/data), which coredns-custom resolves to the
    # Traefik ClusterIP — inside the cluster-CIDR block the tier policies
    # deny. This rule re-allows exactly the Traefik pods (post-DNAT pod
    # ports: websecure=8443, web=8000). Pair with
    # opencloud.mountInsecureTls for the mkcert cert on that hop.
    extraEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
        ports:
          - protocol: TCP
            port: 8443
          - protocol: TCP
            port: 8000

cloud:
  workspaceDriver: "rclone_mount"

# -----------------------------------------------------------------------------
# Main cloud backend — Nextcloud (validating the prod-private Nextcloud path on
# k3d; see docs/issues/main_cloud.md Issue 15). OpenCloud is disabled below so
# the configmap selects MAIN_CLOUD_BACKEND=nextcloud and the orchestrator's
# NEXTCLOUD_* env block turns on. replicas:1 (chart default is 0).
# objectStore.enabled:false stores files on the PVC (no MinIO in k3d).
# Switch back to OpenCloud: nextcloud.enabled=false + drop opencloud.enabled.
# -----------------------------------------------------------------------------
nextcloud:
  enabled: true
  internal: true
  replicas: 1
  objectStore:
    enabled: false

# -----------------------------------------------------------------------------
# OpenCloud — DISABLED while validating Nextcloud (see above). Storage/OIDC
# settings kept so the switch-back is a one-line flip.
# OIDC needs split-DNS workaround: auth.localhost won't resolve from inside
# the pod (RFC 6761 says every container thinks `localhost` = its own loopback)
# so the proxy's verifier can't fetch JWKS. We hostAliases-map it to Traefik's
# ClusterIP and accept the mkcert-issued cert via oidcInsecureTls. Same wound
# as the customer's air-gapped server VLAN; this is the local-dev variant.
# Traefik's ClusterIP is stable for the life of the cluster — re-check after
# `k3d cluster delete && create`.
# -----------------------------------------------------------------------------
opencloud:
  # TEMP 2026-06-10: enabled for OpenCloud rclone-mount slice-1 validation
  # (feature doc Phase 6). configmap precedence picks opencloud over the
  # still-enabled nextcloud block. Flip back to false to restore nextcloud.
  enabled: true
  dataStorageSize: "64Gi"
  oidcInsecureTls: true
  # rclone mounts skip TLS verification on the public data-gateway hop
  # (mkcert cert) — local-only, pairs with workspace.networkPolicy.extraEgress.
  mountInsecureTls: true
  hostAliases:
    - ip: "10.43.239.6"
      hostnames:
        - "auth.localhost"

# -----------------------------------------------------------------------------
# Logging — verbose during local dev
# -----------------------------------------------------------------------------
logLevel: "DEBUG"

# -----------------------------------------------------------------------------
# Session router — direct-WS session endpoints. Without this, GET /connection
# 500s with NoneType .mint (session_tokens guarded behind SESSION_JWT_SECRET).
#   kubectl -n srw create secret generic srw-session-jwt \
#     --from-literal=jwt-secret="$(openssl rand -base64 48 | tr -d '\n' | head -c 64)"
# Then point this overlay at it. ingressHost: localhost so ws_url stays
# same-origin (matches the /p path rule in the cockpit ingress).
# -----------------------------------------------------------------------------
sessionRouter:
  jwtSecretName: "srw-session-jwt"
  jwtSecretKey: "jwt-secret"
  jwtTtlSeconds: 60
  ingressHost: "localhost"
  ingressClass: "traefik"
  # Reuse the cockpit's mkcert-issued TLS secret so per-session Ingresses
  # land on the same websecure entrypoint. Without this, session Ingresses
  # serve only on the HTTP port and the browser's wss:// fails handshake.
  tlsSecretName: "srw-cockpit-tls"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
