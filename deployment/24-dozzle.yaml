# Dozzle — Container log viewer (K8s mode, SRW namespace only)
#
# Captured from live cluster deployment on 2026-03-19.
# Includes RBAC (ServiceAccount + ClusterRole + ClusterRoleBinding),
# Deployment, Service, and Ingress.
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srw-dozzle
  namespace: superhuman-remote-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: srw-dozzle
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: srw-dozzle
subjects:
  - kind: ServiceAccount
    name: srw-dozzle
    namespace: superhuman-remote-worker
roleRef:
  kind: ClusterRole
  name: srw-dozzle
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-dozzle
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-dozzle
  template:
    metadata:
      labels:
        app: srw-dozzle
    spec:
      serviceAccountName: srw-dozzle
      containers:
        - name: dozzle
          image: amir20/dozzle:latest
          args:
            - --mode
            - k8s
            - --no-analytics
            - --namespace
            - superhuman-remote-worker
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: srw-dozzle
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 9999
      targetPort: 8080
  selector:
    app: srw-dozzle
