apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-mcp
  namespace: superhuman-remote-worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-mcp
  template:
    metadata:
      labels:
        app: srw-mcp
    spec:
      initContainers:
        - name: wait-for-orchestrator
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z srw-orchestrator 8085; do sleep 2; done"]
      containers:
        - name: mcp
          image: ghcr.io/knaeckebrothero/superhuman-remote-worker-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: COCKPIT_API_URL
              value: "http://srw-orchestrator:8085"
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8000"
            - name: MCP_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: MCP_INTERNAL_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: srw-mcp
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 8055
      targetPort: 8000
  selector:
    app: srw-mcp
