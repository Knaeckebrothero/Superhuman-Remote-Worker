apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-mcp
  namespace: superhuman-remote-worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-mcp
  template:
    metadata:
      labels:
        app: srw-mcp
    spec:
      initContainers:
        - name: wait-for-orchestrator
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z srw-orchestrator 8085; do sleep 2; done"]
      containers:
        - name: mcp
          image: ghcr.io/knaeckebrothero/superhuman-remote-worker-mcp:sha-63b4e66
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: COCKPIT_API_URL
              value: "http://srw-orchestrator:8085"
            - name: XDG_DATA_HOME
              value: "/tmp/.local/share"
            - name: MCP_TRANSPORT
              value: "http"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8000"
            - name: MCP_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: MCP_INTERNAL_KEY
            # OAuth bridge (optional — set MCP_OAUTH_ENABLED=true to activate)
            - name: MCP_OAUTH_ENABLED
              value: "true"
            - name: MCP_OIDC_CLIENT_ID
              value: "mcp-server"
            - name: MCP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: MCP_OIDC_CLIENT_SECRET
                  optional: true
            - name: MCP_OIDC_CONFIG_URL
              value: "http://srw-keycloak:8080/realms/srw/.well-known/openid-configuration"
            - name: MCP_BASE_URL
              value: "https://mcp.superhuman-remote-worker.com"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: srw-mcp
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 8055
      targetPort: 8000
  selector:
    app: srw-mcp
