# Nextcloud — WebDAV cloud storage for agent file operations
#
# Prerequisites:
#   The 'nextcloud' database must exist on srw-postgres. Handled automatically
#   by ensure_sso_databases() in orchestrator/init.py.
#
# OIDC:
#   Keycloak OIDC is configured automatically by the before-starting hook
#   (setup-oidc.sh from ConfigMap srw-nextcloud-hooks). Set NEXTCLOUD_OIDC_CLIENT_SECRET
#   in srw-secrets to enable. The hook is idempotent and runs on every container start.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-nextcloud-hooks
  namespace: superhuman-remote-worker
data:
  setup-oidc.sh: |
    #!/bin/bash
    # =============================================================================
    # Nextcloud OIDC auto-configuration (before-starting hook)
    # =============================================================================
    # Registers Keycloak as an OpenID Connect provider in Nextcloud.
    # Runs on every container start. Fully idempotent — skips if already configured.
    #
    # Required environment variables:
    #   NEXTCLOUD_OIDC_CLIENT_SECRET  — OIDC client secret (from Keycloak realm)
    #   NEXTCLOUD_OIDC_DISCOVERY_URI  — Keycloak OIDC discovery endpoint (internal)
    # =============================================================================
    # Non-fatal: OIDC setup failure must not prevent Nextcloud from starting
    set +e

    CLIENT_ID="${NEXTCLOUD_OIDC_CLIENT_ID:-nextcloud}"
    CLIENT_SECRET="${NEXTCLOUD_OIDC_CLIENT_SECRET:-}"
    DISCOVERY_URI="${NEXTCLOUD_OIDC_DISCOVERY_URI:-}"
    PROVIDER_NAME="${NEXTCLOUD_OIDC_PROVIDER_NAME:-Keycloak}"

    # Skip if not configured
    if [ -z "$CLIENT_SECRET" ] || [ -z "$DISCOVERY_URI" ]; then
        echo "[oidc-setup] NEXTCLOUD_OIDC_CLIENT_SECRET or DISCOVERY_URI not set, skipping"
        exit 0
    fi

    # Helper: run occ (entrypoint already runs hooks as www-data via run_as)
    occ() {
        php /var/www/html/occ "$@"
    }

    # Check if Nextcloud is installed (first-boot race: DB may not be ready yet)
    if ! occ status --output=json 2>/dev/null | grep -q '"installed":true'; then
        echo "[oidc-setup] Nextcloud not yet installed, skipping (will retry on next start)"
        exit 0
    fi

    # Step 1: Install user_oidc app (idempotent — fails silently if already installed)
    echo "[oidc-setup] Ensuring user_oidc app is installed..."
    occ app:install user_oidc 2>/dev/null || true

    # Step 2: Enable the app (idempotent)
    occ app:enable user_oidc 2>/dev/null || true

    # Step 3: Check if provider already exists
    if occ user_oidc:providers 2>/dev/null | grep -q "$PROVIDER_NAME"; then
        echo "[oidc-setup] OIDC provider '$PROVIDER_NAME' already configured"
        exit 0
    fi

    # Step 4: Register the provider
    # Command name varies by user_oidc version: try "provider" (v5+), fall back to "provider:create"
    echo "[oidc-setup] Registering OIDC provider '$PROVIDER_NAME'..."
    occ user_oidc:provider "$PROVIDER_NAME" \
        --clientid="$CLIENT_ID" \
        --clientsecret="$CLIENT_SECRET" \
        --discoveryuri="$DISCOVERY_URI" \
        --unique-uid=0 \
        --check-bearer=1 2>&1

    if [ $? -eq 0 ]; then
        echo "[oidc-setup] OIDC provider '$PROVIDER_NAME' registered successfully"
    else
        echo "[oidc-setup] WARNING: Failed to register OIDC provider (non-fatal)"
    fi
    exit 0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srw-nextcloud-data
  namespace: superhuman-remote-worker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-nextcloud
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-nextcloud
  template:
    metadata:
      labels:
        app: srw-nextcloud
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z srw-postgres 5432; do sleep 2; done"]
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z srw-keycloak 8080; do sleep 2; done"]
      containers:
        - name: nextcloud
          image: docker.io/library/nextcloud:31-apache
          ports:
            - containerPort: 80
          env:
            - name: NEXTCLOUD_ADMIN_USER
              value: "admin"
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: NEXTCLOUD_ADMIN_PASSWORD
            - name: POSTGRES_HOST
              value: "srw-postgres"
            - name: POSTGRES_DB
              value: "nextcloud"
            - name: POSTGRES_USER
              value: "nextcloud"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: NEXTCLOUD_DB_PASSWORD
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "srw-nextcloud cloud.superhuman-remote-worker.com"
            # S3 primary storage (existing cluster MinIO)
            - name: OBJECTSTORE_S3_BUCKET
              value: "srw-nextcloud"
            - name: OBJECTSTORE_S3_REGION
              value: "us-east-1"
            - name: OBJECTSTORE_S3_HOST
              value: "minio.minio.svc"
            - name: OBJECTSTORE_S3_PORT
              value: "9000"
            - name: OBJECTSTORE_S3_SSL
              value: "false"
            - name: OBJECTSTORE_S3_USEPATH_STYLE
              value: "true"
            - name: OBJECTSTORE_S3_AUTOCREATE
              value: "true"
            - name: OBJECTSTORE_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: NEXTCLOUD_S3_ACCESS_KEY
            - name: OBJECTSTORE_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: NEXTCLOUD_S3_SECRET_KEY
            # OIDC auto-configuration (used by before-starting hook)
            - name: NEXTCLOUD_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: NEXTCLOUD_OIDC_CLIENT_SECRET
                  optional: true
            - name: NEXTCLOUD_OIDC_DISCOVERY_URI
              value: "http://srw-keycloak:8080/realms/srw/.well-known/openid-configuration"
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: oidc-hook
              mountPath: /docker-entrypoint-hooks.d/before-starting/setup-oidc.sh
              subPath: setup-oidc.sh
              readOnly: true
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: "localhost"
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
              httpHeaders:
                - name: Host
                  value: "localhost"
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: srw-nextcloud-data
        - name: oidc-hook
          configMap:
            name: srw-nextcloud-hooks
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: srw-nextcloud
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: srw-nextcloud
