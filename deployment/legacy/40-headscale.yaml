# Headscale — Self-hosted Tailscale Coordination Server
#
# Provides mesh VPN connectivity between agent pods (main cluster) and
# KubeVirt VMs (agent cluster). Replaces NodePort-based SSH access.
#
# Deployed as a single-replica StatefulSet because Headscale uses SQLite
# (only supported backend — PostgreSQL is deprecated). Multiple replicas
# cause database corruption.
#
# Prerequisites:
#   - DNS record for headscale.superhuman-remote-worker.com (Cloudflare tunnel)
#
# After deployment, run the bootstrap job to create user + keys:
#   kubectl apply -f deployment/41-headscale-bootstrap.yaml
# Then store the generated keys in Vault (see bootstrap job comments).
#
# See docs/features/headscale_mesh.md for the full design.

---
apiVersion: v1
kind: Namespace
metadata:
  name: headscale
  labels:
    app.kubernetes.io/part-of: superhuman-remote-worker

---
# Headscale server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
data:
  config.yaml: |
    server_url: https://headscale.superhuman-remote-worker.com
    listen_addr: 0.0.0.0:8443
    tls_cert_path: /etc/headscale/tls/tls.crt
    tls_key_path: /etc/headscale/tls/tls.key
    metrics_listen_addr: 0.0.0.0:9090
    grpc_listen_addr: 0.0.0.0:50443
    private_key_path: /var/lib/headscale/private.key
    noise:
      private_key_path: /var/lib/headscale/noise_private.key
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
    derp:
      server:
        enabled: true
        region_id: 999
        region_code: "hs"
        region_name: "Headscale"
        private_key_path: /var/lib/headscale/derp_server_private.key
        stun_listen_addr: 0.0.0.0:3478
      # Disable global DERP map (clients can't reach derp*.tailscale.com)
      # Only the embedded DERP server above will be used
      urls: []
      paths: []
      auto_update_enabled: false
    ephemeral_node_inactivity_timeout: 30m
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
    dns:
      magic_dns: false
      override_local_dns: false
    policy:
      path: /etc/headscale/acl.hujson

---
# ACL policy — agents can SSH to VMs, nothing else
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-acl
  namespace: headscale
data:
  # HuJSON format (JSON with comments and trailing commas)
  acl.hujson: |
    {
      // Tag owners — empty arrays mean only pre-auth keys can assign these tags
      "tagOwners": {
        "tag:agent": [],
        "tag:vm": [],
      },
      // Deny-by-default when acls array is non-empty
      "acls": [
        {
          "action": "accept",
          "src": ["tag:agent"],
          "dst": ["tag:vm:22"],
        },
      ],
    }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: headscale
  namespace: headscale
  labels:
    app: headscale
spec:
  serviceName: headscale
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      containers:
        - name: headscale
          image: headscale/headscale:0.28.0
          command: ["headscale", "serve"]
          ports:
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9090
            - name: grpc
              containerPort: 50443
            - name: stun
              containerPort: 3478
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /var/lib/headscale
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
            - name: acl
              mountPath: /etc/headscale/acl.hujson
              subPath: acl.hujson
            - name: tls
              mountPath: /etc/headscale/tls
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: acl
          configMap:
            name: headscale-acl
        - name: tls
          secret:
            secretName: headscale-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi

---
# ClusterIP service — exposed externally via Ingress
apiVersion: v1
kind: Service
metadata:
  name: headscale
  namespace: headscale
  labels:
    app: headscale
spec:
  type: ClusterIP
  selector:
    app: headscale
  ports:
    - name: https
      port: 443
      targetPort: 8443
    - name: metrics
      port: 9090
      targetPort: 9090

---
# NodePort for STUN (UDP — cannot go through HTTP Ingress)
apiVersion: v1
kind: Service
metadata:
  name: headscale-stun
  namespace: headscale
  labels:
    app: headscale
spec:
  type: NodePort
  selector:
    app: headscale
  ports:
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP

---
# TLS certificate (cert-manager) — Headscale terminates TLS directly
# (not via Traefik) so DERP HTTP Upgrade works (requires HTTP/1.1,
# which Traefik's HTTP/2 ALPN negotiation breaks).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headscale-tls
  namespace: headscale
spec:
  secretName: headscale-tls
  issuerRef:
    name: cloudflare-dns-issuer
    kind: ClusterIssuer
  dnsNames:
    - headscale.superhuman-remote-worker.com

---
# TCP passthrough — Traefik routes by SNI without terminating TLS.
# Headscale handles TLS itself, serving HTTP/1.1 so DERP's
# "Upgrade: DERP" mechanism works for relay connections.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: headscale-passthrough
  namespace: headscale
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`headscale.superhuman-remote-worker.com`)
      services:
        - name: headscale
          port: 443
  tls:
    passthrough: true
