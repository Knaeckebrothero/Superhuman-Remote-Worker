apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: srw-agent-pdb
  namespace: superhuman-remote-worker
spec:
  # Set to 0 because agent pods are now dynamically provisioned (replicas: 0).
  # Restore to 1 if rolling back to static Deployment.
  minAvailable: 0
  selector:
    matchLabels:
      app: srw-agent
