apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srw-neo4j-data
  namespace: superhuman-remote-worker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# TLS certificate for Neo4j Bolt (cert-manager + Cloudflare DNS)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: srw-neo4j-bolt-tls
  namespace: superhuman-remote-worker
spec:
  secretName: srw-neo4j-bolt-tls
  issuerRef:
    name: cloudflare-dns-issuer
    kind: ClusterIssuer
  dnsNames:
    - bolt-neo4j.superhuman-remote-worker.com
  duration: 2160h    # 90 days
  renewBefore: 720h  # Renew 30 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-neo4j
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: srw-neo4j
  template:
    metadata:
      labels:
        app: srw-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7688
              name: bolt
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: NEO4J_AUTH
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_dbms_security_procedures_unrestricted
              value: "apoc.*"
            - name: NEO4J_dbms_security_procedures_allowlist
              value: "apoc.*"
            - name: NEO4J_server_bolt_listen__address
              value: ":7688"
            - name: NEO4J_server_bolt_advertised__address
              value: "bolt-neo4j.superhuman-remote-worker.com:7688"
            # TLS for Bolt — OPTIONAL allows both encrypted (browser) and unencrypted (internal)
            - name: NEO4J_server_bolt_tls__level
              value: "OPTIONAL"
            - name: NEO4J_dbms_ssl_policy_bolt_enabled
              value: "true"
            - name: NEO4J_dbms_ssl_policy_bolt_base__directory
              value: "/ssl/bolt"
            - name: NEO4J_dbms_ssl_policy_bolt_private__key
              value: "tls.key"
            - name: NEO4J_dbms_ssl_policy_bolt_public__certificate
              value: "tls.crt"
            - name: NEO4J_dbms_ssl_policy_bolt_client__auth
              value: "NONE"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: bolt-tls
              mountPath: /ssl/bolt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: srw-neo4j-data
        - name: bolt-tls
          secret:
            secretName: srw-neo4j-bolt-tls
---
# ClusterIP for internal access (orchestrator, agents)
apiVersion: v1
kind: Service
metadata:
  name: srw-neo4j
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7688
      targetPort: 7688
  selector:
    app: srw-neo4j
---
# MetalLB LoadBalancer for Bolt access from home network
# DNS: bolt-neo4j.superhuman-remote-worker.com -> 10.0.51.32
apiVersion: v1
kind: Service
metadata:
  name: srw-neo4j-lb
  namespace: superhuman-remote-worker
  annotations:
    svccontroller.k3s.cattle.io/enablelb: "false"
spec:
  type: LoadBalancer
  ports:
    - name: bolt
      port: 7688
      targetPort: 7688
      protocol: TCP
  selector:
    app: srw-neo4j
