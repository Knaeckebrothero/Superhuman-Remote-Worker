apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: srw-workspace-policy
  namespace: superhuman-remote-worker
spec:
  podSelector:
    matchLabels:
      srw.io/component: agent-workspace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # SSH + CDP from agent pods (RemoteBackend + browser automation)
    - from:
        - podSelector:
            matchLabels:
              app: srw-agent
        - podSelector:
            matchLabels:
              app: srw-persistent-agent
      ports:
        - protocol: TCP
          port: 22
        - protocol: TCP
          port: 9222
    # code-server from orchestrator (IDE session proxying)
    - from:
        - podSelector:
            matchLabels:
              app: srw-orchestrator
      ports:
        - protocol: TCP
          port: 8080
    # code-server via Traefik ingress (direct IDE access)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTP/HTTPS for browser automation (agent-controlled browsing via CDP)
    # and Tailscale DERP-relay fallback when UDP is blocked.
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Tailscale mesh — direct WireGuard peer + STUN (NAT discovery).
    - ports:
        - protocol: UDP
          port: 41641
        - protocol: UDP
          port: 3478
    # Gitea (workspace git repos)
    - to:
        - podSelector:
            matchLabels:
              app: srw-gitea
      ports:
        - protocol: TCP
          port: 3000
    # PostgreSQL (App DB — for datasource shell tools like psql)
    - to:
        - podSelector:
            matchLabels:
              app: srw-postgres
      ports:
        - protocol: TCP
          port: 5432
    # PostgreSQL (Vector DB)
    - to:
        - podSelector:
            matchLabels:
              app: srw-postgres-vector
      ports:
        - protocol: TCP
          port: 5432
    # Neo4j (for datasource shell tools)
    - to:
        - podSelector:
            matchLabels:
              app: srw-neo4j
      ports:
        - protocol: TCP
          port: 7688
    # MongoDB (for datasource shell tools)
    - to:
        - podSelector:
            matchLabels:
              app: srw-mongodb
      ports:
        - protocol: TCP
          port: 27017
    # No external internet — workspace containers are sandboxed
