# Cockpit web UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: srw-cockpit-ingress
  namespace: superhuman-remote-worker
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-dns-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - superhuman-remote-worker.com
      secretName: srw-cockpit-tls
  rules:
    - host: superhuman-remote-worker.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: srw-cockpit
                port:
                  number: 4000
---
# Orchestrator API (browser calls from cockpit)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: srw-api-ingress
  namespace: superhuman-remote-worker
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-dns-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: superhuman-remote-worker-srw-cors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.superhuman-remote-worker.com
      secretName: srw-api-tls
  rules:
    - host: api.superhuman-remote-worker.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
