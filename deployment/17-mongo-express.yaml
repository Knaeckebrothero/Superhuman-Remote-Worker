apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-mongo-express
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-mongo-express
  template:
    metadata:
      labels:
        app: srw-mongo-express
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z srw-mongodb 27017; do sleep 2; done"]
      containers:
        - name: mongo-express
          image: mongo-express:latest
          ports:
            - containerPort: 8081
          env:
            - name: ME_CONFIG_MONGODB_SERVER
              value: "srw-mongodb"
            - name: ME_CONFIG_BASICAUTH
              value: "false"
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: srw-mongo-express
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: srw-mongo-express
