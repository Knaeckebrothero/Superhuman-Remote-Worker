apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srw-postgres-data
  namespace: superhuman-remote-worker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# ConfigMap for SSO database initialization script.
# Only runs on first postgres start (docker-entrypoint-initdb.d/).
# For existing deployments, ensure_sso_databases() in orchestrator/init.py
# handles creating keycloak/nextcloud databases idempotently.
apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-postgres-init
  namespace: superhuman-remote-worker
data:
  init_sso_dbs.sh: |
    #!/bin/bash
    set -e
    echo "Creating SSO databases..."

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "postgres" \
         -v kc_pass="$KC_DB_PASSWORD" -v nc_pass="$NEXTCLOUD_DB_PASSWORD" <<-EOSQL
        DO \$\$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'keycloak') THEN
                CREATE ROLE keycloak WITH LOGIN PASSWORD :'kc_pass';
            END IF;
        END\$\$;
        SELECT 'CREATE DATABASE keycloak OWNER keycloak'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')
        \gexec

        DO \$\$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'nextcloud') THEN
                CREATE ROLE nextcloud WITH LOGIN PASSWORD :'nc_pass';
            END IF;
        END\$\$;
        SELECT 'CREATE DATABASE nextcloud OWNER nextcloud'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'nextcloud')
        \gexec
    EOSQL
    echo "  keycloak: ok"
    echo "  nextcloud: ok"
    echo "  nextcloud: ok"
    echo "SSO databases ready."
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: srw-postgres
  namespace: superhuman-remote-worker
spec:
  serviceName: srw-postgres
  replicas: 1
  selector:
    matchLabels:
      app: srw-postgres
  template:
    metadata:
      labels:
        app: srw-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: srw-config
                  key: POSTGRES_DB
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: KC_DB_PASSWORD
            - name: NEXTCLOUD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: NEXTCLOUD_DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/init_sso_dbs.sh
              subPath: init_sso_dbs.sh
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "srw"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "srw"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: srw-postgres-data
        - name: init-scripts
          configMap:
            name: srw-postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: srw-postgres
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: srw-postgres
