# VPN Cluster sidecar - routes LLM traffic to university GPU cluster
# Provides HTTP forward (port 8080) and SOCKS5 proxy (port 1080)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-vpn-cluster
  namespace: superhuman-remote-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-vpn-cluster
  template:
    metadata:
      labels:
        app: srw-vpn-cluster
    spec:
      containers:
        - name: vpn
          image: ghcr.io/knaeckebrothero/superhuman-remote-worker-vpn:latest
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: SOCKS_PORT
              value: "1080"
            - name: FORWARD_PORT
              value: "8080"
            - name: FORWARD_TARGET
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: VPN_CLUSTER_LLM_ENDPOINT
            - name: VPN_HOST
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: VPN_CLUSTER_HOST
            - name: VPN_PORT
              valueFrom:
                configMapKeyRef:
                  name: srw-config
                  key: VPN_CLUSTER_PORT
            - name: VPN_REALM
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: VPN_CLUSTER_REALM
            - name: VPN_USER
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: VPN_CLUSTER_USER
            - name: VPN_PASS
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: VPN_CLUSTER_PASS
            - name: VPN_TRUSTED_CERT
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: VPN_CLUSTER_TRUSTED_CERT
          volumeMounts:
            - name: dev-ppp
              mountPath: /dev/ppp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: dev-ppp
          hostPath:
            path: /dev/ppp
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: srw-vpn-cluster
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - name: http-forward
      port: 8080
      targetPort: 8080
    - name: socks
      port: 1080
      targetPort: 1080
  selector:
    app: srw-vpn-cluster
