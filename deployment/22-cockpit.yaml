apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-cockpit-env
  namespace: superhuman-remote-worker
data:
  env.js: |
    (function(window) {
      window['env'] = window['env'] || {};
      window['env']['apiUrl'] = 'https://api.superhuman-remote-worker.com/api';
      window['env']['giteaUrl'] = 'https://git.superhuman-remote-worker.com/srw';
      window['env']['dozzleUrl'] = 'https://dozzle.superhuman-remote-worker.com';
      window['env']['minioConsoleUrl'] = 'https://minio.superhuman-remote-worker.com';
      window['env']['neo4jUrl'] = 'https://neo4j.superhuman-remote-worker.com';
      window['env']['pgadminUrl'] = 'https://pgadmin.superhuman-remote-worker.com';
      window['env']['mongoExpressUrl'] = 'https://mongo.superhuman-remote-worker.com';
      window['env']['mcpUrl'] = 'https://mcp.superhuman-remote-worker.com/mcp';
      window['env']['cloudUrl'] = 'https://cloud.superhuman-remote-worker.com';

      // Keycloak SSO
      window['env']['keycloakUrl'] = 'https://auth.superhuman-remote-worker.com';
      window['env']['keycloakRealm'] = 'srw';
      window['env']['keycloakClientId'] = 'cockpit';

      // Available models (fallback — primary source is GET /api/models)
      window['env']['models'] = [
        { group: 'Local', models: ['openai/gpt-oss-120b'] },
        { group: 'OpenAI', models: ['gpt-5.4', 'codex/gpt-5.3-codex', 'codex/gpt-5.3-codex-spark'] },
        { group: 'Anthropic', models: ['claude-sonnet-4-5-20250929', 'claude-opus-4-6'] },
        { group: 'Google', models: ['gemini-2.5-pro', 'gemini-2.5-flash'] },
        { group: 'Groq', models: ['groq/moonshotai/kimi-k2-instruct-0905', 'groq/gpt-oss-120b'] },
        { group: 'OpenRouter', models: ['openrouter/minimax/minimax-m2.7'] },
      ];

      // Quick-select presets for strategic + tactical model combinations
      window['env']['modelPresets'] = [
        { label: 'Opus + Sonnet', strategic: 'claude-opus-4-6', tactical: 'claude-sonnet-4-5-20250929' },
        { label: 'Codex + Spark', strategic: 'codex/gpt-5.3-codex', tactical: 'codex/gpt-5.3-codex-spark' },
        { label: 'Gemini Pro + Flash', strategic: 'gemini-2.5-pro', tactical: 'gemini-2.5-flash' },
        { label: 'K2 + OSS 120B (Groq)', strategic: 'groq/moonshotai/kimi-k2-instruct-0905', tactical: 'groq/gpt-oss-120b' },
        { label: 'OSS 120B Local (both)', strategic: 'openai/gpt-oss-120b', tactical: 'openai/gpt-oss-120b' },
      ];

      // Models available in the instruction builder chat
      window['env']['builderModels'] = [
        { label: 'GPT OSS 120B (Local)', id: 'openai/gpt-oss-120b' },
        { label: 'MiniMax M2.7', id: 'openrouter/minimax/minimax-m2.7' },
        { label: 'GPT-5.4', id: 'gpt-5.4' },
        { label: 'Codex (coding)', id: 'codex/gpt-5.3-codex' },
        { label: 'Codex Spark (ultra-fast)', id: 'codex/gpt-5.3-codex-spark' },
        { label: 'Claude Opus 4.6', id: 'claude-opus-4-6' },
      ];
    })(this);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-cockpit
  namespace: superhuman-remote-worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-cockpit
  template:
    metadata:
      labels:
        app: srw-cockpit
    spec:
      initContainers:
        - name: wait-for-orchestrator
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z srw-orchestrator 8085; do sleep 2; done"]
      containers:
        - name: cockpit
          image: ghcr.io/knaeckebrothero/superhuman-remote-worker-cockpit:sha-b4af0b7
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: env-js
              mountPath: /usr/share/nginx/html/assets/env.js
              subPath: env.js
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: env-js
          configMap:
            name: srw-cockpit-env
---
apiVersion: v1
kind: Service
metadata:
  name: srw-cockpit
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: srw-cockpit
