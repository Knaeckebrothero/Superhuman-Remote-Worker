# =============================================================================
# Experimental cluster values (develop branch -> Fleet -> home cluster)
# =============================================================================
# CI updates the image tags on every push to `develop`. Fleet then rolls
# out the chart to the homelab cluster. This file is the single source of
# truth for cluster-specific config; the chart itself stays generic.
#
# To install manually (e.g. for local testing):
#   helm install srw ./helm -f ./deployment/values-experimental.yaml
#
# =============================================================================

license:
  acceptTerms: true
# Pin the chart fullname so service/resource names stay short (`srw-*`)
# regardless of how Fleet derives the Helm release name. Keeps DNS names
# under the 63-char label limit and matches the hostnames assumed in Vault.
fullnameOverride: srw
# Scope vm.lifecycle.* NATS subjects to this orchestrator. Must match the dev
# VM controller's `orchestratorId` (deployment-vms/srw-vm-controller/fleet.yaml).
# Without this, the helper falls back to fullnameOverride ("srw") which doesn't
# match the controller's "srw-dev" → publishes drop silently.
orchestratorId: srw-dev
# Connect to the shared homelab NATS hub (Fleet-managed in the HomeLab repo at
# deployments_managed/nats/). The hub bridges to leaf NATS instances on the
# vm cluster so VM lifecycle commands can flow cross-cluster.
nats:
  url: "nats://nats.nats.svc.cluster.local:4222"
global:
  # Canonical domain — flipped to srw.works 2026-07-05. The public app
  # (cockpit / api / auth / cloud / git / mcp) now lives under srw.works;
  # superhuman-remote-worker.com is kept routable (Cloudflare tunnel rules
  # retained) but the app canonicalizes to srw.works — the BFF session cookie,
  # KC_HOSTNAME/OIDC issuer, and SPA base URL are all single-valued, so any
  # login flow that starts on the old domain funnels to srw.works. This one
  # override propagates through the srw.* URL helpers to every ingress, the
  # cockpit env.js, CORS, the Keycloak client redirect URIs, and the cookie
  # domain (.srw.works). The apex superhuman-remote-worker.com stays the sales
  # landing page (deployed separately from the HomeLab repo,
  # deployments_managed/srw-sales-page — not from this chart).
  domain: "srw.works"
  # No imagePullSecrets — all images pulled by this chart are public
  # (SRW images on ghcr.io/knaeckebrothero/superhuman-remote-worker-* +
  # upstream Docker Hub for the admin UIs). Re-add a `ghcr-pull-secret`
  # entry here (and create the matching Secret in-namespace) only if a
  # package is ever flipped back to private.
  hostnames:
    cockpit: "cockpit.srw.works"
    # LAN-only admin UIs + cockpit deep-links stay on
    # superhuman-remote-worker.com. They are reached over the home network via
    # split-horizon MikroTik DNS (<name>.superhuman-remote-worker.com ->
    # 10.0.51.11) with existing cert-manager certs, and are deliberately NOT in
    # the Cloudflare tunnel. There are no srw.works CNAMEs for them, so letting
    # global.domain drag them to *.srw.works would leave them with neither LAN
    # DNS nor a tunnel rule — i.e. unreachable. Pin them back explicitly.
    neo4j: "neo4j.superhuman-remote-worker.com"
    neo4jBolt: "bolt-neo4j.superhuman-remote-worker.com"
    pgadmin: "pgadmin.superhuman-remote-worker.com"
    dozzle: "dozzle.superhuman-remote-worker.com"
    minio: "minio.superhuman-remote-worker.com"
# -----------------------------------------------------------------------------
# Image tags — updated by CI on every push to develop
# -----------------------------------------------------------------------------
image:
  orchestrator:
    tag: sha-4af6c4e
  agent:
    tag: sha-4af6c4e
  cockpit:
    tag: sha-4af6c4e
  mcp:
    tag: sha-2a71df3
  workspace:
    tag: sha-01bf2c9
# -----------------------------------------------------------------------------
# Orchestrator HA — M1 leader-election go-live
# (docs/operations/orchestrator_m1_go_live.md)
#
# replicas:2 is correctness-safe as of M1 (leader election + the dual-leader DB
# claim guards): the ~9 singleton background loops run only on the elected
# replica (session-scoped Postgres advisory lock 'SRW_LEAD'), and every
# non-idempotent path has a DB atomic-claim guard for the brief dual-leader
# window. pdb.minAvailable flips 0 -> 1 so one orchestrator keeps serving
# through a voluntary disruption while a single-pod node drain is still allowed.
# The chart default stays replicas:1 (helm/values.yaml); this dev overlay opts
# dev in first to soak before the default is bumped (Phase 5 / M4).
# -----------------------------------------------------------------------------
orchestrator:
  replicas: 2
  pdb:
    minAvailable: 1
# -----------------------------------------------------------------------------
# Secrets — External Secrets Operator (Vault-backed)
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef: "vault-backend"
  secretStoreKind: "ClusterSecretStore"
  vaultPath: "homelab/superhuman-remote-worker/srw-secrets"
  vmSshKeyVaultPath: "homelab/superhuman-remote-worker/vm-ssh-key"
# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    issuerName: cloudflare-dns-issuer
  cors:
    # superhuman-remote-worker.com is kept as a working alias through the
    # srw.works cutover. The canonical cockpit origin (cockpit.srw.works) is
    # always allowed; list the legacy origin here so the old cockpit host's
    # API/XHR calls to api.srw.works get a clean 401 (→ SPA redirects to login
    # on srw.works) instead of a CORS error. Merged into both the orchestrator
    # CORS_ORIGINS env and the Traefik CORS middleware allow-list.
    additionalOrigins:
      - "https://cockpit.superhuman-remote-worker.com"
# -----------------------------------------------------------------------------
# Admin UIs
# -----------------------------------------------------------------------------
pgadmin:
  enabled: true
mongoExpress:
  enabled: true
dozzle:
  enabled: true
codexProxy:
  enabled: true
  # Pinned to a concrete version (chart default is :latest); upstream ships
  # multiple builds/day. v7.1.30–39 carried the Codex identity-obfuscation fixes
  # that stop OpenAI invalidating the OAuth token after a handful of requests.
  # Bumped 2026-06-22 (v7.1.39 → v7.2.27): from 2026-06-19 the v7.1.39 harmony
  # parser stopped stripping gpt-5.x's tool-call tokens, leaking raw
  # `<|tool_call>…<tool_call|>` into chat/completions `content` (structured
  # tool_calls stayed correct). Verify after rollout: (1) codex auth still
  # survives >13 calls (no 401 storm), (2) leak gone. Revert this line if 401s return.
  # Bumped 2026-07-10 (v7.2.27 → v7.2.61): GPT-5.6 (Sol/Terra/Luna) model
  # registry landed v7.2.55 (GA day), Sol config revised v7.2.59, ultra effort
  # exposure v7.2.60 — v7.2.27 predates all of it, so gpt-5.6-* rows can't
  # resolve through the proxy. Verify after rollout: (1) codex auth survives
  # >13 calls (no 401 storm), (2) no raw `<|tool_call>` leak in chat content,
  # (3) a gpt-5.6-sol completion succeeds. Revert this line if 401s return.
  image: docker.io/eceasy/cli-proxy-api:v7.2.61
# -----------------------------------------------------------------------------
# Cloud storage — OpenCloud bundled (chart default)
# -----------------------------------------------------------------------------
opencloud:
  enabled: true
nextcloud:
  enabled: false
# -----------------------------------------------------------------------------
# S3 / MinIO — workspace snapshots + IDE session blobs. Credentials
# (S3_ACCESS_KEY / S3_SECRET_KEY) come from Vault via the srw-secrets path
# above. Only the non-secret endpoint URL belongs here; without it the
# snapshot service stays disabled and the workspace idle sweeper short-
# circuits, so stale `ws-thread-*` pods accumulate indefinitely.
# -----------------------------------------------------------------------------
s3:
  endpoint: "http://minio.minio.svc.cluster.local:9000"
# -----------------------------------------------------------------------------
# Virtual workspace tier (docs/features/no_workspace_agent_mode.md) — S3-backed
# file tools, no workspace pod. Enables the `virtual` backend; empty `rclone.type`
# would disable it (jobs fail fast). The agent's scoped key
# (VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID / _SECRET_ACCESS_KEY) is a *separate*,
# bucket-only MinIO key from the snapshot key, supplied from Vault (srw-secrets).
# Dedicated `srw-workspaces` bucket (distinct from snapshots' `srw-snapshots`);
# region/provider default to us-east-1/Minio (matches the snapshot store).
# -----------------------------------------------------------------------------
virtualWorkspace:
  rclone:
    type: s3
    root: srw-workspaces
  s3:
    endpoint: "http://minio.minio.svc.cluster.local:9000"
# -----------------------------------------------------------------------------
# Checkpointer — shared Postgres so worker jobs resume on any pod. Stores
# LangGraph state in the app DB, pruned on terminal. This now matches the chart
# default (postgres, flipped after the dev soak); kept explicit so the dev
# overlay documents its own posture.
# Docs: docs/done/cross_pod_resume_cold_starts_checkpoint_not_replicated.md
# -----------------------------------------------------------------------------
checkpointer:
  backend: "postgres"
# -----------------------------------------------------------------------------
# Databases — all internal (chart defaults), override here if you externalize
# -----------------------------------------------------------------------------
databases:
  # Neo4j graph-DB browser UI. Exposed via the chart's Traefik ingress
  # (neo4j.superhuman-remote-worker.com -> srw-neo4j:7474, TLS via
  # cloudflare-dns-issuer) on the home-network Traefik LB (10.0.51.11) ONLY —
  # deliberately kept OUT of the Cloudflare tunnel so the graph DB is reachable
  # from the LAN, not the public internet. Two coupled requirements:
  #   1. The srw-neo4j NetworkPolicy gains a `traefik`-namespace ingress
  #      carve-out for :7474 (helm/templates/databases/network-policies.yaml),
  #      because unlike pgAdmin/Mongo the neo4j pod is behind a NetworkPolicy.
  #   2. A split-horizon MikroTik DNS entry
  #      `neo4j.superhuman-remote-worker.com -> 10.0.51.11` is required — the
  #      public .com domain otherwise resolves to Cloudflare on the LAN.
  neo4j:
    browser:
      enabled: true
    # Bolt exposure so the Browser SPA can actually run queries, not just load
    # the page. The SPA (served over Traefik/HTTPS at neo4j.superhuman-remote-
    # worker.com) opens a wss Bolt connection back to the advertised host
    # bolt-neo4j.superhuman-remote-worker.com:7688 — which needs:
    #   - boltTls: a cert-manager cert so the connection is wss (an https page
    #     can't open an insecure ws), issued via cloudflare-dns-issuer (DNS-01).
    #   - loadBalancer: puts Bolt on a home MetalLB IP (10.0.51.33). Traefik
    #     HTTP ingress can't carry Bolt, so it needs its own L4 endpoint.
    #   - externalTrafficPolicy: Local + allowedClientCIDRs: opens 7688 in the
    #     srw-neo4j NetworkPolicy to the LAN only (the policy otherwise limits
    #     Bolt to orchestrator/agent). Local preserves the client IP so the
    #     ipBlock matches; Bolt stays auth-gated on top.
    # Requires a MikroTik DNS entry:
    #   bolt-neo4j.superhuman-remote-worker.com -> 10.0.51.33
    # (today that name wrongly resolves to prod-private's Bolt LB at .32).
    boltTls:
      enabled: true
      issuerName: cloudflare-dns-issuer
    loadBalancer:
      enabled: true
      ip: "10.0.51.33"
      externalTrafficPolicy: Local
      allowedClientCIDRs:
        - "192.168.178.0/24"
  # Audit store (srw-auditdb) — append-only observability tier. Bumped from the
  # chart default 10Gi to 32Gi after the 10Gi Longhorn volume filled 2026-07-07,
  # crashlooping auditdb ("No space left on device" on postmaster.pid) and
  # stalling the orchestrator's wait-for-auditdb init container -> Fleet NotReady.
  # The live PVC was expanded first (Longhorn online resize); this keeps git in
  # sync so a reconcile never tries to (illegally) shrink it back to 10Gi.
  # Retention still needs tightening so 32Gi doesn't just refill.
  audit:
    storageSize: "32Gi"
# Other DBs stay internal (chart defaults). Externalize here if needed:
#   postgres:
#     externalUrl: ""
#   vector:
#     externalUrl: ""
#   mongodb:
#     externalUrl: ""
#   neo4j:
#     externalUrl: ""

# -----------------------------------------------------------------------------
# Headscale — consumed as an external service. The headscale server is
# deployed out of band by the homelab Fleet bundle in
# HomeLab/deployments_managed/headscale/ (its own namespace, its own release
# lifecycle). We only need the URL here; the agent pre-auth key comes from
# Vault as TAILSCALE_AUTH_KEY in the srw secret.
# -----------------------------------------------------------------------------
headscale:
  url: "https://headscale.h4ll.app"
# Agent tailscale sidecar — joins the headscale tailnet for SSH to KubeVirt
# VMs. Disable to skip the sidecar entirely (e.g. when VM workspaces aren't
# in use or headscale is offline).
agent:
  # Apply admin-curated DB prompt overrides to provisioned agents. ON here
  # (dev/experimental) so the admin Prompt-overrides UI takes effect; the
  # chart default (helm/values.yaml) keeps this OFF for prod.
  configDbOverridesEnabled: "true"
  # DB-backed user experts (experts table) — ON in dev for the experts feature.
  expertsDbEnabled: "true"
  # DB-backed Agent Skills (skills + skill_files) — ON in dev for the skills feature.
  skillsDbEnabled: "true"
  # Protected cloud mode (RO-reader + capture overlay) — ON in dev.
  protectedCloudModeEnabled: "true"
  tailscale:
    enabled: true
# -----------------------------------------------------------------------------
# Workspace network policy — dev cluster lock-down
#
# Dev workspaces are intentionally restricted to public-internet egress only.
# The home LAN (192.168.178.0/24), service CIDR (10.43.0.0/16), and cluster
# host network (10.0.50.0/24) all stay in the `internet-only` tier's `except:`
# list (chart default) and are therefore unreachable from any dev workspace.
#
# `operatorHomeAllowedEmail` is pinned empty here so that even if the chart's
# default changes in a future release, the dev cluster does NOT auto-elevate
# any operator project to `home-allowed`. Home-LAN reachability is tested
# only on the private prod deployment (`srv-prod-private`), where the
# corresponding values file sets this to the operator's email.
#
# Tier flips on dev projects are still possible by admin action through the
# cockpit (admin-gated PATCH /api/projects/{id}), but that's intentional
# manual override, not policy default.
# -----------------------------------------------------------------------------
workspace:
  # PVC-backed job workspaces (Branch a) — ON for the homelab soak/validation.
  # Gives durable reattach + crash-recovery auto-resume + the single-replica
  # node-loss fallback. ephemeralStorageClass defaults to longhorn-ephemeral
  # (present on this cluster, single replica). Rollback = set false (new pods
  # revert to emptyDir; existing PVC pods finish + GC normally — mixed fleet is
  # safe). Capacity guard (resourceQuota) intentionally left default-off for the
  # soak. Node-loss validation runbook: tests/workspace_pvc_node_loss_validation.md.
  # Design: docs/features/workspace_pvc_branch_a_implementation.md.
  pvcEnabled: true
  networkPolicy:
    operatorHomeAllowedEmail: ""
# -----------------------------------------------------------------------------
# Email — routed through the shared ProtonMail Bridge in `protonmail-bridge` ns.
# SMTP_USER / SMTP_PASSWORD come from Vault (srw-secrets). The bridgeCert init
# container extracts the bridge's self-signed cert and adds it to Keycloak's
# JVM truststore so Jakarta Mail accepts the STARTTLS handshake.
# -----------------------------------------------------------------------------
email:
  enabled: true
  smtp:
    host: "protonmail-bridge.protonmail-bridge.svc"
    port: "1025"
    useTls: "true"
    trustSelfSigned: "true"
    from: "noreply@superhuman-remote-worker.com"
  domain: "superhuman-remote-worker.com"
keycloak:
  bridgeCert:
    enabled: true
    smtpHost: "protonmail-bridge.protonmail-bridge.svc"
# -----------------------------------------------------------------------------
# LLM config — actual keys are in the Vault-backed secret (srw-secrets).
# Only non-secret base URLs go here.
# -----------------------------------------------------------------------------
llm:
  baseUrl: ""
  browserBaseUrl: ""
  embeddingBaseUrl: ""
  codexBaseUrl: ""
  # ---------------------------------------------------------------------------
  # System LLM catalog seeding (orchestrator/seed/llm_config.py, run by the
  # post-install/post-upgrade `srw-llm-seed` Job). Insert-only + idempotent:
  # re-running against an already-seeded stack logs "skipped" per row and
  # exits 0, so admin-UI catalog edits survive every helm upgrade.
  #
  # Mistral AI is a FIRST-CLASS provider (provider_kind='system', provider slug
  # 'mistral'): the factory routes it through ReasoningChatOpenAI against
  # api.mistral.ai/v1 (OpenAI-compatible — see src/core/loader._create_mistral_llm),
  # so the catalog rows carry no baseUrl. The API key is NOT stored here — ESO
  # syncs the whole srw-secrets Vault bundle into the `srw` Secret, so add a
  # `MISTRAL_API_KEY` property to
  #   homelab/superhuman-remote-worker/srw-secrets
  # The seed Job derives SEED_MISTRAL_API_KEY from systemApiKeys.mistral below
  # and its pod fails to start if the key is absent, so add it to Vault BEFORE
  # this change syncs. (Provider seeding needs migration 0029, which the
  # orchestrator applies at startup before the seed Job's health gate passes.)
  #
  # Model ids use Mistral's `-latest` aliases (Magistral Medium omitted — it
  # deprecates 2026-07-31; reasoning now lives in Medium 3.5 via
  # reasoning_effort). Confirm the ids against
  #   curl -s https://api.mistral.ai/v1/models -H "Authorization: Bearer $KEY"
  # once the key is in Vault; pin to dated versions if you want reproducibility.
  # contextWindow is nominal for the Mistral 3 family (256k).
  # ---------------------------------------------------------------------------
  seed:
    enabled: true
    systemApiKeys:
      mistral:
        secretName: srw
        key: MISTRAL_API_KEY
    systemModels:
      - provider: mistral
        id: "mistral-large-latest"
        displayName: "Mistral Large 3"
        family: "mistral"
        contextWindow: 256000
        capability: chat
        multimodal: true
      - provider: mistral
        id: "mistral-medium-latest"
        displayName: "Mistral Medium 3.5"
        family: "mistral"
        contextWindow: 256000
        capability: chat
        multimodal: true
      - provider: mistral
        id: "mistral-small-latest"
        displayName: "Mistral Small 4"
        family: "mistral"
        contextWindow: 256000
        capability: chat
        multimodal: true
      - provider: mistral
        id: "codestral-latest"
        displayName: "Codestral"
        family: "mistral"
        contextWindow: 256000
        capability: chat
# -----------------------------------------------------------------------------
# Session router — Direct Session WebSockets
# (docs/features/direct_session_websockets.md)
#
# The HS256 signing key lives in the shared `srw` bundle Secret, populated by
# ESO from Vault under the key `SESSION_JWT_SECRET`. Leaving `jwtSecret` empty
# skips the chart's standalone Secret render (Layout B in helm/values.yaml).
# -----------------------------------------------------------------------------
sessionRouter:
  jwtSecret: ""
  jwtSecretName: srw
  jwtSecretKey: SESSION_JWT_SECRET
  # The cluster's `srw-api-ingress` (host api.*, path /, → orchestrator) is
  # older than any per-session Ingress, and Traefik's default precedence is
  # older-wins on host conflicts. Without an explicit priority bump, the
  # per-session route `/p/{tid}/ws` loses to the catch-all `/` and the WS
  # handshake ends up at the orchestrator (which 403s since the legacy proxy
  # is gone). A high priority value makes the more-specific path win.
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1000"
logLevel: "INFO"
logFormat: "json"
