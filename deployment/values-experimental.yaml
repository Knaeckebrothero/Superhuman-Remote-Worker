# =============================================================================
# Experimental cluster values (develop branch -> Fleet -> home cluster)
# =============================================================================
# CI updates the image tags on every push to `develop`. Fleet then rolls
# out the chart to the homelab cluster. This file is the single source of
# truth for cluster-specific config; the chart itself stays generic.
#
# To install manually (e.g. for local testing):
#   helm install srw ./helm -f ./deployment/values-experimental.yaml
#
# =============================================================================

license:
  acceptTerms: true
# Pin the chart fullname so service/resource names stay short (`srw-*`)
# regardless of how Fleet derives the Helm release name. Keeps DNS names
# under the 63-char label limit and matches the hostnames assumed in Vault.
fullnameOverride: srw
# Scope vm.lifecycle.* NATS subjects to this orchestrator. Must match the dev
# VM controller's `orchestratorId` (deployment-vms/srw-vm-controller/fleet.yaml).
# Without this, the helper falls back to fullnameOverride ("srw") which doesn't
# match the controller's "srw-dev" → publishes drop silently.
orchestratorId: srw-dev
# Connect to the shared homelab NATS hub (Fleet-managed in the HomeLab repo at
# deployments_managed/nats/). The hub bridges to leaf NATS instances on the
# vm cluster so VM lifecycle commands can flow cross-cluster.
nats:
  url: "nats://nats.nats.svc.cluster.local:4222"
global:
  domain: "superhuman-remote-worker.com"
  # No imagePullSecrets — all images pulled by this chart are public
  # (SRW images on ghcr.io/knaeckebrothero/superhuman-remote-worker-* +
  # upstream Docker Hub for the admin UIs). Re-add a `ghcr-pull-secret`
  # entry here (and create the matching Secret in-namespace) only if a
  # package is ever flipped back to private.
  hostnames:
    # Cockpit lives on the cockpit.* subdomain so the apex
    # (superhuman-remote-worker.com) is free for the sales landing page,
    # which is deployed separately from the HomeLab repo
    # (deployments_managed/srw-sales-page) — not from this chart. The
    # override propagates through srw.cockpitUrl to the cockpit ingress,
    # the env.js init, CORS allow-list, and the Keycloak bootstrap Job's
    # redirect URIs.
    cockpit: "cockpit.superhuman-remote-worker.com"
# -----------------------------------------------------------------------------
# Image tags — updated by CI on every push to develop
# -----------------------------------------------------------------------------
image:
  orchestrator:
    tag: sha-21b5ce8
  agent:
    tag: sha-21b5ce8
  cockpit:
    tag: sha-21b5ce8
  mcp:
    tag: sha-55ebd17
  workspace:
    tag: sha-c8f1b31
# -----------------------------------------------------------------------------
# Secrets — External Secrets Operator (Vault-backed)
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef: "vault-backend"
  secretStoreKind: "ClusterSecretStore"
  vaultPath: "homelab/superhuman-remote-worker/srw-secrets"
  vmSshKeyVaultPath: "homelab/superhuman-remote-worker/vm-ssh-key"
# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    issuerName: cloudflare-dns-issuer
# -----------------------------------------------------------------------------
# Admin UIs
# -----------------------------------------------------------------------------
pgadmin:
  enabled: true
mongoExpress:
  enabled: true
dozzle:
  enabled: true
codexProxy:
  enabled: true
  # Pinned (was chart-default :latest) to pick up the Codex identity-obfuscation
  # fixes (v7.1.30–39) that stop OpenAI invalidating the OAuth token after a
  # handful of requests. Bump deliberately; upstream ships multiple/day.
  image: docker.io/eceasy/cli-proxy-api:v7.1.39
# -----------------------------------------------------------------------------
# Cloud storage — OpenCloud bundled (chart default)
# -----------------------------------------------------------------------------
opencloud:
  enabled: true
nextcloud:
  enabled: false
# -----------------------------------------------------------------------------
# S3 / MinIO — workspace snapshots + IDE session blobs. Credentials
# (S3_ACCESS_KEY / S3_SECRET_KEY) come from Vault via the srw-secrets path
# above. Only the non-secret endpoint URL belongs here; without it the
# snapshot service stays disabled and the workspace idle sweeper short-
# circuits, so stale `ws-thread-*` pods accumulate indefinitely.
# -----------------------------------------------------------------------------
s3:
  endpoint: "http://minio.minio.svc.cluster.local:9000"
# -----------------------------------------------------------------------------
# Databases — all internal (chart defaults), override here if you externalize
# -----------------------------------------------------------------------------
# databases:
#   postgres:
#     externalUrl: ""
#   vector:
#     externalUrl: ""
#   mongodb:
#     externalUrl: ""
#   neo4j:
#     externalUrl: ""

# -----------------------------------------------------------------------------
# Headscale — consumed as an external service. The headscale server is
# deployed out of band by the homelab Fleet bundle in
# HomeLab/deployments_managed/headscale/ (its own namespace, its own release
# lifecycle). We only need the URL here; the agent pre-auth key comes from
# Vault as TAILSCALE_AUTH_KEY in the srw secret.
# -----------------------------------------------------------------------------
headscale:
  url: "https://headscale.h4ll.app"
# Agent tailscale sidecar — joins the headscale tailnet for SSH to KubeVirt
# VMs. Disable to skip the sidecar entirely (e.g. when VM workspaces aren't
# in use or headscale is offline).
agent:
  # Apply admin-curated DB prompt overrides to provisioned agents. ON here
  # (dev/experimental) so the admin Prompt-overrides UI takes effect; the
  # chart default (helm/values.yaml) keeps this OFF for prod.
  configDbOverridesEnabled: "true"
  tailscale:
    enabled: true
# -----------------------------------------------------------------------------
# Workspace network policy — dev cluster lock-down
#
# Dev workspaces are intentionally restricted to public-internet egress only.
# The home LAN (192.168.178.0/24), service CIDR (10.43.0.0/16), and cluster
# host network (10.0.50.0/24) all stay in the `internet-only` tier's `except:`
# list (chart default) and are therefore unreachable from any dev workspace.
#
# `operatorHomeAllowedEmail` is pinned empty here so that even if the chart's
# default changes in a future release, the dev cluster does NOT auto-elevate
# any operator project to `home-allowed`. Home-LAN reachability is tested
# only on the private prod deployment (`srv-prod-private`), where the
# corresponding values file sets this to the operator's email.
#
# Tier flips on dev projects are still possible by admin action through the
# cockpit (admin-gated PATCH /api/projects/{id}), but that's intentional
# manual override, not policy default.
# -----------------------------------------------------------------------------
workspace:
  networkPolicy:
    operatorHomeAllowedEmail: ""
# -----------------------------------------------------------------------------
# Email — routed through the shared ProtonMail Bridge in `protonmail-bridge` ns.
# SMTP_USER / SMTP_PASSWORD come from Vault (srw-secrets). The bridgeCert init
# container extracts the bridge's self-signed cert and adds it to Keycloak's
# JVM truststore so Jakarta Mail accepts the STARTTLS handshake.
# -----------------------------------------------------------------------------
email:
  enabled: true
  smtp:
    host: "protonmail-bridge.protonmail-bridge.svc"
    port: "1025"
    useTls: "true"
    trustSelfSigned: "true"
    from: "noreply@superhuman-remote-worker.com"
  domain: "superhuman-remote-worker.com"
keycloak:
  bridgeCert:
    enabled: true
    smtpHost: "protonmail-bridge.protonmail-bridge.svc"
# -----------------------------------------------------------------------------
# LLM config — actual keys are in the Vault-backed secret (srw-secrets).
# Only non-secret base URLs go here.
# -----------------------------------------------------------------------------
llm:
  baseUrl: ""
  browserBaseUrl: ""
  embeddingBaseUrl: ""
  codexBaseUrl: ""
# -----------------------------------------------------------------------------
# Session router — Direct Session WebSockets
# (docs/features/direct_session_websockets.md)
#
# The HS256 signing key lives in the shared `srw` bundle Secret, populated by
# ESO from Vault under the key `SESSION_JWT_SECRET`. Leaving `jwtSecret` empty
# skips the chart's standalone Secret render (Layout B in helm/values.yaml).
# -----------------------------------------------------------------------------
sessionRouter:
  jwtSecret: ""
  jwtSecretName: srw
  jwtSecretKey: SESSION_JWT_SECRET
  # The cluster's `srw-api-ingress` (host api.*, path /, → orchestrator) is
  # older than any per-session Ingress, and Traefik's default precedence is
  # older-wins on host conflicts. Without an explicit priority bump, the
  # per-session route `/p/{tid}/ws` loses to the catch-all `/` and the WS
  # handshake ends up at the orchestrator (which 403s since the legacy proxy
  # is gone). A high priority value makes the more-specific path win.
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1000"
logLevel: "INFO"
