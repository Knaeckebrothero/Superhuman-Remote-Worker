  components:
    orchestrator:
      sourceRevision: 1ed62e242fa0e321a97c174b993ddf463528d7b8
      releaseVersion: "0.0.0-dev.sha-1ed62e242fa0e321a97c174b993ddf463528d7b8"
    agent:
      sourceRevision: 1ed62e242fa0e321a97c174b993ddf463528d7b8
      releaseVersion: "0.0.0-dev.sha-1ed62e242fa0e321a97c174b993ddf463528d7b8"
    cockpit:
      sourceRevision: 1ed62e242fa0e321a97c174b993ddf463528d7b8
      releaseVersion: "0.0.0-dev.sha-1ed62e242fa0e321a97c174b993ddf463528d7b8"
    mcp:
      sourceRevision: 1ed62e242fa0e321a97c174b993ddf463528d7b8
