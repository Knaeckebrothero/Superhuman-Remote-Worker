# Production-like Fleet deployments must resolve MCP by immutable digest.
mcp:
  requireImageDigest: true
# -----------------------------------------------------------------------------
# Orchestrator HA — M1 leader-election go-live
# (knowledge-base/knowledge/operations/orchestrator_m1_go_live.md)
#
# replicas:2 is correctness-safe as of M1 (leader election + the dual-leader DB
# claim guards): the ~9 singleton background loops run only on the elected
# replica (session-scoped Postgres advisory lock 'SRW_LEAD'), and every
# non-idempotent path has a DB atomic-claim guard for the brief dual-leader
# window. pdb.minAvailable flips 0 -> 1 so one orchestrator keeps serving
# through a voluntary disruption while a single-pod node drain is still allowed.
# The chart default stays replicas:1 (helm/values.yaml); this dev overlay opts
# dev in first to soak before the default is bumped (Phase 5 / M4).
# -----------------------------------------------------------------------------
orchestrator:
  persistentAgentReconciliationEnabled: true
  replicas: 2
  pdb:
    minAvailable: 1
  # Gate 3 completion-command substrate ON for dev (chart default stays false).
  # Reports become durable command rows with effects-as-rows and a
  # leader-elected finalizer; `lifespan` additionally starts the finalizer and
  # the queued-age alarm, and the two admin unpark/force-resolve endpoints go
  # live. This is what makes §5.4.5 steps 2-5 real on dev — step 6 opened
  # worker admission but the first probe (job 00c3d898, 12 rotations) ran the
  # LEGACY completion path end to end, so none of that work was exercised and
  # `cmds=0` was a null reading rather than a pass.
  #
  # NOT lane-scoped, and that is the point worth remembering: the flag gates 67
  # sites across 34 functions and covers PINNED jobs too (main.py:13717), from
  # the completion path through dispatch/resume, the human control verbs, the
  # VM lifecycle and the autonomous status sweeps — including the project loop
  # and the officer's routed messages.
  #
  # The transition is incremental rather than big-bang: most of those sites add
  # `NOT EXISTS (job_completion_sweep_exclusions ...)` plus a completion-control
  # context guard, and both are no-ops while no command rows exist. At flip time
  # dev held 0 command rows, 0 exclusion rows, 0 processing and 0 created jobs —
  # nothing mid-execution — so divergence starts one job at a time as jobs
  # complete under the new path.
  #
  # Reorder stays OFF: `completionStatusReorderEnabled` hard-requires this flag
  # (helm/templates/configmap.yaml:5 fails the render otherwise), so it is a
  # separate, later decision rather than a free rider on this one.
  completionCommandsEnabled: true
# -----------------------------------------------------------------------------
# Infrastructure allocation metering — Slice 1 inventory-only soak
# -----------------------------------------------------------------------------
# The collector may inventory Pods but cannot publish usage while shadow and
# publication remain disabled. The stable identity must survive chart/image
# rotations. The ingestion Secret is operator-managed out of band so ESO does
# not overwrite it while syncing the main application Secret from Vault.
infrastructureMetering:
  v2ReadsEnabled: false
  sourceAwareReadsEnabled: false
  collectorEnabled: true
  shadowEnabled: false
  cutoverEnabled: false
  publicationEnabled: false
  pvcInventoryEnabled: false
  pvInventoryEnabled: false
  pvcShadowEnabled: false
  pvShadowEnabled: false
  pvcPublicationEnabled: false
  pvPublicationEnabled: false
  idePodShadowEnabled: false
  agentPodShadowEnabled: false
  idePodPublicationEnabled: false
  agentPodPublicationEnabled: false
  vmInventoryEnabled: false
  vmShadowEnabled: false
  vmPublicationEnabled: false
  vmPvcInventoryEnabled: false
  vmPvInventoryEnabled: false
  vmPvcShadowEnabled: false
  vmPvShadowEnabled: false
  vmPvcPublicationEnabled: false
  vmPvPublicationEnabled: false
  vmPvClusterWideRbacAcknowledged: false
  stableClusterId: "srw-main-dev"
  ingestionSecretName: "srw-infra-metering-ingestion"
  vmIngestionSecretName: "srw-infra-metering-vmi-ingestion"
  vmStorageIngestionSecretName: "srw-infra-metering-vm-storage-ingestion"
  volumeIdentitySecretName: "srw-infra-metering-volume-identity"
  volumeIdentityKeyVersion: "storage-v1"
  # Metering credentials will be selected from the existing SRW Vault bundle
  # into dedicated Kubernetes Secrets. Lifecycle authentication remains
  # intentionally unbound for this credential-only rollout because binding it
  # changes the active VM command protocol and must be coordinated separately.
  externalSecrets:
    enabled: true
    vaultPath: "homelab/superhuman-remote-worker/srw-secrets"
  networkPolicy:
    enabled: true
    allowUnrestrictedEgress: false
    apiServerCidrs:
      - "10.43.0.1/32"
      - "10.0.50.101/32"
      - "10.0.50.102/32"
      - "10.0.50.103/32"
# -----------------------------------------------------------------------------
# Secrets — External Secrets Operator (Vault-backed)
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef: "vault-backend"
  secretStoreKind: "ClusterSecretStore"
  vaultPath: "homelab/superhuman-remote-worker/srw-secrets"
  vmSshKeyVaultPath: "homelab/superhuman-remote-worker/vm-ssh-key"
# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    issuerName: cloudflare-dns-issuer
  cors:
    # superhuman-remote-worker.com is kept as a working alias through the
    # srw.works cutover. The canonical cockpit origin (cockpit.srw.works) is
    # always allowed; list the legacy origin here so the old cockpit host's
    # API/XHR calls to api.srw.works get a clean 401 (→ SPA redirects to login
    # on srw.works) instead of a CORS error. Merged into both the orchestrator
    # CORS_ORIGINS env and the Traefik CORS middleware allow-list.
    additionalOrigins:
      - "https://cockpit.superhuman-remote-worker.com"
# -----------------------------------------------------------------------------
# Dynamic Canvas live preview (dev-enabled 2026-07-16, development profile)
# -----------------------------------------------------------------------------
# srwcanvas.works is a dedicated user-content domain, separate from the trusted
# srw.works BFF/Keycloak cookie boundary. UUID origins live directly below the
# registered domain, making the effective-PSL boundary exact and keeping the
# public hostname contract to one `*.srwcanvas.works` wildcard:
#
#   https://<origin-generation>.srwcanvas.works
#
# The proxied `*.srwcanvas.works` DNS record, Cloudflare Universal SSL, and
# the cloudflared wildcard ingress rule to the gateway Service are live. The
# viewer runs the development/cookie-free posture for single-user dev
# acceptance; do NOT assert the PSL flag or return to the production profile
# until the exact `srwcanvas.works` private PSL rule has propagated and the
# production browser matrix passes. The restricted DB role is provisioned
# (2026-07-16) and its credential lives at the Vault path below.
# Transport decision (2026-07-14, knowledge-base/knowledge/issues/
# canvas_hosted_edge_use_cloudflare_tunnel.md): the wildcard rides the
# existing Cloudflare Tunnel to the gateway Service — Cloudflare's
# adjacent-slash normalization is an accepted, documented property of this
# edge, not a launch blocker. The former DNS-only/VPS/WireGuard/NGINX
# canvas-edge route is scrapped (HomeLab archive branch `canvas-edge-archive`).
# The gateway-specific database identity/config boundary is implemented. The
# Vault path may be declared while dark, but the chart does not render its
# ExternalSecret or contact the provider until viewer.enabled=true.
canvas:
  sharedBrowser:
    enabled: true
  livePreview:
    enabled: true
    deniedPorts: []
    viewer:
      enabled: true
      # Dev-cluster acceptance posture (2026-07-16): the development profile
      # with cookie-free proxying is the documented single-user testing mode —
      # it makes no production isolation claim. Flip back to
      # production/psl-isolated only after the PSL boundary is verified.
      deploymentProfile: development
      cookieMode: development-cookie-free
      domain: "srwcanvas.works"
      hostSuffix: ".srwcanvas.works"
      cockpitOrigins:
        - "https://cockpit.srw.works"
      pslBoundaryVerified: false
      database:
        username: "srw_canvas_gateway"
        credentials:
          create: false
          existingSecret: ""
          vaultPath: "homelab/superhuman-remote-worker/canvas-gateway-db"
          passwordKey: "CANVAS_VIEWER_POSTGRES_PASSWORD"
        provisionRole: false
        pool:
          min: 1
          max: 4
      networkPolicy:
        # The edge is the existing Cloudflare Tunnel connector: only the
        # cloudflared pods may reach the gateway on TCP/8086. Selectors are
        # inert while the viewer is disabled; pslBoundaryVerified stays false
        # until the public black-box gates pass.
        edgeNamespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cloudflare-tunnel
        edgePodSelector:
          matchLabels:
            app: cloudflared
        extraEgress: []
# -----------------------------------------------------------------------------
# Admin UIs
# -----------------------------------------------------------------------------
pgadmin:
  enabled: true
mongoExpress:
  enabled: true
dozzle:
  enabled: true
codexProxy:
  enabled: true
  # Pinned to a concrete version (chart default is :latest); upstream ships
  # multiple builds/day. v7.1.30–39 carried the Codex identity-obfuscation fixes
  # that stop OpenAI invalidating the OAuth token after a handful of requests.
  # Bumped 2026-06-22 (v7.1.39 → v7.2.27): from 2026-06-19 the v7.1.39 harmony
  # parser stopped stripping gpt-5.x's tool-call tokens, leaking raw
  # `<|tool_call>…<tool_call|>` into chat/completions `content` (structured
  # tool_calls stayed correct). Verify after rollout: (1) codex auth still
  # survives >13 calls (no 401 storm), (2) leak gone. Revert this line if 401s return.
  # Bumped 2026-07-10 (v7.2.27 → v7.2.61): GPT-5.6 (Sol/Terra/Luna) model
  # registry landed v7.2.55 (GA day), Sol config revised v7.2.59, ultra effort
  # exposure v7.2.60 — v7.2.27 predates all of it, so gpt-5.6-* rows can't
  # resolve through the proxy. Verify after rollout: (1) codex auth survives
  # >13 calls (no 401 storm), (2) no raw `<|tool_call>` leak in chat content,
  # (3) a gpt-5.6-sol completion succeeds. Revert this line if 401s return.
  #
  # 2026-07-30 -> v7.2.110: v7.2.61 (built 07-10) predates CLIProxyAPI#3055's
  # fix (09da52ad, 07-15), which stops a request-scoped 408 stream disconnect
  # from being charged to the CREDENTIAL — the cascade behind every
  # `503 auth_unavailable` freeze on this cluster (jobs d251e513, eb0143f8).
  # Verify after rollout: a 408 in the proxy log is NO LONGER followed by a run
  # of 503s (`/v0/management/auth-files` should stay status=active), and job
  # freezes stop carrying `auth_unavailable`. Note this jumps 49 releases.
  image: docker.io/eceasy/cli-proxy-api:v7.2.110
# -----------------------------------------------------------------------------
# Gitea metadata DB — migrating SQLite -> Postgres (2026-07-30).
#
# The sqlite3 pin is lifted so this cluster takes the chart default (postgres)
# and the bundled srw-giteadb is created. Gitea will REFUSE TO START until the
# data is migrated: the chart's preflight init container blocks a
# Postgres-configured Gitea whose metadata is still an un-migrated SQLite file,
# so the repos cannot be silently orphaned. Rollback is restoring this block.
# Procedure: knowledge-base/knowledge/operations/gitea_sqlite_to_postgres.md
# -----------------------------------------------------------------------------
gitea: {}
# -----------------------------------------------------------------------------
# Cloud storage — migrated OpenCloud -> Nextcloud 2026-08-02.
#
# Nextcloud is now the main cloud backend: the configmap selects
# MAIN_CLOUD_BACKEND=nextcloud, the orchestrator's NEXTCLOUD_* env block turns
# on, the Keycloak realm-import gains the `nextcloud` OIDC client, and
# cloud.srw.works moves from srw-opencloud:9200 to srw-nextcloud:80. The
# chart default is opencloud.enabled=true and BOTH the configmap backend
# selection and the cloud Ingress prefer opencloud, so the explicit `false`
# below must stay — dropping it silently reinstates OpenCloud.
#
# The old OpenCloud data/config PVCs carry `helm.sh/resource-policy: keep`,
# so disabling the flag does NOT reclaim them; they were deleted by hand
# after the data copy. Runbook: knowledge-base/knowledge/operations/opencloud_to_nextcloud.md
#
# replicas:1 — the chart default is 0 (the bundled Nextcloud is opt-in).
# objectStore:true puts user files in MinIO rather than on the PVC, matching
# how snapshots and virtual workspaces already store blobs on this cluster.
# The bucket (srw-nextcloud) and its bucket-scoped access key already exist on
# minio.minio.svc from an earlier bundled-Nextcloud run and are REUSED — the
# chart's OBJECTSTORE_S3_AUTOCREATE=true is therefore a no-op here. Requires
# NEXTCLOUD_S3_ACCESS_KEY + NEXTCLOUD_S3_SECRET_KEY in the srw Vault path —
# the pod hard-fails on a missing secretKeyRef, it does not fall back to the
# filesystem. The PVC below then only holds the Nextcloud install itself
# (webroot, config, apps), which is why 10Gi is left at the chart default.
#
# storageClass is pinned rather than left empty because this cluster has TWO
# StorageClasses flagged default (local-path and longhorn); an unqualified
# PVC resolves by creation timestamp, which is not something a new volume
# should depend on. Every other SRW PVC here is longhorn.
# -----------------------------------------------------------------------------
opencloud:
  enabled: false
nextcloud:
  enabled: true
  internal: true
  replicas: 1
  storageClass: "longhorn"
  objectStore:
    enabled: true
# -----------------------------------------------------------------------------
# S3 / MinIO — workspace snapshots + IDE session blobs. Credentials
# (S3_ACCESS_KEY / S3_SECRET_KEY) come from Vault via the srw-secrets path
# above. Only the non-secret endpoint URL belongs here; without it the
# snapshot service stays disabled and the workspace idle sweeper short-
# circuits, so stale `ws-thread-*` pods accumulate indefinitely.
# -----------------------------------------------------------------------------
s3:
  endpoint: "http://minio.minio.svc.cluster.local:9000"
# -----------------------------------------------------------------------------
# Virtual workspace tier (knowledge-base/knowledge/features/no_workspace_agent_mode.md) — S3-backed
# file tools, no workspace pod. Enables the `virtual` backend; empty `rclone.type`
# would disable it (jobs fail fast). The agent's scoped key
# (VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID / _SECRET_ACCESS_KEY) is a *separate*,
# bucket-only MinIO key from the snapshot key, supplied from Vault (srw-secrets).
# Dedicated `srw-workspaces` bucket (distinct from snapshots' `srw-snapshots`);
# region/provider default to us-east-1/Minio (matches the snapshot store).
# -----------------------------------------------------------------------------
virtualWorkspace:
  rclone:
    type: s3
    root: srw-workspaces
  s3:
    endpoint: "http://minio.minio.svc.cluster.local:9000"
# -----------------------------------------------------------------------------
# Checkpointer — shared Postgres so worker jobs resume on any pod. Stores
# LangGraph state in the app DB, pruned on terminal. This now matches the chart
# default (postgres, flipped after the dev soak); kept explicit so the dev
# overlay documents its own posture.
# Docs: knowledge-history/done/cross_pod_resume_cold_starts_checkpoint_not_replicated.md
# -----------------------------------------------------------------------------
checkpointer:
  backend: "postgres"
# -----------------------------------------------------------------------------
# Databases — all internal (chart defaults), override here if you externalize
# -----------------------------------------------------------------------------
databases:
  # Neo4j graph-DB browser UI. Exposed via the chart's Traefik ingress
  # (neo4j.superhuman-remote-worker.com -> srw-neo4j:7474, TLS via
  # cloudflare-dns-issuer) on the home-network Traefik LB (10.0.51.11) ONLY —
  # deliberately kept OUT of the Cloudflare tunnel so the graph DB is reachable
  # from the LAN, not the public internet. Two coupled requirements:
  #   1. The srw-neo4j NetworkPolicy gains a `traefik`-namespace ingress
  #      carve-out for :7474 (helm/templates/databases/network-policies.yaml),
  #      because unlike pgAdmin/Mongo the neo4j pod is behind a NetworkPolicy.
  #   2. A split-horizon MikroTik DNS entry
  #      `neo4j.superhuman-remote-worker.com -> 10.0.51.11` is required — the
  #      public .com domain otherwise resolves to Cloudflare on the LAN.
  neo4j:
    browser:
      enabled: true
    # Bolt exposure so the Browser SPA can actually run queries, not just load
    # the page. The SPA (served over Traefik/HTTPS at neo4j.superhuman-remote-
    # worker.com) opens a wss Bolt connection back to the advertised host
    # bolt-neo4j.superhuman-remote-worker.com:7688 — which needs:
    #   - boltTls: a cert-manager cert so the connection is wss (an https page
    #     can't open an insecure ws), issued via cloudflare-dns-issuer (DNS-01).
    #   - loadBalancer: puts Bolt on a home MetalLB IP (10.0.51.33). Traefik
    #     HTTP ingress can't carry Bolt, so it needs its own L4 endpoint.
    #   - externalTrafficPolicy: Local + allowedClientCIDRs: opens 7688 in the
    #     srw-neo4j NetworkPolicy to the LAN only (the policy otherwise limits
    #     Bolt to orchestrator/agent). Local preserves the client IP so the
    #     ipBlock matches; Bolt stays auth-gated on top.
    # Requires a MikroTik DNS entry:
    #   bolt-neo4j.superhuman-remote-worker.com -> 10.0.51.33
    # (today that name wrongly resolves to prod-private's Bolt LB at .32).
    boltTls:
      enabled: true
      issuerName: cloudflare-dns-issuer
    loadBalancer:
      enabled: true
      ip: "10.0.51.33"
      externalTrafficPolicy: Local
      allowedClientCIDRs:
        - "192.168.178.0/24"
  # Audit store (srw-auditdb) — append-only observability tier. Bumped from the
  # chart default 10Gi to 32Gi after the 10Gi Longhorn volume filled 2026-07-07,
  # crashlooping auditdb ("No space left on device" on postmaster.pid) and
  # stalling the orchestrator's wait-for-auditdb init container -> Fleet NotReady.
  # The live PVC was expanded first (Longhorn online resize); this keeps git in
  # sync so a reconcile never tries to (illegally) shrink it back to 10Gi.
  # Retention still needs tightening so 32Gi doesn't just refill.
  audit:
    storageSize: "32Gi"
  # Main postgres (srw-postgres) — same story as audit above, one env narrower.
  # The chart default stays 16Gi (right for a fresh/self-hosted install); only
  # this long-lived dev instance needs more. LangGraph checkpoint_blobs filled
  # the 16Gi volume, and refilled it within ~4 days after the first cleanup on
  # 2026-07-27. The live PVC was expanded to 32Gi (Longhorn online resize);
  # without this override Fleet reconciles git's 16Gi against a 32Gi volume and
  # every apply dies on "spec.resources.requests.storage: Forbidden: field can
  # not be less than status.capacity" (seen 2026-07-28, bundle ErrApplied).
  # A PVC can be grown but never shrunk, so git has to follow the volume.
  # Growth is bounded by the keep-N checkpoint sweeper
  # (orchestrator/services/checkpoint_retention.py) rather than by more disk.
  postgres:
    storageSize: "32Gi"
    # To externalize later, add externalUrl to THIS block — a second
    # `postgres:` key further down would silently shadow the storageSize
    # above and re-arm the shrink failure.
  # Vector store (srw-pgvector) — the same story a third time. The 16Gi volume
  # filled 2026-08-14 and crashlooped pgvector on "No space left on device"
  # writing pg_wal/xlogtemp during WAL recovery. That loop is unescapable
  # unaided: redo completes, the WAL write fails, the postmaster shuts down,
  # repeat. It took the whole knowledge base with it — kb_search/kb_read, the
  # project knowledge API (500s), and every reindex logging "Connection
  # refused" against a healthy embedding service.
  # This is BLOAT, not data volume: ~6.2k notes' chunks and embeddings are a
  # few hundred MB against 16Gi. The KB sweep reindexed an ARCHIVED project's
  # 3.1k notes every tick for over a month, churning rows faster than
  # autovacuum could reclaim them — see
  # knowledge-base/knowledge/issues/kb_sweep_indexes_archived_projects_and_starves_connectors.md.
  # So 32Gi buys headroom to recover and to VACUUM FULL; it is not the fix.
  # Without the sweep fix this refills, exactly as postgres did in ~4 days.
  vector:
    storageSize: "32Gi"
# Other DBs stay internal (chart defaults). Externalize here if needed.
# NOTE: `vector:` is a REAL key above — add externalUrl to that block rather
# than uncommenting a second one here, or it silently shadows the storageSize
# and re-arms the shrink failure (same trap as `postgres:`).
#   mongodb:
#     externalUrl: ""
#   neo4j:
#     externalUrl: ""

# -----------------------------------------------------------------------------
# Headscale — consumed as an external service. The headscale server is
# deployed out of band by the homelab Fleet bundle in
# HomeLab/deployments_managed/headscale/ (its own namespace, its own release
# lifecycle). We only need the URL here; the agent pre-auth key comes from
# Vault as TAILSCALE_AUTH_KEY in the srw secret.
# -----------------------------------------------------------------------------
headscale:
  url: "https://headscale.h4ll.app"
# Agent tailscale sidecar — joins the headscale tailnet for SSH to KubeVirt
# VMs. Disable to skip the sidecar entirely (e.g. when VM workspaces aren't
# in use or headscale is offline).
agent:
  # Stateless session lane ON for dev (chart default stays false): the
  # executor pool serves lite+sandbox session tiers via the run_queue —
  # the first live-traffic deployment of the lane, for the unmeasured
  # acceptance criteria (TTFT, claim-wait, prompt-cache reuse). VM/remote
  # tiers stay pinned/refused.
  stateless:
    enabled: true
    # Gate 3 step 6 (2026-08-16): worker-job admission OPEN on dev. This
    # opens a door, it does not move traffic — a job runs stateless only if
    # its create request asks for `execution_lane: stateless` AND the gate
    # validates it (in-cluster provisioner + Kubernetes sandbox workspace;
    # VM jobs are pinned by capability regardless). Every existing job,
    # every default-created job and everything the loop schedules stays
    # pinned until a lane default is chosen — which waits on Job Bench
    # numbers (§9 S3), not on this flag.
    #
    # Safe to open now because the whole worker-lane failure set is closed
    # in the images this overlay pins: the continue-frontier fix at the
    # source, the coded non-terminal 422 at accept with its driver release
    # contract, and the park-not-re-enqueue rescue for an ownerless
    # terminal-queue job (§9.1 "Worker wedge follow-ups").
    #
    # batchMinWallSeconds stays at the chart's 300 s production floor: dev
    # is where rotation economics get measured, so the rotation cadence must
    # be the real one, not k3d's 60 s acceptance value.
    worker:
      enabled: true
  # Apply admin-curated DB prompt overrides to provisioned agents. ON here
  # (dev/experimental) so the admin Prompt-overrides UI takes effect; the
  # chart default (helm/values.yaml) keeps this OFF for prod.
  configDbOverridesEnabled: "true"
  # DB-backed user experts (experts table) — ON in dev for the experts feature.
  expertsDbEnabled: "true"
  # DB-backed Agent Skills (skills + skill_files) — ON in dev for the skills feature.
  skillsDbEnabled: "true"
  # Project-scoped connector availability and creator auto-attach defaults.
  # Generic REST omission remains separately gated by datasourceDefaultsOnOmission.
  datasourceScopeAutoAttachV1Enabled: "true"
  # Protected cloud mode (RO-reader + capture overlay) — ON in dev.
  protectedCloudModeEnabled: "true"
  tailscale:
    enabled: true
# -----------------------------------------------------------------------------
# Workspace network policy — dev cluster lock-down
#
# Dev workspaces are intentionally restricted to public-internet egress only.
# The home LAN (192.168.178.0/24), service CIDR (10.43.0.0/16), and cluster
# host network (10.0.50.0/24) all stay in the `internet-only` tier's `except:`
# list (chart default) and are therefore unreachable from any dev workspace.
#
# `operatorHomeAllowedEmail` is pinned empty here so that even if the chart's
# default changes in a future release, the dev cluster does NOT auto-elevate
# any operator project to `home-allowed`. Home-LAN reachability is tested
# only on the private prod deployment (`srv-prod-private`), where the
# corresponding values file sets this to the operator's email.
#
# Tier flips on dev projects are still possible by admin action through the
# cockpit (admin-gated PATCH /api/projects/{id}), but that's intentional
# manual override, not policy default.
# -----------------------------------------------------------------------------
workspace:
  # PVC-backed workspaces (Branch a) — ON for the homelab soak/validation.
  # Gives durable reattach + crash-recovery auto-resume + the single-replica
  # node-loss fallback. ephemeralStorageClass defaults to longhorn-ephemeral
  # (present on this cluster, single replica). Rollback = set false (new pods
  # revert to emptyDir; existing PVC pods finish + GC normally — mixed fleet is
  # safe). Node-loss validation runbook: tests/workspace_pvc_node_loss_validation.md.
  # Design: knowledge-base/knowledge/features/workspace_pvc_branch_a_implementation.md.
  #
  # 2026-08-04: this flag now covers SESSIONS as well as jobs — a session claims
  # `pvc-ws-thread-*` for its workspace pod and `pvc-agent-s-*` for its agent
  # pod, and both are reclaimed only when the thread row is hard-deleted (an
  # `ended` thread is resumable and keeps its volumes). Session storage on this
  # cluster therefore grows with RETAINED THREADS, not with concurrency.
  # `resourceQuota` is still intentionally default-off here, which was a
  # low-risk call while only jobs held PVCs and self-reclaimed at terminal
  # status; with sessions in scope it means the accumulation is unbounded
  # against longhorn-ephemeral. Watch PVC count on this cluster and turn the
  # quota on (or prune threads) before the soak becomes the capacity incident.
  pvcEnabled: true
  networkPolicy:
    operatorHomeAllowedEmail: ""
# -----------------------------------------------------------------------------
# Email — routed through the shared ProtonMail Bridge in `protonmail-bridge` ns.
# SMTP_USER / SMTP_PASSWORD come from Vault (srw-secrets). The bridgeCert init
# container extracts the bridge's self-signed cert and adds it to Keycloak's
# JVM truststore so Jakarta Mail accepts the STARTTLS handshake.
# -----------------------------------------------------------------------------
email:
  enabled: true
  smtp:
    host: "protonmail-bridge.protonmail-bridge.svc"
    port: "1025"
    useTls: "true"
    trustSelfSigned: "true"
    from: "noreply@superhuman-remote-worker.com"
  domain: "superhuman-remote-worker.com"
keycloak:
  # HA — 2 replicas (2026-07-30). Safe because the chart runs Keycloak in
  # production mode: the Infinispan cluster discovers peers through
  # srw-keycloakdb via jdbc-ping (no headless Service, no new infra) and user
  # sessions persist to that database instead of living in each pod's memory.
  # Verified on k3d: both pods join a single cluster view, and a live session
  # plus its token refresh survived deleting either pod in turn.
  #
  # The chart default stays 1 because a FRESH install would run --import-realm
  # on both replicas at once against an empty database. This realm already
  # exists, so there is no import to race — the same reasoning that lets
  # orchestrator run replicas:2 here ahead of the chart default.
  replicas: 2
  bridgeCert:
    enabled: true
    smtpHost: "protonmail-bridge.protonmail-bridge.svc"
# -----------------------------------------------------------------------------
# LLM config — actual keys are in the Vault-backed secret (srw-secrets).
# Only non-secret base URLs go here.
# -----------------------------------------------------------------------------
llm:
  baseUrl: ""
  browserBaseUrl: ""
  embeddingBaseUrl: ""
  codexBaseUrl: ""
  # ---------------------------------------------------------------------------
  # System LLM catalog seeding (orchestrator/seed/llm_config.py, run by the
  # post-install/post-upgrade `srw-llm-seed` Job). Insert-only + idempotent:
  # re-running against an already-seeded stack logs "skipped" per row and
  # exits 0, so admin-UI catalog edits survive every helm upgrade.
  #
  # Mistral AI is a FIRST-CLASS provider (provider_kind='system', provider slug
  # 'mistral'): the factory routes it through ReasoningChatOpenAI against
  # api.mistral.ai/v1 (OpenAI-compatible — see src/core/loader._create_mistral_llm),
  # so the catalog rows carry no baseUrl. The API key is NOT stored here — ESO
  # syncs the whole srw-secrets Vault bundle into the `srw` Secret, so add a
  # `MISTRAL_API_KEY` property to
  #   homelab/superhuman-remote-worker/srw-secrets
  # The seed Job derives SEED_MISTRAL_API_KEY from systemApiKeys.mistral below
  # and its pod fails to start if the key is absent, so add it to Vault BEFORE
  # this change syncs. (Provider seeding needs migration 0029, which the
  # orchestrator applies at startup before the seed Job's health gate passes.)
  #
  # Model ids use Mistral's `-latest` aliases (Magistral Medium omitted — it
  # deprecates 2026-07-31; reasoning now lives in Medium 3.5 via
  # reasoning_effort). Confirm the ids against
  #   curl -s https://api.mistral.ai/v1/models -H "Authorization: Bearer $KEY"
  # once the key is in Vault; pin to dated versions if you want reproducibility.
  # contextWindow is nominal for the Mistral 3 family (256k).
  # ---------------------------------------------------------------------------
  seed:
    enabled: true
    systemApiKeys:
      mistral:
        secretName: srw
        key: MISTRAL_API_KEY
    systemModels:
      - provider: mistral
        id: "mistral-large-latest"
        displayName: "Mistral Large 3"
        family: "mistral"
        contextWindow: 256000
        capability: chat
        multimodal: true
      - provider: mistral
        id: "mistral-medium-latest"
        displayName: "Mistral Medium 3.5"
        family: "mistral"
        contextWindow: 256000
        capability: chat
        multimodal: true
      - provider: mistral
        id: "mistral-small-latest"
        displayName: "Mistral Small 4"
        family: "mistral"
        contextWindow: 256000
        capability: chat
        multimodal: true
      - provider: mistral
        id: "codestral-latest"
        displayName: "Codestral"
        family: "mistral"
        contextWindow: 256000
        capability: chat
# -----------------------------------------------------------------------------
# Session router — Direct Session WebSockets
# (knowledge-base/knowledge/features/direct_session_websockets.md)
#
# The HS256 signing key lives in the shared `srw` bundle Secret, populated by
# ESO from Vault under the key `SESSION_JWT_SECRET`. Leaving `jwtSecret` empty
# skips the chart's standalone Secret render (Layout B in helm/values.yaml).
# -----------------------------------------------------------------------------
sessionRouter:
  jwtSecret: ""
  jwtSecretName: srw
  jwtSecretKey: SESSION_JWT_SECRET
  # The cluster's `srw-api-ingress` (host api.*, path /, → orchestrator) is
  # older than any per-session Ingress, and Traefik's default precedence is
  # older-wins on host conflicts. Without an explicit priority bump, the
  # per-session route `/p/{tid}/ws` loses to the catch-all `/` and the WS
  # handshake ends up at the orchestrator (which 403s since the legacy proxy
  # is gone). A high priority value makes the more-specific path win.
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1000"
logLevel: "INFO"
logFormat: "json"
# -----------------------------------------------------------------------------
# Persistent VM rootdisks — the ORCHESTRATOR's copy of the flag
# (knowledge-base/knowledge/features/vm_persistent_rootdisk.md).
#
# This does NOT deploy an in-cluster vm-controller (vmController.enabled stays
# false — dev's controller lives on the vm cluster, configured in
# deployment-vms/srw-vm-controller/fleet.yaml). It only renders
# VM_PERSISTENT_ROOTDISK into the orchestrator's ConfigMap.
#
# What the orchestrator uses it for: deciding whether a VM workspace survives a
# teardown, and therefore whether VM suspend may proceed WITHOUT a snapshot.
# For VM targets a snapshot can never be captured from the orchestrator (it
# SSHes, and a VM workspace is only reachable over the tailnet), which is why
# VM sessions and VM jobs never idle-suspended at all — see
# knowledge-base/knowledge/issues/vm_workspace_snapshot_unreachable_from_orchestrator.md.
#
# MUST NOT be enabled before the vm-cluster controller has it: with the disk
# still cascade-deleting, suspend would tear a workspace down believing the
# files survive. Controller was enabled and live-gated first (steps 1-3 passed
# 2026-07-29, run log in
# knowledge-base/knowledge/features/vm_workspace_persistence_reconciliation.md).
# -----------------------------------------------------------------------------
vmController:
  persistentRootdisk:
    enabled: true
