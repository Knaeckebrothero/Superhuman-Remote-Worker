# =============================================================================
# Experimental cluster values (develop branch -> Fleet -> home cluster)
# =============================================================================
# CI updates the image tags on every push to `develop`. Fleet then rolls
# out the chart to the homelab cluster. This file is the single source of
# truth for cluster-specific config; the chart itself stays generic.
#
# To install manually (e.g. for local testing):
#   helm install srw ./helm -f ./deployment/values-experimental.yaml
#
# =============================================================================

license:
  acceptTerms: true
# Pin the chart fullname so service/resource names stay short (`srw-*`)
# regardless of how Fleet derives the Helm release name. Keeps DNS names
# under the 63-char label limit and matches the hostnames assumed in Vault.
fullnameOverride: srw
# Scope vm.lifecycle.* NATS subjects to this orchestrator. Must match the dev
# VM controller's `orchestratorId` (deployment-vms/srw-vm-controller/fleet.yaml).
# Without this, the helper falls back to fullnameOverride ("srw") which doesn't
# match the controller's "srw-dev" → publishes drop silently.
orchestratorId: srw-dev
# Connect to the shared homelab NATS hub (Fleet-managed in the HomeLab repo at
# deployments_managed/nats/). The hub bridges to leaf NATS instances on the
# vm cluster so VM lifecycle commands can flow cross-cluster.
nats:
  url: "nats://nats.nats.svc.cluster.local:4222"
global:
  # Canonical domain — flipped to srw.works 2026-07-05. The public app
  # (cockpit / api / auth / cloud / git / mcp) now lives under srw.works;
  # superhuman-remote-worker.com is kept routable (Cloudflare tunnel rules
  # retained) but the app canonicalizes to srw.works — the BFF session cookie,
  # KC_HOSTNAME/OIDC issuer, and SPA base URL are all single-valued, so any
  # login flow that starts on the old domain funnels to srw.works. This one
  # override propagates through the srw.* URL helpers to every ingress, the
  # cockpit env.js, CORS, the Keycloak client redirect URIs, and the cookie
  # domain (.srw.works). The apex superhuman-remote-worker.com stays the sales
  # landing page (deployed separately from the HomeLab repo,
  # deployments_managed/srw-sales-page — not from this chart).
  domain: "srw.works"
  # No imagePullSecrets — all images pulled by this chart are public
  # (SRW images on ghcr.io/knaeckebrothero/superhuman-remote-worker-* +
  # upstream Docker Hub for the admin UIs). Re-add a `ghcr-pull-secret`
  # entry here (and create the matching Secret in-namespace) only if a
  # package is ever flipped back to private.
  hostnames:
    cockpit: "cockpit.srw.works"
    # LAN-only admin UIs + cockpit deep-links stay on
    # superhuman-remote-worker.com. They are reached over the home network via
    # split-horizon MikroTik DNS (<name>.superhuman-remote-worker.com ->
    # 10.0.51.11) with existing cert-manager certs, and are deliberately NOT in
    # the Cloudflare tunnel. There are no srw.works CNAMEs for them, so letting
    # global.domain drag them to *.srw.works would leave them with neither LAN
    # DNS nor a tunnel rule — i.e. unreachable. Pin them back explicitly.
    neo4j: "neo4j.superhuman-remote-worker.com"
    neo4jBolt: "bolt-neo4j.superhuman-remote-worker.com"
    pgadmin: "pgadmin.superhuman-remote-worker.com"
    dozzle: "dozzle.superhuman-remote-worker.com"
    minio: "minio.superhuman-remote-worker.com"
