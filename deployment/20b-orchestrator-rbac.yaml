# RBAC for the orchestrator to manage workspace container pods.
# The ContainerProvisioner creates/deletes pods via CoreV1Api.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: srw-orchestrator
  namespace: superhuman-remote-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: srw-orchestrator-workspace
  namespace: superhuman-remote-worker
rules:
  # Workspace container lifecycle (create, delete, get status)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: srw-orchestrator-workspace
  namespace: superhuman-remote-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: srw-orchestrator-workspace
subjects:
  - kind: ServiceAccount
    name: srw-orchestrator
    namespace: superhuman-remote-worker
