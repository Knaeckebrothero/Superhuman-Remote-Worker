apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-config
  namespace: superhuman-remote-worker
data:
  # PostgreSQL (App DB) — non-secret config only
  # DATABASE_URL (with credentials) is in srw-secrets
  POSTGRES_DB: "srw"

  # Vector DB — non-secret config only
  # VECTOR_DB_URL (with credentials) is in srw-secrets
  VECTOR_POSTGRES_DB: "srw_vector"

  # MongoDB (no auth)
  MONGODB_URL: "mongodb://srw-mongodb:27017/srw_logs"

  # Gitea
  GITEA_URL: "http://srw-gitea:3000"
  GITEA_INTERNAL_URL: "http://srw-gitea:3000"

  # Orchestrator
  ORCHESTRATOR_URL: "http://srw-orchestrator:8085"

  # Workspace
  WORKSPACE_PATH: "/workspace"
  WORKSPACE_STORAGE_CLASS: "longhorn-ephemeral"

  # Agent
  AGENT_CONFIG: "defaults"
  AGENT_PORT: "8001"
  PERSISTENT_AGENT_CONFIG: "interactive"

  # Keycloak SSO (public OIDC config)
  KEYCLOAK_URL: "http://srw-keycloak:8080"
  KEYCLOAK_ISSUER_URL: "https://auth.superhuman-remote-worker.com"
  KEYCLOAK_REALM: "srw"

  # CORS (orchestrator reads this for additional allowed origins)
  CORS_ORIGINS: "https://superhuman-remote-worker.com"

  # Cockpit external URL (for deep links in emails/notifications)
  COCKPIT_EXTERNAL_URL: "https://superhuman-remote-worker.com"

  # LLM routing (via VPN sidecar to GPU cluster)
  LLM_BASE_URL: "http://srw-vpn-cluster:8080/v1"
  KEY_COOLDOWN_SECONDS: "3600"

  # Vision model
  VISION_MODEL: "gpt-4o-mini"

  # Browser automation (via VPN sidecar)
  BROWSER_LLM_MODEL: "gpt-oss-120b"
  BROWSER_LLM_BASE_URL: "http://srw-vpn-cluster:8080/v1"

  # Research proxy (via VPN sidecar SOCKS5)
  RESEARCH_PROXY_TYPE: "socks5"
  RESEARCH_PROXY_HOST: "srw-vpn-research"
  RESEARCH_PROXY_PORT: "1080"

  # Citation Engine (via VPN sidecar)
  # CITATION_DB_URL (with credentials) is in srw-secrets
  CITATION_LLM_URL: "http://srw-vpn-cluster:8080/v1"
  CITATION_LLM_MODEL: "gpt-oss-120b"
  CITATION_REASONING_LEVEL: "high"
  CITATION_EMBEDDING_MODEL: "qwen3-embedding-8b"
  CITATION_EMBEDDING_URL: "http://srw-vpn-workstation:8080/v1"

  # Embedding model (memories + knowledge index, via workstation VPN)
  EMBEDDING_MODEL: "qwen3-embedding-8b"
  EMBEDDING_BASE_URL: "http://srw-vpn-workstation:8080/v1"

  # Codex proxy (CLIProxyAPI — ChatGPT subscription via OAuth proxy)
  CODEX_BASE_URL: "http://srw-codex-proxy:8317/v1"

  # Instruction Builder (Cockpit AI Chat)
  BUILDER_MODEL: "gpt-5.2-pro"
  BUILDER_LLM_PROVIDER: "openai"

  # Orchestrator settings
  AUTO_ASSIGN_ENABLED: "true"

  # Neo4j (local instance in this namespace)
  NEO4J_URL: "bolt://srw-neo4j:7688"
  DEFAULT_DS_NEO4J_URL: "bolt://srw-neo4j:7688"
  DEFAULT_DS_NEO4J_NAME: "Default Neo4j"
  DEFAULT_DS_NEO4J_READ_ONLY: "false"

  # S3 / MinIO (existing cluster MinIO)
  S3_ENDPOINT: "http://minio.minio.svc:9000"
  S3_BUCKET: "srw-snapshots"
  S3_REGION: "us-east-1"
  SNAPSHOT_MAX_SIZE_GB: "10"
  SNAPSHOT_RETENTION_DAYS: "90"

  # IDE sessions (requires MinIO or Gitea)
  IDE_SESSION_IDLE_TIMEOUT: "30"
  IDE_SESSION_MAX_LIFETIME: "240"
  IDE_MAX_CONCURRENT_PER_USER: "2"
  CODE_SERVER_IMAGE: "codercom/code-server:latest"
  IDE_PROXY_BASE_URL: "https://api.superhuman-remote-worker.com"

  # Notification — SMTP (via shared Proton Bridge in protonmail-bridge namespace)
  SMTP_HOST: "protonmail-bridge.protonmail-bridge.svc"
  SMTP_PORT: "1025"
  SMTP_USE_TLS: "true"
  SMTP_TRUST_SELF_SIGNED: "true"
  SMTP_FROM: "noreply@superhuman-remote-worker.com"

  # Notification — IMAP (via shared Proton Bridge)
  IMAP_HOST: "protonmail-bridge.protonmail-bridge.svc"
  IMAP_PORT: "1143"
  IMAP_USE_SSL: "false"
  IMAP_TRUST_SELF_SIGNED: "true"
  IMAP_POLL_INTERVAL: "30"
  AGENT_EMAIL: "agent@superhuman-remote-worker.com"
  MAIL_DOMAIN: "superhuman-remote-worker.com"

  # Notification — Ntfy (optional)
  NTFY_URL: ""
  NTFY_TOPIC: ""

  # Nextcloud — internal + public URLs for NextcloudAdmin service
  NEXTCLOUD_URL: "http://srw-nextcloud"
  NEXTCLOUD_PUBLIC_URL: "https://cloud.superhuman-remote-worker.com"
  NEXTCLOUD_ADMIN_USER: "admin"
  NEXTCLOUD_AGENT_USER: "agent-service"

  # Nextcloud / WebDAV datasource (optional)
  DEFAULT_DS_WEBDAV_URL: "http://srw-nextcloud/remote.php/dav/files/admin/"
  DEFAULT_DS_WEBDAV_NAME: "Nextcloud"
  DEFAULT_DS_WEBDAV_READ_ONLY: "false"

  # Workstation API (via VPN sidecar)
  WORKSTATION_BASE_URL: "http://srw-vpn-workstation:8080/v1"

  # VPN — non-secret config (ports only; hosts, users, realms, endpoints in srw-secrets)
  VPN_CLUSTER_PORT: "443"
  VPN_RESEARCH_PORT: "443"
  VPN_WORKSTATION_PORT: "443"

  # NATS (hub on main cluster, used by orchestrator for VM lifecycle)
  NATS_URL: "nats://nats.nats.svc.cluster.local:4222"

  # Headscale (mesh VPN coordination server)
  HEADSCALE_URL: "https://headscale.superhuman-remote-worker.com"

  # Workspace containers (per-job sandboxed execution environments)
  WORKSPACE_IMAGE: "ghcr.io/knaeckebrothero/superhuman-remote-worker-workspace:sha-ba0aecf"
  WORKSPACE_NAMESPACE: "superhuman-remote-worker"

  # Persistent agent pods (on-demand, same image as worker agents)
  PERSISTENT_AGENT_IMAGE: "ghcr.io/knaeckebrothero/superhuman-remote-worker-agent:sha-4d2bb70"

  # Logging
  LOG_LEVEL: "DEBUG"
