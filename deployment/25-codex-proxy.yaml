# Codex OAuth Proxy (CLIProxyAPI)
# Provides OpenAI-compatible API backed by ChatGPT Plus/Pro subscription.
#
# First-time auth (one-off, credentials are persisted in the PVC):
#   1. kubectl -n superhuman-remote-worker port-forward svc/srw-codex-proxy 1455:1455
#   2. Trigger login from cockpit Settings > Codex (or curl the orchestrator)
#   3. Browser opens OpenAI OAuth — callback hits localhost:1455 via the port-forward
#   4. Once authenticated, the port-forward can be closed
#
# The callback URL is hardcoded to localhost:1455 by OpenAI's OAuth registration,
# so a public ingress is not possible — port-forward is the intended approach.
apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-codex-proxy-config
  namespace: superhuman-remote-worker
data:
  config.yaml: |
    port: 8317
    auth-dir: /root/.cli-proxy-api

    remote-management:
      allow-remote: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srw-codex-proxy-auths
  namespace: superhuman-remote-worker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-codex-proxy
  namespace: superhuman-remote-worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srw-codex-proxy
  template:
    metadata:
      labels:
        app: srw-codex-proxy
    spec:
      containers:
        - name: codex-proxy
          image: docker.io/eceasy/cli-proxy-api:latest
          ports:
            - name: api
              containerPort: 8317
            - name: oauth-callback
              containerPort: 1455
          env:
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srw-secrets
                  key: CODEX_MANAGEMENT_KEY
          volumeMounts:
            - name: config
              mountPath: /CLIProxyAPI/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: auths
              mountPath: /root/.cli-proxy-api
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8317
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8317
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: srw-codex-proxy-config
        - name: auths
          persistentVolumeClaim:
            claimName: srw-codex-proxy-auths
---
apiVersion: v1
kind: Service
metadata:
  name: srw-codex-proxy
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 8317
      targetPort: 8317
    - name: oauth-callback
      port: 1455
      targetPort: 1455
  selector:
    app: srw-codex-proxy
