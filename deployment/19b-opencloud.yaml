# OpenCloud — cloud storage for agent file operations (replaces Nextcloud)
#
# Prerequisites:
#   Keycloak must be running with the opencloud-web and opencloud-orchestrator
#   clients configured. Seed them via docker/keycloak/setup-opencloud-client.sh
#   (adapted for production redirect URIs) or manually in the Keycloak admin UI.
#
# The pre-start hook (setup-opencloud.sh from ConfigMap srw-opencloud-config)
# runs on every container start. It validates PROXY_USER_OIDC_CLAIM=sub and
# OC_OIDC_ISSUER are set. Non-fatal — failures won't block startup.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: srw-opencloud-config
  namespace: superhuman-remote-worker
data:
  setup-opencloud.sh: |
    #!/bin/sh
    set +e
    log() { printf "[oc-setup] %s\n" "$*"; }
    log "Running OpenCloud pre-start hook"
    if [ "${PROXY_USER_OIDC_CLAIM:-}" != "sub" ]; then
        log "WARNING: PROXY_USER_OIDC_CLAIM is '${PROXY_USER_OIDC_CLAIM:-<unset>}'," \
            "expected 'sub'. See docs/operations/opencloud-bootstrap.md §4."
    fi
    if [ -z "${OC_OIDC_ISSUER:-}" ]; then
        log "WARNING: OC_OIDC_ISSUER is not set; OpenCloud will fail login flows."
    fi
    log "Reminder: the orchestrator expects a Keycloak client named"
    log "  '${OPENCLOUD_KEYCLOAK_CLIENT_ID:-opencloud-orchestrator}'"
    log "with serviceAccountsEnabled=true and the 'opencloudAdmin' group assigned."
    log "Pre-start hook complete"
    exit 0
  csp.yaml: |
    ## CSP override for production.
    ##
    ## OpenCloud's default connect-src only allows 'self'. The OIDC issuer
    ## (Keycloak at auth.superhuman-remote-worker.com) is on a different
    ## origin, so the browser's oidc-client library needs it in connect-src.
    directives:
      child-src:
        - "'self'"
      connect-src:
        - "'self'"
        - "blob:"
        - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
        - "https://update.opencloud.eu/"
        - "https://auth.superhuman-remote-worker.com"
      default-src:
        - "'none'"
      font-src:
        - "'self'"
      frame-ancestors:
        - "'self'"
      frame-src:
        - "'self'"
        - "blob:"
        - "https://embed.diagrams.net/"
      img-src:
        - "'self'"
        - "data:"
        - "blob:"
        - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
      manifest-src:
        - "'self'"
      media-src:
        - "'self'"
      object-src:
        - "'self'"
        - "blob:"
      script-src:
        - "'self'"
        - "'unsafe-inline'"
      style-src:
        - "'self'"
        - "'unsafe-inline'"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srw-opencloud-data
  namespace: superhuman-remote-worker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srw-opencloud-config
  namespace: superhuman-remote-worker
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srw-opencloud
  namespace: superhuman-remote-worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: srw-opencloud
  template:
    metadata:
      labels:
        app: srw-opencloud
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z srw-keycloak 8080; do sleep 2; done"]
      containers:
        - name: opencloud
          image: docker.io/opencloudeu/opencloud:latest
          command: ["/bin/sh", "-c"]
          args:
            - "echo no | /usr/bin/opencloud init || true; /opt/opencloud-hooks/setup-opencloud.sh || true; exec /usr/bin/opencloud server"
          ports:
            - containerPort: 9200
          env:
            # Public URL — used by OpenCloud to generate absolute URLs,
            # redirect URIs, and browser-facing links.
            - name: OC_URL
              value: "https://cloud.superhuman-remote-worker.com"
            # TLS is terminated by Traefik ingress; OpenCloud serves plain HTTP.
            - name: PROXY_TLS
              value: "false"
            - name: PROXY_HTTP_ADDR
              value: "0.0.0.0:9200"
            - name: PROXY_ENABLE_BASIC_AUTH
              value: "false"
            # CRITICAL: must be "sub" — changing after users exist orphans all
            # Spaces, groups, and shares. See docs/operations/opencloud-bootstrap.md §4.
            - name: PROXY_USER_OIDC_CLAIM
              value: "sub"
            # Disable internal IdP — use external Keycloak.
            - name: OC_EXCLUDE_RUN_SERVICES
              value: "idp"
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: "oidc"
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: "groups"
            # OIDC — browser login via Keycloak
            - name: WEB_OIDC_CLIENT_ID
              value: "opencloud-web"
            - name: WEB_OIDC_METADATA_URL
              value: "https://auth.superhuman-remote-worker.com/realms/srw/.well-known/openid-configuration"
            # Issuer must match the `iss` claim in Keycloak tokens.
            # KC_HOSTNAME in 18-keycloak.yaml is set to the external URL,
            # so tokens always carry iss=https://auth.superhuman-remote-worker.com/realms/srw.
            - name: OC_OIDC_ISSUER
              value: "https://auth.superhuman-remote-worker.com/realms/srw"
            - name: OC_OIDC_ENDPOINT_URL
              value: "https://auth.superhuman-remote-worker.com/realms/srw"
            - name: OC_LOG_LEVEL
              value: "info"
            - name: OC_ADMIN_USER_ID
              value: "admin"
            # CSP override — allows browser OIDC discovery to reach Keycloak
            # on a different origin (auth.* vs cloud.*).
            - name: PROXY_CSP_CONFIG_FILE_OVERRIDE_LOCATION
              value: "/opt/opencloud-hooks/csp.yaml"
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
            - name: config
              mountPath: /etc/opencloud
            - name: hooks
              mountPath: /opt/opencloud-hooks
          startupProbe:
            httpGet:
              path: /status.php
              port: 9200
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status.php
              port: 9200
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status.php
              port: 9200
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: srw-opencloud-data
        - name: config
          persistentVolumeClaim:
            claimName: srw-opencloud-config
        - name: hooks
          configMap:
            name: srw-opencloud-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: srw-opencloud
  namespace: superhuman-remote-worker
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
  selector:
    app: srw-opencloud
