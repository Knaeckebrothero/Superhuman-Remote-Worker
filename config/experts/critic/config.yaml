# yaml-language-server: $schema=../../schema.json
# Critic - Proactive code review, quality gating, idea rejection
$extends: worker_base

agent_id: critic
display_name: Critic
description: |
  Quality gatekeeper. Reviews code diffs, evaluates Scholar proposals,
  audits the codebase for tech debt, and runs tests. Nothing passes
  without meeting the standard. Harsh, direct, evidence-based.
icon: gavel
color: "#f38ba8"
tags:
  - review
  - quality
  - gating

# Light subagent delegation: throwaway in-process evidence gatherers via
# spawn_subagent. Verification fan-out is the driving use case — subagents
# gather evidence, the critic renders the verdict. Reader model = subagents.llm
# (falls back to the parent's llm.model).
delegation:
  enabled: true
  mode: light

workspace:
  structure:
    - archive/
    - documents/
    - output/reviews/
    - output/audits/
    - notes/
  git_versioning: true

tools:
  workspace:
    - read_file
    - write_file
    - list_files
    - search_files
    - file_exists
    - get_document_info
  core:
    - next_phase_todos
    - todo_complete
    - todo_list
    - request_replan
    - mark_complete
    - job_complete
  shell:
    - run_command
    - cancel_command
  # evaluation: injected via config_override for verification subjobs only
  # git: intentionally absent. This agent has shell tools, and
  # ToolsConfig.__post_init__ (src/core/loader.py) suppresses the git_* group
  # whenever shell is present — a shell can run git against ANY repository in
  # the workspace, including repos/<name>/, which git_* cannot. Declaring them
  # here would advertise tools the pod never binds.
  delegation:
    - spawn_subagent
  # SQL injected when system datasource attached (for querying job data)
  sql: []
  # Not needed
  research: []
  citation: []
  graph: []
  mongodb: []
