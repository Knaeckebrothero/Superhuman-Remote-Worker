# yaml-language-server: $schema=../../schema.json
# Scholar - Continuous R&D exploration and idea generation
$extends: defaults

agent_id: scholar
display_name: Scholar
description: |
  Continuous exploration agent. Scans the web, digs through codebases,
  analyzes logs and test results, runs experiments. Generates a high volume
  of idea artifacts — the Critic decides which survive.
icon: lightbulb
color: "#f9e2af"
tags:
  - research
  - exploration
  - ideas

llm: {}

scholar:
  enabled: false

workspace:
  structure:
    - archive/
    - documents/
    - output/ideas/
    - output/experiments/
    - notes/
    - reference/
    - repo/
  git_versioning: true

# Scholar-specific instruction files (extends defaults' todo_guide.md)
instruction_files:
  - file: todo_guide.md
    trigger: before_tool:next_phase_todos
    enforce: true
  - file: research_guide.md
    trigger: phase:tactical
    enforce: false  # Active: injected automatically at tactical phase start

tools:
  workspace:
    - read_file
    - write_file
    - edit_file
    - list_files
    - delete_file
    - search_files
    - file_exists
    - move_file
    - copy_file
    - get_document_info
    - create_directory
  core:
    - next_phase_todos
    - todo_complete
    - todo_list
    - todo_rewind
    - mark_complete
    - job_complete
  research:
    - web_search
    - extract_webpage
    - crawl_website
    - map_website
    - search_papers
    - download_paper
    - get_paper_info
    - browse_website
    - research_topic
  coding:
    - run_command
  git:
    - git_log
    - git_show
    - git_diff
    - git_status
    - git_tags
  delegation:
    - delegate_work
  # SQL injected when system datasource attached (for reading job data, test results)
  sql: []
  # Not needed
  document: []
  citation: []
  graph: []
  mongodb: []

delegation:
  enabled: true
