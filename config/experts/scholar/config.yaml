# yaml-language-server: $schema=../../schema.json
# Scholar - Continuous R&D exploration and idea generation
$extends: defaults

agent_id: scholar
display_name: Scholar
description: |
  Continuous exploration agent. Scans the web, digs through codebases,
  analyzes logs and test results, runs experiments. Generates a high volume
  of idea artifacts — the Critic decides which survive.
icon: lightbulb
color: "#f9e2af"
tags:
  - research
  - exploration
  - ideas

llm: {}

scholar:
  enabled: false

workspace:
  structure:
    - archive/
    - documents/
    - output/ideas/
    - output/experiments/
    - notes/
    - reference/
    - repo/
  git_versioning: true

# Scholar-specific instruction files (extends defaults' todo-guide skill)
instruction_files:
  - skill: todo-guide
    trigger: before_tool:next_phase_todos
    enforce: true
  - skill: research-guide
    trigger: phase:tactical
    enforce: false  # Active: injected automatically at tactical phase start
  - skill: verify-before-done
    trigger: phase:tactical
    enforce: false  # Active: injected at tactical phase start (where completion happens)
  # Reference every claim inline as [N] (cite-and-place, not cite-and-forget).
  - skill: cite-as-you-write
    trigger: before_tool:cite_web
    enforce: true
  - skill: cite-as-you-write
    trigger: before_tool:cite_document
    enforce: true

tools:
  workspace:
    - read_file
    - write_file
    - edit_file
    - list_files
    - delete_file
    - search_files
    - file_exists
    - move_file
    - copy_file
    - get_document_info
    - create_directory
  core:
    - next_phase_todos
    - todo_complete
    - todo_list
    - todo_rewind
    - mark_complete
    - job_complete
  research:
    - web_search
    - extract_webpage
    - crawl_website
    - map_website
    - search_papers
    - download_paper
    - get_paper_info
    - browse_website
    - research_topic
  shell:
    - run_command
  git:
    - git_log
    - git_show
    - git_diff
    - git_status
    - git_tags
  delegation:
    - delegate_work
    - resume_delegation_child
  # SQL injected when system datasource attached (for reading job data, test results)
  sql: []
  # Citations: a research agent must back every factual claim with a source.
  # the research-guide skill (tactical phase) instructs cite_web / cite_document,
  # so the tools must exist. Mirrors defaults.yaml's citation suite.
  citation:
    - cite_document
    - cite_web
    - list_sources
    - get_citation
    - list_citations
    - edit_citation
    - annotate_source
    - get_annotations
    - tag_source
    - search_library
    - generate_bibliography
  # Graph + MongoDB auto-injected when a matching datasource is attached
  graph: []
  mongodb: []
