# yaml-language-server: $schema=../../schema.json
# Unrestricted Agent - full computer access with no command restrictions
$extends: defaults

agent_id: unrestricted
display_name: Unrestricted Agent
description: |
  Full-access agent with no command blocklist and no workspace sandboxing.
  The container IS the sandbox. Intended for containerized deployments where
  the agent needs to install packages, run services, and operate freely.
icon: terminal
color: "#f38ba8"
tags:
  - coding
  - unrestricted
  - development

# No command restrictions, no workspace sandbox
run_command_blocked_commands: []
run_command_sandbox: false

workspace:
  structure:
    - archive/
    - documents/
    - output/
    - repo/
  git_versioning: true

tools:
  workspace:
    - read_file
    - write_file
    - edit_file
    - list_files
    - search_files
    - file_exists
    - move_file
    - copy_file
    - delete_file
    - create_directory
    - delete_directory
  coding:
    - run_command
  core:
    - next_phase_todos
    - todo_complete
    - todo_rewind
    - mark_complete
    - job_complete
  git:
    - git_log
    - git_diff
    - git_show
    - git_status
    - git_tags
  research:
    - web_search
  # Disable unused tool categories
  document: null
  citation: null
  graph: null
