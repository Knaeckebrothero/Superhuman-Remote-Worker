# yaml-language-server: $schema=../../schema.json
# Developer - test-driven implementation. Spec first, tests first, code last.
$extends: worker_base

agent_id: developer
display_name: Developer
description: |
  Test-driven implementation engine. Defines EARS acceptance criteria up front,
  writes failing tests, then writes the minimum code that makes them pass.
  Operates in a spec → red → green → refactor cycle, with phase-typed todos
  and strict file-scope discipline (no source edits in red, no test edits in green).
icon: code
color: "#89b4fa"
tags:
  - coding
  - development
  - tdd
  - delegation

llm:
  reasoning_level: high

# Built-in subagents (delegate_agent) — parallel EXPLORATION, research and
# bounded implementation work fanned out to the roster children; the parent
# owns the code that lands. `enabled` gates the tool binding; which children
# exist, their tools, write policy and budgets live in `subagents.roster`
# (their model defaults to the parent's; per-job override via
# config_override.subagents.llm).
delegation:
  enabled: true
  max_concurrent: 4

workspace:
  structure:
    - archive/
    - documents/
    - output/
  git_versioning: true

tools:
  workspace:
    - read_file
    - write_file
    - list_files
    - search_files
    - file_exists
    - get_document_info
  shell:
    - run_command
    - cancel_command
    - shell_read
  core:
    - next_phase_todos
    - todo_complete
    - request_replan
    - mark_complete
    - job_complete
  # git: intentionally absent. This agent has shell tools, and
  # ToolsConfig.__post_init__ (src/core/loader.py) suppresses the git_* group
  # whenever shell is present — a shell can run git against ANY repository in
  # the workspace, including repos/<name>/, which git_* cannot. Declaring them
  # here would advertise tools the pod never binds.
  # Websearch — a coder must be able to look things up (docs, APIs, error
  # messages). browser_direct (step-by-step Chromium) is inherited from worker_base.
  research:
    - web_search
    - extract_webpage
    - crawl_website
    - map_website
    - research_topic
  # The built-in subagents' spawn tool (bound only with delegation.enabled).
  delegation:
    - delegate_agent
  # Disable unused tool categories
  citation: []
  graph: []
