# yaml-language-server: $schema=../../schema.json
# Developer - Claude Code delegation, PR factory
$extends: defaults

agent_id: developer
display_name: Developer
description: |
  Implementation engine. Receives approved ideas and implementation tasks,
  delegates to Claude Code sessions, manages PRs. Throughput-focused and
  systematic. One todo = one delegation = one focused change.
icon: code
color: "#89b4fa"
tags:
  - coding
  - development
  - delegation

llm:
  reasoning_level: high

claude_code:
  model: openai/gpt-oss-120b

shell:
  auto_start_claude_code: true

workspace:
  structure:
    - archive/
    - documents/
    - output/
    - repo/
  git_versioning: true

tools:
  workspace:
    - read_file
    - write_file
    - list_files
    - search_files
    - file_exists
    - get_document_info
  shell:
    - run_command
    - shell_read
  core:
    - next_phase_todos
    - todo_complete
    - todo_rewind
    - mark_complete
    - job_complete
  git:
    - git_log
    - git_diff
    - git_status
    - git_tags
  # Disable unused tool categories
  research: []
  citation: []
  graph: []
