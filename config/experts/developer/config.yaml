# yaml-language-server: $schema=../../schema.json
# Developer - test-driven implementation. Spec first, tests first, code last.
$extends: defaults

agent_id: developer
display_name: Developer
description: |
  Test-driven implementation engine. Defines EARS acceptance criteria up front,
  writes failing tests, then writes the minimum code that makes them pass.
  Operates in a spec → red → green → refactor cycle, with phase-typed todos
  and strict file-scope discipline (no source edits in red, no test edits in green).
icon: code
color: "#89b4fa"
tags:
  - coding
  - development
  - tdd
  - delegation

llm:
  reasoning_level: high

workspace:
  structure:
    - archive/
    - documents/
    - output/
    - repo/
  git_versioning: true

tools:
  workspace:
    - read_file
    - write_file
    - list_files
    - search_files
    - file_exists
    - get_document_info
  shell:
    - run_command
    - shell_read
  core:
    - next_phase_todos
    - todo_complete
    - todo_rewind
    - mark_complete
    - job_complete
  git:
    - git_log
    - git_diff
    - git_status
    - git_tags
  # Disable unused tool categories
  research: []
  citation: []
  graph: []
