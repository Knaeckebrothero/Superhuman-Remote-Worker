# Global model catalog — single source of truth for all available models.
#
# The orchestrator loads this file and filters it based on which providers
# have API keys available (system env vars, user keys, project keys).
#
# Provider field maps to VALID_API_KEY_PROVIDERS for access control.
# Special provider "local" means always available (self-hosted, no external key).
#
# Family field maps to settings_matrix.yaml for inference parameter defaults.

groups:
  - name: "Local"
    provider: local
    models:
      - id: "openai/RedHatAI/gemma-4-31B-it-FP8-Dynamic"
        display_name: "Gemma 4 31B"
        family: gemma

  - name: "OpenAI"
    provider: openai
    models:
      - id: "gpt-4o"
        display_name: "GPT-4o"
        family: default
      - id: "gpt-4o-mini"
        display_name: "GPT-4o Mini"
        family: default

  - name: "Codex"
    provider: codex
    models:
      - id: "codex/gpt-5.4"
        display_name: "GPT-5.4"
        family: gpt-5
      - id: "codex/gpt-5.3-codex"
        display_name: "Codex"
        family: gpt-5
      - id: "codex/gpt-5.3-codex-spark"
        display_name: "Codex Spark"
        family: gpt-5

  - name: "Anthropic"
    provider: anthropic
    models:
      - id: "claude-opus-4-6"
        display_name: "Claude Opus 4.6"
        family: claude-opus
      - id: "claude-sonnet-4-5-20250929"
        display_name: "Claude Sonnet 4.5"
        family: claude-sonnet

  - name: "Google"
    provider: google
    models:
      - id: "gemini-2.5-pro"
        display_name: "Gemini 2.5 Pro"
        family: gemini
      - id: "gemini-2.5-flash"
        display_name: "Gemini 2.5 Flash"
        family: gemini

  - name: "Groq"
    provider: groq
    models:
      - id: "groq/moonshotai/kimi-k2-instruct-0905"
        display_name: "Kimi K2 Instruct"
        family: default
      - id: "groq/gpt-oss-120b"
        display_name: "GPT OSS 120B (Groq)"
        family: gpt-oss

  - name: "OpenRouter"
    provider: openrouter
    models:
      - id: "openrouter/minimax/minimax-m2.7"
        display_name: "MiniMax M2.7"
        family: minimax

# Quick-select presets for strategic + tactical model combinations (job mode).
# Only shown when both models are available to the user.
presets:
  - label: "Opus + Sonnet"
    strategic: "claude-opus-4-6"
    tactical: "claude-sonnet-4-5-20250929"
  - label: "Codex + Spark"
    strategic: "codex/gpt-5.3-codex"
    tactical: "codex/gpt-5.3-codex-spark"
  - label: "Gemini Pro + Flash"
    strategic: "gemini-2.5-pro"
    tactical: "gemini-2.5-flash"
  - label: "K2 + OSS 120B (Groq)"
    strategic: "groq/moonshotai/kimi-k2-instruct-0905"
    tactical: "groq/gpt-oss-120b"
  - label: "Gemma 4 Local (both)"
    strategic: "openai/RedHatAI/gemma-4-31B-it-FP8-Dynamic"
    tactical: "openai/RedHatAI/gemma-4-31B-it-FP8-Dynamic"

# Models available in the instruction builder chat.
# Filtered by provider availability, same as groups above.
builder_models:
  - label: "Gemma 4 31B (Local)"
    id: "openai/RedHatAI/gemma-4-31B-it-FP8-Dynamic"
    provider: local
  - label: "MiniMax M2.7"
    id: "openrouter/minimax/minimax-m2.7"
    provider: openrouter
  - label: "GPT-5.4"
    id: "codex/gpt-5.4"
    provider: codex
  - label: "Codex (coding)"
    id: "codex/gpt-5.3-codex"
    provider: codex
  - label: "Codex Spark (ultra-fast)"
    id: "codex/gpt-5.3-codex-spark"
    provider: codex
  - label: "Claude Opus 4.6"
    id: "claude-opus-4-6"
    provider: anthropic

# =========================================================================
# Helper models — auxiliary, vision, whisper, embedding.
# Same provider-based filtering as groups above.
# =========================================================================

# Auxiliary LLM: memory extraction, knowledge curation, summarization.
# Any chat model works. Smaller/faster models recommended for cost.
auxiliary_models:
  - id: "openai/RedHatAI/gemma-4-31B-it-FP8-Dynamic"
    label: "Gemma 4 31B (Local)"
    provider: local
  - id: "gpt-4o-mini"
    label: "GPT-4o Mini"
    provider: openai
  - id: "gpt-4o"
    label: "GPT-4o"
    provider: openai
  - id: "claude-sonnet-4-5-20250929"
    label: "Claude Sonnet 4.5"
    provider: anthropic
  - id: "gemini-2.5-flash"
    label: "Gemini 2.5 Flash"
    provider: google
  - id: "groq/moonshotai/kimi-k2-instruct-0905"
    label: "Kimi K2 Instruct (Groq)"
    provider: groq
  - id: "groq/gpt-oss-120b"
    label: "GPT OSS 120B (Groq)"
    provider: groq

# Vision: multimodal model for describing images/charts when primary model
# is text-only. Must support image input.
vision_models:
  - id: "openai/RedHatAI/gemma-4-31B-it-FP8-Dynamic"
    label: "Gemma 4 31B (Local)"
    provider: local
  - id: "gpt-4o"
    label: "GPT-4o"
    provider: openai
  - id: "gpt-4o-mini"
    label: "GPT-4o Mini"
    provider: openai
  - id: "gpt-4.1-mini"
    label: "GPT-4.1 Mini"
    provider: openai
  - id: "claude-sonnet-4-5-20250929"
    label: "Claude Sonnet 4.5"
    provider: anthropic
  - id: "gemini-2.5-flash"
    label: "Gemini 2.5 Flash"
    provider: google

# Whisper: speech-to-text for audio files in workspaces.
whisper_models:
  - id: "whisper-1"
    label: "Whisper v1 (OpenAI)"
    provider: openai
  - id: "whisper-large-v3"
    label: "Whisper Large v3 (Local)"
    provider: local
  - id: "whisper-large-v3-turbo"
    label: "Whisper Large v3 Turbo (Local)"
    provider: local

# Embedding: vector embeddings for memory, knowledge, citation search.
embedding_models:
  - id: "qwen3-embedding-8b"
    label: "Qwen3 Embedding 8B (Local)"
    provider: local
    dimensions: 4096
  - id: "text-embedding-3-small"
    label: "Text Embedding 3 Small (OpenAI)"
    provider: openai
    dimensions: 1536
  - id: "text-embedding-3-large"
    label: "Text Embedding 3 Large (OpenAI)"
    provider: openai
    dimensions: 3072
  - id: "openrouter/qwen/qwen3-embedding-8b"
    label: "Qwen3 Embedding 8B (OpenRouter)"
    provider: openrouter
    dimensions: 4096
