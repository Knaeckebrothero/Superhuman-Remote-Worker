# Prompt Matrix — maps (prompt_type, model_family) → filename
# Resolution: expert matrix → base matrix, model-specific → default
# File search: expert directory → config/prompts/

default:
  systemprompt: systemprompt.txt
  persona: persona.txt
  strategic: strategic.txt
  tactical: tactical.txt
  summarization: summarization_prompt.txt
  memory_extraction: memory_extraction_prompt.txt
  curation: curation_prompt.txt

minimax:
  systemprompt: systemprompt_minimax.txt
  persona: persona_minimax.txt
  strategic: strategic_minimax.txt
  tactical: tactical_minimax.txt
  summarization: summarization_prompt_minimax.txt

gpt-oss:
  systemprompt: systemprompt_gpt_oss.txt
  persona: persona_gpt_oss.txt
  strategic: strategic_gpt_oss.txt
  tactical: tactical_gpt_oss.txt
  summarization: summarization_prompt_gpt_oss.txt
  memory_extraction: memory_extraction_prompt_gpt_oss.txt
  curation: curation_prompt_gpt_oss.txt

