# yaml-language-server: $schema=schema.json
# Framework defaults - agents extend this via $extends

agent_id: default
display_name: The General Secretary

llm:
  model: openai/gpt-oss-120b
  provider: null  # Auto-detect from model name (claude-* → anthropic, gemini-* → google)
  temperature: 0.0
  reasoning_level: high
  reasoning_method: null  # Auto-detect from model name (prompt/api/none)
  base_url: null  # Set LLM_BASE_URL env var for local vLLM endpoint
  timeout: 600
  max_retries: 3
  max_output_tokens: null  # Auto-detected per provider; override for local models if needed
  multimodal: false  # Set to true if model can process images directly
  parallel_tool_calls: false  # Set to true for models that handle parallel calls well (e.g., GPT-5.2 Pro, Opus 4.6)
  model_max_context_tokens: 100000  # gpt-oss-120b effective context limit (vLLM); Layer 0/1 safety
  # IMPORTANT: Override this per-model in expert configs. Wrong values cause crashes
  # (too high → token limit errors) or wasted context (too low → premature compaction).
  # No phase overrides — strategic, tactical, and summarization all use gpt-oss-120b

workspace:
  structure:
    - archive/
    - output/
    - reference/
    - tools/
  instructions_template: instructions.md
  initial_files:
    workspace.md: prompts/workspace_template.md
  max_read_words: 25000
  max_write_words: 10000
  # Git versioning for workspace history
  git_versioning: true

tools:
  # Workspace tools - file operations (src/tools/workspace/)
  workspace:
    - read_file
    - write_file
    - edit_file
    - list_files
    - delete_file
    - search_files
    - file_exists
    - move_file
    - rename_file
    - copy_file
    - get_workspace_summary
    - get_document_info
    - create_directory
    - delete_directory
  # Core tools - to-do + job management (src/tools/core/)
  core:
    - next_phase_todos
    - todo_complete
    - todo_list
    - todo_rewind
    - mark_complete
    - job_complete
  # Document tools - document processing (src/tools/document/)
  document:
    - chunk_document
  # Research tools - web search, academic papers, browser & workflows (src/tools/research/)
  research:
    - web_search
    - extract_webpage
    - crawl_website
    - map_website
    - search_papers
    - download_paper
    - get_paper_info
    - browse_website
    - download_from_website
    - research_topic
  # Citation tools - citation management (src/tools/citation/)
  citation:
    - cite_document
    - cite_web
    - list_sources
    - get_citation
    - list_citations
    - edit_citation
    - annotate_source
    - get_annotations
    - tag_source
    - search_library
    - generate_bibliography
  # Graph tools - Neo4j operations (src/tools/graph/)
  # NOTE: Graph tools are no longer listed in defaults. They are injected
  # automatically when a Neo4j datasource is attached to the job.
  # See docs/datasources.md for the datasource connector system.
  graph: []
  # SQL tools - PostgreSQL operations (src/tools/sql/)
  # Injected automatically via datasource system
  sql: []
  # MongoDB tools - MongoDB operations (src/tools/mongodb/)
  # Injected automatically via datasource system
  mongodb: []
  # Coding tools - persistent terminal sessions (src/tools/coding/)
  coding:
    - shell_execute   # Execute commands/keystrokes in persistent tabs (requires tmux)
    - shell_read      # Read output history from persistent tabs
  # Evaluation tools - verdict tools for critic agents (src/tools/evaluation/)
  # Enable in critic config to give reviewer agents approve/return capabilities.
  evaluation: []
  # Git tools - workspace version control (src/tools/git/)
  git:
    - git_log
    - git_show
    - git_diff
    - git_status
    - git_tags

# Instruction files — config-driven auto-injection of guidance documents.
# Each entry copies a file to the workspace and triggers injection based on conditions.
# enforce: true = passive (tool rejects until agent reads file)
# enforce: false = active (system injects content as transient message)
instruction_files:
  - file: todo_guide.md
    trigger: before_tool:next_phase_todos
    enforce: true

connections:
  postgres: true

limits:
  context_threshold_tokens: 80000
  message_count_threshold: 300
  message_count_min_tokens: 50000
  tool_retry_count: 3
  model_max_context_tokens: 80000
  summarization_safe_limit: 100000  # Must be < model_max to leave room for summarization prompt overhead
  summarization_chunk_size: 80000
  response_validation:
    enabled: true
    max_content_length: 50000   # chars, flag if exceeded with no tool calls
    max_tag_repetitions: 50     # same closing tag repeated this many times
    max_token_repetitions: 20   # same word/token repeated consecutively
    max_line_repetitions: 10    # same line repeated in output

context_management:
  compact_on_archive: true
  keep_recent_tool_results: 150
  keep_recent_messages: 10
  summarization_template: summarization_prompt.txt
  reasoning_level: high  # Only injected when reasoning_method is "prompt" (gpt-oss)
  max_summary_length: 20000

research:
  # Proxy for accessing paywalled content (e.g., via SSH tunnel to university)
  proxy:
    enabled: false
    type: socks5  # "http", "socks5", or "none"
    host: null
    port: null

# Memory Light (RecallStore) — hybrid search memory for cross-context recall
# See docs/features/memory_light.md for architecture details.
memory:
  enabled: true                    # Opt-in per config
  budget_tokens: 10000              # Max tokens for memory injection per LLM call
  max_memories_per_injection: 25   # Cap on number of memories injected
  observer_interval: 5             # Run observer every N turns
  observer_model: null             # null = use main LLM, or specify model
  observer_base_url: null          # null = use main LLM_BASE_URL
  embedding_model: text-embedding-3-small
  dense_results: 5                 # Top-K for dense vector search
  sparse_results: 5                # Top-K for sparse/keyword search
  recent_results: 3                # Number of recent memories to include
  importance_threshold: 0.3        # Minimum importance to store
  dedup_threshold: 0.92            # Cosine similarity threshold for dedup
  storage: postgres                # Only option for v1

# Verification — auto-spawn a critic job after job_complete to review deliverables.
# The critic either approves the job or resumes it with feedback.
# See docs/features/verification_phase.md for full design.
verification:
  enabled: true          # Spawn a critic job after job_complete to review deliverables
  critic_config: critic  # Which expert config to use for the reviewer
  max_rounds: 3          # Max feedback round-trips before auto-accepting

# Autonomy level — controls when the agent pauses for human review
# full | review | partial | guided | dependent
autonomy: review

# Browser automation settings (browser-use + Playwright)
browser:
  headless: true
  timeout: 60000  # Milliseconds
  use_vision: false  # DOM-based by default (works with any LLM)

# Claude Code delegation settings (model for auto-started claude-code shell tab)
claude_code:
  model: claude-opus-4-6

# Persistent shell sessions (tmux-backed terminal multiplexer)
# Requires tmux installed.
shell:
  max_tabs: 15                   # Maximum number of concurrent shell tabs
  max_read_lines: 200          # Maximum lines shell_read can return
  scrollback_limit: 5000       # Tmux history-limit per pane
  default_timeout: 120         # Default timeout for shell_execute sync mode (seconds)
  blocked_commands: [sudo, reboot, shutdown, poweroff, halt, init, systemctl]
  sandbox: true                # Restrict working directory to workspace
  auto_start_claude_code: false # Auto-open a Claude Code tab on job start (requires claude CLI)

