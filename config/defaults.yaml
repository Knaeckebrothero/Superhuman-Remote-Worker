# yaml-language-server: $schema=schema.json
# Framework defaults - agents extend this via $extends

agent_id: default
display_name: The General Secretary

llm:
  model: openai/gpt-oss-120b
  provider: null  # Auto-detect from model name (claude-* → anthropic, gemini-* → google)
  temperature: 0.0
  reasoning_level: high
  reasoning_method: null  # Auto-detect from model name (prompt/api/none)
  base_url: null  # Set LLM_BASE_URL env var for local vLLM endpoint
  timeout: 600
  max_retries: 3
  max_output_tokens: null  # Auto-detected per provider; override for local models if needed
  multimodal: false  # Set to true if model can process images directly
  parallel_tool_calls: false  # Set to true for models that handle parallel calls well (e.g., GPT-5.2 Pro, Opus 4.6)
  # Model-specific inference params (temperature, top_p, top_k) and context limits
  # are set via config/settings_matrix.yaml — the single source of truth for
  # model-dependent settings. Do not set model_max_context_tokens here.

workspace:
  structure:
    - archive/
    - output/
    - reference/
    - tools/
  instructions_template: instructions.md
  initial_files: {}
  max_read_words: 25000
  max_write_words: 10000
  # Git versioning for workspace history
  git_versioning: true
  # Workspace backend: "local" (default) or "remote" (SSH/SFTP to VM)
  backend: local
  # Remote backend settings (only used when backend: remote)
  # remote:
  #   host: ""                                        # VM IP or hostname
  #   port: 22
  #   username: agent-host
  #   key_path: /run/secrets/vm-ssh-key               # Path to SSH private key
  #   workspace_path: /home/agent-host/workspace    # Workspace root on the VM

tools:
  # Workspace tools - file operations (src/tools/workspace/)
  workspace:
    - read_file
    - write_file
    - edit_file
    - list_files
    - delete_file
    - search_files
    - file_exists
    - move_file
    - rename_file
    - copy_file
    - get_document_info
    - create_directory
    - delete_directory
  # Core tools - to-do + job management (src/tools/core/)
  core:
    - next_phase_todos
    - todo_complete
    - todo_list
    - todo_rewind
    - mark_complete
    - job_complete
  # Document tools - document processing (src/tools/document/)
  document:
    - chunk_document
  # Research tools - web search, academic papers, browser & workflows (src/tools/research/)
  research:
    - web_search
    - extract_webpage
    - crawl_website
    - map_website
    - search_papers
    - download_paper
    - get_paper_info
    - browse_website
    - download_from_website
    - research_topic
  # Citation tools - citation management (src/tools/citation/)
  citation:
    - cite_document
    - cite_web
    - list_sources
    - get_citation
    - list_citations
    - edit_citation
    - annotate_source
    - get_annotations
    - tag_source
    - search_library
    - generate_bibliography
  # Graph tools - Neo4j operations (src/tools/graph/)
  # NOTE: Graph tools are no longer listed in defaults. They are injected
  # automatically when a Neo4j datasource is attached to the job.
  # See docs/datasources.md for the datasource connector system.
  graph: []
  # SQL tools - PostgreSQL operations (src/tools/sql/)
  # Injected automatically via datasource system
  sql: []
  # MongoDB tools - MongoDB operations (src/tools/mongodb/)
  # Injected automatically via datasource system
  mongodb: []
  # Coding tools - shell command execution (src/tools/coding/)
  coding:
    - run_command     # Execute commands, get output (stateless mode, default)
    - shell_read      # Read more output from scrollback when needed
  # Evaluation tools - verdict tools for critic agents (src/tools/evaluation/)
  # Enable in critic config to give reviewer agents approve/return capabilities.
  evaluation: []
  # Knowledge tools — project knowledge base CRUD + search (src/tools/knowledge/)
  # Available when Neo4j + pgvector are connected; silently skipped otherwise.
  knowledge:
    - kb_write
    - kb_update
    - kb_read
    - kb_list
    - kb_search
    - kb_related
    - kb_contradictions
    - kb_provenance
    - kb_unanswered
    - kb_export
  # Communication tools - agent-human messaging via email (src/tools/communication/)
  communication:
    - send_message
  # Delegation tools - spawn child jobs as workspace branches (src/tools/delegation/)
  # Not in defaults — opt-in per expert config (e.g. tools.delegation: [delegate_work])
  delegation: []
  # Git tools - workspace version control (src/tools/git/)
  git:
    - git_log
    - git_show
    - git_diff
    - git_status
    - git_tags

# Instruction files — config-driven auto-injection of guidance documents.
# Each entry copies a file to the workspace and triggers injection based on conditions.
# enforce: true = passive (tool rejects until agent reads file)
# enforce: false = active (system injects content as transient message)
instruction_files:
  - file: todo_guide.md
    trigger: before_tool:next_phase_todos
    enforce: true

connections:
  postgres: true

limits:
  # Model-dependent limits (context_threshold_tokens, model_max_context_tokens, etc.)
  # are set via config/settings_matrix.yaml — do not set them here.
  message_count_threshold: 300
  tool_retry_count: 3
  response_validation:
    enabled: true
    max_content_length: 50000   # chars, flag if exceeded with no tool calls
    max_tag_repetitions: 50     # same closing tag repeated this many times
    max_token_repetitions: 20   # same word/token repeated consecutively
    max_line_repetitions: 10    # same line repeated in output
  progress_stall_threshold: 30     # tool calls without progress before nudge reminder
  max_tool_calls_per_phase: 200    # max tool calls per phase before rewind (tactical) or freeze (strategic)

context_management:
  compact_on_archive: true
  keep_recent_tool_results: 150
  keep_recent_messages: 10
  summarization_template: summarization_prompt.txt
  reasoning_level: high  # Only injected when reasoning_method is "prompt" (gpt-oss)
  max_summary_length: 20000

research:
  # Proxy for accessing paywalled content (e.g., via SSH tunnel to university)
  proxy:
    enabled: false
    type: socks5  # "http", "socks5", or "none"
    host: null
    port: null

# Memory Light (RecallStore) — hybrid search memory for cross-context recall
# See docs/features/memory_light.md for architecture details.
memory:
  enabled: true                    # Opt-in per config
  budget_tokens: 10000             # Max tokens for memory injection per LLM call
  max_memories_per_injection: 150  # Cap on number of memories injected
  observer_interval: 5             # Run observer every N turns
  assembler_interval: 7            # Run assembler every N turns (TTL curation)
  default_ttl: 10                  # Default TTL in turns for new memories (guaranteed injection)
  observer_model: null             # null = use main LLM, or specify model
  observer_base_url: null          # null = use main LLM_BASE_URL
  embedding_model: qwen3-embedding-8b
  dense_results: 30                # Top-K for dense vector search
  sparse_results: 30               # Top-K for sparse/keyword search
  recent_results: 15               # Number of recent memories to include
  importance_threshold: 0.3        # Minimum importance to store
  dedup_threshold: 0.85            # Cosine similarity threshold for dedup
  retrieval_importance_floor: 0.4  # Minimum importance for retrieval (memories below this are stored but not recalled)
  project_scoped: true             # When true, memories are shared across all jobs in the same project
  storage: postgres                # Only option for v1

# Auxiliary LLM — unified support task system for background LLM tasks.
# Handles memory extraction, knowledge curation, and other support tasks
# using structured output. Two modes: chain (in→out) and agent (in→tools→out).
# See docs/features/auxiliary.md for full design.
auxiliary:
  enabled: true
  model: openai/gpt-oss-120b  # Free local model for all support tasks
  base_url: null               # null = use LLM_BASE_URL (university vLLM endpoint)
  temperature: 0.0
  max_iterations: 15       # Cap for agent mode loops
  timeout: 120             # Seconds per LLM call
  tasks:
    extract_memories:
      enabled: true
    curate_knowledge:
      enabled: true
    assemble_memories:
      enabled: true

# Verification — auto-spawn a critic job after job_complete to review deliverables.
# The critic either approves the job or resumes it with feedback.
# See docs/features/verification_phase.md for full design.
verification:
  enabled: true          # Spawn a critic job after job_complete to review deliverables
  critic_config: critic  # Which expert config to use for the reviewer
  max_rounds: 5          # Max feedback round-trips before auto-accepting (0 = unlimited)

# Curation — inline knowledge extraction via AuxiliaryLLM at archive_phase.
# Runs CurateKnowledgeTask in agent mode to extract knowledge notes
# into the project knowledge base (Neo4j + pgvector).
# Requires a project_id in job metadata and Neo4j connection.
# See docs/features/project_knowledge_base.md for full design.
curator:
  enabled: false         # Opt-in per config or per project

# Scholar — auto-spawn a research job before the main job starts.
# The scholar gathers information, does web research, and writes findings
# to the research/ folder in the workspace. The main job starts after.
scholar:
  enabled: true            # Spawn a scholar job before main job starts
  scholar_config: scholar   # Which expert config to use

# Subagent delegation — let agents spawn child jobs that branch off the workspace
delegation:
  enabled: false             # Opt-in: agent gets delegate_work tool
  max_depth: 1               # Nesting depth (1 = no grandchildren)
  default_timeout: 7200      # Default timeout per delegation in seconds (2h)
  max_timeout: 14400          # Maximum allowed timeout (4h)
  allowed_configs: []        # Which configs children can use (empty = any)

# Autonomy level — controls when the agent pauses for human review
# full | review | partial | guided | dependent
autonomy: review

# Communication — agent-initiated messaging to humans via email
# Messages stored in workspace/messages/ as markdown files with YAML frontmatter.
communication:
  enabled: true
  blocking_timeout_hours: 24       # Auto-resume blocked jobs after this timeout
  max_message_length: 5000         # Max chars per message body
  allowed_recipients: project      # "owner" (job owner only) or "project" (all project members)

# Browser automation settings (browser-use + Playwright)
browser:
  headless: true
  timeout: 60000  # Milliseconds
  use_vision: false  # DOM-based by default (works with any LLM)

# Claude Code delegation settings (model for auto-started claude-code shell tab)
claude_code:
  model: claude-opus-4-6

# Shell command execution (tmux-backed terminal multiplexer)
# Requires tmux installed.
shell:
  mode: stateless              # "stateless" (run_command, default) or "persistent" (shell_execute)
  max_tabs: 15                   # Maximum number of concurrent shell tabs
  max_read_lines: 200          # Maximum lines shell_read can return
  scrollback_limit: 5000       # Tmux history-limit per pane
  default_timeout: 120         # Default timeout for sync mode (seconds)
  blocked_commands: [reboot, shutdown, poweroff, halt, init]  # sudo/systemctl allowed for remote server management
  sandbox: true                # Restrict working directory to workspace
  auto_start_claude_code: false # Auto-open a Claude Code tab on job start (requires claude CLI)

