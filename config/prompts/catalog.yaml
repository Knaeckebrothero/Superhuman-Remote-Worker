# Human-facing descriptions for editable config keys (DB-backed config editor).
# Each entry: kind (prompts | instructions | settings | guardrails) + name + a
# title and description. Settings/guardrails entries also carry a `type` (and
# optional min/max/enum) so the admin UI renders typed editors and the API
# validates writes. Drives the admin "what is this / where is it used" text and
# the bundled-default view. Add entries here (and wire the resolver) to expose
# more.
- kind: prompts
  name: systemprompt
  title: "System prompt (framework scaffold)"
  description: >-
    Framework system prompt. The expert persona is injected into it as
    {expert_identity}. Rebuilt on every LLM call and survives compaction.
- kind: prompts
  name: persona
  title: "Expert persona / identity"
  description: >-
    Injected as {expert_identity} on every call. Defines who the agent is and
    how it thinks.
- kind: prompts
  name: strategic
  title: "Strategic-phase directive"
  description: "Appended during strategic (planning / reflection) phases."
- kind: prompts
  name: tactical
  title: "Tactical-phase directive"
  description: "Appended during tactical (execution) phases."
- kind: prompts
  name: summarization
  title: "Summarization (compaction) prompt"
  description: "Used when the conversation is compacted to free context."

# --- Settings (LLM inference params + execution limits) -----------------------
# `name` is the matrix leaf; dotted names (limits.*) target LimitsConfig fields.
- kind: settings
  name: temperature
  type: number
  min: 0.0
  max: 2.0
  title: "Sampling temperature"
  description: >-
    0 = deterministic. Reasoning models often require ~1.0. Applied per model
    family on top of the bundled settings matrix.
- kind: settings
  name: top_p
  type: number
  min: 0.0
  max: 1.0
  title: "Top-p (nucleus sampling)"
  description: "Probability-mass cutoff for nucleus sampling."
- kind: settings
  name: parallel_tool_calls
  type: boolean
  title: "Allow parallel tool calls"
  description: "Whether the model may emit multiple tool calls per response."
- kind: settings
  name: model_max_context_tokens
  type: integer
  title: "Model context window (tokens)"
  description: >-
    Per-model context window used for budgeting. Overrides the bundled family
    value.
- kind: settings
  name: limits.context_threshold_tokens
  type: integer
  title: "Context threshold (tokens)"
  description: "Token count at which summarization / compaction is triggered."
- kind: settings
  name: limits.summarization_safe_limit
  type: integer
  title: "Summarization safe limit (tokens)"
  description: "Upper safety bound kept free while summarizing."

# --- Guardrails (tool examples + nudges) --------------------------------------
- kind: guardrails
  name: guardrails
  type: json
  title: "Guardrails (tool examples + nudges)"
  description: >-
    The {tool_examples, nudges} document, deep-merged onto the bundled default
    for the family.
