# DeepSeek V4 guardrails
#
# DeepSeek V4 (Pro 1.6T/49B + Flash 284B/13B) are hybrid reasoning models served
# via an OpenAI-compatible API (LangChain ChatOpenAI over OpenRouter). Tool calls
# use standard OpenAI parens-form serialization — everything in `default.yaml`
# applies as-is. Reasoning is returned out-of-band (DeepSeek `reasoning_content`,
# OpenRouter `reasoning`/`reasoning_details`) and captured by
# src/llm/reasoning_chat.py, so it never needs to appear in tool examples.
#
# This file exists so the matrix has a guardrails entry for `deepseek` and any
# future drift (e.g. a tool-format quirk surfaced by real runs) can be added
# here without touching the matrix again.

tool_examples: {}

nudges: {}
