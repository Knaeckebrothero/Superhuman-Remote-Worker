# yaml-language-server: $schema=schema.json
$extends: persistent_defaults

agent_id: interactive
display_name: Interactive Assistant

llm:
  model: openai/gpt-oss-120b
  temperature: 1.0
  reasoning_level: null

# Simpler tool set for interactive testing
tools:
  workspace:
    - read_file
    - write_file
    - list_files
    - search_files
  research:
    - web_search
  shell:
    - run_command
    - shell_read
  git:
    - git_log
    - git_status
    - git_diff
  orchestrator: [ ]
  core: [ ]
  citation: [ ]
  graph: [ ]
  sql: [ ]
  mongodb: [ ]
  evaluation: [ ]
  knowledge: [ ]
  delegation: [ ]

interactive:
  permission_mode: autonomous
  greeting: "Hello! I'm your interactive assistant. How can I help?"
