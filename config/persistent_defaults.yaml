# yaml-language-server: $schema=schema.json
# Persistent agent defaults — base for interactive/persistent configs.
# Worker-mode configs should extend defaults.yaml instead.
#
# Does NOT include: instruction_files, phase_settings, delegation, autonomy,
# verification, scholar, curator, communication. Those are worker-mode only.
#
# Model-specific inference params (temperature, top_p, context limits) are
# injected automatically by the settings matrix — do not set them here.

agent_id: persistent
display_name: Persistent Agent

llm:
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic
  provider: null
  temperature: 0.0
  reasoning_level: high
  reasoning_method: null
  base_url: null
  timeout: 600
  max_retries: 3
  max_output_tokens: null
  # multimodal and parallel_tool_calls are set per model family
  # in config/settings_matrix.yaml — do not set them here.

workspace:
  structure:
    - documents/
    - notes/
    - output/
  max_read_words: 25000
  max_write_words: 10000
  git_versioning: true
  backend: sandbox

tools:
  workspace:
    - read_file
    - write_file
    - edit_file
    - list_files
    - delete_file
    - search_files
    - file_exists
    - move_file
    - rename_file
    - copy_file
    - get_document_info
    - create_directory
    - delete_directory
  research:
    - web_search
    - extract_webpage
    - crawl_website
    - map_website
    - search_papers
    - download_paper
    - get_paper_info
    - browse_website
    - download_from_website
    - research_topic
  browser_direct:
    - browser_navigate
    - browser_snapshot
    - browser_click
    - browser_type
    - browser_select
    - browser_scroll
    - browser_screenshot
    - browser_back
    - browser_close
  citation:
    - cite_document
    - cite_web
    - list_sources
    - get_citation
    - list_citations
    - edit_citation
    - annotate_source
    - get_annotations
    - tag_source
    - search_library
    - generate_bibliography
  shell:
    - run_command
    - shell_read
  git:
    - git_log
    - git_show
    - git_diff
    - git_status
    - git_tags
  knowledge:
    - kb_write
    - kb_update
    - kb_read
    - kb_list
    - kb_search
    - kb_related
    - kb_contradictions
    - kb_provenance
    - kb_unanswered
    - kb_export
  # Orchestrator tools auto-injected by PersistentSession._setup_tools()
  orchestrator: [ ]
  # Phase-specific tools not used in persistent mode
  core: [ ]
  # Datasource-injected (empty by default)
  graph: [ ]
  sql: [ ]
  mongodb: [ ]
  # Not used in persistent mode
  evaluation: [ ]
  delegation: [ ]
  communication: [ ]

connections:
  postgres: true

limits:
  message_count_threshold: 300
  tool_retry_count: 3
  response_validation:
    enabled: true
    max_content_length: 50000
    max_tag_repetitions: 50
    max_token_repetitions: 20
    max_line_repetitions: 10

context_management:
  keep_recent_tool_results: 150
  keep_recent_messages: 10
  summarization_template: summarization_prompt.txt
  reasoning_level: high
  max_summary_length: 20000

memory:
  enabled: true
  budget_tokens: 10000
  max_memories_per_injection: 150
  observer_interval: 5
  assembler_interval: 7
  default_ttl: 10
  importance_threshold: 0.3
  dedup_threshold: 0.85
  retrieval_importance_floor: 0.4
  project_scoped: true
  # MemoryManager seam (memory overhaul Phase 1). manager.enabled is the
  # cutover flag: true routes memory through the manager + the pipeline
  # below; false keeps the legacy direct-store paths. Persistent mode has
  # its own writer set: the elapsed-gate interval extractor and the
  # session_end/idle_archive teardown extractor (no assembler, no phases).
  manager:
    enabled: true
  pipeline:
    retrievers:
      - recall_two_tier              # TTL-pinned tier + hybrid search (RecallStore)
      - kb_notes                     # Top-5 project knowledge notes
    scorers:
      - reranker                     # GATE B (overhaul Phase 3): cross-encoder rerank over the fused candidates
    policies:
      - gate                         # drop the non-qualifying tail (relative floor)
      - bounded                      # cap the survivors at max_items
    writers:
      - persistent_interval_extractor  # In-loop observer (elapsed gate)
      - teardown_extractor             # Final extraction on session end / idle archive
  # Phase-3+4 production-candidate stack, flipped on for the dev rollout
  # (GATE B — docs/features/agent_memory_overhaul.md). Harness-measured:
  # R@5 0.20->1.0 at ~111 tok/q and knowledge-update end-task 0/4->3/4.
  # ROLLBACK: scorers/policies back to [] + ingestion.enabled false (the
  # legacy two-tier read + cosine-dedup write stay in place behind the flags).
  reranker:
    model: qwen3-reranker-8b         # rides the auxiliary endpoint (no extra credential plumbing)
    top_k: 512                       # cover the candidate set; tail past this fails the gate open, bounded backstops it
    keep_pinned_first: false         # ~95% of project corpora freeze TTL-pinned — let the reranker rank them too
    timeout: 10                      # live-latency cap (eval used 60 for cold-batch throughput); slow rerank degrades to legacy order, contained
  gate:
    threshold: 0.01                  # relative floor = 0.01 x the assemble's top rerank score
    mode: relative                   # absolute thresholds falsified: qwen3-reranker scale varies orders of magnitude per query
  bounded:
    max_items: 10                    # inject at most 10 memory items after gating
  # Phase 4 — ingestion verdicts (ADD/UPDATE/MERGE/NOOP) + bi-temporal
  # supersede: retire stale facts. Cost guard: the verdict LLM fires only when
  # a neighbour is >= review_floor similar (else straight ADD, no LLM call).
  ingestion:
    enabled: true
    verdict_top_k: 5
    review_floor: 0.5   # measured 2026-06-17 (lifecycle probe): 0.6→0.5 halves missed-retire (catches cosine-0.547 supersede), false-retire stays 0
  extraction:
    write_gate: false                # completeness over precision — relevance is gated at retrieval now, not at write time

auxiliary:
  enabled: true
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic
  base_url: null
  temperature: 0.0
  max_iterations: 15
  # Bounded for the interactive path: short aux tasks (memory extraction,
  # knowledge curation, titles) run inline on the turn's critical path, so a
  # hung endpoint mustn't stall a turn for long. Failures fall back / skip
  # gracefully. Summarization is the exception — each fold pass gets the
  # larger summarization_call_timeout below.
  timeout: 120
  # Per fold-call budget for conversation summarization. Each summarization
  # pass is one bounded call (src/core/summarizer.py); a hung endpoint costs
  # at most this much per attempt, never a single shared 600s blob.
  summarization_call_timeout: 240
  tasks:
    extract_memories:
      enabled: true
    curate_knowledge:
      enabled: true
    assemble_memories:
      # Worker-only: no persistent code path calls assemble_memories, so
      # enabling it here is a no-op (docs/issues/memory_bugs.md B3). Whether
      # to wire or retire the assembler is a memory-overhaul decision.
      enabled: false

interactive:
  permission_mode: supervised
  narration_mode: auto
  idle_timeout_minutes: 30

# --- Extra config (flows to config.extra, read by tools) ---

research:
  proxy:
    enabled: false
    type: socks5
    host: null
    port: null

browser:
  snapshot:
    include_screenshot: auto
    max_dom_chars: 40000
  security:
    allowed_domains: []
    blocked_domains: ["localhost", "127.0.0.1", "169.254.169.254"]
    blocked_schemes: ["file", "javascript", "data"]

shell:
  mode: stateless
  max_tabs: 15
  max_read_lines: 200
  scrollback_limit: 5000
  default_timeout: 120
  blocked_commands: [ reboot, shutdown, poweroff, halt, init ]
  sudo_action: freeze
  sandbox: true
