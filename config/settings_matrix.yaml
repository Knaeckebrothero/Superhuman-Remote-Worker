# Settings Matrix — model-family-specific inference parameter defaults.
# Single source of truth for model-dependent settings.
# Keys match detect_model_family() output in src/core/loader.py.
#
# Resolution: default → family-specific (deep_merge).
# Per-expert: experts can place settings_matrix.yaml in their directory.
# Flat keys → data["llm"], nested "limits:" → data["limits"].

default:
  model_max_context_tokens: 128000
  limits:
    model_max_context_tokens: 100000
    context_threshold_tokens: 80000
    summarization_safe_limit: 90000
    summarization_chunk_size: 80000
    message_count_min_tokens: 50000

