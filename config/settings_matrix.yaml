# Settings Matrix — model-family-specific inference parameter defaults.
# Single source of truth for model-dependent settings.
# Keys match detect_model_family() output in src/core/loader.py.
#
# Resolution: default → family-specific (deep_merge).
# Per-expert: experts can place settings_matrix.yaml in their directory.
# Flat keys → data["llm"], nested "limits:" → data["limits"].

default:
  model_max_context_tokens: 128000
  limits:
    model_max_context_tokens: 100000
    context_threshold_tokens: 80000
    summarization_safe_limit: 90000
    summarization_chunk_size: 80000
    message_count_min_tokens: 50000

minimax:
  temperature: 1.0
  top_p: 0.95
  top_k: 40
  model_max_context_tokens: 196608
  limits:
    model_max_context_tokens: 150000
    context_threshold_tokens: 100000
    summarization_safe_limit: 150000
    summarization_chunk_size: 100000
    message_count_min_tokens: 80000

o-series:
  temperature: 1.0
  model_max_context_tokens: 200000
  limits:
    model_max_context_tokens: 170000
    context_threshold_tokens: 130000
    summarization_safe_limit: 160000
    summarization_chunk_size: 110000
    message_count_min_tokens: 80000

deepseek:
  top_p: 0.95
  model_max_context_tokens: 64000
  limits:
    model_max_context_tokens: 55000
    context_threshold_tokens: 40000
    summarization_safe_limit: 45000
    summarization_chunk_size: 35000
    message_count_min_tokens: 30000

gemini:
  top_p: 0.95
  top_k: 40
  model_max_context_tokens: 1000000
  limits:
    model_max_context_tokens: 200000
    context_threshold_tokens: 150000
    summarization_safe_limit: 180000
    summarization_chunk_size: 120000
    message_count_min_tokens: 100000

gpt-5:
  temperature: 1.0
  model_max_context_tokens: 1050000  # gpt-5.4: 1.05M, gpt-5.3-codex: 400K, spark: 128K
  limits:
    model_max_context_tokens: 200000
    context_threshold_tokens: 150000
    summarization_safe_limit: 180000
    summarization_chunk_size: 120000
    message_count_min_tokens: 100000

gpt-oss:
  temperature: 1.0  # OpenAI official: use 1.0 for full reasoning capability
  top_p: 1.0        # OpenAI official: do not restrict vocabulary distribution
  # top_k: DO NOT SET — HuggingFace defaults to 50 if present; must stay disabled
  # repetition_penalty: DO NOT SET — some clients enable by default; OpenAI says disable
  model_max_context_tokens: 131072  # True 128K context (MoE: 117B total, 5.1B active)
  limits:
    model_max_context_tokens: 110000
    context_threshold_tokens: 85000
    summarization_safe_limit: 100000
    summarization_chunk_size: 75000
    message_count_min_tokens: 60000
