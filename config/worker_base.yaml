# yaml-language-server: $schema=schema.json
# Framework worker base — safe fallbacks for worker experts.

agent_id: worker_base
display_name: Framework Worker Base

llm:
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic
  provider: null  # Auto-detect from model name (claude-* → anthropic, gemini-* → google)
  temperature: 0.0
  reasoning_level: high
  reasoning_method: null  # Auto-detect from model name (prompt/api/none)
  base_url: null  # Set LLM_BASE_URL env var for local vLLM endpoint
  timeout: 600
  # Single-layer retries: the worker graph's retry_manager (limits.llm_inproc_retries,
  # Tier 1) is the ONE retry authority for the main LLM call. Provider-SDK retries
  # here would multiply with the graph loop and burn the Tier-2 outage budget
  # 2–10× too fast. See
  # knowledge-base/knowledge/features/llm_outage_pause_and_backoff_redispatch.md §Hard preconditions.
  max_retries: 0
  # NOTE: do NOT declare max_output_tokens here, even as null. It is matrix-driven
  # (per-family settings.max_output_tokens in config/model_config_matrix.yaml,
  # clamped to the context window by _resolve_max_output_tokens). A base
  # declaration enters explicit_llm_keys and SHADOWS the family value the same way
  # a base model_max_context_tokens would (see
  # knowledge-base/knowledge/features/reasoning_aware_max_output_tokens.md). A per-job/expert override
  # still wins — it re-enters explicit_llm_keys with a real value.
  # Model-specific inference params (temperature, top_p, top_k, multimodal,
  # parallel_tool_calls) and context limits are set via config/model_config_matrix.yaml
  # — the single source of truth for model-dependent settings.
  # Do not set model_max_context_tokens here.
  #
  # One model per expert: `model` runs every phase (U1 collapsed the old
  # strategic/tactical tiers). The only remaining override is
  #   summarization: context compaction (optional, same override path)
  # The light-subagent reader model is `subagents.llm` (a top-level
  # `subagents:` block), e.g. a top-tier parent spawning a mid-tier reader:
  #   subagents:
  #     llm:
  #       model: claude-haiku-4-5-20251001
  # Legacy `llm.strategic` / `llm.tactical` / `llm.subagent` keys are still
  # accepted in any layer and mapped (with a deprecation warning) — see
  # universal_experts_and_subagents.md §1.1.

workspace:
  structure:
    # No tools/ here: the whole prefix is a virtual directory served from the
    # live tool registry (knowledge-base/knowledge/features/virtual_directories.md). Listing it
    # made initialize() create an empty real directory that nothing ever wrote
    # to — dead scaffolding the virtual-dirs live gate flagged.
    - archive/
    - output/
    - reference/
  instructions_template: instructions.md
  initial_files: {}
  max_read_words: 25000
  max_write_words: 10000
  # Git versioning for workspace history
  git_versioning: true
  # Workspace backend: "sandbox" (SSH workspace container) or "vm"
  # (KubeVirt VM with sudo gate). The agent never operates on its own
  # filesystem — every workspace lives in an isolated SSH-accessible
  # container or VM. The orchestrator injects the connection details at
  # dispatch time.
  backend: sandbox
  # Remote backend settings (injected by orchestrator at dispatch time)
  # remote:
  #   host: ""                                        # VM/container hostname or IP
  #   port: 22
  #   username: agent-host
  #   key_path: /run/secrets/vm-ssh-key               # K8s: Secret mount
  #           # /run/secrets/ssh/id_ed25519            # Docker Compose: shared volume
  #   workspace_path: /home/agent-host/workspace     # Workspace root (subdirectory of home)

tools:
  # Workspace tools - file operations (src/tools/workspace/)
  workspace:
    - read_file
    - write_file
    - edit_file
    - use_skill
    - list_files
    - delete_file
    - search_files
    - file_exists
    - move_file
    - rename_file
    - copy_file
    - get_document_info
    - create_directory
    - delete_directory
  # Core tools - to-do + job management (src/tools/core/)
  core:
    - next_phase_todos
    - todo_complete
    - todo_list
    - request_replan
    - mark_complete
    - job_complete
  # Research tools - web search, academic papers, browser & workflows (src/tools/research/)
  research:
    - web_search
    - extract_webpage
    - crawl_website
    - map_website
    - search_papers
    - download_paper
    - get_paper_info
    - research_topic
  # Direct browser control - step-by-step page interaction (src/tools/research/browser_direct.py)
  browser_direct:
    - browser_navigate
    - browser_snapshot
    - browser_click
    - browser_type
    - browser_select
    - browser_scroll
    - browser_screenshot
    - browser_back
    - browser_close
  # Citation tools - citation management (src/tools/citation/)
  citation:
    - cite_document
    - cite_web
    - list_sources
    - get_citation
    - list_citations
    - edit_citation
    - annotate_source
    - get_annotations
    - tag_source
    - search_library
    - generate_bibliography
  # Graph tools - Neo4j operations (src/tools/graph/)
  # NOTE: Graph tools are no longer listed in defaults. They are injected
  # automatically when a Neo4j datasource is attached to the job.
  # See knowledge-base/knowledge/datasources.md for the datasource connector system.
  graph: []
  # SQL tools - PostgreSQL operations (src/tools/sql/)
  # Injected automatically via datasource system
  sql: []
  # MongoDB tools - MongoDB operations (src/tools/mongodb/)
  # Injected automatically via datasource system
  mongodb: []
  # WebDAV tools - WebDAV file operations (src/tools/webdav/)
  # Injected automatically via datasource system
  webdav: []
  # Repo tools - write operations on cloned repository datasources
  # (src/tools/repo/). Injected automatically via datasource system; distinct
  # from `git`, which covers the agent's own workspace history.
  repo: []
  # Email tools - IMAP/SMTP mailbox operations (src/tools/email/)
  # Injected automatically via datasource system
  email: []
  # Shell tools - shell command execution (src/tools/shell/)
  # Privileged and orchestration-oriented capabilities are opt-in at the expert
  # layer.  This base is a reliable fallback, not a maximal role profile.
  shell: []
  # Evaluation tools - verdict tools for critic agents (src/tools/evaluation/)
  # Enable in critic config to give reviewer agents approve/return capabilities.
  evaluation: []
  # Knowledge tools — project knowledge base CRUD + search (src/tools/knowledge/)
  # Available when Neo4j + pgvector are connected; silently skipped otherwise.
  knowledge:
    - kb_write
    - kb_update
    - kb_read
    - kb_list
    - kb_search
    - kb_related
    - kb_contradictions
    - kb_provenance
    - kb_unanswered
    - kb_export
  # Communication tools - agent-human messaging via email (src/tools/communication/)
  communication:
    - send_message
  # Delegation tools - spawn child jobs as workspace branches (src/tools/delegation/)
  delegation: []
  # Orchestrator tools - job delegation for persistent agents (src/tools/orchestrator/)
  # Empty by default; persistent agents auto-load these via PersistentSession
  orchestrator: [ ]
  # Dynamic Canvas is persistent-session-only. Worker agents never receive it.
  canvas: [ ]
  # Agent catalog tools - expert/skill management
  # Empty by default; persistent agents auto-load these via PersistentSession
  agent_catalog: [ ]
  # Workflow tools - automations and project loop inspection
  # Empty by default; session experts opt into this closed control group.
  workflows: [ ]
  # Git tools - workspace version control (src/tools/git/)
  git:
    - git_log
    - git_show
    - git_diff
    - git_status
    - git_tags

# Instruction files — config-driven, bounded activation of guidance documents.
# before_tool + enforce=true rejects that action until the agent has read the file.
# phase_start injects once per concrete phase instance, never once per turn.
instruction_files:
  - skill: todo-guide
    trigger: before_tool:next_phase_todos
    enforce: true
  - skill: verify-before-done
    trigger: before_tool:todo_complete
    enforce: true
    phases: [tactical]
    read_scope: phase
    max_read_age_turns: 20
  - skill: verify-before-done
    trigger: before_tool:job_complete
    enforce: true
    phases: [strategic]
    read_scope: phase
    max_read_age_turns: 20
  # Cite-as-you-write: bound to the citation tools (not a phase) so it also fires
  # in persistent sessions, which have no phase loop. enforce=true → the agent must
  # read it before its first citation. See knowledge-history/done/citation_engine_integration.md Phase 4.
  - skill: cite-as-you-write
    trigger: before_tool:cite_web
    enforce: true
  - skill: cite-as-you-write
    trigger: before_tool:cite_document
    enforce: true

connections:
  postgres: true

limits:
  # Model-dependent limits (context_threshold_tokens, model_max_context_tokens, etc.)
  # are set via config/settings_matrix.yaml — do not set them here.
  message_count_threshold: 300
  tool_retry_count: 3
  # Tier-1 in-process LLM retries for a transient outage before the worker
  # freezes the job for pause+backoff re-dispatch (Tier 2). 5 → 1+2+4+8+16s
  # ≈ 31s of hot-context coverage for a short blip, avoiding a re-dispatch.
  # See knowledge-base/knowledge/features/llm_outage_pause_and_backoff_redispatch.md.
  llm_inproc_retries: 5
  response_validation:
    enabled: true
    max_content_length: 50000   # chars, flag if exceeded with no tool calls
    max_tag_repetitions: 50     # same closing tag repeated this many times
    max_token_repetitions: 20   # same word/token repeated consecutively
    max_line_repetitions: 10    # same line repeated in output
  progress_stall_threshold: 30     # tool calls without progress before nudge reminder
  # Per-phase ceiling: OFF by default. It resets at every phase boundary, so it
  # bounded a phase but never a job — and with few large phases it would have
  # tightened the effective budget rather than loosened it. Set >0 only if you
  # deliberately want a per-phase guard.
  max_tool_calls_per_phase: 0
  # Job ceiling — the real backstop, and the ONLY automatic stop a runaway job
  # has (the progress nudge and act-ratio tripwire only inject reminders; loop
  # detection only masks tools; the orchestrator has no job-duration limit).
  # Exceeding it freezes with budget_exceeded, which parks for human review
  # rather than auto-redispatching, so it cannot livelock. 0 disables it.
  max_tool_calls_per_job: 5000
  # Act-ratio tripwire: after N consecutive tool actions that touch ONLY
  # process artifacts (patterns below), inject a one-line "stop planning"
  # nudge. Any action on a non-process target resets the counter. 0 disables.
  act_ratio_nudge_threshold: 6
  # Progress durability — see src/core/progress_commit.py. Commits land per
  # completed todo (free, local); pushes are throttled to this interval so a
  # burst of quick todos doesn't hammer Gitea.
  progress_push_interval_seconds: 60
  # Wall-clock floor: commit work in progress after this long with no commit.
  # Catches the stuck agent, which by definition never calls todo_complete.
  # 0 disables.
  progress_wip_commit_after_seconds: 300
  # Steering lane B (queued, non-urgent replies): delivered at the agent's next
  # completed todo, or after this long if it never reaches one. Urgent guidance
  # is lane A and ignores this — it renders every turn. 0 = break-driven only.
  queued_reply_max_wait_seconds: 300
  process_artifact_patterns:       # fnmatch, workspace-relative
    - todos.yaml
    - plan.md
    - "archive/*"
    - "*retrospective*"
  # Per-category audited tool-batch timeout (seconds). The batch timeout is the
  # max of categories in the batch, then clipped by graph-level hard ceilings.
  tool_category_timeouts:
    default: 120
    workspace: 120
    core: 120
    research: 120
    citation: 120
    graph: 120
    shell: 900
    webdav: 120
    git: 120
    knowledge: 120
    communication: 120
    # Delegation batches run whole in-process subagent loops (spawn_subagent),
    # not SSH ops — must exceed delegation.light.timeout_seconds plus queueing
    # slack (fan-out > max_parallel runs in waves), or deep fan-outs get killed.
    delegation: 600
    orchestrator: 120
    canvas: 120
    workflows: 120
    loop: 120
    agent_catalog: 120

# Phase alternation bounds — enforced by TodoManager.stage_tactical_todos
# (next_phase_todos rejects outside this range). Floor of 2: decompose-as-
# needed beats padded upfront decomposition; a correct 2-todo phase is legal.
phase_settings:
  min_todos: 2
  # Raised 20 -> 30 for the fewer-larger-phases model: a single execution phase
  # now covers work that used to be split across several. Note the cost — todo
  # bodies are injected verbatim on EVERY turn (see the ~15k/turn floor in
  # knowledge-base/knowledge/issues/phase_model_overhead_amnesia_loop.md F3), so this cap is also a
  # per-turn token budget. Prefer coarser todos over more of them.
  max_todos: 30

context_management:
  compact_on_archive: true
  keep_recent_tool_results: 150
  keep_recent_messages: 10
  keep_window_max_tool_result_chars: 16000
  summarization_template: summarization_prompt.txt
  reasoning_level: high  # Only injected when reasoning_method is "prompt" (gpt-oss)
  max_summary_length: 20000

research:
  # Proxy for accessing paywalled content (e.g., via SSH tunnel to university)
  proxy:
    enabled: false
    type: socks5  # "http", "socks5", or "none"
    host: null
    port: null

# Memory Light (RecallStore) — hybrid search memory for cross-context recall
# See knowledge-base/knowledge/features/memory_light.md for architecture details.
memory:
  enabled: true                    # Opt-in per config
  required: false                  # When true, a memory-dependent job pauses for bounded re-dispatch instead of running blind if memory/KB fail to init (self-improvement loop sets this)
  budget_tokens: 4000              # Max tokens for memory injection per LLM call (P-4 A/B, strategy doc §14)
  max_memories_per_injection: 50   # Cap on number of memories injected
  observer_interval: 5             # Run observer every N turns
  assembler_interval: 7            # Run assembler every N turns (TTL curation)
  default_ttl: 10                  # Default TTL in turns for new memories (guaranteed injection)
  importance_threshold: 0.3        # Minimum importance to store
  dedup_threshold: 0.85            # Cosine similarity threshold for dedup
  retrieval_importance_floor: 0.4  # Minimum importance for retrieval (memories below this are stored but not recalled)
  project_scoped: true             # When true, memories are shared across all jobs in the same project
  # NOTE: the observer runs on the auxiliary LLM (see `auxiliary:` below) and
  # the embedding model comes from the EMBEDDING_* env vars — neither is
  # configurable here (dead keys removed, knowledge-base/knowledge/issues/memory_bugs.md B9).
  # MemoryManager seam (memory overhaul Phase 1). manager.enabled is the
  # cutover flag: true routes memory through the manager + the pipeline
  # below; false keeps the legacy direct-store paths in the graph. The
  # pipeline names resolve against MEMORY_PLUGIN_REGISTRY
  # (src/services/memory/) — an unknown name fails loudly at setup.
  manager:
    enabled: true
  pipeline:
    retrievers:
      - recall_two_tier              # TTL-pinned tier + hybrid search (RecallStore)
      - kb_notes                     # Top-5 project knowledge notes
    scorers:
      - reranker                     # GATE B (overhaul Phase 3): cross-encoder rerank over the fused candidates
    policies:
      - gate                         # drop the non-qualifying tail (relative floor)
      - bounded                      # cap the survivors at max_items
    writers:
      - interval_extractor           # Worker in-loop observer (modulo gate)
      - phase_boundary_extractor     # Extraction at archive_phase
      - pre_compaction_extractor     # Chunked extraction of the evicted slice before compaction
      - memory_assembler             # TTL curation every assembler_interval turns
      - compaction_memory            # Store compaction summaries
      - queued_memory                # Flush todo_complete-queued memories
  # Phase-3+4 production-candidate stack, flipped on for the dev rollout
  # (GATE B — knowledge-base/knowledge/features/agent_memory_overhaul.md). Harness-measured:
  # R@5 0.20->1.0 at ~111 tok/q (80x cheaper than the full dump) and
  # knowledge-update end-task 0/4->3/4 once stale facts are retired.
  # ROLLBACK: set scorers/policies back to [] and ingestion.enabled false —
  # the legacy two-tier read + cosine-dedup write stay in place behind these
  # flags, so this is a one-edit revert.
  reranker:
    model: qwen3-reranker-8b         # rides the embedding endpoint EMBEDDING_BASE_URL (same qwen3 router; no extra credential plumbing)
    top_k: 512                       # cover the candidate set; any tail past this fails the gate open, bounded backstops it
    keep_pinned_first: false         # ~95% of project corpora freeze TTL-pinned — let the reranker rank them too
    timeout: 10                      # live-latency cap per attempt (eval used 60 for cold-batch throughput)
    # Transient faults (timeout/connection drop/5xx) retry in-call, then
    # degrade THAT TURN to hybrid order instead of failing the job; structural
    # failures (4xx/shape) stay job-fatal ("configured => required").
    # knowledge-base/knowledge/issues/reranker_transient_fault_hard_fails_job.md
    retries: 2                       # extra attempts after the first
    retry_backoff: 1.0               # seconds before retry 1, doubling after
  gate:
    threshold: 0.01                  # relative floor = 0.01 x the assemble's top rerank score
    mode: relative                   # absolute thresholds falsified: qwen3-reranker scale varies orders of magnitude per query
  bounded:
    max_items: 10                    # inject at most 10 memory items after gating
  # Phase 4 — ingestion verdicts (ADD/UPDATE/MERGE/NOOP) + bi-temporal
  # supersede: retire stale facts so they stop being injected. Cost guard:
  # the verdict LLM fires only when a neighbour is >= review_floor similar.
  ingestion:
    enabled: true
    verdict_top_k: 5
    review_floor: 0.5   # measured 2026-06-17 (lifecycle probe): 0.6→0.5 halves missed-retire (catches cosine-0.547 supersede), false-retire stays 0
  extraction:
    write_gate: false                # completeness over precision — relevance is gated at retrieval now, not at write time

# Auxiliary LLM — unified support task system for background LLM tasks.
# Handles memory extraction, knowledge curation, and other support tasks
# using structured output. Two modes: chain (in→out) and agent (in→tools→out).
# See knowledge-base/knowledge/features/auxiliary.md for full design.
auxiliary:
  enabled: true
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic  # Free local model for all support tasks
  base_url: null               # null = use LLM_BASE_URL (university vLLM endpoint)
  temperature: 0.0
  max_iterations: 15       # Cap for agent mode loops
  timeout: 120             # Seconds per LLM call (quick interactive tasks)
  # Per fold-call budget for conversation summarization (each pass is one
  # bounded call — src/core/summarizer.py)
  summarization_call_timeout: 240
  tasks:
    extract_memories:
      enabled: true
    curate_knowledge:
      enabled: true
      verdict: true          # OKF KB slice 2 PR2 — adjudicate each curator write (ADD/UPDATE/SUPERSEDE/DISCARD) against existing notes before it lands. Fires only where the curator runs (loops); cost-guarded to neighbours >= review_floor. See knowledge-base/knowledge/features/okf_knowledge_base.md §11.1.
    assemble_memories:
      enabled: true
    # Citation verification (citation engine Phase 2): cite_* returns 'pending'
    # and the verifier writes the verdict back async on the citation model
    # (CITATION_LLM_*, dispatched per job) or the auxiliary model fallback.
    verify_citations:
      enabled: true

# Verification — auto-spawn a critic job after job_complete to review deliverables.
# The critic either approves the job or resumes it with feedback.
# See knowledge-base/knowledge/features/verification_phase.md for full design.
verification:
  enabled: false         # Experts opt in when an independent critic is required
  critic_config: critic  # Which expert config to use for the reviewer
  max_rounds: 5          # Max feedback round-trips before auto-accepting (0 = unlimited)

# Curation — inline knowledge extraction via AuxiliaryLLM at archive_phase.
# Runs CurateKnowledgeTask in agent mode to extract knowledge notes
# into the project knowledge base (Neo4j + pgvector).
# Requires a project_id in job metadata and Neo4j connection.
# See knowledge-base/knowledge/features/project_knowledge_base.md for full design.
curator:
  enabled: false         # Opt-in per config or per project

# Scholar — auto-spawn a research job before the main job starts.
# The scholar gathers information, does web research, and writes findings
# to the research/ folder in the workspace. The main job starts after.
scholar:
  enabled: false           # Experts opt in when a dedicated research pass is required
  scholar_config: scholar   # Which expert config to use

# Subagent delegation — let agents spawn child jobs that branch off the workspace
delegation:
  enabled: false             # Experts opt in; base workers never spawn children
  max_depth: 1               # Nesting depth (1 = no grandchildren)
  default_timeout: 7200      # Default timeout per delegation in seconds (2h)
  max_timeout: 14400          # Maximum allowed timeout (4h)
  allowed_configs: []        # Which configs children can use (empty = any)
  # Backend for the shared `spawn_subagent` tool. The agent-facing name and
  # schema are identical either way — the backend is operator-selected, not the
  # model's choice:
  #   heavy — full child jobs (the delegate_work path): worktree + dispatch +
  #           parent freeze/checkpoint/wake + squash-merge.
  #   light — throwaway in-process ReAct readers that read sources and return a
  #           string; per-reader worktree, discarded never merged, no freeze.
  mode: heavy
  # Light-backend knobs (used only when mode: light). The reader MODEL is set
  # via `subagents.llm` (see the llm: block above), not here — so a top-tier
  # parent can spawn a mid-tier reader (opus → sonnet, gpt → gpt-mini).
  light:
    enabled: true
    max_iterations: 10       # Per-reader ReAct loop cap
    max_tokens: 40000        # Per-reader token budget
    max_parallel: 3          # Max concurrent readers per turn
    # Per-reader wall-clock budget (0 = unbounded). Readers self-terminate with
    # partial results at this deadline. Must stay well under
    # tool_category_timeouts.delegation or the parent batch watchdog discards
    # the whole fan-out (job 472ea457: 3-way fan-out vs 120s watchdog → job
    # failed as "workspace may be wedged").
    timeout_seconds: 240
    allow_writes: false      # Readers read-and-distill by default (no merge)

# Autonomy level — controls when the agent pauses for human review
# full | review | partial | guided | dependent
autonomy: review

# Image quality — resolution tier of images the agent receives
# economy | standard | high (default standard). Higher = more visual detail and
# more image tokens; resolved to a per-model-family max edge at the image seam.
# See knowledge-base/knowledge/issues/session_turn_hard_fails_on_transient_llm_outage.md (Track 1).
image_quality: standard

# Communication — agent-initiated messaging to humans via email
# Messages stored in workspace/messages/ as markdown files with YAML frontmatter.
communication:
  enabled: true
  blocking_timeout_hours: 24       # Auto-resume blocked jobs after this timeout
  max_message_length: 5000         # Max chars per message body
  allowed_recipients: project      # "owner" (job owner only) or "project" (all project members)

# Browser tool settings (workspace-side browser-exec daemon)
# Direct browser tools (browser_navigate, browser_click, etc.) give the agent
# step-by-step control of a Chromium on the workspace; the agent pod never
# runs a browser. Vision mode auto-selects based on model's multimodal flag.
browser:
  snapshot:
    include_screenshot: auto  # "auto" (if multimodal) | true | false
    max_dom_chars: 40000  # Truncate DOM text beyond this
  security:
    allowed_domains: []  # Empty = allow all domains
    blocked_domains: []  # Browser runs in isolated workspace — localhost is safe
    blocked_schemes: ["file", "javascript", "data"]

# Shell command execution (tmux-backed terminal multiplexer)
# Requires tmux installed.
shell:
  # `mode` is intentionally NOT set here. It is model-family-derived
  # (config/model_config_matrix.yaml `settings.shell_mode`): capable families ->
  # "persistent" (shell_execute), everything else falls to the stateless floor at
  # the read-sites (shell_tools.create_shell_tools / loader.get_all_tool_names,
  # both `.get("mode", "stateless")`). An explicit `mode:` here or in an
  # expert/session/project config overrides that family default (human wins).
  max_tabs: 15                   # Maximum number of concurrent shell tabs
  max_read_lines: 200          # Maximum lines shell_read can return
  scrollback_limit: 5000       # Tmux history-limit per pane
  default_timeout: 120         # Default timeout for sync mode (seconds)
  blocked_commands: [reboot, shutdown, poweroff, halt, init]
  sudo_action: freeze          # "freeze" (intercept sudo, offer VM upgrade) or "block" (hard reject)
  sandbox: true                # Restrict working directory to workspace

# Interactive persistent agent settings
# Only used when agent is started with --mode persistent
interactive:
  permission_mode: supervised   # supervised | auto_accept | autonomous
  narration_mode: auto          # silent | verbose | auto
  idle_timeout_minutes: 30      # Auto-pause session after idle period (0 = disabled)
