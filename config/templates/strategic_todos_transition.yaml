# Strategic todos for phase transitions (between tactical phases)
# These todos guide the agent through a review-reflect-adapt cycle
# that ensures quality planning and accurate progress tracking.
#
# IMPORTANT: The PLAN todo (id 4) starts with the stop condition.
# If all deliverables are done, call job_complete. Do NOT invent new work.
todos:
  - id: 1
    content: >-
      REVIEW: Examine what the previous tactical phase actually accomplished
      using git evidence — not memory (which may be wrong after context compaction).

      Steps:
      (1) Use git_tags() to confirm phase boundary tags exist.
      (2) Use git_log(max_count=15) to see commits from the previous phase.
      (3) Use git_diff with the phase start tag (e.g., ref="phase_N_start") to see
          all file changes made during the phase.

      Then write a retrospective to archive/phase_N_retrospective.md with these
      six sections:
      1. **Accomplished**: What was completed, with specific file paths that changed.
      2. **Incomplete**: What was attempted but didn't fully succeed, and why.
      3. **Discoveries**: Unexpected findings or blockers encountered.
      4. **Failed Approaches**: What was tried and did NOT work, with the reason.
         (These must survive so you avoid retrying the same failed strategy.)
      5. **Todo Stats**: How many todos were completed vs planned (e.g., "8/10 completed").
      6. **Deliverable Status**: Which deliverables from plan.md's "## Deliverables" section
         are now done vs still remaining. Use list_files('output/') to verify. List them explicitly.

      COMPLETION CRITERIA: archive/phase_N_retrospective.md written with all 6 sections,
      backed by git evidence (commit hashes, file paths from git_diff).

      INSTEAD OF: Writing the retrospective from memory alone — use git_log and git_diff
      for evidence. Include section 4 (Failed Approaches) and section 6 (Deliverable Status)
      even if empty — these drive the job completion decision in todo 4.

  - id: 2
    content: >-
      REFLECT on workspace.md: Read it fully, then REWRITE it.

      workspace.md is injected into every LLM call. Stale or bloated content wastes
      tokens and confuses future decisions. After rewriting, it should contain ONLY:

      PROTECTED sections (preserve verbatim unless provably wrong):
      - "## Pinned Instructions" — re-read instructions.md if you're unsure these are
        still accurate and complete
      - "## Facts" — durable knowledge: IDs, paths, credentials, configurations.
        Only remove facts that are confirmed wrong or no longer relevant.
      - "## Failed Approaches" — approaches that didn't work. Only remove entries
        when the underlying issue is confirmed resolved.

      REWRITABLE sections (update freely):
      - "## Deliverables" — update the status table based on the retrospective's
        Deliverable Status section. Mark completed items as "done" with verification evidence.
      - "## Key Decisions" — significant choices made so far, with brief reasoning
      - "## Status" — current phase, active blockers (or "none")

      BLOCKER CHALLENGE: If "## Status" lists blockers from previous phases,
      re-verify them now. Re-read the source, re-run the command, or re-check the
      assumption. If the blocker is still valid, keep it. If not, remove it.

      Remove: progress percentages, phase completion status, todo summaries,
      document inventories, anything already tracked in plan.md.

      COMPLETION CRITERIA: workspace.md fully rewritten, under 4000 tokens (~60 lines),
      protected sections preserved, stale blockers challenged.

      INSTEAD OF: Appending new content to the existing file — rewrite the whole file.
      Instead of merging Facts into Critical Context — keep Facts as a separate protected
      section. Instead of removing entries you're unsure about — keep them.

  - id: 3
    content: >-
      ADAPT plan.md based on the retrospective. Read plan.md, then update it.

      For each action below, REWRITE the relevant parts of plan.md (use a single
      write_file to replace the whole file rather than appending a second copy):
      (1) Mark completed phases with actual outcomes — not just "done" but what
          was produced (e.g., "Phase 2: Completed. Produced output/analysis.md
          with 15 requirement entries extracted from 8 source documents.").
      (2) Evaluate phase sizing: Was the todo count appropriate? If the phase had
          20 todos and only 12 were completed, plan smaller next time. If 10 todos
          were done in the first half, plan bigger.
      (3) If the phase was incomplete, create a continuation phase (e.g., "Phase 2.5:
          Complete remaining extraction") rather than overloading the next phase.
      (4) Remove phases that are no longer needed based on what you've learned.
      (5) Cross-check remaining phases against the "## Deliverables" section in plan.md —
          are all required deliverables still covered by at least one upcoming phase?

      COMPLETION CRITERIA: plan.md updated with outcomes on completed phases,
      phase sizing adjusted, upcoming phases verified against instructions.md.

      INSTEAD OF: Appending a new copy of the plan below the existing one — rewrite
      in place. Instead of adding phases for housekeeping (archiving, cleanup, packaging,
      PDF generation, status updates, file reorganization) — these are handled
      automatically by git versioning and Gitea. Keep every phase mapped to a
      required deliverable.

  - id: 4
    content: >-
      PLAN OR COMPLETE — Read this todo carefully. The stop condition comes FIRST.

      === STOP CONDITION (check this FIRST) ===

      Check the "## Deliverables" table in workspace.md (or re-read plan.md's
      Deliverables section). Then verify which outputs actually exist in output/
      using list_files. If ALL required deliverables exist AND the REVIEW phase
      (todo 1) confirmed their quality, then the job is DONE.

      Call job_complete with:
      - summary: What was accomplished across all phases
      - deliverables: List of output file paths (e.g., ["output/report.md", "output/data.csv"])
      - confidence: Your honest quality assessment (0.0-1.0)
      - notes: Any caveats, known gaps, or areas a reviewer should check

      The system will freeze the job, commit all workspace files, and push everything
      to Gitea for human review. You do not need to archive files, generate PDFs,
      update database status, or clean up — the system handles all of this automatically.

      === CONTINUE CONDITION (only if deliverables are still missing) ===

      If required deliverables are still missing:

      (1) FIRST read_file('todo_guide.md') — the next_phase_todos tool will reject
          your call if you haven't read the guide recently.
      (2) Then call next_phase_todos to create the next tactical phase.

      Guidelines:
      - Target 3-7 todos per phase — adapt to task complexity
      - Each todo should be completable in 1-3 tool calls
      - Each todo must be specific: name exact files, sections, tools, and outcomes
      - Each todo must directly advance a deliverable from instructions.md
      - Include a verification todo that produces evidence (recorded in todo notes or an output file)
      - If the next work involves an unfamiliar topic, make it a RESEARCH phase
        (web search first, then summarize findings) before an execution phase

      COMPLETION CRITERIA: Either job_complete called (job is done) OR
      next_phase_todos called (more work needed). Exactly one of these must happen.

      INSTEAD OF: Creating a new phase when all deliverables already exist — call
      job_complete. Instead of continuing "just because there might be more to do" —
      check the instructions. Instead of creating todos for archiving, cleanup,
      packaging, PDF generation, status updates, or file reorganization — these are
      handled automatically by the system. Instead of inventing deliverables not
      mentioned in instructions.md — only produce what was requested.
