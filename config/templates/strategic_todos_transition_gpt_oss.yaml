# Strategic todos for phase transitions (gpt-oss optimized)
# Addresses known gpt-oss failure modes: skeleton trap, strategic loops,
# false confidence, and todo_complete omission. Two todos: review-and-adapt
# (with content checks), then plan-or-complete. The system already archives
# every phase boundary automatically — no retrospective deliverable exists.
#
# IMPORTANT: The PLAN todo (id 2) starts with the stop condition.
# If all deliverables are done, call job_complete. Do NOT invent new work.
todos:
  - id: 1
    content: >-
      REVIEW AND ADAPT: Check what the previous phase actually produced, then
      REWRITE plan.md where reality diverged (do NOT append).

      Use git evidence, not memory:
      (1) Use git_tags to list the phase boundary tags
          (<job_short_id>-phase-<N>-<type>-complete; each marks the END of that phase).
      (2) Use git_diff between the two most recent boundary tags to see all file
          changes (only one tag yet? diff from the "[Phase 0 Seed]" commit in
          git_log). The completed/not-completed todo record is already in
          archive/ — written automatically.
      (3) CONTENT CHECK: read_file every output/ file the phase touched. Does it
          contain substantive prose, or just headings and placeholders? Is the
          word count reasonable (a chapter 400+ words, a section 100+)? Any
          "*Placeholder:*" or "[TODO:" markers left?

      Then REWRITE the relevant parts of plan.md in place (one write_file):
      - Mark completed phases with actual outcomes and content assessment
        ("Phase 2: output/chapter3.md, 1,847 words of prose" NOT "created").
      - A phase that produced only skeletons is INCOMPLETE — add a continuation
        phase for the real content.
      - Remove phases no longer needed; keep every remaining phase mapped to a
        deliverable in plan.md's "## Deliverables" section.

      COMPLETION CRITERIA: plan.md rewritten (not appended to) with accurate,
      content-assessed outcomes, backed by git evidence.

      INSTEAD OF: Writing a separate retrospective file — the archive and git
      history already record the phase. Instead of housekeeping phases
      (archiving, cleanup, packaging) — the system handles those.

  - id: 2
    content: >-
      PLAN OR COMPLETE — The stop condition comes FIRST.

      === STOP CONDITION (check FIRST) ===

      Check plan.md's "## Deliverables" section. Use list_files('output/') and
      read_file on EACH deliverable to confirm it is genuinely complete:
      substantive content (not headings or placeholders), appropriate size, no
      "*Placeholder:*" or "[TODO:" markers, matches instructions.md.

      If ALL deliverables pass, call job_complete with:
      - summary: what was accomplished across all phases
      - deliverables: list of output file paths
      - confidence: honest, based on content quality:
        * 0.8-1.0: all deliverables complete with substantive, verified content
        * 0.5-0.7: most complete, some gaps or quality concerns
        * 0.2-0.4: significant gaps, incomplete deliverables
        * 0.0-0.2: skeleton/placeholder output, major requirements unmet
      - notes: caveats or areas a reviewer should check

      If ANY deliverable is a skeleton, placeholder, or missing, DO NOT call
      job_complete — continue below.

      === CONTINUE CONDITION ===

      Call next_phase_todos with the todos for the next tactical phase — enough
      to cover the remaining work in one phase where possible. Each
      todo MUST produce substantive content (NEVER "create skeleton" or "add
      headings"), name exact files, sections, and expected word counts, and be
      completable in 1-3 tool calls. Include a verification todo that checks
      CONTENT QUALITY, not just file existence. (The todo-guide skill at
      skills/todo-guide/SKILL.md covers todo crafting.)

      {% if has_tool("kb_write") -%}
      If this phase surfaced a durable lesson (a decision, a failed approach and
      why, a discovered fact), record it with one kb_write before continuing.
      Skip this when there is nothing durable.
      {% else -%}
      If this phase surfaced a durable lesson (a decision, a failed approach and
      why, a discovered fact), record it in notes/ before continuing. Skip this
      when there is nothing durable.
      {%- endif %}

      COMPLETION CRITERIA: Either job_complete called (all deliverables verified
      substantive) OR next_phase_todos called (work remains).

      INSTEAD OF: Calling job_complete when output files contain only headings.
      Instead of creating todos for archiving, cleanup, or packaging.
      Instead of inventing deliverables not in instructions.md.
