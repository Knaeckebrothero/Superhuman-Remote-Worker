# =============================================================================
# LLM Configuration (configmap values)
# =============================================================================
llm:
  # NOTE: builder/browser/citation/vision/embedding model IDs and base URLs
  # are admin-curated catalog rows now (system_api_keys + llm_endpoints
  # tables, plus default-model pins via Admin → Providers → Defaults).
  # The orchestrator resolves them at runtime through the model registry.
  # See docs/features/db_backed_llm_config.md and
  # docs/features/models_yaml_removal.md for the migration rationale.
  #
  # Removed in chunk 7 of models_yaml_removal:
  #   visionModel, embeddingModel, embeddingBaseUrl, codexBaseUrl,
  #   builderProvider
  # Pin replacement defaults via Admin → Models → Defaults.
  keyCooldownSeconds: "3600"

  # ---------------------------------------------------------------------------
  # One-shot seed for system-scoped provider keys and LLM endpoints. Applied
  # by a post-install / post-upgrade Job. Insert-only: existing rows in
  # system_api_keys and llm_endpoints (user_id IS NULL) are NEVER
  # overwritten, so admin-UI edits survive `helm upgrade`. Leave enabled:false
  # to bring the stack up empty and configure providers via Admin → Providers.
  # ---------------------------------------------------------------------------
  seed:
    # -- Enable the seed Job. Missing/false leaves system tables untouched.
    enabled: false

    # -- Optional: system API keys keyed by provider. Each entry references
    # an existing Secret in the release namespace — plaintext keys must never
    # appear in values.yaml. In ESO mode the referenced Secret is populated by
    # Vault; in non-ESO mode the operator creates it by hand.
    #
    # systemApiKeys:
    #   openai:
    #     secretName: "srw-llm-seed"
    #     key: "openai_api_key"
    #   anthropic:
    #     secretName: "srw-llm-seed"
    #     key: "anthropic_api_key"
    systemApiKeys: {}

    # -- Optional: system-scoped OpenAI-compatible endpoints (vLLM, Ollama,
    # local gateways). Visible to every user. `apiKeyRef` is optional — omit
    # for keyless endpoints like in-cluster vLLM.
    #
    # `capability` on each model is optional and defaults to `chat`. Set it
    # to `embedding`, `vision`, `auxiliary`, or `whisper` to route the row
    # to the matching slot in Admin → Providers → Defaults. A single endpoint
    # can back multiple capabilities (e.g., Groq serving chat + whisper, or
    # OpenRouter serving chat + embedding) by listing the same `apiKeyRef`
    # once and adding one model row per physical model — a single row can
    # claim multiple capabilities via `capabilities: [...]` (see below).
    #
    # systemEndpoints:
    #   - label: "Local Gemma"
    #     baseUrl: "http://vllm.ai.svc.cluster.local:8000/v1"
    #     apiKeyRef:
    #       secretName: "srw-llm-seed"
    #       key: "gemma_api_key"
    #     models:
    #       - id: "RedHatAI/gemma-4-31B-it-FP8-Dynamic"
    #         displayName: "Gemma 4 31B"
    #         family: "gemma"
    #         contextWindow: 128000
    #         reasoningLevel: null
    #         capabilities: [chat, auxiliary]  # explicit array (preferred)
    #       - id: "qwen3-embedding-8b"
    #         displayName: "Qwen3 Embedding 8B"
    #         capability: embedding             # singular shorthand also accepted
    #       - id: "whisper-large-v3"
    #         displayName: "Whisper Large v3"
    #         capability: whisper
    #       - id: "kokoro-tts"
    #         displayName: "Kokoro TTS"
    #         capability: tts
    systemEndpoints: []

    # -- Optional: provider-direct catalog rows (served by a system API key,
    # not a custom endpoint). Each entry is one physical model — under the
    # capabilities[] array model, a single row can serve multiple roles
    # (e.g. ['chat', 'auxiliary'] for any chat-capable LLM, or
    # ['chat', 'auxiliary', 'vision'] for a multimodal one).
    #
    # `provider` must match an entry in `systemApiKeys` above (or one already
    # in the DB) — entries whose provider has no key seeded are skipped.
    #
    # Capability inputs:
    #
    # - `capabilities: [chat, auxiliary]` — explicit array, respected as-is.
    #   No auto-expansion: write `[chat]` and you get a chat-only row.
    # - `capability: chat` — singular shorthand. Auto-expanded to
    #   ['chat', 'auxiliary'] (chat-capable LLMs always serve auxiliary).
    #   Singular for any other enum value lands as `[<value>]`.
    # - `multimodal: true` — convenience flag that adds 'vision' to a
    #   chat-capable row. Use it for known multimodal models so the same
    #   physical row also surfaces in the vision dropdown.
    #
    # systemModels:
    #   - provider: "anthropic"
    #     id: "claude-opus-4-7"
    #     displayName: "Claude Opus 4.7"
    #     capabilities: [chat, auxiliary, vision]   # multimodal → all three
    #     family: "claude-opus"
    #     contextWindow: 200000
    #     reasoningLevel: null
    #   - provider: "openai"
    #     id: "gpt-4o"
    #     displayName: "GPT-4o"
    #     capability: chat                          # auto-expands to [chat, aux]
    #     multimodal: true                          # +vision
    #     family: "gpt-4o"
    #   - provider: "openai"
    #     id: "text-embedding-3-large"
    #     displayName: "OpenAI Embedding (Large)"
    #     capability: embedding                     # singleton: [embedding]
    systemModels: []

    # -- Resource requests for the short-lived seed Job pod.
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# =============================================================================
# Citation Engine
# =============================================================================
# NOTE: `llmUrl` / `llmModel` / `reasoningLevel` moved to the DB-backed LLM
# config. The orchestrator passes resolved values through job
# `config_override` at dispatch; the agent no longer reads CITATION_LLM_MODEL
# / CITATION_LLM_URL from env. Embedding model/URL stay here for now.
citation:
  embeddingModel: "qwen3-embedding-8b"
  embeddingUrl: ""

