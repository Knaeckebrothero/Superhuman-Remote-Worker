# Superhuman Remote Worker — Helm Chart Values
# See knowledge-base/knowledge/helm_migration.md for architecture overview.

# -- Override chart name in resource names
nameOverride: ""
# -- Override full resource name prefix
fullnameOverride: ""

# =============================================================================
# Namespace
# =============================================================================
namespace:
  # -- If true, the chart creates the namespace it's deployed into. The
  # Namespace manifest is annotated `helm.sh/resource-policy: keep` so
  # `helm uninstall` does NOT delete it (which would cascade-delete every
  # PVC, including the databases). To fully wipe an installation:
  #   helm uninstall <release> -n <ns>
  #   kubectl delete namespace <ns>
  # Leave false if the namespace is managed elsewhere (e.g. Fleet, Kustomize,
  # or `kubectl apply -f namespace.yaml` before `helm install`).
  create: false

# =============================================================================
# License Acceptance
# =============================================================================
# The Superhuman Remote Worker source is publicly available under the terms in
# the LICENSE file of the source repository. You must explicitly accept those
# terms to install and run the application.
#
#   See: https://github.com/knaeckebrothero/Superhuman-Remote-Worker/blob/main/LICENSE
#
# The chart refuses to render when license.acceptTerms is false, and the
# orchestrator refuses to start (enforced at runtime via LICENSE_TERMS_ACCEPTED).
license:
  # -- REQUIRED: set to true to accept the license terms.
  acceptTerms: false

global:
  # -- REQUIRED: Base domain (e.g. "example.com"). All subdomains are derived automatically.
  domain: ""
  # -- Pull secrets for private container registries (e.g. GHCR)
  imagePullSecrets: []
  #   - name: ghcr-pull-secret
  # -- Per-component hostname overrides. When unset, each defaults to
  # <subdomain>.<global.domain>. Set when a flat subdomain is already taken
  # by another service in the same parent zone (e.g. an existing
  # git.example.com forces using git-srw.example.com here). Each override
  # is a full hostname (no scheme, no path) and propagates to Ingress hosts,
  # ConfigMap URLs, OIDC redirect URIs, and the cockpit env-init script.
  # TLS Secret names stay tied to the release name, not the host.
  hostnames:
    cockpit: ""        # default: <domain>             (cockpit root)
    api: ""            # default: api.<domain>
    auth: ""           # default: auth.<domain>        (overridden by keycloak.externalIssuerUrl when keycloak.internal=false)
    git: ""            # default: git.<domain>         (overridden by gitea.externalUrl when gitea.internal=false)
    cloud: ""          # default: cloud.<domain>       (overridden by cloud.externalUrl when using external cloud)
    mcp: ""            # default: mcp.<domain>
    neo4j: ""          # default: neo4j.<domain>       (Neo4j browser UI)
    neo4jBolt: ""      # default: bolt-neo4j.<domain>  (Bolt TLS SAN + LoadBalancer host)
    pgadmin: ""        # default: pgadmin.<domain>
    dozzle: ""         # default: dozzle.<domain>
    headscale: ""      # default: headscale.<domain>   (overridden by headscale.url when set)
    minio: ""          # default: minio.<domain>       (cockpit deep-link only — chart does not deploy MinIO)

# =============================================================================
# Container Images
# =============================================================================
image:
  orchestrator:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-orchestrator
    tag: latest
    digest: ""
    pullPolicy: Always
  agent:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-agent
    tag: latest
    digest: ""
    pullPolicy: Always
  cockpit:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-cockpit
    tag: latest
    digest: ""
    pullPolicy: Always
  mcp:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-mcp
    tag: latest
    digest: ""
    pullPolicy: Always
  workspace:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-workspace
    tag: latest
    digest: ""
    pullPolicy: Always

# Public, declarative component identity. Source revisions are full commit IDs,
# never display tags. Artifact digests remain empty unless the corresponding
# image is actually deployed by digest above.
provenance:
  sourceUrl: https://github.com/knaeckebrothero/Superhuman-Remote-Worker
  documentationUrl: https://github.com/knaeckebrothero/Superhuman-Remote-Worker/tree/main/docs
  releaseVersion: ""
  components:
    orchestrator:
      sourceRevision: ""
      releaseVersion: ""
    agent:
      sourceRevision: ""
      releaseVersion: ""
    cockpit:
      sourceRevision: ""
      releaseVersion: ""
    mcp:
      sourceRevision: ""
      releaseVersion: ""
    workspace:
      sourceRevision: ""
      releaseVersion: ""

# =============================================================================
# Orchestrator
# =============================================================================
orchestrator:
  # -- 1 replica by default. NOT a statement about what HA needs: leader
  # election (M1) makes replicas:2 correctness-safe and removes the
  # orchestrator as a hard SPOF — one pod can fail or drain with zero serving
  # blackout, live-verified on dev 2026-06-26. The default optimises for the
  # single-node self-host on a mini PC, whose operator is the least likely to
  # edit this file and for whom a second replica is pure overhead. Raise it to
  # 2+ on any cluster with more than one node; the PDB below follows
  # automatically, and `databases.profile: ha` is the data-tier counterpart.
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      # 2Gi (was 1Gi): headroom for a rare, unattributed transient memory
      # spike observed during session resume that OOM-killed the pod (steady
      # state is ~150-280Mi). Stopgap, not a diagnosed leak.
      memory: "2Gi"
      cpu: "500m"
  # -- Auto-assign jobs to idle agents
  autoAssignEnabled: "true"
  # -- Enable durable completion-command admission/finalization. Ships dark;
  # open only after the Gate-3 parity and crash-recovery proof is complete.
  completionCommandsEnabled: false
  # -- Move terminal status behind Class B and delivery-gated completion
  # effects. Independently revertible and invalid unless completion commands
  # are also enabled.
  completionStatusReorderEnabled: false
  # -- Local crash-recovery proof hook: pause after durable command acceptance
  # and before inline finalization. Keep at zero outside an intentional test.
  completionFinalizerInlineDelaySeconds: 0
  # -- Automatic image-drift and missing-pod reconciliation for commissioned
  # Officer runtimes. First rollout stays dark until every orchestrator
  # replica serves the parked-boundary acknowledgement contract; the
  # owner/admin manual recycle endpoint remains available while false.
  persistentAgentReconciliationEnabled: false
  # -- Admin-only, exact-binding runtime-grant verification plans. This is a
  # deployed-test seam, never an Officer/model capability; every profile ships
  # disabled and a bounded gate enables it only for the test interval.
  officerRuntimeVerificationEnabled: false
  # -- Additional exact Git host or host:port endpoints trusted for external
  # OKF KB datasources. The built-in public-provider set remains enabled.
  # Wildcards, IP literals, and localhost are rejected. Example:
  # "gitea.example.com,gitea.internal:3000"
  # Gitea, so an external OKF KB connector can reach a repo hosted here.
  # Without this only github.com/gitlab.com/bitbucket.org/codeberg.org are
  # trusted and the connector fails closed. Exact host:port, no wildcards.
  #
  # NOTE the public HTTPS name, not srw-gitea:3000. Token/password auth is
  # refused over plain http (kb_git_source.validate_git_auth_configuration),
  # and the in-cluster service exposes only port 3000 over http — so a private
  # repo can only be reached via the TLS ingress. Keep both entries: the
  # in-cluster name still serves a public (credential-less) repo.
  kbGitAllowedHosts: "git.srw.works,srw-gitea:3000"
  # -- Optional OpenSSH known_hosts content for external OKF KB deploy-key
  # remotes. Non-empty content switches SSH from accept-new to strict pinning.
  kbGitSshKnownHosts: ""
  # -- Maximum simultaneous external OKF Git snapshot/embed operations per
  # orchestrator replica (create/update/manual/test plus the leader sweep).
  kbExternalReindexConcurrency: 2
  # -- Seconds between leader-gated native/external OKF freshness sweeps.
  kbReindexSweepSeconds: 900
  # -- Per-store asyncpg connection pool sizing for the orchestrator's own
  # pools (control-plane app DB, pgvector, audit trail). The orchestrator does
  # NOT envFrom the shared ConfigMap, so these are wired as explicit env in
  # orchestrator/deployment.yaml — the ConfigMap's POSTGRES_*_CONNECTIONS carry
  # the small AGENT-pod sizing (agent.dbPool) and must not reach the
  # orchestrator. These match the code defaults; override only to tune.
  # Budget per server: sum(maxes across replicas + agents) <= max_connections
  # - 3 reserved - ~10 headroom. At the defaults (replicas=2,
  # agent.pool.maxAgents=10, agent.dbPool.app.max=3), per server:
  #   app    : 2*10 (orch) + 10*3 (agents) = 50   (fits default max_connections=100)
  #   vector : 2*5  + 10*3 = 40
  #   audit  : 2*4  + (agents keep the code default) = 8
  # Scaling to ~30 agents pushes app to 2*10 + 30*3 = 110 -> raise Postgres
  # max_connections, trim agent.dbPool.app.max, or front the app DB with
  # pgbouncer (transaction mode; the advisory-lock migration runner + LISTEN
  # users stay on direct connections).
  dbPool:
    app:
      min: "2"
      max: "10"
    vector:
      min: "1"
      max: "5"
    audit:
      min: "1"
      max: "4"
  # -- Budget (seconds) for the WS proxy to wait for the agent's /ready
  # endpoint to flip true. Must outlast the agent's own workspace SSH poll
  # (120s) plus margin for cold workspace image pulls (~130s observed).
  wsReadyTimeoutSeconds: 180
  # -- Budget (seconds) for the WS proxy to wait for an agent pod to register
  # and bind to a thread. Must accommodate a cold agent image pull on every
  # node — observed up to 5+ minutes for a fresh tag with no cache.
  agentBindTimeoutSeconds: 300
  # -- Graceful shutdown. On SIGTERM the pod is removed from Service endpoints;
  # the preStop sleep holds the container alive while that removal propagates
  # (kube-proxy/LB) so in-flight requests drain instead of being cut. Long-lived
  # SSE streams drop regardless and are recovered by thread_events replay.
  preStopDrainSeconds: 15
  # -- Must exceed preStopDrainSeconds + lifespan shutdown (background loops,
  # NATS drain, DB pool close).
  terminationGracePeriodSeconds: 60
  # -- Pod Disruption Budget. minAvailable is DERIVED from `replicas`, not
  # configured: 1 above a single replica (a leader keeps serving through
  # kubectl drain / node cordon — M1, live-verified on dev 2026-06-26), and 0
  # at replicas:1, where minAvailable:1 would block ALL voluntary evictions
  # (the 2026-05-16 incident mode). The knob used to be settable and the
  # warning was a comment; the template enforces it now.
  pdb:
    enabled: true

# =============================================================================
# Infrastructure allocation metering
# =============================================================================
# Gated infrastructure allocation metering. Slice 1 can run the dedicated Pod
# collector and shadow reconciliation without publishing customer usage.
infrastructureMetering:
  v2ReadsEnabled: false
  sourceAwareReadsEnabled: false
  collectorEnabled: false
  shadowEnabled: false
  # Enables the authenticated one-shot fleet-admin cutover request surface.
  # It does not choose a barrier automatically and may be disabled again after
  # the durable state reaches active.
  cutoverEnabled: false
  publicationEnabled: false
  # Slice 2 storage classes remain independently dark-launched. Inventory can
  # be enabled without reconciliation, and reconciliation without publication.
  # The global collector/shadow/publication gates remain mandatory masters.
  pvcInventoryEnabled: false
  pvInventoryEnabled: false
  pvcShadowEnabled: false
  pvShadowEnabled: false
  pvcPublicationEnabled: false
  pvPublicationEnabled: false
  # Slice 3 compute classes reuse Pod inventory where possible but cannot
  # inherit an already-active workspace cutover. Each class has its own
  # shadow/publication gate and durable activation boundary.
  idePodShadowEnabled: false
  agentPodShadowEnabled: false
  idePodPublicationEnabled: false
  agentPodPublicationEnabled: false
  # Remote KubeVirt inventory uses a dedicated authenticated collector
  # identity. These remain dark until its transport and controller journal are
  # configured and validated on the VM cluster.
  vmInventoryEnabled: false
  vmShadowEnabled: false
  vmPublicationEnabled: false
  # Root-disk storage is collected by a second VM-cluster identity so the VMI
  # credential can never authorize PVC/PV observations. These inventory and
  # shadow gates are independent of both VMI compute and local-cluster storage.
  vmPvcInventoryEnabled: false
  vmPvInventoryEnabled: false
  vmPvcShadowEnabled: false
  vmPvShadowEnabled: false
  # Remote storage publication is authorized only by the main orchestrator.
  # The VM-cluster collectors remain database-free and cannot enable it.
  vmPvcPublicationEnabled: false
  vmPvPublicationEnabled: false
  # Kubernetes PVs are cluster-scoped. Enabling remote PV inventory grants the
  # dedicated storage collector visibility of every PV in the VM cluster, so
  # the server and remote chart both require this explicit acknowledgement.
  vmPvClusterWideRbacAcknowledged: false
  vmStableClusterId: ""
  vmNamespace: ""
  # Stable operator-owned installation identity. Required before collection or
  # publication; it must survive endpoint and credential rotation.
  stableClusterId: ""
  deploymentMode: dedicated
  # The release namespace is always included. Add separate workspace/agent
  # namespaces here; each receives its own namespace-scoped RoleBinding.
  namespaceAllowlist: []
  relistIntervalSeconds: 300
  staleAfterSeconds: 900
  # Remote lifecycle timestamps are evidence only. VMI scheduled transitions
  # outside this app-receipt skew window cannot become exact interval starts.
  maxCollectorClockSkewSeconds: 300
  listPageSize: 500
  scopeConcurrency: 2
  watchQueueSize: 10000
  maxSnapshotItems: 50000
  maxSnapshotBytes: 67108864
  ingestionTicketTtlSeconds: 600
  # Raw snapshot items are diagnostic scaffolding, not the durable accounting
  # record. Immutable manifests remain after their children expire.
  snapshotItemRetentionDays: 7
  diagnosticRetentionDays: 35
  cleanupIntervalSeconds: 300
  # Empty in chart-managed mode creates a dedicated preserved Secret readable
  # only by the collector and orchestrator. External secret modes must provide
  # a distinct Secret name; the main application Secret is rejected.
  ingestionSecretName: ""
  ingestionSecretKey: INFRASTRUCTURE_METERING_INGESTION_KEY
  # The VM-cluster collector uses an independently rotated HMAC credential.
  # Provision the same key into this Secret and the remote VM-cluster Secret;
  # this chart never copies credentials between clusters.
  vmIngestionSecretName: ""
  vmIngestionSecretKey: INFRASTRUCTURE_METERING_VMI_INGESTION_KEY
  # Remote PVC/PV inventory has its own rotated ingestion credential. Keep it
  # separate from the application, local collector, VMI, and durable-volume
  # identity Secrets; this chart never copies credentials between clusters.
  vmStorageIngestionSecretName: ""
  vmStorageIngestionSecretKey: INFRASTRUCTURE_METERING_VM_STORAGE_INGESTION_KEY
  # Controller lifecycle identity uses a fourth, dedicated credential. It is
  # intentionally never read from the application or collector Secrets because
  # dynamic guests/collectors must not be able to forge VM commands or admitted
  # UID evidence. Provision the same key independently on the VM cluster.
  vmLifecycleAuthSecretName: ""
  vmLifecycleAuthSecretKey: VM_LIFECYCLE_HMAC_SECRET
  # Optional authenticated route for a collector in another cluster. Prefer a
  # private tunnel; when this is enabled, TLS and an explicit source-CIDR
  # allowlist remain mandatory in addition to per-request HMAC authentication.
  remoteIngress:
    enabled: false
    sourceCidrs: []
  # PV identities use a separate, non-rotating HMAC key. In chart-managed
  # secret mode, an empty name creates a dedicated preserved Secret. Other
  # secret modes must name a separately provisioned Secret. The key version
  # becomes part of every durable identity and is required before PV inventory.
  volumeIdentitySecretName: ""
  volumeIdentitySecretKey: INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY
  volumeIdentityKeyVersion: ""
  # Optional ESO projections for metering credentials stored alongside the
  # existing application bundle. Vault-facing property names stay concise,
  # while each value is projected into a dedicated Kubernetes Secret under
  # the canonical runtime key expected by the collectors/controllers.
  externalSecrets:
    enabled: false
    vaultPath: ""
    vmiIngestionProperty: METERING_VMI_INGESTION_KEY
    vmStorageIngestionProperty: METERING_VM_STORAGE_INGESTION_KEY
    volumeIdentityProperty: METERING_VOLUME_IDENTITY_KEY
    vmLifecycleAuthProperty: METERING_VM_LIFECYCLE_HMAC_SECRET
  # Exact, operator-owned PV pricing classifications. These rules are stored
  # immutably by the orchestrator; collector labels and StorageClass parameters
  # can never select a priced resource. Empty means quantity-only/unpriced.
  volumeResourceMappings: []
  networkPolicy:
    # Egress-deny cannot infer every distribution's API-server address. Enable
    # after supplying the control-plane CIDRs used by this cluster. DNS is
    # restricted to the selected kube-system resolver Pods; adjust the selector
    # for distributions that do not use the standard CoreDNS label.
    enabled: false
    # Explicit break-glass acknowledgement for clusters where a supported
    # egress NetworkPolicy cannot be installed. Enabling the collector with
    # both this and `enabled` false is rejected at template time.
    allowUnrestrictedEgress: false
    apiServerCidrs: []
    dnsNamespace: kube-system
    dnsPodSelector:
      k8s-app: kube-dns
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# =============================================================================
# Agent
# =============================================================================
agent:
  # All agent pods are now provisioned dynamically by AgentProvisioner.
  # The static Deployment was removed in Phase 1a of the unified instance
  # lifecycle redesign — `agent.replicas` is no longer honored. The
  # PodDisruptionBudget and Service stay; they target the dynamic pods
  # via shared chart selector labels.
  config: "worker_base"
  port: "8001"
  persistentConfig: "interactive"
  # -- Apply admin-curated DB config overrides (config_overrides table) to
  # provisioned agents. Default OFF (prod-safe); the dev/experimental values
  # file turns it on. Gates only the agent's prompt resolver — not the
  # orchestrator or the admin UI (overrides remain editable regardless).
  configDbOverridesEnabled: "false"
  # -- Enable DB-backed experts for both orchestrator and agent.
  # DB-backed experts are the source of truth for the application and personal
  # root-creation defaults. Set false only as an emergency compatibility switch.
  expertsDbEnabled: "true"
  # -- Enable DB-backed Agent Skills (skills + skill_files tables). Default OFF
  # (prod-safe); the dev/experimental values file turns it on. Mirrors
  # expertsDbEnabled.
  skillsDbEnabled: "false"
  # -- Emergency operator-only withdrawal of the managed in-product App Guide.
  # Default OFF. This is not a user preference or normal feature gate; enable
  # only to contain a broken guide/reader, then disable it after rollback or
  # repair. Persistent-agent health reports operator_break_glass while active.
  appGuideBreakGlassDisabled: "false"
  # -- Dark-launch gate for the authenticated, read-only M2 product-capability
  # endpoint. This is an operator rollout control, not a user preference.
  # Keep false until the shadow comparison/acceptance gates pass.
  productCapabilitiesEndpointEnabled: "false"
  # -- Separate canary gate for the persistent-session capability tool.
  # Operators must also enable the endpoint gate for controlled live probes.
  productCapabilitiesToolEnabled: "false"
  # -- Enable user-added MCP servers as datasources. Both gates default off;
  # stdio executes third-party commands in agent pods and should remain off
  # for hosted/multi-tenant deployments without suitable isolation.
  mcpDatasourcesEnabled: "false"
  mcpStdioEnabled: "false"
  # -- Temporary compatibility gate for REST/session requests that omit
  # datasource_ids. Cockpit submits an explicit reviewed array; enable this
  # after legacy clients no longer encode "none" by omission.
  datasourceDefaultsOnOmission: "false"
  # -- Coordinated rollout gate for the connector project-scope/auto-attach UI.
  # Keep false until all orchestrator replicas understand the v1 API contract.
  datasourceScopeAutoAttachV1Enabled: "false"
  # -- Enable protected cloud mode: RO-reader provisioning + capture overlay.
  # Default OFF (prod-safe); the dev/experimental values file turns it on.
  # See knowledge-base/knowledge/design/cloud_access_unification.md §8 Phase 1.
  protectedCloudModeEnabled: "false"
  # -- Effective context ceiling (tokens) for models routed via the system codex
  # proxy, whose ChatGPT-OAuth backend caps context ~400K regardless of the
  # model's true API window. Compaction fires at 80% of this. Set 0 to disable
  # (e.g. once OpenAI ships 1M-for-Codex). See
  # knowledge-base/knowledge/issues/codex_proxy_context_window_cap.md.
  codexContextWindowCap: 400000
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  # -- Tailscale sidecar for mesh VPN to KubeVirt VMs
  tailscale:
    enabled: false
    image: ghcr.io/tailscale/tailscale:v1.82.5
    # -- Seconds the sidecar may stay disconnected before the liveness probe
    # kills it and the tunnel_dark reaper recycles the pod. Widen on small
    # deployments with long-idle pool agents; self-heal recovers transient loss.
    darkTimeoutSeconds: 600
  # -- Pod Disruption Budget
  pdb:
    enabled: true
    minAvailable: 0
  # -- Egress NetworkPolicy for agent pods (helm/templates/agent/network-policy.yaml).
  # Agent pods hold internal credentials and historically had NO policy at all;
  # this is the companion control to the local-execution-fallback removals
  # (no_workspace_agent_mode.md §9.1). In-cluster dependencies are allowed by
  # podSelector; public internet is allowed on TCP 80/443/22 minus the `except`
  # CIDRs below.
  networkPolicy:
    # -- DEFAULT OFF (opt-in). External LLM/Keycloak/Tavily work over the 443
    # wildcard out of the box, but a deployment whose LLM, Keycloak, or cloud
    # lives on an RFC1918 address (in-cluster other-namespace, or the home LAN)
    # MUST add an `extraEgress` carve-out before enabling, or agents lose model
    # access. See knowledge-base/knowledge/issues/agent_egress_networkpolicy_enablement.md.
    enabled: false
    # -- CIDRs subtracted from the 0.0.0.0/0 internet egress allow. Cluster
    # CIDRs + home LAN + link-local/metadata denied by default (prod-safe,
    # matches the workspace `internet-only` tier); in-cluster services stay
    # reachable only via the explicit podSelector rules in the template.
    except:
      - 10.0.50.0/24       # K3s nodes
      - 10.0.51.0/24       # MetalLB IPs (use podSelector for in-cluster services)
      - 10.42.0.0/16       # pod CIDR
      - 10.43.0.0/16       # service CIDR
      - 192.168.178.0/24   # home LAN
      - 169.254.0.0/16     # link-local / cloud-metadata
    # -- Extra egress rules appended verbatim to the policy (raw NetworkPolicy
    # egress entries). Use for an in-cluster LLM in another namespace
    # (namespaceSelector) or a LAN LLM/Keycloak/cloud endpoint (ipBlock) that
    # the `except` list above denies. Example:
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: ai
    #     ports:
    #       - protocol: TCP
    #         port: 8000
    extraEgress: []
  # -- Agent pool sizing (AgentProvisioner) — this is the agent COUNT, not DB
  # connections (see dbPool below).
  pool:
    maxAgents: "10"
    minAgents: "2"
    buffer: "1"
    reservedSessionSlots: "2"
    reservedJobSlots: "2"
  # -- Per-agent asyncpg connection pool sizing (app DB). Provisioned agent pods
  # inherit these via envFrom on the shared ConfigMap as POSTGRES_MIN/MAX_
  # CONNECTIONS. Kept small: the connection multiplier is agent COUNT, so this
  # bounds the fleet's total footprint on the app DB (maxAgents * app.max). The
  # agent's vector pool shares the same POSTGRES_* env, so one knob bounds both
  # its app and vector pools. asyncpg's default max_inactive_connection_lifetime
  # (300s) sheds idle connections between jobs. The orchestrator sizes its own
  # (larger) pools separately (orchestrator.dbPool) and never sees these values.
  dbPool:
    app:
      min: "1"
      max: "3"
  # -- Stateless executor Deployment (knowledge-base/knowledge/features/stateless_agents.md §5.8;
  # templates/agent/stateless-deployment.yaml). A static pool of generic agent
  # processes running `--mode stateless` that PULL work units from the
  # run_queue, replacing per-thread provisioning for queue-lane threads
  # (threads.execution_lane='stateless'). Coexists with the AgentProvisioner
  # plane: the pods carry distinct class labels so the agent Service/PDB,
  # reap/scale sweeps, and per-session routing never touch them.
  stateless:
    # -- DEFAULT OFF (prod-safe). This renders the executor pool and opens
    # stateless admission for supported session workspace tiers. Disabled
    # preserves pinned session behavior. VM/remote tiers remain pinned/refused
    # even when enabled.
    enabled: false
    # -- Warm floor of executor pods (§5.8: interactive floor ≥ 2). KEDA/HPA
    # autoscaling is a later, separately-gated addition.
    replicas: 2
    # -- Boot config for the executor process. Pool pods boot as workers and
    # re-resolve per-attach from the claim bundle, mirroring provisioner job
    # pods (agent.config above).
    config: "worker_base"
    # -- Pod resources for the stateless class. Empty = inherit
    # agent.resources.
    resources: {}
    # -- Worker-job admission on the stateless executor plane. This is
    # independent from `stateless.enabled`: the shared pool may serve session
    # turns while every new worker job continues to use the pinned lane.
    # Turning admission off does not stop these executor pods from draining
    # worker_batch rows that were already accepted into the durable queue.
    worker:
      # -- DEFAULT OFF. A fresh install preserves the pinned worker path.
      enabled: false
      # -- DEFAULT OFF. When enabled, omitted root jobs try the stateless lane
      # only when admission is open and an in-cluster Kubernetes sandbox is
      # available. Other workspaces fall back to pinned; VM jobs always pin.
      defaultEnabled: false
      # -- Minimum wall-clock budget for one worker batch. Production keeps a
      # five-minute floor; local acceptance may explicitly lower it.
      batchMinWallSeconds: 300

# =============================================================================
# Cockpit (Angular frontend)
# =============================================================================
cockpit:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"

  # Where the chart-rendered env.js ConfigMap mounts inside the cockpit
  # container. Defaults to the nginx static-asset path (production image
  # serves it verbatim). Tilt-mode dev image overrides this to land the
  # file in Angular's source tree so `ng serve` picks it up — set via
  # `deployment/values-tilt.yaml`.
  envJs:
    mountPath: "/usr/share/nginx/html/assets/env.js"

  # Opt-in startupProbe. Production nginx is ready in ~1 s so the existing
  # liveness probe's 30 s initialDelaySeconds is fine; Tilt-mode `ng serve`
  # cold-compile takes 30-90 s and trips the readiness probe before the
  # dev server can respond. Enabling this gives compile time without
  # slowing prod startup detection (which keeps using liveness/readiness).
  startupProbe:
    enabled: false
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30   # ≈10+5×30 = 160 s grace

  # NOTE: Model groups, presets, and builder model lists were removed in the
  # DB-backed LLM config migration. Cockpit now reads the catalog from
  # `GET /api/models`, which is the authoritative source (system endpoints
  # seeded via `llm.seed.systemEndpoints` + user endpoints). Empty catalogs
  # render a role-aware empty-state banner pointing operators to
  # Admin → Providers. See knowledge-base/knowledge/features/db_backed_llm_config.md.

# =============================================================================
# Dynamic Canvas
# =============================================================================
canvas:
  # Shared browser (knowledge-base/knowledge/features/shared_browser.md): stream the workspace
  # Chromium into the Canvas. Dark by default; the dev profile enables it.
  sharedBrowser:
    enabled: false
  livePreview:
    # -- Master capability gate for workspace-port live preview. The proxy,
    # isolated viewer origin, and browser acceptance gates must all fail closed
    # when this is false. Viewer/domain configuration and the dedicated internal
    # gateway are charted below, but wildcard DNS/TLS and the public edge remain
    # operator-owned. Enabling this flag alone admits `workspace_port` only for
    # positively attested eligible agents/internal calls; it creates no
    # browser-facing viewer or public route.
    enabled: false
    # -- Additional workspace loopback ports which live preview must reject.
    # The built-in control-port denylist remains enforced independently.
    deniedPorts: []
    # Browser-facing live-app delivery is a separate, stricter gate. The
    # conditional gateway below is internal-only by default; the optional
    # ingress block renders a standard wildcard Ingress for it. A normalizing
    # HTTP proxy in front (Cloudflare tunnel/proxy, an ordinary ingress
    # controller) is a supported edge: adjacent-slash merging is an accepted,
    # documented limitation of that mode, not a security regression (see
    # knowledge-base/knowledge/issues/canvas_hosted_edge_use_cloudflare_tunnel.md). Production
    # operators must still supply the restricted database role/Secret and the
    # PSL-boundary attestation.
    viewer:
      # -- Create the internal Canvas gateway and let the orchestrator advertise
      # viewer-session capability. Also requires livePreview.enabled=true and,
      # for the production profile, the PSL-boundary attestation below.
      enabled: false
      # -- `production` requires a verified effective-PSL boundary and
      # psl-isolated cookies. `development` may use cookie-free proxy mode but
      # is not a production security claim.
      deploymentProfile: production
      # -- Empty while disabled. Enabled values are `psl-isolated` or, only for
      # the development profile, `development-cookie-free`.
      cookieMode: ""
      # -- Dedicated, independently registrable user-content domain, without
      # scheme or wildcard (for example `example-userland.com`). Its exact name
      # must be the effective PSL boundary in production. No DNS/ingress is
      # created.
      domain: ""
      # -- Exact dotted suffix for random origins. Production requires this to
      # equal `.` plus domain, yielding one-label origins covered by a normal
      # first-level wildcard. Development may use a nested suffix.
      hostSuffix: ""
      # -- Exact trusted HTTPS Cockpit origins allowed to embed the gateway.
      cockpitOrigins: []
      # -- Explicit operator attestation. Production requires the exact
      # user-content domain to be a verified effective-PSL cookie boundary.
      pslBoundaryVerified: false
      sessionTtlSeconds: 900
      bootstrapTtlSeconds: 60
      attachmentTtlSeconds: 1200
      revalidateSeconds: 15
      replicas: 1
      # -- Optional plug-and-play wildcard Ingress for the gateway
      # (`*` + hostSuffix). Default off: deployments fronted by a Cloudflare
      # tunnel or an operator-owned edge route to the ClusterIP Service
      # directly. A cert-manager wildcard certificate requires a DNS-01
      # solver on the referenced issuer.
      ingress:
        enabled: false
        className: ""
        annotations: {}
        tls:
          enabled: true
          # -- cert-manager ClusterIssuer with a DNS-01 solver for the
          # user-content domain. Empty = no cert-manager annotation.
          issuerName: ""
          # -- Existing wildcard TLS Secret; empty derives a chart-local name.
          secretName: ""
      # The public gateway must never inherit the orchestrator's application
      # database credential. It connects with a dedicated login whose grants
      # are limited to the viewer/session query surface.
      database:
        # -- Dedicated PostgreSQL login. Chart-managed development credentials
        # use this fixed name so an uninstall/reinstall cannot strand older
        # privileged roles under operator-selected names.
        username: "srw_canvas_gateway"
        credentials:
          # -- Generate a dedicated Secret. Development/internal-Postgres only;
          # production must reference an operator-managed Secret instead.
          create: false
          # -- Existing Secret containing only the gateway DB credential.
          existingSecret: ""
          # -- Vault KV path containing exactly `username` and `password`.
          # This selects a chart-rendered ExternalSecret instead of a
          # pre-created Kubernetes Secret and requires externalSecrets.enabled.
          # The path is inert while viewer.enabled=false: no provider lookup or
          # credential requirement is created until the gateway is enabled.
          vaultPath: ""
          passwordKey: "CANVAS_VIEWER_POSTGRES_PASSWORD"
        # -- Reconcile the restricted login/grants with a bounded one-shot Job.
        # Allowed only for bundled Postgres and required with credentials.create.
        provisionRole: false
        pool:
          min: 1
          max: 4
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      limits:
        maxConnections: 256
        maxHttpPerSession: 16
        maxHeaderBytes: 65536
        maxHeaderFields: 100
        maxQueryBytes: 16384
        maxQueryFields: 256
        maxRequestBodyBytes: 10485760
        maxResponseBodyBytes: 104857600
        connectTimeoutSeconds: 5
        idleTimeoutSeconds: 60
        exchangeTimeoutSeconds: 300
      networkPolicy:
        # -- Both selectors must contain matchLabels and/or matchExpressions
        # before viewer.enabled can be set. They identify whatever fronts the
        # gateway — a Cloudflare tunnel connector (cloudflared), the cluster's
        # ingress-controller pods, or a dedicated edge — and open only that
        # source to the otherwise internal Service on TCP/8086.
        edgeNamespaceSelector: {}
        edgePodSelector: {}
        # -- Raw egress rules for an external app Postgres endpoint or
        # non-pod workspace SSH target. Built-in rules cover cluster DNS,
        # chart Postgres, and labelled in-cluster workspaces on SSH 22/30022.
        extraEgress: []

# =============================================================================
# Collabora Online — Office documents in Dynamic Canvas
# =============================================================================
# Official collabora-online dependency. This surface is deliberately dark by
# default: enabling it also requires an exact public origin, WOPI aliasgroup,
# Cockpit frame-ancestor CSP, and edge selectors (validated by the parent
# chart), plus one of the sessionRouter JWT-secret layouts below. Keep one
# replica and no HPA until a document-affinity design exists.
collabora:
  enabled: false
  # -- Exact browser-visible Collabora origin, without a trailing slash.
  # Example: https://office.example.com
  publicUrl: ""
  # Session-length read token; live user/thread/path checks remain the actual
  # revocation boundary on every WOPI request.
  tokenTtlSeconds: 36000
  discoveryCacheTtlSeconds: 21600
  discoveryTimeoutSeconds: 5
  maxOfficeBytes: 26214400

  # Official subchart values.
  replicaCount: 1
  autoscaling:
    enabled: false
    # Preserve the upstream value to make the required HPA override explicit.
    minReplicas: 2
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 50
    scaleDownDisabled: false
  terminationGracePeriodSeconds: 60
  image:
    repository: docker.io/collabora/code
    pullPolicy: IfNotPresent
    # Empty pins to the dependency's 26.04.x appVersion.
    tag: ""
  collabora:
    # Required when enabled. Must equal the host[:port] in publicUrl.
    server_name: ""
    # Required when enabled. aliasgroup1.host must exactly equal the rendered
    # in-cluster orchestrator URL printed by the validation error/NOTES.
    aliasgroups: []
    # When enabling, append the exact rendered Cockpit origin after
    # `frame-ancestors`, followed by `;`. The parent chart validates it.
    extra_params: >-
      --o:ssl.enable=false
      --o:ssl.termination=true
      --o:per_document.always_save_on_exit=true
      --o:admin_console.enable=false
      --o:net.content_security_policy=frame-ancestors
    proofKeysSecretRef: ""
    proofKeyGeneration:
      enabled: false
      secretName: ""
  resources:
    requests:
      cpu: 1800m
      memory: 2Gi
    limits:
      cpu: 1800m
      memory: 2Gi
  ingress:
    enabled: false
  route:
    enabled: false
  podLabels:
    srw.io/component: collabora
  # The dependency's generic policy stays off; the parent renders a stricter
  # DNS + WOPI-only policy with an ANDed edge namespace/pod selector.
  networkPolicy:
    enabled: false
    edgeNamespaceSelector: {}
    edgePodSelector: {}

# =============================================================================
# Auth — cockpit cookie BFF + (future) PAT system
# =============================================================================
# Knobs for the orchestrator's cookie-backed session layer for the cockpit.
# See knowledge-base/knowledge/features/auth_bff_and_api_tokens.md. The cookie domain defaults
# to a leading-dot prefix of global.domain so the cookie rides on both the
# cockpit and api subdomains; override below for non-shared parents.
auth:
  bff:
    # -- Keycloak client_id used by the orchestrator BFF when exchanging
    # the auth code at /token. Confidential client, distinct from the
    # cockpit SPA's public client (keycloak.cockpitClientId). They share
    # the realm + the user identity; only the auth model differs.
    clientId: "cockpit-bff"
    # -- Cookie Domain attribute. Sentinel-based:
    #     "auto"        → ".{{ global.domain }}" (the prod default — rides on
    #                     api.* and cockpit subdomains under one base domain)
    #     "" (empty)    → host-only (right for localhost dev; browsers reject
    #                     Domain=.localhost as a public-suffix edge case)
    #     "foo.example" → literal
    cookieDomain: "auto"
    # -- "1"=Secure flag set (production), "0"=cleartext for HTTP-only dev.
    cookieSecure: "1"
    # -- SameSite attribute. "lax" is right when cockpit + api share a base
    # domain (production: both under superhuman-remote-worker.com → same-site).
    # Set to "none" for split-host local dev (cockpit on `localhost`, api on
    # `api.localhost` — Chrome treats those as cross-site, so Lax blocks the
    # session cookie on the cockpit's XHR to the API). "none" requires Secure.
    cookieSamesite: "lax"
    # -- When true, route /api/* and /auth/* on the cockpit host through the
    # orchestrator (path-based routing on the cockpit ingress). Makes cockpit
    # and API same-origin → session cookie is first-party → works in every
    # browser regardless of 3rd-party cookie policy. The api.* ingress stays
    # in place (other consumers may use it). Use this for split-host local
    # dev. In prod where cockpit and api share a base domain, leave false
    # (cross-subdomain is already same-site).
    sameOriginApi: false
    # -- Idle session expiry (seconds). Validator rejects a session whose
    # last_seen_at is older than now() - this.
    sessionIdleTimeoutSeconds: 1800
    # -- Hard session lifetime (seconds). Anchored to KC refresh-token TTL
    # at session creation.
    sessionAbsoluteTimeoutSeconds: 2592000
    # -- How early (seconds) the validator refreshes the stored KC access
    # token before its `exp` claim. 60s avoids the rare clock-skew window
    # where the validator reuses a token KC has already rejected.
    accessTokenRefreshSkewSeconds: 60

# =============================================================================
# MCP Server (Claude Code / AI platform integration)
# =============================================================================
mcp:
  enabled: true
  replicas: 1
  # -- Reject mutable tag-only image references. Enable in production values;
  # local/Tilt workflows may leave this false for developer-built images.
  requireImageDigest: false
  # -- Also route the MCP server under the cockpit host at /mcp (e.g.
  # https://localhost/mcp on k3d). Convenience for local dev so a committed
  # .mcp.json works without a dedicated mcp.<domain> cert/DNS. Leave off in
  # prod, where the dedicated mcp.<domain> subdomain is the OAuth-client host.
  exposeOnRootHost: false
  oauth:
    enabled: true
    clientId: "mcp-server"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    # -- cert-manager ClusterIssuer name
    issuerName: ""
  # -- Extra annotations for all Ingress resources
  annotations: {}
  # -- CORS middleware (Traefik CRD) for cockpit -> API cross-origin
  cors:
    enabled: true
    # -- Extra browser origins allowed to call the API, in addition to the
    # canonical cockpit URL (srw.cockpitUrl). Use this when the app is served
    # from more than one domain (e.g. a domain migration where an old hostname
    # is kept as a working alias). Each entry is a full scheme://host origin.
    # Merged into both the orchestrator's CORS_ORIGINS env and the Traefik CORS
    # middleware allow-list.
    additionalOrigins: []
  # -- Layer 1 (P4b): block /api/agents/* and /api/internal/* at the public
  # API ingress so agent-internal paths can't be probed externally. Renders
  # a Traefik IPWhiteList middleware + a high-priority Ingress that 403s
  # those prefixes; the in-cluster Service stays reachable for the agent.
  #
  # Layer 2 (app-layer X-Internal-Key gate via require_internal) is always
  # on regardless of this toggle — every agent-internal endpoint also
  # refuses anonymous external callers at the application level.
  #
  # When to enable: you front the orchestrator with Traefik (or another
  # ingress controller that honors the same Middleware CRD) and want a
  # network-layer block before the request reaches the app.
  # When to leave off: you use a tunnel/edge that bypasses Traefik
  # (Cloudflare Tunnel, Tailscale Funnel, Ngrok, etc.) — Traefik never
  # sees the request, so the middleware would be dead code. Add the
  # equivalent path rule at your tunnel/edge instead. See
  # knowledge-base/knowledge/multi_tenancy.md for the cloudflared example.
  internalPathBlock:
    enabled: false

# =============================================================================
# Secrets — three modes (pick one)
# =============================================================================
secrets:
  # -- Mode 3: Reference a pre-existing K8s Secret by name
  existingSecret: ""
  # -- Mode 2: Chart creates a Secret from the values below (dev/testing only)
  create: false
  values: {}
  # -- Separate existing secret for VM SSH key (optional)
  existingVmSshKeySecret: ""

# -- Mode 1: External Secrets Operator (Vault-backed)
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretStoreRef: "vault-backend"
  secretStoreKind: "ClusterSecretStore"
  vaultPath: ""
  vmSshKeyVaultPath: ""

# =============================================================================
# Headscale — external Tailscale coordination server (consumed, not deployed).
# Headscale itself is deployed out of band (see HomeLab/deployments_managed/
# headscale/) so its lifecycle is independent of the SRW release.
# =============================================================================
headscale:
  # -- Full headscale server URL. When empty, falls back to
  # https://headscale.<global.domain> via the srw.headscaleUrl helper.
  url: ""

# =============================================================================
# Databases
# =============================================================================
# LangGraph checkpointer backend for WORKER jobs (persistent/interactive
# sessions don't use a checkpointer — they resume from thread_messages).
#
#   "postgres" (default) — graph state lives in the shared app Postgres, keyed
#     by thread_id = job_id. Any pod move (preemption, orphan-recovery, pod
#     eviction, rolling deploy, manual pause→resume) resumes from the actual
#     interruption point instead of cold-starting from the job opening. This is
#     the fix for the cross-pod cold-start class of bugs. The agent creates the
#     LangGraph tables (checkpoints / checkpoint_blobs / checkpoint_writes /
#     checkpoint_migrations) on first run via setup(); the orchestrator prunes a
#     job's rows when it reaches a terminal state (completed/failed/cancelled)
#     and KEEPS them while non-terminal (paused/waiting/pending_review) so those
#     can resume. Live checkpoint volume is therefore bounded to currently-active
#     jobs. Requires the orchestrator to receive CHECKPOINTER_BACKEND (wired as
#     an explicit env in helm/templates/orchestrator/deployment.yaml — it does
#     NOT read the ConfigMap via envFrom like the agents do), otherwise retention
#     silently no-ops.
#
#   "sqlite" — legacy pod-local checkpoint (/workspace/checkpoints/job_<id>.db).
#     Lower write traffic to Postgres, but a job that relocates to another pod
#     cold-starts. Use only if the shared-PG write load proves problematic; it's
#     the one-line rollback (revert this value, redeploy).
#
# Cutover caveat: at the flip, any in-flight job still holding a sqlite-only
# checkpoint has no PG checkpoint yet, so it cold-starts ONCE, then runs on PG.
# Docs: knowledge-history/done/cross_pod_resume_cold_starts_checkpoint_not_replicated.md
checkpointer:
  # -- Worker checkpointer backend: "postgres" (shared, cross-pod — default) or "sqlite" (pod-local, legacy)
  backend: "postgres"

# LLM-outage / cooldown resilience. Docs:
# knowledge-base/knowledge/features/llm_outage_pause_and_backoff_redispatch.md +
# knowledge-base/knowledge/features/llm_cooldown_pause_and_resume.md.
# This single ceiling is read by BOTH the orchestrator (give-up: fail a job
# loudly after this much continuous outage) AND every agent pod (cutoff: a quota
# cooldown whose provider-stated reset fits inside this budget PAUSES + resumes
# from checkpoint; a longer/multi-day wall fails fast). They MUST agree, so it
# flows through the shared ConfigMap (agents envFrom it; the orchestrator
# references the same key explicitly). The other llm_outage_* knobs (backoff,
# jitter, attempts, reset-window, sweep) are orchestrator-only and stay on code
# defaults — expose them here the same way only if a need arises.
llmOutage:
  # -- Max pause budget in seconds (default 12h): the outage give-up ceiling AND
  # the cooldown pause-vs-fail-fast cutoff. Lower to surface long walls to an
  # operator sooner; raise to wait out longer quota windows unattended.
  ceilingSeconds: 43200

databases:
  # -- CloudNativePG operator. The chart can install it as a subchart for a
  #    batteries-included self-host, or defer to one the cluster already runs
  #    (one operator serving many namespaces is the normal deployment, and is
  #    how the dev cluster is set up — cnpg-system, cluster-wide).
  operator:
    # -- Install the CloudNativePG operator as a subchart. OFF while every
    #    database still runs on `engine: statefulset` — an operator with no
    #    Cluster to reconcile is pure risk, and one operator serving many
    #    namespaces is the normal deployment (the dev cluster is set up that
    #    way: cnpg-system, cluster-wide, installed out of band).
    #    Turn it on for a self-host whose cluster has no operator yet.
    #    NOTE: Helm does not upgrade CRDs installed by a subchart, and
    #    `helm uninstall` does not remove them, so this is close to a one-way
    #    door. A cluster that already runs CloudNativePG must leave it off, or
    #    the two installs fight over the same cluster-scoped CRDs.
    install: false
    # -- Namespace the CloudNativePG operator runs in. The database
    #    NetworkPolicies allow it in so it can poll instance health and
    #    orchestrate failover; without this the operator is silently locked
    #    out and a failover simply never happens. Dev: cnpg-system.
    namespace: "cnpg-system"

  # -- Replica profile. Resolves DEFAULT instance counts and nothing else.
  #    single -> 1 each.  ha -> 2 each.  Per-database `instances` overrides it.
  #    Anti-affinity, PDBs and topology all derive from the RESOLVED count, so
  #    an explicit `instances: 3` behaves correctly without naming a profile.
  profile: single

  ha:
    # -- kubernetes.io/hostname on bare metal. On a hyperscaler set
    #    topology.kubernetes.io/zone: block volumes are zonal, so spreading
    #    across nodes inside one zone buys nothing.
    topologyKey: "kubernetes.io/hostname"

  # -- Continuous WAL archiving + scheduled base backups, via the Barman Cloud
  #    CNPG-I plugin. Applies only to databases on the `cnpg` engine.
  #
  #    REQUIRES that plugin, which this chart CANNOT install: it ships as a raw
  #    manifest that hardcodes the operator's namespace (cnpg-system), which a
  #    release deployed elsewhere does not own. See the runbook:
  #    knowledge-base/knowledge/operations/cnpg_backup_runbook.md
  backup:
    # -- none | objectstore. Default none, deliberately. Pointing this at the
    #    BUNDLED Garage would be worse than nothing: single node, one PVC, same
    #    cluster as the databases -- whatever kills the database plausibly kills
    #    the backup, while looking like a backup. Use storage in a different
    #    failure domain, and confirm a restore before believing it.
    method: "none"
    # -- s3://bucket/prefix. Required when method is objectstore. Each cluster
    #    gets its own folder underneath, named after the cluster.
    destinationPath: ""
    # -- Override S3 endpoint discovery (MinIO, Garage, Ceph, R2). Leave empty
    #    for AWS S3 proper.
    endpointURL: ""
    # -- CA bundle for an S3 endpoint served by a private CA.
    endpointCA:
      secretName: ""
      key: "ca.crt"
    # -- Secret holding the S3 credentials. Empty = the chart's own Secret, so
    #    the keys ride the existing Vault bundle rather than a second ESO path.
    credentialsSecret: ""
    accessKeyIdKey: "BACKUP_S3_ACCESS_KEY_ID"
    secretAccessKeyKey: "BACKUP_S3_SECRET_ACCESS_KEY"
    # -- XXu, u in [dwm]. Applies to base backups AND the WALs between them.
    retentionPolicy: "30d"
    wal:
      # -- bzip2 | gzip | lz4 | snappy | xz | zstd
      compression: "gzip"
    data:
      # -- bzip2 | gzip | lz4 | snappy. NOT xz or zstd -- those are WAL-only
      #    and the CRD rejects them here.
      compression: "gzip"
    # -- SIX-field cron, seconds FIRST (robfig/cron), not the five-field
    #    Kubernetes CronJob format. "0 0 2 * * *" is 02:00:00 daily; the
    #    five-field "0 2 * * *" is silently misparsed into the wrong time.
    schedule: "0 0 2 * * *"
    # -- Take one immediately when the ScheduledBackup is created, so a fresh
    #    install has a base backup before the first scheduled window. Without a
    #    base backup the WAL archive restores nothing.
    immediate: true

  postgres:
    enabled: true
    # -- Which implementation backs this database.
    #      statefulset — the bundled single-replica StatefulSet (today's default)
    #      migrating   — renders BOTH, so a CloudNativePG Cluster can import
    #                    from the live StatefulSet Service. Transitional only.
    #      cnpg        — the CloudNativePG Cluster only
    #    Removed once every instance is migrated and soaked.
    engine: "statefulset"
    # -- Override the profile's instance count for this database. null = derive.
    instances: null
    # -- max_connections for this server. The bundled StatefulSet inherited the
    #    image default of 100; CloudNativePG sets it explicitly. Budget
    #    arithmetic — orchestrator replicas x pool max, plus per-agent
    #    checkpointer connections — is documented above under `orchestrator`.
    #    Leave headroom for the instance manager's own connections.
    maxConnections: 100
    # -- pg_restore --jobs for the post-data (index) section during a
    #    `migrating` import. null = serial, which is right for a database whose
    #    restore is dominated by COPY rather than by index builds.
    importRestoreJobs: null
    # -- Extra postgresql.conf settings, merged over max_connections above.
    #    Values MUST be strings: CNPG's parameters map is map[string]string, and
    #    an unquoted integer fails admission for the whole Cluster.
    parameters: {}
    # -- Include this database in backups when databases.backup.method is set.
    backupEnabled: true
    # -- CloudNativePG operand image, used ONLY when `engine` is not
    #    `statefulset`. Deliberately separate from `image` above: CNPG's
    #    admission webhook parses the tag as a PostgreSQL version and rejects
    #    the StatefulSet's `pgvector/pgvector:pg15` outright ("invalid version
    #    tag", verified against the live CRD 2026-08-21).
    #
    #    CloudNativePG's own operand image, which already bundles pgvector
    #    0.8.6, uuid-ossp and btree_gist -- every extension this fleet uses.
    #    Verified by inspecting the image, not by reading the docs: the
    #    ImageVolume extension mechanism is PostgreSQL 18+ only, which is easy
    #    to mistake for "operands no longer bundle extensions". They do.
    #
    #    PINNED, not floating. imageName is part of the Cluster spec, so a
    #    moving tag would roll every Postgres cluster whenever upstream
    #    publishes. Bumping is a deliberate act; postgres-operand-check.yml
    #    reports weekly when a newer patch exists.
    cnpgImage: "ghcr.io/cloudnative-pg/postgresql:16.15"
    # -- Deploy StatefulSet within chart (false = external database — set
    # externalHost/externalPort/externalDb below)
    internal: true
    # -- External mode connection parts (used when internal=false). The
    # DSN is composed at runtime as
    # ``postgresql://<user>:<password>@<externalHost>:<externalPort>/<externalDb>``
    # where user/password come from the Secret (POSTGRES_USER /
    # POSTGRES_PASSWORD) — never from a single bundled URL key. This avoids
    # the urlsplit/`/`-encoding footgun of ``DATABASE_URL`` in Vault.
    # -- IMPORTANT (HA): orchestrator leader election (M1) uses a SESSION-scoped
    # Postgres advisory lock, which silently breaks behind a TRANSACTION-mode
    # connection pooler (PgBouncer/pgcat/RDS-Proxy in txn mode — the lock leaks
    # and can stall autovacuum). Point externalHost at a direct or session-mode
    # Postgres endpoint. See knowledge-history/researches/orchestrator_leader_election.md.
    externalHost: ""
    externalPort: 5432
    externalDb: "srw"
    # -- libpq TLS mode for the DSN the orchestrator and agents compose.
    #    Applies in BOTH internal and external mode. "prefer" is asyncpg's own
    #    default (encrypt if the server offers it, never verify), so leaving
    #    this alone changes nothing. A managed external Postgres usually wants
    #    "require", or "verify-full" to defeat MITM.
    #    NOTE: verify-ca/verify-full validate against the SYSTEM CA bundle. A
    #    private CA needs a mounted bundle, which is not yet supported.
    #    WARNING: the BUNDLED in-cluster database serves no TLS. Verified on
    #    k3d 2026-08-21: "prefer" and "disable" connect (ssl_in_use=False),
    #    "require" fails with 'rejected SSL upgrade'. Only raise this above
    #    "prefer" when internal=false -- or once the bundled database
    #    terminates TLS, which the CloudNativePG migration will change.
    sslMode: "prefer"
    image: pgvector/pgvector:pg15
    storageClass: ""
    storageSize: "16Gi"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  vector:
    enabled: true
    # -- Which implementation backs this database.
    #      statefulset — the bundled single-replica StatefulSet (today's default)
    #      migrating   — renders BOTH, so a CloudNativePG Cluster can import
    #                    from the live StatefulSet Service. Transitional only.
    #      cnpg        — the CloudNativePG Cluster only
    #    Removed once every instance is migrated and soaked.
    engine: "statefulset"
    # -- Override the profile's instance count for this database. null = derive.
    instances: null
    # -- max_connections for this server. The bundled StatefulSet inherited the
    #    image default of 100; CloudNativePG sets it explicitly. Budget
    #    arithmetic — orchestrator replicas x pool max, plus per-agent
    #    checkpointer connections — is documented above under `orchestrator`.
    #    Leave headroom for the instance manager's own connections.
    maxConnections: 100
    # -- pg_restore --jobs for the post-data (index) section during a
    #    `migrating` import. This database's restore is dominated by rebuilding
    #    3.9 GB of HNSW across ~850k rows, and index builds are exactly what
    #    the post-data section contains -- so parallelism here is the lever.
    #    Keep it at or below max_parallel_maintenance_workers above.
    importRestoreJobs: 4
    # -- Extra postgresql.conf settings, merged over max_connections above.
    #    Values MUST be strings: CNPG's parameters map is map[string]string, and
    #    an unquoted integer fails admission for the whole Cluster.
    #
    #    These two exist for the migration. A logical restore rebuilds all
    #    3.9 GB of this database's HNSW indexes from scratch, and the legacy
    #    server did that at maintenance_work_mem 64MB, where pgvector falls
    #    back to building the graph on disk with repeated merges. Keep
    #    maintenance_work_mem WELL under resources.limits.memory below -- above
    #    it, the build is OOM-killed rather than slow.
    parameters:
      maintenance_work_mem: "2GB"
      max_parallel_maintenance_workers: "4"
    # -- Include this database in backups when databases.backup.method is set.
    backupEnabled: true
    # -- CloudNativePG operand image, used ONLY when `engine` is not
    #    `statefulset`. Deliberately separate from `image` above: CNPG's
    #    admission webhook parses the tag as a PostgreSQL version and rejects
    #    the StatefulSet's `pgvector/pgvector:pg15` outright ("invalid version
    #    tag", verified against the live CRD 2026-08-21).
    #
    #    CloudNativePG's own operand image, which already bundles pgvector
    #    0.8.6, uuid-ossp and btree_gist -- every extension this fleet uses.
    #    Verified by inspecting the image, not by reading the docs: the
    #    ImageVolume extension mechanism is PostgreSQL 18+ only, which is easy
    #    to mistake for "operands no longer bundle extensions". They do.
    #
    #    PINNED, not floating. imageName is part of the Cluster spec, so a
    #    moving tag would roll every Postgres cluster whenever upstream
    #    publishes. Bumping is a deliberate act; postgres-operand-check.yml
    #    reports weekly when a newer patch exists.
    cnpgImage: "ghcr.io/cloudnative-pg/postgresql:16.15"
    # -- PostgreSQL extensions mounted as image volumes (CloudNativePG >= 1.29).
    #    REQUIRES Kubernetes >= 1.35, or 1.33/1.34 with the ImageVolume feature
    #    gate enabled on the API server and every kubelet, plus containerd
    #    >= 2.1.0. The image tag encodes the PostgreSQL major ("-18-"), so it
    #    must match `image` below. Declaring an extension only makes it
    #    AVAILABLE; the migrations still run CREATE EXTENSION.
    #    EMPTY ON PURPOSE. The operand image (`cnpgImage`) already carries
    #    pgvector, which is the "alternative for older clusters" this comment
    #    describes -- and it is not optional here: the only official extension
    #    images are PostgreSQL 18, so mounting one into the PostgreSQL 16
    #    operand would be a major-version mismatch. Revisit when the cluster
    #    reaches Kubernetes 1.35 and the custom image can be retired:
    #      - name: pgvector
    #        image:
    #          reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-18-trixie
    extensions: []
    internal: true
    # -- External mode connection parts. See ``databases.postgres`` above for
    # the rationale (credentials live in the Secret, not a bundled URL).
    externalHost: ""
    externalPort: 5432
    externalDb: "srw_vector"
    # -- libpq TLS mode for the DSN the orchestrator and agents compose.
    #    Applies in BOTH internal and external mode. "prefer" is asyncpg's own
    #    default (encrypt if the server offers it, never verify), so leaving
    #    this alone changes nothing. A managed external pgvector usually wants
    #    "require", or "verify-full" to defeat MITM.
    #    NOTE: verify-ca/verify-full validate against the SYSTEM CA bundle. A
    #    private CA needs a mounted bundle, which is not yet supported.
    #    WARNING: the BUNDLED in-cluster database serves no TLS. Verified on
    #    k3d 2026-08-21: "prefer" and "disable" connect (ssl_in_use=False),
    #    "require" fails with 'rejected SSL upgrade'. Only raise this above
    #    "prefer" when internal=false -- or once the bundled database
    #    terminates TLS, which the CloudNativePG migration will change.
    sslMode: "prefer"
    image: pgvector/pgvector:pg15
    storageClass: ""
    storageSize: "16Gi"
    # -- Resources for the CloudNativePG Cluster, used ONLY when `engine` is
    #    not `statefulset`. Separate from `resources` above because that one
    #    also sizes the legacy StatefulSet, and raising it there restarts a
    #    live database to reserve memory it never uses. Empty = inherit.
    cnpgResources:
      requests:
        # Sized for the index REBUILD a logical import performs, not for steady
        # state: this database carries 3.9 GB of HNSW across ~850k rows, and
        # the legacy pod ran it in ~169Mi. maintenance_work_mem above this
        # limit is an OOM kill, not a slow build.
        memory: "2Gi"
        cpu: "100m"
      limits:
        memory: "8Gi"
        cpu: "500m"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  # Audit DB (srw-auditdb) — the observability tier. Its own server so
  # observability writes can't take down the control plane (failure-domain
  # isolation). Append-only, monthly-partitioned, retention-bounded.
  audit:
    enabled: true
    # -- Which implementation backs this database.
    #      statefulset — the bundled single-replica StatefulSet (today's default)
    #      migrating   — renders BOTH, so a CloudNativePG Cluster can import
    #                    from the live StatefulSet Service. Transitional only.
    #      cnpg        — the CloudNativePG Cluster only
    #    Removed once every instance is migrated and soaked.
    engine: "statefulset"
    # -- Override the profile's instance count for this database. null = derive.
    instances: null
    # -- max_connections for this server. The bundled StatefulSet inherited the
    #    image default of 100; CloudNativePG sets it explicitly. Budget
    #    arithmetic — orchestrator replicas x pool max, plus per-agent
    #    checkpointer connections — is documented above under `orchestrator`.
    #    Leave headroom for the instance manager's own connections.
    maxConnections: 100
    # -- pg_restore --jobs for the post-data (index) section during a
    #    `migrating` import. null = serial, which is right for a database whose
    #    restore is dominated by COPY rather than by index builds.
    importRestoreJobs: null
    # -- Extra postgresql.conf settings, merged over max_connections above.
