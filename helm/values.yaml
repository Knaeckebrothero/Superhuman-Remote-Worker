# Superhuman Remote Worker — Helm Chart Values
# See docs/helm_migration.md for architecture overview.

# -- Override chart name in resource names
nameOverride: ""
# -- Override full resource name prefix
fullnameOverride: ""

# =============================================================================
# License Acceptance
# =============================================================================
# The Superhuman Remote Worker source is publicly available under the terms in
# the LICENSE file of the source repository. You must explicitly accept those
# terms to install and run the application.
#
#   See: https://github.com/knaeckebrothero/Superhuman-Remote-Worker/blob/main/LICENSE
#
# The chart refuses to render when license.acceptTerms is false, and the
# orchestrator refuses to start (enforced at runtime via LICENSE_TERMS_ACCEPTED).
license:
  # -- REQUIRED: set to true to accept the license terms.
  acceptTerms: false

global:
  # -- REQUIRED: Base domain (e.g. "example.com"). All subdomains are derived automatically.
  domain: ""
  # -- Pull secrets for private container registries (e.g. GHCR)
  imagePullSecrets: []
  #   - name: ghcr-pull-secret

# =============================================================================
# Container Images
# =============================================================================
image:
  orchestrator:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-orchestrator
    tag: latest
    pullPolicy: Always
  agent:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-agent
    tag: latest
    pullPolicy: Always
  cockpit:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-cockpit
    tag: latest
    pullPolicy: Always
  mcp:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-mcp
    tag: latest
    pullPolicy: Always
  workspace:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-workspace
    tag: latest
    pullPolicy: Always
  vpn:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-vpn
    tag: latest
    pullPolicy: Always

# =============================================================================
# Orchestrator
# =============================================================================
orchestrator:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # -- Auto-assign jobs to idle agents
  autoAssignEnabled: "true"

# =============================================================================
# Agent
# =============================================================================
agent:
  # -- Static replica count (0 = dynamic provisioning via AgentProvisioner)
  replicas: 0
  config: "defaults"
  port: "8001"
  persistentConfig: "interactive"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  # -- Tailscale sidecar for mesh VPN to KubeVirt VMs
  tailscale:
    enabled: false
    image: ghcr.io/tailscale/tailscale:v1.82.5
  # -- Pod Disruption Budget
  pdb:
    enabled: true
    minAvailable: 0
  # -- Agent pool sizing (AgentProvisioner)
  pool:
    maxAgents: "10"
    minAgents: "2"
    buffer: "1"
    reservedSessionSlots: "2"
    reservedJobSlots: "2"

# =============================================================================
# Cockpit (Angular frontend)
# =============================================================================
cockpit:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  # NOTE: Model groups, presets, and builder model lists were removed in the
  # DB-backed LLM config migration. Cockpit now reads the catalog from
  # `GET /api/models`, which is the authoritative source (system endpoints
  # seeded via `llm.seed.systemEndpoints` + user endpoints). Empty catalogs
  # render a role-aware empty-state banner pointing operators to
  # Admin → Providers. See docs/features/db_backed_llm_config.md.

# =============================================================================
# MCP Server (Claude Code / AI platform integration)
# =============================================================================
mcp:
  enabled: true
  replicas: 1
  oauth:
    enabled: true
    clientId: "mcp-server"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# =============================================================================
# Ingress
# =============================================================================
ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    # -- cert-manager ClusterIssuer name
    issuerName: ""
  # -- Extra annotations for all Ingress resources
  annotations: {}
  # -- CORS middleware (Traefik CRD) for cockpit -> API cross-origin
  cors:
    enabled: true

# =============================================================================
# Secrets — three modes (pick one)
# =============================================================================
secrets:
  # -- Mode 3: Reference a pre-existing K8s Secret by name
  existingSecret: ""
  # -- Mode 2: Chart creates a Secret from the values below (dev/testing only)
  create: false
  values: {}
  # -- Separate existing secret for VM SSH key (optional)
  existingVmSshKeySecret: ""

# -- Mode 1: External Secrets Operator (Vault-backed)
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretStoreRef: "vault-backend"
  secretStoreKind: "ClusterSecretStore"
  vaultPath: ""
  vmSshKeyVaultPath: ""

# =============================================================================
# VPN Sidecars (optional)
# =============================================================================
vpn:
  cluster:
    enabled: false
    port: "443"
  research:
    enabled: false
    port: "443"
  workstation:
    enabled: false
    port: "443"

# =============================================================================
# Headscale — self-hosted Tailscale coordination (optional)
# =============================================================================
headscale:
  enabled: false
  image: headscale/headscale:0.28.0
  storageClass: ""
  storageSize: "1Gi"
  stun:
    # -- NodePort for STUN/UDP (cannot go through HTTP ingress)
    enabled: true

# =============================================================================
# Databases
# =============================================================================
databases:
  postgres:
    enabled: true
    # -- Deploy StatefulSet within chart (false = external database — set externalUrl)
    internal: true
    # -- Full database URL for external mode. Required when internal=false.
    # When internal=true, DATABASE_URL is read from secrets.
    # Example: "postgres://user:pass@my-pg.db.svc:5432/srw"
    externalUrl: ""
    image: pgvector/pgvector:pg15
    storageClass: ""
    storageSize: "10Gi"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  vector:
    enabled: true
    internal: true
    # -- Full vector DB URL for external mode. Example: "postgresql://user:pass@vector-pg:5432/srw_vector"
    externalUrl: ""
    image: pgvector/pgvector:pg15
    storageClass: ""
    storageSize: "10Gi"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  mongodb:
    enabled: true
    internal: true
    # -- Full MongoDB URL for external mode. Example: "mongodb://my-mongo.db.svc:27017/srw_logs"
    externalUrl: ""
    image: mongo:7
    storageClass: ""
    storageSize: "5Gi"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  neo4j:
    enabled: true
    internal: true
    # -- Full Neo4j Bolt URL for external mode. Example: "bolt://my-neo4j.db.svc:7687"
    externalUrl: ""
    image: neo4j:5-community
    storageClass: ""
    storageSize: "10Gi"
    # -- Bolt TLS certificate via cert-manager (optional, internal-only)
    boltTls:
      enabled: false
      issuerName: ""
    # -- LoadBalancer for direct Bolt access (optional, internal-only)
    loadBalancer:
      enabled: false
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

# =============================================================================
# Supporting Services
# =============================================================================
gitea:
  enabled: true
  # -- Deploy Gitea StatefulSet within the chart. Set false to use external git server.
  internal: true
  # -- Internal cluster URL (when internal=false, set to your existing git server's internal URL)
  internalUrl: ""
  # -- Public URL (when internal=false, set to your existing git server's public URL).
  # When internal=true, defaults to https://git.{global.domain}.
  externalUrl: ""
  image: gitea/gitea:1.22-rootless
  storageClass: ""
  storageSize: "5Gi"
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"

keycloak:
  # -- Whether the system uses Keycloak/OIDC at all. Set false only for unauthenticated dev.
  enabled: true
  # -- Deploy Keycloak StatefulSet within the chart. Set false to use external OIDC provider.
  # When false, fill in the externalIssuerUrl and externalInternalUrl fields below.
  internal: true
  image: quay.io/keycloak/keycloak:26.2
  realm: "srw"
  # -- Public OIDC issuer URL (when internal=false, e.g. "https://login.microsoftonline.com/{tenant}/v2.0"
  # for Azure AD, or "https://accounts.google.com" for Google Workspace).
  # When internal=true, defaults to https://auth.{global.domain}.
  externalIssuerUrl: ""
  # -- Internal cluster URL for backend-to-OIDC traffic (when internal=false). Often same as
  # externalIssuerUrl if the IdP is reachable by both browser and cluster. When internal=true,
  # defaults to the internal Keycloak service.
  externalInternalUrl: ""
  # -- Cockpit OIDC client ID (the public SPA client). Default "cockpit" matches the bundled realm.
  cockpitClientId: "cockpit"
  # -- Disable the Keycloak admin group sync. When using external OIDC, set true so the
  # orchestrator doesn't try to call Keycloak admin APIs (project membership stays in Postgres).
  adminApiDisabled: false
  # -- ProtonMail Bridge cert extraction for SMTP STARTTLS (optional)
  bridgeCert:
    enabled: false
    smtpHost: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

nextcloud:
  enabled: false
  internal: true
  image: docker.io/library/nextcloud:31-apache
  replicas: 0
  storageClass: ""
  storageSize: "10Gi"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

opencloud:
  enabled: true
  image: docker.io/opencloudeu/opencloud:latest
  storageClass: ""
  dataStorageSize: "10Gi"
  configStorageSize: "1Gi"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# -- External cloud storage (used when both opencloud.enabled and nextcloud.enabled are false).
# Agent authenticates with a single service account (credentials in the secret as
# CLOUD_SERVICE_USER / CLOUD_SERVICE_PASSWORD). Per-user OAuth/linking is configured
# in-app as datasources, not by the chart.
cloud:
  # -- Backend type: "nextcloud" | "opencloud" | "webdav" | "" (disables external cloud)
  externalBackend: ""
  # -- Public URL (browser-visible). Used for deep-links from cockpit.
  externalUrl: ""
  # -- Internal URL the agent calls server-to-server. Defaults to externalUrl when empty.
  externalServiceUrl: ""

# =============================================================================
# Workspace
# =============================================================================
workspace:
  storageClass: ""
  storageSize: "20Gi"
  # -- Storage class for ephemeral per-job workspace PVCs
  ephemeralStorageClass: ""
  # -- NetworkPolicy restricting workspace pod traffic
  networkPolicy:
    enabled: true

# =============================================================================
# Optional Admin UIs
# =============================================================================
pgadmin:
  enabled: false
  image: dpage/pgadmin4:latest
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"

mongoExpress:
  enabled: false
  image: mongo-express:latest
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

dozzle:
  enabled: false
  image: amir20/dozzle:latest
  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"

codexProxy:
  enabled: false
  image: docker.io/eceasy/cli-proxy-api:latest
  storageSize: "1Gi"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# =============================================================================
# Reloader (watches ConfigMap/Secret changes and triggers rolling restarts)
# =============================================================================
reloader:
  enabled: true
  image: stakater/reloader:v1.3.0
  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "100m"

# =============================================================================
# LLM Configuration (configmap values)
# =============================================================================
llm:
  # NOTE: builder/browser/citation model IDs and base URLs moved to the
  # `system_api_keys` + `user_llm_endpoints` tables via the seed block below.
  # The orchestrator resolves them at runtime through the model registry;
  # they are no longer read from env at startup. See
  # docs/features/db_backed_llm_config.md for the migration rationale.
  keyCooldownSeconds: "3600"
  visionModel: "gpt-4o-mini"
  embeddingModel: "qwen3-embedding-8b"
  embeddingBaseUrl: ""
  codexBaseUrl: ""
  builderProvider: "openai"

  # ---------------------------------------------------------------------------
  # One-shot seed for system-scoped provider keys and LLM endpoints. Applied
  # by a post-install / post-upgrade Job. Insert-only: existing rows in
  # system_api_keys and user_llm_endpoints (user_id IS NULL) are NEVER
  # overwritten, so admin-UI edits survive `helm upgrade`. Leave enabled:false
  # to bring the stack up empty and configure providers via Admin → Providers.
  # ---------------------------------------------------------------------------
  seed:
    # -- Enable the seed Job. Missing/false leaves system tables untouched.
    enabled: false

    # -- Optional: system API keys keyed by provider. Each entry references
    # an existing Secret in the release namespace — plaintext keys must never
    # appear in values.yaml. In ESO mode the referenced Secret is populated by
    # Vault; in non-ESO mode the operator creates it by hand.
    #
    # systemApiKeys:
    #   openai:
    #     secretName: "srw-llm-seed"
    #     key: "openai_api_key"
    #   anthropic:
    #     secretName: "srw-llm-seed"
    #     key: "anthropic_api_key"
    systemApiKeys: {}

    # -- Optional: system-scoped OpenAI-compatible endpoints (vLLM, Ollama,
    # local gateways). Visible to every user. `apiKeyRef` is optional — omit
    # for keyless endpoints like in-cluster vLLM.
    #
    # systemEndpoints:
    #   - label: "Local Gemma"
    #     baseUrl: "http://vllm.ai.svc.cluster.local:8000/v1"
    #     apiKeyRef:
    #       secretName: "srw-llm-seed"
    #       key: "gemma_api_key"
    #     models:
    #       - id: "RedHatAI/gemma-4-31B-it-FP8-Dynamic"
    #         displayName: "Gemma 4 31B"
    #         family: "gemma"
    #         contextWindow: 128000
    #         reasoningLevel: null
    systemEndpoints: []

    # -- Resource requests for the short-lived seed Job pod.
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# =============================================================================
# Citation Engine
# =============================================================================
# NOTE: `llmUrl` / `llmModel` / `reasoningLevel` moved to the DB-backed LLM
# config. The orchestrator passes resolved values through job
# `config_override` at dispatch; the agent no longer reads CITATION_LLM_MODEL
# / CITATION_LLM_URL from env. Embedding model/URL stay here for now.
citation:
  embeddingModel: "qwen3-embedding-8b"
  embeddingUrl: ""

# =============================================================================
# Research Proxy (SOCKS5 via VPN sidecar)
# =============================================================================
research:
  proxyType: "socks5"
  proxyHost: ""
  proxyPort: "1080"

# =============================================================================
# Email / Notifications
# =============================================================================
email:
  enabled: false
  smtp:
    host: ""
    port: "1025"
    useTls: "true"
    trustSelfSigned: "true"
    from: ""
  imap:
    host: ""
    port: "1143"
    useSsl: "false"
    trustSelfSigned: "true"
    pollInterval: "30"
  agentEmail: ""
  domain: ""

notifications:
  ntfy:
    url: ""
    topic: ""

# =============================================================================
# S3 / Object Storage
# =============================================================================
s3:
  endpoint: ""
  bucket: "srw-snapshots"
  region: "us-east-1"
  snapshotMaxSizeGb: "10"
  snapshotRetentionDays: "90"

# =============================================================================
# IDE Sessions
# =============================================================================
ide:
  sessionIdleTimeout: "30"
  sessionMaxLifetime: "240"
  maxConcurrentPerUser: "2"
  codeServerImage: "codercom/code-server:latest"

# =============================================================================
# NATS Messaging (optional)
# =============================================================================
nats:
  url: ""

# =============================================================================
# Logging
# =============================================================================
logLevel: "DEBUG"
