    #    reports weekly when a newer patch exists.
    cnpgImage: "ghcr.io/cloudnative-pg/postgresql:16.15"
    internal: true
    # -- External mode connection parts (credentials live in the Secret).
    externalHost: ""
    externalPort: 5432
    externalDb: "srw_audit"
    # -- libpq TLS mode for the DSN the orchestrator and agents compose.
    #    Applies in BOTH internal and external mode. "prefer" is asyncpg's own
    #    default (encrypt if the server offers it, never verify), so leaving
    #    this alone changes nothing. A managed external audit Postgres usually wants
    #    "require", or "verify-full" to defeat MITM.
    #    NOTE: verify-ca/verify-full validate against the SYSTEM CA bundle. A
    #    private CA needs a mounted bundle, which is not yet supported.
    #    WARNING: the BUNDLED in-cluster database serves no TLS. Verified on
    #    k3d 2026-08-21: "prefer" and "disable" connect (ssl_in_use=False),
    #    "require" fails with 'rejected SSL upgrade'. Only raise this above
    #    "prefer" when internal=false -- or once the bundled database
    #    terminates TLS, which the CloudNativePG migration will change.
    sslMode: "prefer"
    # PostgreSQL 16 (>= 16.5 ships the DETACH CONCURRENTLY + partitioned-FK
    # fixes); 15.9+ is compatible if a 15.x is preferred for fleet uniformity.
    image: postgres:16
    storageClass: ""
    storageSize: "16Gi"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  # Dedicated Postgres for the bundled Gitea (gitea.database.type: postgres).
  # Its own server for the same failure-domain reason as the audit DB: Gitea is
  # a chatty writer on every agent push, and a git-metadata problem must not be
  # able to stall the control plane's DB. Only renders when the bundled Gitea,
  # `gitea.database.type: postgres`, and this DB are all internal.
  gitea:
    enabled: true
    # -- Which implementation backs this database.
    #      statefulset — the bundled single-replica StatefulSet (today's default)
    #      migrating   — renders BOTH, so a CloudNativePG Cluster can import
    #                    from the live StatefulSet Service. Transitional only.
    #      cnpg        — the CloudNativePG Cluster only
    #    Removed once every instance is migrated and soaked.
    engine: "statefulset"
    # -- Override the profile's instance count for this database. null = derive.
    instances: null
    # -- max_connections for this server. The bundled StatefulSet inherited the
    #    image default of 100; CloudNativePG sets it explicitly. Budget
    #    arithmetic — orchestrator replicas x pool max, plus per-agent
    #    checkpointer connections — is documented above under `orchestrator`.
    #    Leave headroom for the instance manager's own connections.
    maxConnections: 100
    # -- pg_restore --jobs for the post-data (index) section during a
    #    `migrating` import. null = serial, which is right for a database whose
    #    restore is dominated by COPY rather than by index builds.
    importRestoreJobs: null
    # -- Extra postgresql.conf settings, merged over max_connections above.
    #    Values MUST be strings: CNPG's parameters map is map[string]string, and
    #    an unquoted integer fails admission for the whole Cluster.
    parameters: {}
    # -- Include this database in backups when databases.backup.method is set.
    backupEnabled: true
    # -- CloudNativePG operand image, used ONLY when `engine` is not
    #    `statefulset`. Deliberately separate from `image` above: CNPG's
    #    admission webhook parses the tag as a PostgreSQL version and rejects
    #    the StatefulSet's `pgvector/pgvector:pg15` outright ("invalid version
    #    tag", verified against the live CRD 2026-08-21).
    #
    #    CloudNativePG's own operand image, which already bundles pgvector
    #    0.8.6, uuid-ossp and btree_gist -- every extension this fleet uses.
    #    Verified by inspecting the image, not by reading the docs: the
    #    ImageVolume extension mechanism is PostgreSQL 18+ only, which is easy
    #    to mistake for "operands no longer bundle extensions". They do.
    #
    #    PINNED, not floating. imageName is part of the Cluster spec, so a
    #    moving tag would roll every Postgres cluster whenever upstream
    #    publishes. Bumping is a deliberate act; postgres-operand-check.yml
    #    reports weekly when a newer patch exists.
    cnpgImage: "ghcr.io/cloudnative-pg/postgresql:16.15"
    # -- When false, the bundled Gitea points at externalHost/Port/Db below
    #    (managed Postgres — RDS, Cloud SQL, CloudNativePG). Credentials still
    #    come from the Secret (GITEA_DB_USER / GITEA_DB_PASSWORD).
    internal: true
    externalHost: ""
    externalPort: 5432
    externalDb: "gitea"
    # -- Gitea's libpq sslmode. "disable" is right for the in-cluster Service;
    #    a managed external Postgres usually wants "require" or "verify-full".
    sslMode: "disable"
    image: postgres:16
    storageClass: ""
    storageSize: "8Gi"
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  # Dedicated Postgres for the bundled Keycloak. Keeps the IdP's data plane
  # isolated from the orchestrator's. Only renders when both the bundled
  # Keycloak and this DB are internal.
  keycloak:
    enabled: true
    # -- Which implementation backs this database.
    #      statefulset — the bundled single-replica StatefulSet (today's default)
    #      migrating   — renders BOTH, so a CloudNativePG Cluster can import
    #                    from the live StatefulSet Service. Transitional only.
    #      cnpg        — the CloudNativePG Cluster only
    #    Removed once every instance is migrated and soaked.
    engine: "statefulset"
    # -- Override the profile's instance count for this database. null = derive.
    instances: null
    # -- max_connections for this server. The bundled StatefulSet inherited the
    #    image default of 100; CloudNativePG sets it explicitly. Budget
    #    arithmetic — orchestrator replicas x pool max, plus per-agent
    #    checkpointer connections — is documented above under `orchestrator`.
    #    Leave headroom for the instance manager's own connections.
    maxConnections: 100
    # -- pg_restore --jobs for the post-data (index) section during a
    #    `migrating` import. null = serial, which is right for a database whose
    #    restore is dominated by COPY rather than by index builds.
    importRestoreJobs: null
    # -- Extra postgresql.conf settings, merged over max_connections above.
    #    Values MUST be strings: CNPG's parameters map is map[string]string, and
    #    an unquoted integer fails admission for the whole Cluster.
    parameters: {}
    # -- Include this database in backups when databases.backup.method is set.
    backupEnabled: true
    # -- CloudNativePG operand image, used ONLY when `engine` is not
    #    `statefulset`. Deliberately separate from `image` above: CNPG's
    #    admission webhook parses the tag as a PostgreSQL version and rejects
    #    the StatefulSet's `pgvector/pgvector:pg15` outright ("invalid version
    #    tag", verified against the live CRD 2026-08-21).
    #
    #    CloudNativePG's own operand image, which already bundles pgvector
    #    0.8.6, uuid-ossp and btree_gist -- every extension this fleet uses.
    #    Verified by inspecting the image, not by reading the docs: the
    #    ImageVolume extension mechanism is PostgreSQL 18+ only, which is easy
    #    to mistake for "operands no longer bundle extensions". They do.
    #
    #    PINNED, not floating. imageName is part of the Cluster spec, so a
    #    moving tag would roll every Postgres cluster whenever upstream
    #    publishes. Bumping is a deliberate act; postgres-operand-check.yml
    #    reports weekly when a newer patch exists.
    cnpgImage: "ghcr.io/cloudnative-pg/postgresql:16.15"
    # -- When false, KC_DB_URL on the Keycloak pod uses externalUrl below.
    #    Lets the bundled Keycloak point at a managed Postgres (RDS, Cloud SQL).
    internal: true
    # -- Full JDBC URL for external mode. Example:
    #    "jdbc:postgresql://kc-pg.example.com:5432/keycloak?user=keycloak"
    #    The password still comes from KC_DB_PASSWORD in the secret.
    externalUrl: ""
    image: postgres:15
    storageClass: ""
    storageSize: "8Gi"
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "200m"
  neo4j:
    enabled: true
    internal: true
    # -- Full Neo4j Bolt URL for external mode. Example: "bolt://my-neo4j.db.svc:7687"
    externalUrl: ""
    # -- Auth credentials for the bundled Neo4j: both NEO4J_USERNAME and
    # NEO4J_PASSWORD live in the Secret (Vault), mirroring how the
    # POSTGRES_USER / VECTOR_POSTGRES_USER pairs
    # work — there is no chart-level value for the username. Community
    # edition allows only "neo4j"; enterprise can admit a different name,
    # but in either case the value is set via Vault, not values.yaml.
    # The chart composes NEO4J_AUTH for the server image as
    # ``$(NEO4J_USERNAME)/$(NEO4J_PASSWORD)``, so the Vault entry
    # ``NEO4J_AUTH`` itself is dead and can be removed.
    #
    # NOTE: don't put a "/" in NEO4J_PASSWORD. The Neo4j image splits
    # NEO4J_AUTH on the first slash, so a "/"-bearing password mis-parses
    # server-side and Bolt comes up unauthenticated. Use URL-safe base64
    # or any alphabet without "/".
    # -- Edition: "community" (default) or "enterprise". Enterprise unlocks
    #    multi-database, fine-grained RBAC, online backup, hot replicas, and
    #    better query planning. Free under Neo4j's Startup Program (<$10M
    #    revenue, <20 employees) or as a non-production "eval" license.
    #    Setting this to "enterprise" requires acceptLicense below.
    edition: community
    # -- Required when edition: enterprise. Set to "yes" if you have a
    #    commercial or Startup Program license, or "eval" for non-production
    #    testing under the developer license. Renders to NEO4J_ACCEPT_LICENSE_AGREEMENT.
    #    Leave empty for community (no license required).
    acceptLicense: ""
    # -- Container image. Auto-defaults to neo4j:5-community or neo4j:5-enterprise
    #    based on edition above; override here to pin a specific tag.
    image: ""
    storageClass: ""
    storageSize: "16Gi"
    # -- Neo4j Browser web UI (HTTP/7474) Ingress. Off by default — the DB
    # itself is reachable in-cluster on the Bolt port via the always-on
    # ClusterIP service, which is all the orchestrator/agents need. Turn this
    # on only if a human operator wants the Browser SPA. NOTE: enabling this
    # alone produces a *non-functional* UI — the SPA opens a Bolt WebSocket
    # back to NEO4J_server_bolt_advertised__address, so you also need
    # loadBalancer.enabled + boltTls.enabled below, plus a DNS record for the
    # neo4jBolt hostname pointing at the LoadBalancer IP.
    browser:
      enabled: false
    # -- Bolt TLS certificate via cert-manager (optional, internal-only)
    boltTls:
      enabled: false
      issuerName: ""
    # -- LoadBalancer for direct Bolt access (optional, internal-only).
    # Required when the Neo4j Browser UI is exposed via Ingress: the JS app
    # served at 7474 opens a Bolt WebSocket from the user's browser back to
    # NEO4J_server_bolt_advertised__address (i.e. <neo4jBolt host>:7688), so
    # that hostname must resolve to a TCP-reachable IP. Traefik HTTP ingress
    # can't carry raw Bolt — this Service exposes it via MetalLB instead.
    loadBalancer:
      enabled: false
      # -- Pin a specific IP from the MetalLB pool. Rendered as the
      # `metallb.universe.tf/loadBalancerIPs` annotation (preferred over the
      # deprecated `spec.loadBalancerIP` field). Leave empty to let MetalLB
      # auto-assign from the pool.
      ip: ""
      # -- Name of the MetalLB IPAddressPool to draw from. Rendered as the
      # `metallb.universe.tf/ip-address-pool` annotation. Leave empty to use
      # MetalLB's default pool selection.
      ipAddressPool: ""
      # -- externalTrafficPolicy for the Bolt LoadBalancer. Empty = Kubernetes
      # default (Cluster, which SNATs the client to a node IP). Set to "Local"
      # to preserve the real client source IP — REQUIRED when scoping Bolt with
      # allowedClientCIDRs below, since the srw-neo4j NetworkPolicy matches on
      # that client IP. (In a routed homelab there is no NAT between LAN and
      # MetalLB, so Local surfaces the actual LAN address at the pod.)
      externalTrafficPolicy: ""
      # -- Client CIDRs permitted to reach Bolt (7688) through the LoadBalancer.
      # Each renders an ipBlock allow-rule in the srw-neo4j NetworkPolicy, which
      # otherwise limits Bolt to the orchestrator/agent pods — without this the
      # Browser SPA's Bolt WebSocket is dropped. Bolt is authenticated, so this
      # gates *reachability*, not access. Empty = no carve-out. Requires
      # externalTrafficPolicy: Local (above) so the source IP is the real client.
      allowedClientCIDRs: []
    # -- JVM heap and OS-level page cache. Neo4j 5 auto-detects from the cgroup
    #    limit and routinely overshoots, refusing to start with "Invalid memory
    #    configuration - exceeds physical memory". Pin both explicitly. Together
    #    they should leave ~1Gi of headroom under the container's memory limit
    #    for JVM metaspace, native threads, and page cache OS overhead.
    heapMaxSize: "512m"
    pagecacheSize: "512m"
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

# =============================================================================
# Supporting Services
# =============================================================================
gitea:
  enabled: true
  # -- Deploy Gitea StatefulSet within the chart. Set false to use external git server.
  internal: true
  # -- Internal cluster URL (when internal=false, set to your existing git server's internal URL)
  internalUrl: ""
  # -- Public URL (when internal=false, set to your existing git server's public URL).
  # When internal=true, defaults to https://git.{global.domain}.
  externalUrl: ""
  image: gitea/gitea:1.22-rootless
  # -- Metadata database backing the bundled Gitea: users, orgs, repo
  # metadata, issues, PRs, and the OIDC login source. Git object data always
  # lives on the Gitea PVC and is NOT affected by this setting.
  #
  #   postgres (default) — dedicated `srw-giteadb` StatefulSet, or an external
  #     server via `databases.gitea`. Concurrent readers/writers, no
  #     single-file corruption risk, and the only option with a scaling story.
  #   sqlite3 — one file on the Gitea PVC. Simplest, zero extra infra, but
  #     single-writer and lost/corrupted by an ungraceful kill mid-write.
  #
  # SWITCHING AN EXISTING INSTALL IS A DATA MIGRATION, NOT A CONFIG FLIP.
  # The git repos on the PVC survive either way, but Gitea reads *which repos
  # and users exist* from this database — pointing a populated instance at an
  # empty Postgres yields a Gitea that believes it is a fresh install while
  # hundreds of repos sit orphaned on disk. A preflight init container refuses
  # to start in exactly that situation; run the migration first:
  # knowledge-base/knowledge/operations/gitea_sqlite_to_postgres.md
  database:
    type: postgres
  storageClass: ""
  storageSize: "8Gi"
  # Gitea serves every jobs-repo clone the agents make, and pack generation is
  # CPU-bound: a 250m limit throttled clones to ~1-2 MiB/s, slow enough that
  # large project repos outlived the agent-side clone wait. Requests stay small;
  # the limits are burst headroom for pack-objects and the web UI.
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "2"

keycloak:
  # -- Whether the system uses Keycloak/OIDC at all. Set false only for unauthenticated dev.
  enabled: true
  # -- Deploy Keycloak StatefulSet within the chart. Set false to use external OIDC provider.
  # When false, fill in the externalIssuerUrl and externalInternalUrl fields below.
  internal: true
  image: quay.io/keycloak/keycloak:26.2
  # -- Replica count for the bundled Keycloak. The pod runs in production mode
  # (`start`), so >1 is correctness-safe without extra infrastructure: the
  # Infinispan cluster discovers peers via `jdbc-ping` through the Keycloak
  # database, and user sessions are persisted to that database rather than held
  # in each pod's memory (KC 26.0+). No headless Service or DNS_PING required.
  #
  # Default stays 1 for the same reason the orchestrator's did before M1 soaked
  # on dev: a FRESH install runs `--import-realm` on every replica at once
  # against an empty database, and that concurrent-bootstrap path is untested
  # here. Existing installs have no import to race, so opt them in via the
  # deployment overlay (dev does this) and leave fresh installs at 1.
  replicas: 1
  realm: "srw"
  # -- Public OIDC issuer URL (when internal=false, e.g. "https://login.microsoftonline.com/{tenant}/v2.0"
  # for Azure AD, or "https://accounts.google.com" for Google Workspace).
  # When internal=true, defaults to https://auth.{global.domain}.
  externalIssuerUrl: ""
  # -- Internal cluster URL for backend-to-OIDC traffic (when internal=false). Often same as
  # externalIssuerUrl if the IdP is reachable by both browser and cluster. When internal=true,
  # defaults to the internal Keycloak service.
  externalInternalUrl: ""
  # -- Cockpit OIDC client ID (the public SPA client). Default "cockpit" matches the bundled realm.
  cockpitClientId: "cockpit"
  # -- Disable the Keycloak admin group sync. When using external OIDC, set true so the
  # orchestrator doesn't try to call Keycloak admin APIs (project membership stays in Postgres).
  adminApiDisabled: false
  # -- ProtonMail Bridge cert extraction for SMTP STARTTLS (optional)
  bridgeCert:
    enabled: false
    smtpHost: ""
  # -- Realm session/token lifespans (seconds). Applied to both the realm-import
  # JSON (fresh installs) and force-synced via kcadm in the postStart hook on
  # every pod restart, so changes here propagate to existing deployments
  # without a DB wipe. Defaults to 2h idle / 24h max with a 3-day "remember me"
  # checkbox enabled — matches the homelab profile and avoids the 30-min
  # re-login that Keycloak's built-in defaults impose.
  session:
    rememberMe: true
    ssoSessionIdleTimeout: 7200              # 2 hours
    ssoSessionMaxLifespan: 86400             # 24 hours
    ssoSessionIdleTimeoutRememberMe: 259200  # 3 days
    ssoSessionMaxLifespanRememberMe: 259200  # 3 days
    accessTokenLifespan: 900                 # 15 minutes
    offlineSessionIdleTimeout: 2592000       # 30 days
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  # -- Bootstrap (only meaningful when keycloak.internal=false): a Helm
  # pre-install/pre-upgrade Job that registers the SRW clients (`srw-cockpit`,
  # `srw-mcp`) in an existing external Keycloak. Idempotent: get-or-create
  # semantics, safe to re-run on every upgrade. Uses kcadm.sh in the same
  # Keycloak image we already pull for internal mode, so no extra build.
  #
  # MCP secret is *supplied* (not generated): the Job reads MCP_OIDC_CLIENT_SECRET
  # from Vault and registers it in Keycloak. This keeps Vault as the source of
  # truth for the secret and avoids chart-owned writeback.
  bootstrap:
    enabled: false
    # -- Source of the bootstrap credentials. The bootstrap Job needs:
    #     • KC_ADMIN_USER, KC_ADMIN_PASSWORD     (always)
    #     • MCP_OIDC_CLIENT_SECRET               (always)
    #     • CLOUD_SERVICE_USER, CLOUD_SERVICE_PASSWORD
    #                                            (when serviceAccounts.cloud.enabled=true)
    #
    # When bootstrap.enabled=true, pick one of:
    #
    #   adminCredentialsSecret       — name of a pre-existing K8s Secret in the
    #                                  release namespace, holding ALL of the keys
    #                                  above. You create it before `helm install`
    #                                  (kubectl create secret ...).
    #
    #   adminCredentialsVaultPath    — Vault path (e.g.
    #                                  "homelab/<ns>/keycloak-bootstrap") holding
    #                                  the keys above. The chart renders an
    #                                  ExternalSecret as a pre-install hook
    #                                  (weight -15, runs before the bootstrap Job
    #                                  at -5) that ESO syncs into a K8s Secret.
    #                                  Requires externalSecrets.enabled=true.
    #
    #   <neither set>                — when both knobs are empty, the chart falls
    #                                  back to externalSecrets.vaultPath (the main
    #                                  runtime bundle) and ESO selects the keys
    #                                  above from there. Recommended for new
    #                                  deployments — one Vault entry serves both
    #                                  runtime and bootstrap.
    #
    # Setting BOTH adminCredentialsSecret and adminCredentialsVaultPath is a
    # chart-render error.
    #
    # Required roles for the credentials (assign via the master realm, on the
    # `<TARGET_REALM>-realm` client — e.g. `home-realm` if you're bootstrapping
    # realm `home`):
    #   - view-realm      — kcadm get realms/<realm> existence check
    #   - view-clients    — look up cockpit/mcp client UUIDs before update
    #   - manage-clients  — create/update srw-cockpit + srw-mcp
    #   - view-users      — look up srw-agent UUID (cloud SA only)
    #   - manage-users    — create/update srw-agent + set its password (cloud SA only)
    #
    # In modern Keycloak (24+) the composite `realm-admin` role was removed; the
    # five granular roles above are the minimum and `manage-*` does NOT auto-
    # compose `view-*`, so both must be assigned. Full master admin works too
    # but is over-privileged — a Secret leak compromises every realm, not just
    # this one.
    #
    # If createRealm=true, the account additionally needs the master-realm
    # `create-realm` role (which auto-makes the creator admin of the new realm,
    # so the five granular roles above are not separately required for it).
    adminCredentialsSecret: ""
    adminCredentialsVaultPath: ""
    # -- Realm to create the clients in. Defaults to keycloak.realm.
    realm: ""
    # -- Create the realm if it does not exist. Requires master-realm admin
    # credentials (the supplied account must be in the master realm with
    # `create-realm` role). Off by default — most customers add SRW clients
    # to an existing realm that already holds their human users.
    createRealm: false
    # -- Admin server URL kcadm authenticates against. Defaults to
    # keycloak.externalInternalUrl (cluster-internal, fastest) and falls back
    # to keycloak.externalIssuerUrl with the /realms/... suffix stripped. Set
    # explicitly only if neither default is reachable from the chart's
    # namespace (e.g. a Keycloak behind a private network the cluster can't
    # reach via either URL).
    serverUrl: ""
    # -- The clientIds to register. Match the ones the Cockpit/MCP services
    # already expect (keycloak.cockpitClientId / mcp.oauth.clientId).
    cockpitClientId: ""
    mcpClientId: ""
    # -- Image used for kcadm. Defaults to keycloak.image (already cached when
    # keycloak.internal=true; otherwise pulled once per upgrade).
    image: ""
    backoffLimit: 3
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "500m"
    # -- Service accounts to provision in TARGET_REALM. Each block is opt-in.
    # Only meaningful when keycloak.internal=false (otherwise the realm-import
    # JSON owns user provisioning). Username + password read from the main app
    # Secret so they always match what the agent reads at runtime.
    serviceAccounts:
      # The agent's cloud datasource user. Enable when:
      #   - opencloud.enabled or nextcloud.enabled is true (the internal cloud
      #     trusts our Keycloak), OR
      #   - cloud.externalUrl is set AND that external cloud is configured
      #     against the SAME Keycloak realm we're bootstrapping. If the cloud
      #     uses a different IdP, leave this off and create the user manually
      #     per your cloud's docs.
      # Reads username from CLOUD_SERVICE_USER and password from
      # CLOUD_SERVICE_PASSWORD in the main app Secret. The `username` field
      # below is a fallback only — if CLOUD_SERVICE_USER is set, it wins.
      cloud:
        enabled: false
        username: "srw-agent"
        email: ""
        firstName: "SRW"
        lastName: "Agent"

nextcloud:
  enabled: false
  internal: true
  # Primary storage backend. true = S3 object storage via OBJECTSTORE_S3_* (the
  # prod-private layout, requires an external bucket e.g. minio.minio.svc). false =
  # local filesystem on the PVC at /var/www/html/data — used by the k3d overlay,
  # which has no MinIO. Default true preserves existing prod behaviour.
  objectStore:
    enabled: true
  image: docker.io/library/nextcloud:31-apache
  replicas: 0
  storageClass: ""
  storageSize: "10Gi"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

opencloud:
  enabled: true
  # PINNED — do not float this tag, and do not move to a 7.x tag yet. The entire
  # OpenCloud 7.x line (verified on 7.2.0 AND 7.2.2) hard-requires a sharing
  # service-account id our provisioning never sets, so the pod CrashLoops on
  # boot:  "service account id has not been configured for sharing".
  # `:latest`/`7.2`/`7` all resolve to a 7.x image and will break. 4.0.8 is the
  # last release before that requirement and the version that ran healthy on the
  # homelab (config PVC is 4.x-written; the chart's `echo no | opencloud init`
  # never overwrites it). To move onto 7.x, first wire OC_SERVICE_ACCOUNT_ID/
  # _SECRET via ESO (reuse the id/secret opencloud init wrote to the config PVC),
  # validate a rollout, then re-pin deliberately. See the 2026-07-14 incident.
  image: docker.io/opencloudeu/opencloud:4.0.8
  storageClass: ""
  # OpenCloud's decomposeds3 driver buffers TUS uploads on the local PVC
  # before promoting them to S3 on finalize. 16Gi is a light-use baseline
  # (single-user homelab, modest file sizes). Override per-cluster to 64Gi+
  # if you expect multi-GB uploads at concurrency — undersizing risks a
  # disk-full cascade where postprocessing can't drain via NATS jetstream
  # and the entire UI returns "Resource not found" until staging is cleared.
  # NB: PVC expansion is online (Longhorn supports it), but shrinking is
  # not — once bumped, you can't go back without copy-swap.
  dataStorageSize: "16Gi"
  configStorageSize: "1Gi"
  # TTL for incomplete/abandoned TUS upload sessions. The decomposeds3
  # driver doesn't auto-purge expired sessions (opencloud-eu/opencloud#2208) —
  # this only marks them eligible for the cleanup CronJob below. Short
  # values (4h) cap the worst-case staging working set when a sync client
  # misbehaves; legitimate slow uploads renew the lease per chunk.
  uploadExpiration: "4h"
  # Periodic cleanup of expired TUS sessions. Runs `opencloud storage-users
  # uploads sessions --expired=true --clean` inside the running pod via
  # pods/exec RBAC. Without this, expired entries accumulate forever and
  # eventually fill the data PVC.
  cleanup:
    enabled: true
    schedule: "0 * * * *"   # hourly
    image: "docker.io/bitnami/kubectl:latest"
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
  # -- Local-dev only: rclone cloud mounts pass --no-check-certificate so the
  # tus upload hop (ocdav redirects PATCHes to the PUBLIC data-gateway URL,
  # which presents the mkcert edge cert on local k3d) passes TLS verification.
  # Pair with workspace.networkPolicy.extraEgress for the in-cluster Traefik
  # hairpin. Never enable on a real deployment.
  mountInsecureTls: false
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# -- External MAIN CLOUD backend (used when both opencloud.enabled and nextcloud.enabled
# are false). This is the per-deployment file backend for home/session folders — distinct
# from two other "cloud"/"datasource" concepts: (a) runtime `datasources` rows the app
# creates per-user/project (configured in-app, NOT by the chart), and (b) a raw single-mount
# WebDAV datasource (externalBackend: "webdav" + DEFAULT_DS_WEBDAV_*), which has no
# MainCloudBackend at all. The backend reads its OWN creds — NEXTCLOUD_ADMIN/AGENT_* or
# OPENCLOUD_KEYCLOAK_CLIENT_SECRET (see externalBackend below) — NOT CLOUD_SERVICE_*, which
# is a Keycloak service-account cred consumed only by the Keycloak bootstrap Job.
cloud:
  # -- Backend type: "nextcloud" | "opencloud" | "webdav" | "" (disables external cloud)
  externalBackend: ""
  # -- Public URL (browser-visible). Used for deep-links from cockpit.
  externalUrl: ""
  # -- Internal URL the agent calls server-to-server. Defaults to externalUrl when empty.
  externalServiceUrl: ""
  # -- Main-cloud workspace data plane: "rclone_mount" (lazy rclone/FUSE
  # mounts) or "sync" (legacy eager clone).
  workspaceDriver: "rclone_mount"
  rcloneMount:
    # -- Treat SSH workspace containers as rclone/FUSE-capable runtimes.
    allowContainer: true
  # -- Optional explicit Nextcloud username for rclone user-home mounts.
  # Pair with Secret key NEXTCLOUD_RCLONE_USER_HOME_PASSWORD.
  nextcloudRcloneUserHomeUsername: ""

# =============================================================================
# Workspace
# =============================================================================
workspace:
  storageClass: ""
  storageSize: "20Gi"
  fuse:
    # -- Mount /dev/fuse and grant SYS_ADMIN to workspace containers so rclone
    # mount can run where the agent shell executes.
    enabled: true
    # -- Use a privileged/unconfined runtime profile for FUSE workspaces. This
    # is required by k3d/containerd and many managed cluster runtimes even when
    # /dev/fuse and SYS_ADMIN are present.
    privileged: true
  # -- Access mode for the shared workspace PVC. Production uses
  # ReadWriteMany (Longhorn). Single-node clusters with RWO-only storage
  # (k3s local-path) can override to "ReadWriteOnce".
  accessMode: "ReadWriteMany"
  # -- Storage class for the ephemeral per-workspace PVCs (jobs and sessions,
  # including a session's agent-pod claim). The capacity quota below is keyed
  # on this class, so all three claim kinds share one bucket.
  ephemeralStorageClass: ""
  # -- PVC-backed workspaces (Branch a). Covers BOTH jobs and sessions: every
  # workspace pod gets a PVC named by its owner UUID (`pvc-workspace-<job>` /
  # `pvc-ws-thread-<thread>`) so on-disk files survive pod crashes and reattach
  # by name on recreate. A session ALSO gets a second claim for its agent pod
  # (`pvc-agent-s-<thread>`), so one session consumes TWO claims; job agent pods
  # stay emptyDir.
  #
  # Reclaim is asymmetric, and that is the part to internalize before flipping
  # this on:
  #   * job PVCs are reclaimed on terminal status (completed/failed/cancelled)
  #     and retained across idle reap / suspend / restore;
  #   * session PVCs are reclaimed ONLY when the `threads` row is hard-deleted.
  #     An `ended` thread is still resumable (sessions end on an idle timeout
  #     routinely), so its two claims outlive its pods. Turning this on makes
  #     workspace storage track the number of RETAINED THREADS rather than
  #     concurrency — size `resourceQuota` and the backing pool for that, and
  #     prune threads you do not intend to reopen.
  #
  # Default off → emptyDir (pre-Branch-a behavior) and the rollback posture.
  # Mixed fleets are safe — the reaper reads each pod's actual volume mode — so
  # this is a rolling flip, not a cutover; flipping it back off leaves existing
  # PVCs to drain as their work finishes.
  # See knowledge-base/knowledge/features/workspace_pvc_branch_a_implementation.md.
  pvcEnabled: false
  # -- Size of each workspace PVC (only used when pvcEnabled). Applies to every
  # claim: job workspace, session workspace, and session agent.
  pvcSize: "10Gi"
  # -- Single-replica node-loss fallback (Phase 3b). Extended ready-wait (s) for a
  # PVC REATTACH: a transient node reboot (the replica's node returning) recovers
  # within this window without discarding data; past it, a still-wedged reattach
  # whose holdup is a volume-attach failure means the lone replica's node is gone
  # → the PVC is discarded and the job recovers onto a fresh volume (agent clones
  # from Gitea + resumes the checkpoint; unpushed files are lost). Only relevant
  # for networked single-replica storage (longhorn-ephemeral); harmless elsewhere.
  reattachReadyTimeout: 180
  # -- Kill-switch for the discard-and-recover fallback above (the only data-
  # destructive recovery path). false → a wedged reattach stays in recovery until
  # the node returns or the recovery cap fails it loud, never discarding.
  freshFallback: true
  # -- Reclaim-on-idle (Task 7). On a session's idle-suspend, once the S3
  # snapshot is confirmed restorable (verify_snapshot), drop its workspace
  # PVC instead of retaining it — the next touch extracts from S3 like any
  # never-PVC-backed session. Bounds live PVCs to currently-active +
  # recently-crashed sessions instead of every retained thread ever. Fail-
  # safe: an unverifiable snapshot always keeps the PVC. Default off = keep
  # today's retain-on-idle behavior. See
  # knowledge-base/knowledge/features/workspace_durability_tiering.md §D3.
  reclaimOnIdle: false
  # -- Capacity guard for PVC-backed workspaces (Phase 3a). Renders a
  # namespaced ResourceQuota keyed on `ephemeralStorageClass` that caps BOTH the
  # total storage and the count of workspace PVCs of that class. At the cap, new
  # workspace PVCs are rejected (403) and the owning work fails closed with a
  # distinct "workspace capacity quota exceeded" log line — never a silent
  # emptyDir fallback. Requires `pvcEnabled: true` and a DEDICATED
  # `ephemeralStorageClass` so the quota isolates workspace storage from the
  # platform's own data PVCs (Postgres, …). On prod `longhorn-ephemeral`
  # is already dedicated; on single-node/local-path make a dedicated
  # local-path-backed class (same provisioner, distinct name) and point
  # `ephemeralStorageClass` at it. See the storage-substrate section of
  # knowledge-base/knowledge/features/workspace_pvc_branch_a_implementation.md.
  #
  # ONE BUCKET FOR BOTH KINDS. The quota is keyed on the storage class, and jobs
  # and sessions share that class — there is no per-kind split. A backlog of
  # retained session threads can therefore exhaust the count and 403 a JOB's PVC
  # create, failing that job closed for a reason that has nothing to do with the
  # job. If the two need isolating, give sessions their own storage class (and
  # its own quota) rather than raising this one.
  #
  # Defaults re-derived 2026-08-04 for the jobs+sessions flip. Previously
  # 200Gi / 20 — sized when only jobs held PVCs (20 × pvcSize 10Gi):
  #     jobs:     20 concurrent × 1 claim  = 20 claims
  #     sessions: 20 retained   × 2 claims = 40 claims  (workspace + agent pod)
  #     total     60 claims × pvcSize 10Gi = 600Gi
  # Session claims are NOT bounded by concurrency (see `pvcEnabled` above): they
  # live until the thread row is deleted, so re-derive `maxCount` against your
  # thread-retention policy, not your peak concurrent-session count.
  resourceQuota:
    enabled: false
    # -- Max total storage summed across all workspace PVCs of the ephemeral
    # class (jobs + sessions).
    maxStorage: "600Gi"
    # -- Max number of workspace PVCs of the ephemeral class (jobs + sessions;
    # a session counts twice — workspace pod + agent pod).
    maxCount: 60
  # -- NetworkPolicy restricting workspace traffic. Covers BOTH container
  # workspaces and same-cluster KubeVirt VM workspaces (selector
  # srw.io/component=agent-workspace matches both). Disabling removes the
  # policy for both implementations. Requires a CNI or paired controller
  # that enforces NetworkPolicy: Calico, Cilium, OVN-Kubernetes, and Antrea
  # enforce natively; K3s ships Flannel paired with the embedded kube-router
  # network-policy controller, which enforces by default (Flannel alone
  # does not). See knowledge-base/knowledge/features/workspace_network_policy_unification.md.
  #
  # PR 3 (per-project tiering): one NetworkPolicy is rendered per entry
  # in `tiers` below. Each policy selects pods carrying the matching
  # `srw.io/network-tier: <name>` label (emitted by the orchestrator's
  # ContainerProvisioner, derived from `projects.network_tier`). The
  # default tier `internet-only` MUST exist — pre-PR-3 pods and pods
  # whose project has no resolvable tier inherit it. See
  # knowledge-base/knowledge/features/workspace_network_isolation.md §3.
  networkPolicy:
    enabled: true
    # If set, the orchestrator init seeder bumps this user's default
    # project to `network_tier='home-allowed'` on first boot (idempotent,
    # one-way: never moves a project off home-allowed). Intended for
    # operator/homelab installs where the cluster admin needs their own
    # workspaces to reach the home LAN. Leave empty in SaaS deployments.
    operatorHomeAllowedEmail: ""
    # The closed set of named tiers. Order is irrelevant; the orchestrator
    # references each tier by name. The set must stay in sync with the
    # CHECK constraint in 0016_project_network_tier.sql — widening here
    # without a migration leaves stranded label values.
    tiers:
      - name: internet-only
        # Default tier. Public internet TCP 80/443/22 (ipBlock-bounded),
        # cluster CIDRs + home LAN + link-local denied. The orchestrator
        # treats this as the implicit fallback for pods lacking the
        # network-tier label (legacy/pre-migration).
        except:
          - 10.0.50.0/24       # K3s nodes
          - 10.0.51.0/24       # MetalLB IPs (use podSelector for in-cluster services)
          - 10.42.0.0/16       # pod CIDR
          - 10.43.0.0/16       # service CIDR
          - 192.168.178.0/24   # home LAN
          - 169.254.0.0/16     # link-local / cloud-metadata
      - name: home-allowed
        # Operator/homelab tier: home LAN added back to the allowlist.
        # Cluster CIDRs + link-local stay denied (in-cluster services
        # remain reachable only via the explicit podSelector rules below).
        except:
          - 10.0.50.0/24       # K3s nodes
          - 10.0.51.0/24       # MetalLB IPs
          - 10.42.0.0/16       # pod CIDR
          - 10.43.0.0/16       # service CIDR
          - 169.254.0.0/16     # link-local / cloud-metadata
    # -- Extra egress rules appended verbatim to EVERY tier policy (raw
    # NetworkPolicy egress entries). Intended for deployment-specific holes
    # the cluster-CIDR hardening would otherwise close — e.g. local k3d adds
    # an in-cluster Traefik hairpin so uploads addressed to the public edge
    # hostname (OpenCloud's tus data gateway resolves to the Traefik
    # ClusterIP via coredns-custom) can connect. Real deployments resolve
    # those hostnames externally and don't need this. See
    # deployment/values-local.yaml.example for the Traefik block.
    extraEgress: []
  # -- Pre-pull the workspace image on every node via a DaemonSet, so a
  # freshly-built tag doesn't pay a ~2-minute cold pull penalty on the first
  # session-attach (which would exceed the orchestrator/agent readiness
  # timeouts). See helm/templates/optional/workspace-prewarm.yaml.
  prewarm:
    enabled: true
    # -- Tiny no-op container that keeps the DaemonSet pod Ready so the
    # kubelet doesn't garbage-collect the pulled workspace image.
    pauseImage: "registry.k8s.io/pause:3.10"

# =============================================================================
# Optional Admin UIs
# =============================================================================
pgadmin:
  enabled: false
  image: dpage/pgadmin4:latest
  # -- Pre-register the three SRW application databases (app / pgvector / audit)
  # in the pgAdmin server tree on startup, with passwords pre-filled from a
  # chmod-600 .pgpass assembled from the Secret. With this on, an operator only
  # needs the pgAdmin login (auth.* below) — all three DBs are ready on first
  # login. Set false for a bare pgAdmin with no servers pre-configured.
  preregisterDatabases: true
  auth:
    # -- Secret keys holding the pgAdmin login email + password. Add both to your
    # Vault bundle (prod: the main ExternalSecret uses `dataFrom: extract`, so new
    # properties appear automatically) or to secrets.values (chart-managed dev
    # secret). The login email isn't strictly secret but is sourced from the
    # Secret so the whole pgAdmin credential lives in one place.
    emailSecretKey: PGADMIN_EMAIL
    passwordSecretKey: PGADMIN_PASSWORD
    # -- DB role pgAdmin connects as. MUST equal POSTGRES_USER (all three SRW
    # databases share it). Used both in servers.json and the assembled .pgpass.
    dbUsername: srw
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"

dozzle:
  enabled: false
  image: amir20/dozzle:latest
  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"

codexProxy:
  enabled: false
  # Pin a concrete upstream version — CLIProxyAPI ships multiple builds/day and
  # `latest` makes pod restarts silently change behavior. Overlays may override.
  #
  # Floor is v7.2.110 (2026-08-05, was v7.2.61). Anything older than the
  # 2026-07-15 fix `09da52ad` (router-for-me/CLIProxyAPI#3055) charges a
  # REQUEST-scoped `408 stream disconnected before completion` to the
  # CREDENTIAL: the auth entry goes unavailable and every following call gets an
  # instant `503 auth_unavailable`, which reads as a dead token and takes out
  # unrelated jobs on the same proxy. v7.2.110 adds IsRequestScoped() and is a
  # strict descendant of that fix. Dev has run it since 2026-07-30.
  # knowledge-history/done/codex_stream_disconnect_shape_nudge.md
  image: docker.io/eceasy/cli-proxy-api:v7.2.110
  storageSize: "1Gi"
  # Retries INSIDE the proxy, on 403/408/500/502/503/504. An unset key yields 0
  # (Go zero value) despite upstream's config.example.yaml documenting 3.
  #
  # Only safe at 3 BECAUSE of the image floor above. Pre-#3055, retrying a 408
  # is what burns credentials — the upstream reporter watched it take out 4 of
  # 6, then 5 of 6 — so on an older image this value is an amplifier, not a
  # cure. If you ever pin the image back below v7.2.110, set this to 0.
  requestRetry: 3
  # Body-level request/response logging to the pod log. OFF by default: it emits
  # full prompts AND auth headers. Flip to true only while actively catching an
  # upstream error the status endpoint won't explain, then flip it back.
  requestLog: false
  debug: false
  # The proxy buffers the full request/response body in memory (Go), so a
  # single multimodal turn (e.g. several multi-MB images base64-inflated to
  # ~30MB each, plus the response) can spike well past a tight limit. The old
  # 256Mi limit was OOMKilled mid-turn by an image-heavy session, which the
  # agent saw as `APIConnectionError: Connection error.` and the turn died.
  # Give it generous headroom (limit is a ceiling, not a reservation).
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# =============================================================================
# Test-only Infrastructure
# =============================================================================
# Throwaway services that back integration tests. Everything under `test.` is
# OFF by default and must stay off on production overlays.
test:
  # -- GreenMail — disposable IMAP+IMAPS+SMTP(+S) mail server for the `email`
  # datasource integration tests (knowledge-base/knowledge/features/email_datasource.md §Testing).
  # Auth disabled (any credentials work), state is in-memory only. Enable on
  # local k3d / CI overlays; seed fixtures with scripts/seed_greenmail.py.
  greenmail:
    enabled: false
    # Pin a concrete version — test assertions depend on server behavior
    # (folder semantics, REST API), so don't track :latest.
    image: docker.io/greenmail/standalone:2.1.11
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# =============================================================================
# Reloader (watches ConfigMap/Secret changes and triggers rolling restarts)
# =============================================================================
reloader:
  enabled: true
  image: stakater/reloader:v1.3.0
  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "100m"

# =============================================================================
# LLM Configuration (configmap values)
# =============================================================================
llm:
  # NOTE: builder/browser/citation/vision/embedding model IDs and base URLs
  # are admin-curated catalog rows now (system_api_keys + llm_endpoints
  # tables, plus default-model pins via Admin → Providers → Defaults).
  # The orchestrator resolves them at runtime through the model registry.
  # See knowledge-base/knowledge/features/db_backed_llm_config.md and
  # knowledge-base/knowledge/features/models_yaml_removal.md for the migration rationale.
  #
  # Removed in chunk 7 of models_yaml_removal:
  #   visionModel, embeddingModel, embeddingBaseUrl, codexBaseUrl,
  #   builderProvider
  # Pin replacement defaults via Admin → Models → Defaults.
  keyCooldownSeconds: "3600"

  # Codex raw-response diagnostic. When "1"/"true", the codex lane dumps each
  # non-streaming /v1/responses request+response pair (incl. the raw usage
  # block) to codexRawDumpDir on the pod running the LLM call — used to confirm
  # whether the CLIProxyAPI proxy forwards input_tokens_details.cached_tokens.
  # Default off (verbose + disk); flip in values-local.yaml for k3d testing,
  # then start a FRESH session so a new agent pod inherits the ConfigMap value.
  # See knowledge-base/knowledge/issues/codex_cached_tokens_not_metered.md.
  debugCodexRawResponse: "0"
  codexRawDumpDir: "/app/logs/codex-raw"

  # ---------------------------------------------------------------------------
  # One-shot seed for system-scoped provider keys and LLM endpoints. Applied
  # by a post-install / post-upgrade Job. Insert-only: existing rows in
  # system_api_keys and llm_endpoints (user_id IS NULL) are NEVER
  # overwritten, so admin-UI edits survive `helm upgrade`. Leave enabled:false
  # to bring the stack up empty and configure providers via Admin → Providers.
  # ---------------------------------------------------------------------------
  seed:
    # -- Enable the seed Job. Missing/false leaves system tables untouched.
    enabled: false

    # -- Optional: system API keys keyed by provider. Each entry references
    # an existing Secret in the release namespace — plaintext keys must never
    # appear in values.yaml. In ESO mode the referenced Secret is populated by
    # Vault; in non-ESO mode the operator creates it by hand.
    #
    # systemApiKeys:
    #   openai:
    #     secretName: "srw-llm-seed"
    #     key: "openai_api_key"
    #   anthropic:
    #     secretName: "srw-llm-seed"
    #     key: "anthropic_api_key"
    systemApiKeys: {}

    # -- Optional: system-scoped OpenAI-compatible endpoints (vLLM, Ollama,
    # local gateways). Visible to every user. `apiKeyRef` is optional — omit
    # for keyless endpoints like in-cluster vLLM.
    #
    # `capability` on each model is optional and defaults to `chat`. Set it
    # to `embedding`, `vision`, `auxiliary`, or `whisper` to route the row
    # to the matching slot in Admin → Providers → Defaults. A single endpoint
    # can back multiple capabilities (e.g., Groq serving chat + whisper, or
    # OpenRouter serving chat + embedding) by listing the same `apiKeyRef`
    # once and adding one model row per physical model — a single row can
    # claim multiple capabilities via `capabilities: [...]` (see below).
    #
    # systemEndpoints:
    #   - label: "Local Gemma"
    #     baseUrl: "http://vllm.ai.svc.cluster.local:8000/v1"
    #     apiKeyRef:
    #       secretName: "srw-llm-seed"
    #       key: "gemma_api_key"
    #     models:
    #       - id: "RedHatAI/gemma-4-31B-it-FP8-Dynamic"
    #         displayName: "Gemma 4 31B"
    #         family: "gemma"
    #         contextWindow: 128000
    #         reasoningLevel: null
    #         capabilities: [chat, auxiliary]  # explicit array (preferred)
    #       - id: "qwen3-embedding-8b"
    #         displayName: "Qwen3 Embedding 8B"
    #         capability: embedding             # singular shorthand also accepted
    #       - id: "whisper-large-v3"
    #         displayName: "Whisper Large v3"
    #         capability: whisper
    #       - id: "kokoro-tts"
    #         displayName: "Kokoro TTS"
    #         capability: tts
    systemEndpoints: []

    # -- Optional: provider-direct catalog rows (served by a system API key,
    # not a custom endpoint). Each entry is one physical model — under the
    # capabilities[] array model, a single row can serve multiple roles
    # (e.g. ['chat', 'auxiliary'] for any chat-capable LLM, or
    # ['chat', 'auxiliary', 'vision'] for a multimodal one).
    #
    # `provider` must match an entry in `systemApiKeys` above (or one already
    # in the DB) — entries whose provider has no key seeded are skipped.
    #
    # Capability inputs:
    #
    # - `capabilities: [chat, auxiliary]` — explicit array, respected as-is.
    #   No auto-expansion: write `[chat]` and you get a chat-only row.
    # - `capability: chat` — singular shorthand. Auto-expanded to
    #   ['chat', 'auxiliary'] (chat-capable LLMs always serve auxiliary).
    #   Singular for any other enum value lands as `[<value>]`.
    # - `multimodal: true` — convenience flag that adds 'vision' to a
    #   chat-capable row. Use it for known multimodal models so the same
    #   physical row also surfaces in the vision dropdown.
    #
    # systemModels:
    #   - provider: "anthropic"
    #     id: "claude-opus-4-7"
    #     displayName: "Claude Opus 4.7"
    #     capabilities: [chat, auxiliary, vision]   # multimodal → all three
    #     family: "claude-opus"
    #     contextWindow: 200000
    #     reasoningLevel: null
    #   - provider: "openai"
    #     id: "gpt-4o"
    #     displayName: "GPT-4o"
    #     capability: chat                          # auto-expands to [chat, aux]
    #     multimodal: true                          # +vision
    #     family: "gpt-4o"
    #   - provider: "openai"
    #     id: "text-embedding-3-large"
    #     displayName: "OpenAI Embedding (Large)"
    #     capability: embedding                     # singleton: [embedding]
    systemModels: []

    # -- Resource requests for the short-lived seed Job pod.
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# =============================================================================
# Citation Engine
# =============================================================================
# The citation engine is a native SRW subsystem: it uses the agent's shared
# vector store (VECTOR_POSTGRES_*) for storage and SRW's EMBEDDING_* service
# for embeddings — no separate citation DB, role, or embedding config.
# `llmUrl` / `llmModel` / `reasoningLevel` for the verifier are passed via job
# `config_override` at dispatch (default set in Admin → Models). See
# knowledge-history/done/citation_engine_integration.md.

# =============================================================================
# Email / Notifications
# =============================================================================
email:
  enabled: false
  smtp:
    host: ""
    port: "1025"
    useTls: "true"
    trustSelfSigned: "true"
    from: ""
  imap:
    host: ""
    port: "1143"
    useSsl: "false"
    trustSelfSigned: "true"
    pollInterval: "30"
  agentEmail: ""
  domain: ""

notifications:
  ntfy:
    url: ""
    topic: ""

# =============================================================================
# S3 / Object Storage
# =============================================================================
s3:
  endpoint: ""
  bucket: "srw-snapshots"
  region: "us-east-1"
  snapshotMaxSizeGb: "10"
  snapshotRetentionDays: "90"
  # Fail-closed policy (opt-in). Default false = the orchestrator logs one loud
  # startup warning if either object-store seam is unconfigured, then runs
  # degraded. Set true and the orchestrator REFUSES to start (pod crash-loops)
  # unless BOTH seams have a durable store: snapshots (s3.endpoint) AND the
  # virtual tier (virtualWorkspace.rclone.type=s3, or the bundled garage.enabled).
  required: false

# =============================================================================
# Bundled object store (Garage) — NOT FOR PRODUCTION
# =============================================================================
# Single-node Garage S3 for self-host installs with no external object store.
# When enabled AND the matching external endpoint is unset, the chart auto-wires
# this store into snapshots (S3_ENDPOINT/s3.bucket) and the virtual workspace
# tier (VIRTUAL_WORKSPACE_*). Single replica, PVC-bound, NO replication/erasure
# — external S3 (s3.endpoint, virtualWorkspace.s3.endpoint) remains the
# recommended production path and always overrides this store when set.
# NOTE: the bundled store's S3 region is fixed at us-east-1 — keep s3.region and
# virtualWorkspace.s3.region at their us-east-1 defaults when using it; a region
# override would cause sigv4 signature mismatches against the store.
garage:
  # null = AUTO (default): run the bundled store unless you brought your own by
  # setting `s3.endpoint`. Set `true` to force it on alongside an external
  # endpoint, or `false` to run with no object store at all.
  #
  # Auto rather than a plain `false` default because every consumer degrades
  # SILENTLY without a store: canvas presentations stop surviving their
  # workspace (knowledge-base/knowledge/features/canvas_durable_presentation.md), workspace
  # snapshots never capture, and the virtual tier stays unwired. An operator who
  # configures nothing should get a store that works, not a deployment that
  # looks healthy and quietly forgets things.
  enabled: null
  image: dxflrs/garage:v1.0.1        # pinned; admin API is "v1" for this tag
  replicas: 1                         # informational only — the StatefulSet fixes replicas to 1 (not tunable)
  storageClass: ""
  dataStorageSize: "20Gi"             # one PVC backs meta + data + both buckets
  # Single-node layout capacity advertised to Garage, in BYTES. Keep strictly
  # BELOW dataStorageSize — meta + data share the one PVC, so advertising the
  # full PVC size risks a disk-full store under load.
  capacityBytes: 17179869184          # 16 GiB (headroom under the 20Gi PVC)
  buckets:
    # Snapshot bucket reuses s3.bucket (single source of truth). Only the
    # virtual-tier workspace bucket is named here.
    workspaces: "srw-workspaces"
  bootstrap:
    # Shell+curl image for the admin-API bootstrap Job (garage image is
    # shell-less). Must have /bin/sh + curl; no runtime package installs.
    image: curlimages/curl:8.11.0
    resources:
      requests: { memory: "32Mi", cpu: "10m" }
      limits:   { memory: "128Mi", cpu: "200m" }
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits:   { memory: "1Gi",   cpu: "1000m" }

# =============================================================================
# Virtual workspace tier (no_workspace_agent_mode.md §4/§5)
# =============================================================================
# Object store backing `workspace.backend: virtual` agents — file tools over
# explicit rclone ops, no workspace pod, no PVC. The orchestrator injects this
# as the agent's mount spec at dispatch/attach; per-job files land under
# jobs/<id>/, sessions under threads/<id>/. Credentials travel in-flight only
# (never persisted to the job/thread row) and reach rclone as RCLONE_CONFIG_*
# env in the agent — never argv.
#
# Local-dev story (resolves the §13 open question):
#   * dev / k3d  → type "memory": a non-durable, in-process store. A `virtual`
#     job/session runs as a single pod and round-trips files within the agent's
#     lifetime, with NO MinIO dependency. Not durable — files vanish on pod
#     restart; fine for smoke tests, never a real target.
#   * production → type "s3" against the existing MinIO (e.g. minio.minio.svc),
#     with credentials in the bundled Secret keys VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID
#     / VIRTUAL_WORKSPACE_S3_SECRET_ACCESS_KEY (secrets.values for chart-managed
#     secrets, or ESO/Vault); endpoint/region/provider via virtualWorkspace.s3.*.
#
# Empty `rclone.type` disables the tier: a `virtual` job/session then fails fast
# with an actionable error (use `none`, `sandbox`, or `vm` instead).
virtualWorkspace:
  rclone:
    # rclone backend type: "s3" | "memory" | "" (disabled). "memory" is a
    # non-durable in-process dev store (no credentials, no MinIO).
    type: ""
    # Bucket or bucket/subpath, e.g. "srw-workspaces". Empty for type "memory".
    root: ""
  # S3 connection (type: s3) — non-secret parts. The agent's scoped key is
  # bucket-only; rclone is told not to create the (pre-provisioned) bucket.
  # Credentials are the Secret keys VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID /
  # VIRTUAL_WORKSPACE_S3_SECRET_ACCESS_KEY (secrets.values for chart-managed,
  # or ESO/Vault). Mirrors the discrete snapshot S3 wiring (SNAPSHOT_S3_*).
  s3:
    endpoint: ""          # e.g. "http://minio.minio.svc:9000"
    region: "us-east-1"
    provider: "Minio"     # rclone S3 provider quirk-profile

# =============================================================================
# IDE Sessions
# =============================================================================
ide:
  sessionIdleTimeout: "30"
  sessionMaxLifetime: "240"
  maxConcurrentPerUser: "2"
  codeServerImage: "codercom/code-server:latest"

# -----------------------------------------------------------------------------
# Session router — Direct Session WebSockets
# (knowledge-base/knowledge/features/direct_session_websockets.md)
# -----------------------------------------------------------------------------
sessionRouter:
  # Tier-1 ingress controller — tested in CI + dev cluster.
  # nginx-ingress, HAProxy ingress, Istio Gateway are Tier-2: should work
  # via the standard Ingress API but not exercised by the test suite.
  ingressClass: traefik

  # Hostname used in per-session Ingress rules. Defaults to api.<global.domain>
  # when empty.
  ingressHost: ""

  # JWT signing key shared by orchestrator + agent pods. REQUIRED to enable
  # the new flow.
  #
  # Two layouts:
  #
  #   Layout A (standalone Secret, simplest for dev / non-Vault):
  #     Set ``jwtSecret`` to a 32+ byte random string. The chart renders a
  #     dedicated K8s Secret named ``<release>-session-jwt`` (override via
  #     ``jwtSecretName``) with the value at key ``jwt-secret``.
  #     `--set-string sessionRouter.jwtSecret="$(openssl rand -hex 32)"`
  #
  #   Layout B (key on an existing bundled Secret, e.g. ESO-synced from Vault):
  #     Leave ``jwtSecret`` empty (so the standalone Secret render is skipped).
  #     Point ``jwtSecretName`` at the existing Secret (e.g. ``srw``) and set
  #     ``jwtSecretKey`` to the key within that bundle (e.g.
  #     ``SESSION_JWT_SECRET``). The bundle's owner (ESO, sealed-secrets, etc.)
  #     populates it.
  jwtSecret: ""
  jwtSecretName: ""  # defaults to <release>-session-jwt (Layout A)
  jwtSecretKey: "jwt-secret"  # key within the Secret; "jwt-secret" matches Layout A's standalone render
  jwtTtlSeconds: 60

  # Extra annotations merged into every per-session Ingress resource.
  # Use this for ingress-controller-specific WS tuning (e.g. nginx-ingress
  # proxy-read-timeout).
  annotations: {}

# =============================================================================
# Orchestrator identity
# =============================================================================
# Per-orchestrator id used to scope vm.lifecycle.* NATS subjects when sharing
# a NATS hub across SRW installations. Empty (default) falls back to the chart
# fullname (e.g. "srw", "srw-prod") via the srw.orchestratorId helper. Must
# match the paired VM controller's `orchestratorId` value on the vm-cluster
# chart, otherwise publishes drop silently on the controller side.
orchestratorId: ""

# =============================================================================
# NATS Messaging (optional)
# =============================================================================
# Used by the orchestrator for VM lifecycle commands when VMs are involved.
# Two modes (mutually exclusive — setting both is a chart-render error):
#
#   internal=true              chart deploys a single-replica NATS hub in the
#                              release namespace. NATS_URL is auto-set to the
#                              in-cluster Service. JetStream streams are
#                              provisioned by a post-install Job.
#
#   url="nats://...:4222"      orchestrator points at an external NATS (e.g.
#                              a shared homelab hub — see the HomeLab repo's
#                              deployments_managed/nats/ for the canonical
#                              shared-hub deployment pattern).
#
# Leaving both unset disables VM lifecycle entirely (orchestrator falls back
# to K8s pod workspaces via the container provisioner).
nats:
  internal: false
  url: ""
  # When internal=true, expose the leafnode port (7422) via a NodePort so a
  # NATS leaf on a different cluster (e.g. the vm cluster running
  # superhuman-remote-worker-vm-cluster) can dial in. Set to 0 to skip the
  # NodePort (single-cluster setups). Recommend 30743+ to avoid collision
  # with dev's existing 30742 if both share the same cluster.
  leafNodePort: 0
  # Storage size for JetStream durable streams (PVC has helm.sh/resource-policy:
  # keep so it survives uninstall, matching the v0.0.5 PVC pattern).
  storageSize: "2Gi"
  # NATS server image (official nats-io)
  image: "nats:2.10-alpine"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"

# =============================================================================
# VM Controller (optional, same-cluster KubeVirt)
# =============================================================================
# Co-locates the VM Controller in the orchestrator's cluster so VMs can be
# created without standing up a second Kubernetes cluster + NATS.
#
# Prerequisites the chart does NOT install (operator must do this first):
#   - KubeVirt operator + KubeVirt CR (cluster-scoped)
#   - CDI operator (DataVolume support — used by the VM template)
#   - Nodes with hardware virtualization (vmx/svm) and KubeVirt feature gates
#
# Trade-offs vs. the cross-cluster (NATS) path:
#   - Blast radius is namespace-scoped instead of cluster-scoped (weaker isolation)
#   - HTTP transport carries lifecycle (create/delete/query) only. In-VM daemon
#     events (register, heartbeat, freeze, resume) still need NATS — set
#     vmController.transport=both and configure nats.url if you need them.
vmController:
  # -- Deploy the VM controller into the same cluster as the orchestrator.
  enabled: false
  # -- Transport: "http" (no NATS, lifecycle only) | "nats" (cross-cluster,
  # full feature set) | "both" (HTTP for lifecycle + NATS for daemon events).
  transport: http
  # -- Namespace for the controller and VMs. Defaults to the release namespace
  # when empty. A dedicated namespace is recommended so the controller's RBAC
  # (kubevirt.io verbs) stays scoped away from the orchestrator's namespace.
  namespace: agent-vms
  image:
    repository: ghcr.io/knaeckebrothero/superhuman-remote-worker-vm-controller
    tag: latest
    pullPolicy: Always
  service:
    port: 8080
  # -- Dedicated shared HMAC credential for lifecycle commands and identity
  # responses. The Secret must exist in the controller namespace and contain
  # the same value as infrastructureMetering.vmLifecycleAuthSecretName in the
  # orchestrator namespace. It must never be an application/collector Secret.
  # Empty preserves legacy provisioning but VM compute/storage is unattributed.
  lifecycleAuthSecretName: ""
  lifecycleAuthSecretKey: VM_LIFECYCLE_HMAC_SECRET
  # -- Default VM image — override per-job via the orchestrator API.
  # When empty, defaults to ghcr.io/knaeckebrothero/superhuman-remote-worker-agent-vm-base:v<Chart.AppVersion>
  # so the VM base tracks the chart release. Set explicitly to pin a specific tag.
  defaultVmImage: ""
  # -- Per-VM size: 8 cores / 16Gi (bumped from 2c/4Gi 2026-06-21). Workspace
  # *containers* (sandbox tier) are sized separately and are NOT affected.
  defaultCpu: 8
  defaultMemory: 16Gi
  # -- CDI DataVolume storage class + size for the VM root disk.
  vmStorageClass: local-path
  vmDiskSize: 20Gi
  # -- Golden-image boot acceleration
  # (knowledge-base/knowledge/features/vm_golden_image_boot_acceleration.md). Import the base image
  # once into a shared golden PVC per digest; clone each VM root disk from it
  # (host-assisted local copy on local-path) instead of a per-VM registry
  # import. Off = byte-for-byte the current registry-per-VM behaviour.
  goldenImage:
    enabled: false
    # Golden PVC size; empty → vmDiskSize (keeps the clone target >= source).
    diskSize: ""
    gc:
      enabled: true
      keep: 3            # keep the N newest image digests
      minAgeMinutes: 30  # don't GC a golden younger than this
  # -- Persistent VM rootdisks (knowledge-base/knowledge/features/vm_persistent_rootdisk.md).
  # Create each VM's root disk as a standalone DataVolume instead of via
  # spec.dataVolumeTemplates, so it is not cascade-deleted with the VM. A
  # recreate reattaches it by name: files survive a crash or a suspend, and the
  # clone is skipped entirely. Off = today's templated (VM-owned) disk.
  persistentRootdisk:
    enabled: false
    # Orphan backstop for disks whose entity row the orchestrator no longer
    # knows (a DB reset). OFF by default: the controller has no DB, so it
    # cannot tell a leaked disk from a long-suspended session's workspace.
    gc:
      enabled: false
      orphanHours: 72
  # -- SSH public key injected into the VM's authorized_keys (cloud-init).
  # The matching private key lives in the chart's vm-ssh-key secret and is
  # mounted into orchestrator/agent pods. Required for HTTP/lifecycle mode
  # since there's no external Headscale to dial — agents SSH directly to the
  # VM's pod IP.
  vmSshPublicKey: ""
  headscale:
    # -- Existing Secret with a Headscale API key. Empty disables the mesh.
    apiKeySecretName: ""
    apiKeySecretKey: api-key
    user: srw
    # -- Pre-auth key registration deadline (minutes). The VM must join the mesh
    # within this window of key mint (at VM-create); it must exceed worst-case
    # create→join, which includes the cold per-VM image import — not just boot.
    # 10 (old default) expired mid-import for tier upgrades. See
    # knowledge-base/knowledge/features/workspace_tier_upgrade.md Q7.
    keyExpiryMinutes: 30
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# =============================================================================
# Logging
# =============================================================================
logLevel: "DEBUG"
# Log output format: "json" (structured, for the Alloy -> Loki pipeline) or
# "text" (human-readable). See knowledge-base/knowledge/features/centralized_logging.md.
logFormat: "json"
