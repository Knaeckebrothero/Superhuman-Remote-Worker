worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    client_max_body_size 64k;
    client_body_timeout 10s;
    send_timeout 15s;
    client_body_temp_path /tmp/srw-client-body;
    fastcgi_temp_path /tmp/srw-fastcgi;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /index.php/apps/srw_protected_effect/api/v1/capability {
            limit_except GET { deny all; }
            include /etc/nginx/fastcgi_params;
            fastcgi_pass unix:/run/srw-nextcloud/protected-effect.sock;
            fastcgi_param SCRIPT_FILENAME /opt/srw-protected-effect/capability.php;
            fastcgi_param SCRIPT_NAME /index.php/apps/srw_protected_effect/api/v1/capability;
            fastcgi_param HTTP_X_SRW_BACKEND_INSTANCE $http_x_srw_backend_instance;
            fastcgi_intercept_errors off;
            fastcgi_read_timeout 65s;
            fastcgi_send_timeout 10s;
            fastcgi_request_buffering on;
        }

        location ~ ^/ocs/v2\.php(?<srw_path_info>/cloud/(?:users(?:/[^/]+/groups)?|groups(?:/[^/]+)?))$ {
            limit_except POST { deny all; }
            include /etc/nginx/fastcgi_params;
            fastcgi_pass unix:/run/srw-nextcloud/protected-effect.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/html/ocs/v2.php;
            fastcgi_param SCRIPT_NAME /ocs/v2.php;
            fastcgi_param PATH_INFO $srw_path_info;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_ACCEPT $http_accept;
            fastcgi_param HTTP_OCS_APIREQUEST $http_ocs_apirequest;
            fastcgi_param HTTP_USER_AGENT $http_user_agent;
            fastcgi_param HTTP_X_SRW_BACKEND_INSTANCE $http_x_srw_backend_instance;
            fastcgi_param HTTP_X_SRW_PROTECTED_EFFECT_AUTHORITY $http_x_srw_protected_effect_authority;
            fastcgi_param HTTP_X_SRW_PROTECTED_EFFECT_SIGNATURE $http_x_srw_protected_effect_signature;
            fastcgi_intercept_errors off;
            fastcgi_read_timeout 65s;
            fastcgi_send_timeout 10s;
            fastcgi_request_buffering on;
        }

        location ~ ^/index\.php(?<srw_index_path>/apps/groupfolders/folders/[1-9][0-9]*/groups(?:/[^/]+)?)$ {
            limit_except POST { deny all; }
            include /etc/nginx/fastcgi_params;
            fastcgi_pass unix:/run/srw-nextcloud/protected-effect.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param PATH_INFO $srw_index_path;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_ACCEPT $http_accept;
            fastcgi_param HTTP_OCS_APIREQUEST $http_ocs_apirequest;
            fastcgi_param HTTP_USER_AGENT $http_user_agent;
            fastcgi_param HTTP_X_SRW_BACKEND_INSTANCE $http_x_srw_backend_instance;
            fastcgi_param HTTP_X_SRW_PROTECTED_EFFECT_AUTHORITY $http_x_srw_protected_effect_authority;
            fastcgi_param HTTP_X_SRW_PROTECTED_EFFECT_SIGNATURE $http_x_srw_protected_effect_signature;
            fastcgi_intercept_errors off;
            fastcgi_read_timeout 65s;
            fastcgi_send_timeout 10s;
            fastcgi_request_buffering on;
        }

        location / {
            return 404;
        }
    }
}
