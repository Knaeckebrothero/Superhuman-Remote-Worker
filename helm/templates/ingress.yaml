{{- if .Values.ingress.enabled }}
{{- $fullName := include "srw.fullname" . -}}
{{- $cockpitHost := include "srw.host" (dict "context" . "key" "cockpit" "default" "") -}}
{{- $apiHost     := include "srw.urlHost" (include "srw.apiUrl" .) -}}
{{- $authHost    := include "srw.urlHost" (include "srw.authUrl" .) -}}
{{- $gitHost     := include "srw.urlHost" (include "srw.gitUrl" .) -}}
{{- $cloudHost   := include "srw.urlHost" (include "srw.cloudUrl" .) -}}
{{- $mcpHost     := include "srw.urlHost" (include "srw.mcpUrl" .) -}}
{{- $neo4jHost   := include "srw.neo4jBrowserHost" . -}}
{{- $pgadminHost := include "srw.pgadminHost" . -}}
{{- $mongoHost   := include "srw.mongoHost" . -}}
{{- $dozzleHost  := include "srw.dozzleHost" . -}}
# Cockpit web UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-cockpit-ingress
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "cockpit") | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.issuerName }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerName }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $cockpitHost }}
      secretName: {{ $fullName }}-cockpit-tls
  {{- end }}
  rules:
    - host: {{ $cockpitHost }}
      http:
        paths:
          {{- if .Values.auth.bff.sameOriginApi }}
          # Same-origin API: /api, /auth, /ws (control-plane WebSocket), and
          # /p (session-router WebSocket) on the cockpit host route to the
          # orchestrator. Avoids cross-site cookies for split-host local dev.
          # Without these, browser blocks 3rd-party cookies on the API XHRs;
          # without /ws, WebSocket upgrades hit the cockpit SPA and fail with
          # "Unexpected response code: 200".
          # Order matters — longest-prefix-first so traefik matches these
          # before the cockpit catch-all.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
          # /p is intentionally NOT routed by the cockpit ingress — the
          # session router creates a per-session Ingress under that prefix
          # that points directly at the agent pod. Adding a /p Prefix here
          # would shadow it (Traefik picks the longer-prefix match, but the
          # per-session Ingress is "longer" only because of the {tid} suffix,
          # not the literal /p prefix — they collide).
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-cockpit
                port:
                  number: 4000
---
# Orchestrator API (browser calls from cockpit)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api-ingress
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.issuerName }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerName }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    {{- if .Values.ingress.cors.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-cors@kubernetescrd
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $apiHost }}
      secretName: {{ $fullName }}-api-tls
  {{- end }}
  rules:
    - host: {{ $apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
{{- if .Values.ingress.internalPathBlock.enabled }}
---
# Track B (P4b) — Layer 1 (opt-in). Block /api/agents/* and /api/internal/*
# at the public API ingress so agent-internal paths can't be probed from
# outside. This is OPT-IN because it only works when the orchestrator is
# fronted by Traefik (or another ingress controller that honors this CRD).
#
# If you use a tunnel/edge that bypasses your ingress controller
# (Cloudflare Tunnel, Tailscale Funnel, Ngrok, etc.), Traefik never sees
# the request and this middleware never fires — leave the toggle off and
# put the equivalent path rule at your tunnel/edge instead. See
# `docs/multi_tenancy.md` for the cloudflared example.
#
# Layer 2 (app-layer ``require_internal`` checking the ``X-Internal-Key``
# header) is the primary defense and is always on regardless of this toggle.
# Cluster-internal callers (the agent reaching the orchestrator via the
# in-cluster Service DNS http://srw-orchestrator:8085) always bypass the
# ingress, so the agent's traffic is unaffected whether or not Layer 1 is on.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-block-external
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  # An IP allow-list with a single non-routable address effectively denies all
  # real clients while keeping the resource valid. Traefik returns 403.
  #
  # Field name: ``ipWhiteList`` works on both Traefik v2 (only known name) and
  # Traefik v3 (deprecated alias, still accepted). The newer ``ipAllowList``
  # spelling is v3-only and silently no-ops on v2.
  ipWhiteList:
    sourceRange:
      - 127.0.0.99/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-api-ingress-blocked-internal
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.issuerName }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuerName }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- end }}
    # Higher priority than the main API ingress so these path matches win.
    # Without this, Traefik may evaluate the shorter `/` prefix first.
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-block-external@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $apiHost }}
      secretName: {{ $fullName }}-api-tls
  {{- end }}
  rules:
    - host: {{ $apiHost }}
      http:
        paths:
          # Pure-agent paths (P4b ingress strip — agent ↔ orchestrator only).
          # These are still served on the in-cluster Service DNS; only the
          # public host blocks them.
          - path: /api/agents
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
          - path: /api/internal
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-orchestrator
                port:
                  number: 8085
{{- end }}
