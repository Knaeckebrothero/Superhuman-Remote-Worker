{{- include "srw.nextcloudProtectedEffectValidate" . -}}
{{- $effect := .Values.nextcloud.protectedEffect -}}
{{- if and (eq (include "srw.nextcloudProtectedEffectEnabled" .) "true") (not $effect.hmacSecretName) -}}
{{- $secretName := include "srw.nextcloudProtectedEffectSecretName" . -}}
{{- if .Values.secrets.create -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingKey := "" -}}
{{- if and $existing $existing.data (index $existing.data "NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY") -}}
{{- $existingKey = index $existing.data "NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY" | b64dec -}}
{{- end -}}
{{- $userKey := index .Values.secrets.values "NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY" | default "" -}}
{{- if and $existingKey $userKey (ne $existingKey $userKey) -}}
{{- fail "NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY cannot rotate while retained effect authority may exist; preserve the dedicated Secret or complete the explicit drain/rotation procedure" -}}
{{- end -}}
{{- $key := $userKey -}}
{{- if not $key -}}{{- $key = $existingKey -}}{{- end -}}
{{- if not $key -}}{{- $key = randAlphaNum 48 -}}{{- end -}}
{{- if lt (len $key) 32 -}}
{{- fail "secrets.values.NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY must be at least 32 bytes" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "nextcloud-protected-effect") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
immutable: true
type: Opaque
stringData:
  NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY: {{ $key | quote }}
{{- else if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "nextcloud-protected-effect") | nindent 4 }}
spec:
  # The effect root is deliberately adoption-once. An ordinary Vault refresh
  # must never rotate the key beneath append-once signed intent history.
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ $secretName }}
    creationPolicy: Orphan
    immutable: true
  data:
    - secretKey: NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY
      remoteRef:
        key: {{ required "nextcloud.protectedEffect.hmacVaultPath is required" $effect.hmacVaultPath }}
        property: NEXTCLOUD_PROTECTED_EFFECT_HMAC_KEY
{{- end -}}
{{- end -}}
