{{- if .Values.opencloud.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.fullname" . }}-opencloud-config
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "opencloud") | nindent 4 }}
data:
  setup-opencloud.sh: |
    #!/bin/sh
    set +e
    log() { printf "[oc-setup] %s\n" "$*"; }
    log "Running OpenCloud pre-start hook"
    if [ "${PROXY_USER_OIDC_CLAIM:-}" != "sub" ]; then
        log "WARNING: PROXY_USER_OIDC_CLAIM is '${PROXY_USER_OIDC_CLAIM:-<unset>}'," \
            "expected 'sub'. See docs/operations/opencloud-bootstrap.md §4."
    fi
    if [ -z "${OC_OIDC_ISSUER:-}" ]; then
        log "WARNING: OC_OIDC_ISSUER is not set; OpenCloud will fail login flows."
    fi
    log "Reminder: the orchestrator expects a Keycloak client named"
    log "  '${OPENCLOUD_KEYCLOAK_CLIENT_ID:-opencloud-orchestrator}'"
    log "with serviceAccountsEnabled=true and the 'opencloudAdmin' group assigned."
    log "Pre-start hook complete"
    exit 0
  csp.yaml: |
    ## CSP override for production.
    ##
    ## OpenCloud's default connect-src only allows 'self'. The OIDC issuer
    ## (Keycloak) is on a different origin, so the browser's oidc-client
    ## library needs it in connect-src.
    directives:
      child-src:
        - "'self'"
      connect-src:
        - "'self'"
        - "blob:"
        - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
        - "https://update.opencloud.eu/"
        - {{ include "srw.authUrl" . | quote }}
      default-src:
        - "'none'"
      font-src:
        - "'self'"
      frame-ancestors:
        - "'self'"
      frame-src:
        - "'self'"
        - "blob:"
        - "https://embed.diagrams.net/"
        - {{ include "srw.authUrl" . | quote }}
      img-src:
        - "'self'"
        - "data:"
        - "blob:"
        - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
      manifest-src:
        - "'self'"
      media-src:
        - "'self'"
      object-src:
        - "'self'"
        - "blob:"
      script-src:
        - "'self'"
        - "'unsafe-inline'"
      style-src:
        - "'self'"
        - "'unsafe-inline'"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "srw.fullname" . }}-opencloud-data
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "opencloud") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.opencloud.storageClass }}
  storageClassName: {{ .Values.opencloud.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.opencloud.dataStorageSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "srw.fullname" . }}-opencloud-config
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "opencloud") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.opencloud.storageClass }}
  storageClassName: {{ .Values.opencloud.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.opencloud.configStorageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-opencloud
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "opencloud") | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "opencloud") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "opencloud") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
      {{- with .Values.opencloud.hostAliases }}
      # Map the public auth hostname to an in-cluster address so the proxy's
      # OIDC verifier can fetch JWKS without leaving the cluster. OpenCloud's
      # verifier dereferences OC_OIDC_ISSUER (which must stay public to match
      # the `iss` claim) for the .well-known fetch — and in any split-DNS
      # cluster (k3d's `localhost` loopback, customer air-gapped server VLAN)
      # that public hostname won't resolve from inside the pod. Typically
      # set to Traefik's ClusterIP so we hit the cluster's own ingress.
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "srw.fullname" . }}-keycloak 8080; do sleep 2; done"]
      containers:
        - name: opencloud
          image: {{ .Values.opencloud.image }}
          command: ["/bin/sh", "-c"]
          args:
            - "echo no | /usr/bin/opencloud init || true; /opt/opencloud-hooks/setup-opencloud.sh || true; exec /usr/bin/opencloud server"
          ports:
            - containerPort: 9200
          env:
            # Public URL — used by OpenCloud to generate absolute URLs,
            # redirect URIs, and browser-facing links.
            - name: OC_URL
              value: {{ include "srw.cloudUrl" . | quote }}
            # TLS is terminated by ingress; OpenCloud serves plain HTTP.
            - name: PROXY_TLS
              value: "false"
            - name: PROXY_HTTP_ADDR
              value: "0.0.0.0:9200"
            - name: PROXY_ENABLE_BASIC_AUTH
              value: "false"
            # CRITICAL: must be "sub" — changing after users exist orphans all
            # Spaces, groups, and shares. See docs/operations/opencloud-bootstrap.md §4.
            - name: PROXY_USER_OIDC_CLAIM
              value: "sub"
            # Disable internal IdP — use external Keycloak.
            - name: OC_EXCLUDE_RUN_SERVICES
              value: "idp"
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: "oidc"
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: "groups"
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            # OIDC — browser login via Keycloak. The browser uses the public
            # URL (WEB_OIDC_METADATA_URL, served by the cockpit). The proxy
            # pod itself uses the in-cluster Service URL for JWKS / discovery
            # fetches because the public hostname isn't always reachable from
            # inside the pod (split-DNS on the customer's air-gapped cluster,
            # `localhost` loopback-hijack on k3d, etc.). OC_OIDC_ISSUER keeps
            # the public URL because it must match the `iss` claim Keycloak
            # mints into tokens (driven by KC_HOSTNAME). Keycloak emits
            # backchannel URLs based on the inbound Host header
            # (KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true) so the discovery doc the
            # proxy fetches at the internal URL points jwks_uri at the
            # internal URL too — no further hop to the public hostname.
            - name: WEB_OIDC_CLIENT_ID
              value: "opencloud-web"
            - name: WEB_OIDC_METADATA_URL
              value: "{{ include "srw.authUrl" . }}/realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration"
            - name: OC_OIDC_ISSUER
              value: "{{ include "srw.authUrl" . }}/realms/{{ .Values.keycloak.realm }}"
            - name: OC_OIDC_ENDPOINT_URL
              value: "{{ include "srw.authUrl" . }}/realms/{{ .Values.keycloak.realm }}"
            {{- if .Values.opencloud.oidcInsecureTls }}
            # When the proxy hits OC_OIDC_ISSUER through a hostAliases-mapped
            # in-cluster Traefik (k3d/customer air-gapped), the cert chain
            # is the cluster's local CA (mkcert in dev) and won't validate
            # against OpenCloud's bundled roots. This skips TLS verification
            # on OIDC fetches only — not a general TLS bypass.
            - name: OC_INSECURE
              value: "true"
            - name: PROXY_OIDC_INSECURE
              value: "true"
            {{- end }}
            - name: OC_LOG_LEVEL
              value: "info"
            - name: OC_ADMIN_USER_ID
              value: "admin"
            # CSP override — allows browser OIDC discovery to reach Keycloak
            # on a different origin (auth.* vs cloud.*).
            - name: PROXY_CSP_CONFIG_FILE_OVERRIDE_LOCATION
              value: "/opt/opencloud-hooks/csp.yaml"
            # TUS upload staging TTL. The decomposeds3 driver stages each
            # upload on the local PVC; expired sessions don't auto-purge
            # without the companion cleanup CronJob (see opencloud-cleanup.yaml).
            # Short TTL bounds the worst-case staging working set when a sync
            # client misbehaves. See docs/issues for the runaway-upload incident.
            - name: STORAGE_USERS_UPLOAD_EXPIRATION
              value: {{ .Values.opencloud.uploadExpiration | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/opencloud
            - name: config
              mountPath: /etc/opencloud
            - name: hooks
              mountPath: /opt/opencloud-hooks
          startupProbe:
            httpGet:
              path: /status.php
              port: 9200
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status.php
              port: 9200
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /status.php
              port: 9200
            periodSeconds: 10
          resources:
            {{- toYaml .Values.opencloud.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "srw.fullname" . }}-opencloud-data
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "srw.fullname" . }}-opencloud-config
        - name: hooks
          configMap:
            name: {{ include "srw.fullname" . }}-opencloud-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-opencloud
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "opencloud") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "opencloud") | nindent 4 }}
{{- end }}
