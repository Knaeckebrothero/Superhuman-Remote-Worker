{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-mcp
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "mcp") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8055
      targetPort: 8000
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "mcp") | nindent 4 }}
{{- end }}
