{{- $metering := .Values.infrastructureMetering | default dict -}}
{{- $pvcInventory := $metering.vmPvcInventoryEnabled | default false -}}
{{- $pvInventory := $metering.vmPvInventoryEnabled | default false -}}
{{- $storageInventory := or $pvcInventory $pvInventory -}}
{{- $storageShadow := or ($metering.vmPvcShadowEnabled | default false) ($metering.vmPvShadowEnabled | default false) -}}
{{- if and (include "srw.vmSameCluster" .) $storageInventory }}
{{- $collectorName := printf "%s-storage-metering" (include "srw.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $vmNamespace := $metering.vmNamespace | default .Release.Namespace -}}
{{- $stableClusterId := $metering.vmStableClusterId | default $metering.stableClusterId -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $collectorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "storage-metering") | nindent 4 }}
automountServiceAccountToken: true
{{- if $pvcInventory }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $collectorName }}
  namespace: {{ $vmNamespace | quote }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "storage-metering") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $collectorName }}
  namespace: {{ $vmNamespace | quote }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "storage-metering") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $collectorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $collectorName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if $pvInventory }}
---
# PersistentVolumes are cluster-scoped. This authority is rendered only after
# the operator explicitly acknowledges that RBAC cannot constrain PV LIST/WATCH
# to the VM namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $collectorName }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "storage-metering") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $collectorName }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "storage-metering") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $collectorName }}
subjects:
  - kind: ServiceAccount
    name: {{ $collectorName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $collectorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "storage-metering") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Do not overlap two authorities during settings or credential rollouts.
    type: Recreate
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "storage-metering") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "storage-metering") | nindent 8 }}
      annotations:
        checksum/storage-metering-settings: {{ toJson $metering | sha256sum | quote }}
        # Secret data changes are invisible to Helm. Operators bump the opaque
        # revision value when rotating an env-backed ingestion credential.
        checksum/storage-metering-credential-revision: {{ $metering.credentialRevision | default "" | sha256sum | quote }}
    spec:
      serviceAccountName: {{ $collectorName }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      {{- with $metering.orchestratorHostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ include "srw.imageRef" (dict "image" .Values.image.orchestrator) | quote }}
          imagePullPolicy: {{ .Values.image.orchestrator.pullPolicy }}
          command: ["python", "-m", "services.infrastructure_metering.collector_runtime"]
          env:
            - name: INFRASTRUCTURE_METERING_COLLECTOR_ENABLED
              value: "true"
            - name: INFRASTRUCTURE_METERING_DEPLOYMENT_MODE
              value: "dedicated"
            - name: INFRASTRUCTURE_METERING_COLLECTOR_ID
              value: "kubevirt-storage"
            - name: INFRASTRUCTURE_METERING_ORCHESTRATOR_URL
              value: {{ printf "http://%s-orchestrator:8085" (include "srw.fullname" .) | quote }}
            - name: INFRASTRUCTURE_METERING_INGESTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $metering.vmStorageIngestionSecretName | quote }}
                  key: {{ $metering.vmStorageIngestionSecretKey | quote }}
            # The runtime's generic identity fields are deliberately pinned to
            # the same exact VM-cluster/namespace authority as its remote gates.
            - name: INFRASTRUCTURE_METERING_STABLE_CLUSTER_ID
              value: {{ $stableClusterId | quote }}
            - name: INFRASTRUCTURE_METERING_NAMESPACE_ALLOWLIST
              value: {{ $vmNamespace | quote }}
            - name: INFRASTRUCTURE_METERING_VM_STABLE_CLUSTER_ID
              value: {{ $stableClusterId | quote }}
            - name: INFRASTRUCTURE_METERING_VM_NAMESPACE
              value: {{ $vmNamespace | quote }}
            - name: INFRASTRUCTURE_METERING_VM_PVC_INVENTORY_ENABLED
              value: {{ $pvcInventory | quote }}
            - name: INFRASTRUCTURE_METERING_VM_PV_INVENTORY_ENABLED
              value: {{ $pvInventory | quote }}
            - name: INFRASTRUCTURE_METERING_VM_PVC_SHADOW_ENABLED
              value: {{ $metering.vmPvcShadowEnabled | default false | quote }}
            - name: INFRASTRUCTURE_METERING_VM_PV_SHADOW_ENABLED
              value: {{ $metering.vmPvShadowEnabled | default false | quote }}
            - name: INFRASTRUCTURE_METERING_VM_PV_CLUSTER_WIDE_RBAC_ACKNOWLEDGED
              value: {{ $metering.vmPvClusterWideRbacAcknowledged | default false | quote }}
            - name: INFRASTRUCTURE_METERING_SHADOW_ENABLED
              value: {{ $storageShadow | quote }}
            # This chart is collection-only. Every publication, serving-read,
            # and cutover gate is hard-disabled rather than exposed as a value.
            - name: INFRASTRUCTURE_METERING_PUBLICATION_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_V2_READS_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_SOURCE_AWARE_READS_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_CUTOVER_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_VM_INVENTORY_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_VM_SHADOW_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_VM_PUBLICATION_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_PVC_INVENTORY_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_PV_INVENTORY_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_PVC_SHADOW_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_PV_SHADOW_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_PVC_PUBLICATION_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_PV_PUBLICATION_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_IDE_POD_SHADOW_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_AGENT_POD_SHADOW_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_IDE_POD_PUBLICATION_ENABLED
              value: "false"
            - name: INFRASTRUCTURE_METERING_AGENT_POD_PUBLICATION_ENABLED
              value: "false"
            {{- if $pvInventory }}
            - name: INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $metering.volumeIdentitySecretName | quote }}
                  key: {{ $metering.volumeIdentitySecretKey | quote }}
            - name: INFRASTRUCTURE_METERING_VOLUME_IDENTITY_KEY_VERSION
              value: {{ $metering.volumeIdentityKeyVersion | quote }}
            {{- end }}
            - name: INFRASTRUCTURE_METERING_RELIST_INTERVAL_SECONDS
              value: {{ $metering.relistIntervalSeconds | quote }}
            - name: INFRASTRUCTURE_METERING_STALE_AFTER_SECONDS
              value: {{ $metering.staleAfterSeconds | quote }}
            - name: INFRASTRUCTURE_METERING_LIST_PAGE_SIZE
              value: {{ $metering.listPageSize | quote }}
            - name: INFRASTRUCTURE_METERING_SCOPE_CONCURRENCY
              value: "1"
            - name: INFRASTRUCTURE_METERING_WATCH_QUEUE_SIZE
              value: {{ $metering.watchQueueSize | quote }}
            - name: INFRASTRUCTURE_METERING_MAX_SNAPSHOT_ITEMS
              value: {{ $metering.maxSnapshotItems | quote }}
            - name: INFRASTRUCTURE_METERING_MAX_SNAPSHOT_BYTES
              value: {{ $metering.maxSnapshotBytes | int64 | quote }}
          resources:
            {{- toYaml $metering.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if $metering.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $collectorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "storage-metering") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "storage-metering") | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $metering.networkPolicy.dnsNamespace | default "kube-system" | quote }}
          podSelector:
            matchLabels:
              {{- toYaml ($metering.networkPolicy.dnsPodSelector | default (dict "k8s-app" "kube-dns")) | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range $metering.networkPolicy.apiServerCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- end }}
    {{- range $metering.networkPolicy.orchestratorCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- range $metering.networkPolicy.orchestratorPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
