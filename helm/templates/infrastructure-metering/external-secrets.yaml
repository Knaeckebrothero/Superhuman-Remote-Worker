{{- $metering := .Values.infrastructureMetering | default dict -}}
{{- $sync := $metering.externalSecrets | default dict -}}
{{- if ($sync.enabled | default false) }}
{{- if not .Values.externalSecrets.enabled }}
{{- fail "infrastructureMetering.externalSecrets.enabled requires externalSecrets.enabled" }}
{{- end }}
{{- $vaultPath := required "infrastructureMetering.externalSecrets.vaultPath is required when metering secret sync is enabled" $sync.vaultPath -}}
{{- $targets := list
      (dict "label" "vmIngestionSecretName" "name" ($metering.vmIngestionSecretName | default ""))
      (dict "label" "vmStorageIngestionSecretName" "name" ($metering.vmStorageIngestionSecretName | default ""))
      (dict "label" "volumeIdentitySecretName" "name" ($metering.volumeIdentitySecretName | default ""))
      (dict "label" "vmLifecycleAuthSecretName" "name" ($metering.vmLifecycleAuthSecretName | default ""))
-}}
{{- $seenTargets := dict -}}
{{- $targetCount := 0 -}}
{{- range $target := $targets }}
{{- if $target.name }}
{{- $targetCount = add1 $targetCount -}}
{{- if hasKey $seenTargets $target.name }}
{{- fail (printf "infrastructureMetering external secret targets must be distinct; %s reuses %s" $target.label $target.name) }}
{{- end }}
{{- $_ := set $seenTargets $target.name true -}}
{{- end }}
{{- end }}
{{- if eq $targetCount 0 }}
{{- fail "infrastructureMetering.externalSecrets.enabled requires at least one metering Secret name" }}
{{- end }}
{{- $properties := list
      (dict "label" "vmiIngestionProperty" "name" ($sync.vmiIngestionProperty | default ""))
      (dict "label" "vmStorageIngestionProperty" "name" ($sync.vmStorageIngestionProperty | default ""))
      (dict "label" "volumeIdentityProperty" "name" ($sync.volumeIdentityProperty | default ""))
      (dict "label" "vmLifecycleAuthProperty" "name" ($sync.vmLifecycleAuthProperty | default ""))
-}}
{{- $seenProperties := dict -}}
{{- range $property := $properties }}
{{- if not (regexMatch "^[-._A-Za-z0-9]+$" $property.name) }}
{{- fail (printf "infrastructureMetering.externalSecrets.%s must be a valid Vault property name" $property.label) }}
{{- end }}
{{- if hasKey $seenProperties $property.name }}
{{- fail (printf "infrastructureMetering external secret properties must be distinct; %s reuses %s" $property.label $property.name) }}
{{- end }}
{{- $_ := set $seenProperties $property.name true -}}
{{- end }}
{{- if $metering.vmIngestionSecretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $metering.vmIngestionSecretName | quote }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "infra-metering") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | quote }}
    kind: {{ .Values.externalSecrets.secretStoreKind | quote }}
  target:
    name: {{ $metering.vmIngestionSecretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $metering.vmIngestionSecretKey | quote }}
      remoteRef:
        key: {{ $vaultPath | quote }}
        property: {{ $sync.vmiIngestionProperty | quote }}
{{- end }}
{{- if $metering.vmStorageIngestionSecretName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $metering.vmStorageIngestionSecretName | quote }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "infra-metering") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | quote }}
    kind: {{ .Values.externalSecrets.secretStoreKind | quote }}
  target:
    name: {{ $metering.vmStorageIngestionSecretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $metering.vmStorageIngestionSecretKey | quote }}
      remoteRef:
        key: {{ $vaultPath | quote }}
        property: {{ $sync.vmStorageIngestionProperty | quote }}
{{- end }}
{{- if $metering.volumeIdentitySecretName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $metering.volumeIdentitySecretName | quote }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "infra-metering") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | quote }}
    kind: {{ .Values.externalSecrets.secretStoreKind | quote }}
  target:
    name: {{ $metering.volumeIdentitySecretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $metering.volumeIdentitySecretKey | quote }}
      remoteRef:
        key: {{ $vaultPath | quote }}
        property: {{ $sync.volumeIdentityProperty | quote }}
{{- end }}
{{- if $metering.vmLifecycleAuthSecretName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $metering.vmLifecycleAuthSecretName | quote }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "infra-metering") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | quote }}
    kind: {{ .Values.externalSecrets.secretStoreKind | quote }}
  target:
    name: {{ $metering.vmLifecycleAuthSecretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $metering.vmLifecycleAuthSecretKey | quote }}
      remoteRef:
        key: {{ $vaultPath | quote }}
        property: {{ $sync.vmLifecycleAuthProperty | quote }}
{{- end }}
{{- end }}
