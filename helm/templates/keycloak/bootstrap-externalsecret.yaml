{{- $effectivePath := include "srw.keycloakBootstrapVaultPath" . -}}
{{- if and .Values.keycloak.enabled (not .Values.keycloak.internal) .Values.keycloak.bootstrap.enabled (not .Values.keycloak.bootstrap.adminCredentialsSecret) $effectivePath }}
{{- if not .Values.externalSecrets.enabled -}}
{{- fail "Bootstrap-creds sync requires externalSecrets.enabled=true (the chart renders an ExternalSecret to sync the bootstrap creds from Vault). Either flip externalSecrets.enabled, or switch to keycloak.bootstrap.adminCredentialsSecret (a pre-created K8s Secret)." -}}
{{- end -}}
{{- $sa := .Values.keycloak.bootstrap.serviceAccounts -}}
# ---------------------------------------------------------------
# Keycloak bootstrap creds — synced from Vault by ESO.
#
# Pre-install hook at weight -15 (runs before bootstrap-configmap at
# -10 and bootstrap-job at -5). The bootstrap Job's init container
# waits for this Secret to materialize before starting the main
# container, so the ESO sync race is handled even if reconcile takes
# a few seconds.
#
# The bundle holds *every* secret the bootstrap Job consumes — admin
# credentials AND any value the Job needs to register in Keycloak
# (MCP client secret, cloud SA password). Pulling them all here, into
# one hook-synced Secret, sidesteps the timing problem of trying to
# read from the runtime srw Secret which doesn't exist yet at hook
# time. The Vault path is shared with the runtime (defaults to
# externalSecrets.vaultPath); ESO selects only the keys we need.
#
# delete-policy is `before-hook-creation` ONLY (intentionally NOT
# `hook-succeeded`): we want this ExternalSecret to persist after
# install so ESO keeps reconciling it (rotating creds in Vault
# propagates without a chart upgrade).
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "keycloak-bootstrap") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: KC_ADMIN_USER
      remoteRef:
        key: {{ $effectivePath }}
        property: KC_ADMIN_USER
    - secretKey: KC_ADMIN_PASSWORD
      remoteRef:
        key: {{ $effectivePath }}
        property: KC_ADMIN_PASSWORD
    - secretKey: MCP_OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ $effectivePath }}
        property: MCP_OIDC_CLIENT_SECRET
    {{- if and $sa $sa.cloud $sa.cloud.enabled }}
    - secretKey: CLOUD_SERVICE_USER
      remoteRef:
        key: {{ $effectivePath }}
        property: CLOUD_SERVICE_USER
    - secretKey: CLOUD_SERVICE_PASSWORD
      remoteRef:
        key: {{ $effectivePath }}
        property: CLOUD_SERVICE_PASSWORD
    {{- end }}
{{- end }}
