{{- if and .Values.keycloak.enabled (not .Values.keycloak.internal) .Values.keycloak.bootstrap.enabled .Values.keycloak.bootstrap.adminCredentialsVaultPath }}
{{- if not .Values.externalSecrets.enabled -}}
{{- fail "keycloak.bootstrap.adminCredentialsVaultPath requires externalSecrets.enabled=true (the chart renders an ExternalSecret to sync the bootstrap creds from Vault). Either flip externalSecrets.enabled, or switch to keycloak.bootstrap.adminCredentialsSecret (a pre-created K8s Secret)." -}}
{{- end -}}
# ---------------------------------------------------------------
# Keycloak bootstrap admin credentials — synced from Vault by ESO.
#
# Pre-install hook at weight -15 (runs before bootstrap-configmap at
# -10 and bootstrap-job at -5). The bootstrap Job's init container
# waits for this Secret to materialize before starting the main
# container, so the ESO sync race is handled even if reconcile takes
# a few seconds.
#
# delete-policy is `before-hook-creation` ONLY (intentionally NOT
# `hook-succeeded`): we want this ExternalSecret to persist after
# install so ESO keeps reconciling it (rotating creds in Vault
# propagates without a chart upgrade).
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "keycloak-bootstrap") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.keycloak.bootstrap.adminCredentialsVaultPath }}
{{- end }}
