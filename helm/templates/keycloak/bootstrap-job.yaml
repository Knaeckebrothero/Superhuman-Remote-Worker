{{- if and .Values.keycloak.enabled (not .Values.keycloak.internal) .Values.keycloak.bootstrap.enabled }}
{{- $effectivePath := include "srw.keycloakBootstrapVaultPath" . -}}
{{- if and .Values.keycloak.bootstrap.adminCredentialsSecret .Values.keycloak.bootstrap.adminCredentialsVaultPath -}}
{{- fail "keycloak.bootstrap.adminCredentialsSecret and keycloak.bootstrap.adminCredentialsVaultPath are mutually exclusive — set exactly one. See keycloak.bootstrap in values.yaml." -}}
{{- end -}}
{{- if and (not .Values.keycloak.bootstrap.adminCredentialsSecret) (not $effectivePath) -}}
{{- fail "keycloak.bootstrap.enabled requires a credential source. Either: (a) set keycloak.bootstrap.adminCredentialsSecret to a pre-created K8s Secret (with keys KC_ADMIN_USER, KC_ADMIN_PASSWORD, MCP_OIDC_CLIENT_SECRET, plus CLOUD_SERVICE_USER/PASSWORD when serviceAccounts.cloud.enabled=true); (b) set keycloak.bootstrap.adminCredentialsVaultPath to a dedicated Vault path the chart syncs via ESO; or (c) leave both empty and rely on externalSecrets.vaultPath (the main runtime bundle) — the chart will pull the same keys from there. The Keycloak admin account needs roles view-realm, view-clients, manage-clients (+ view-users, manage-users when serviceAccounts.cloud.enabled=true) on the <TARGET_REALM>-realm client in the master realm." -}}
{{- end -}}
{{- $sa := .Values.keycloak.bootstrap.serviceAccounts -}}
{{- if and $sa $sa.cloud $sa.cloud.enabled -}}
{{- $hasCloud := or .Values.opencloud.enabled .Values.nextcloud.enabled (ne (default "" .Values.cloud.externalUrl) "") -}}
{{- if not $hasCloud -}}
{{- fail "keycloak.bootstrap.serviceAccounts.cloud.enabled=true requires a configured cloud (opencloud.enabled, nextcloud.enabled, or cloud.externalUrl). With no cloud, the user has nothing to authenticate against." -}}
{{- end -}}
{{- end -}}
# Keycloak bootstrap Job — pre-install/pre-upgrade hook that registers the
# SRW clients in an external Keycloak. Runs once per `helm install/upgrade`.
#
# Hook ordering: weight=-5 so it runs after the bootstrap ConfigMap (-10) but
# before any chart resource that depends on the clients existing (orchestrator,
# cockpit, mcp). Failure aborts the install/upgrade.
#
# delete-policy: before-hook-creation keeps the Job from a previous run around
# for log inspection; it gets cleaned up the next time we run. hook-succeeded
# means a successful Job is removed immediately so it doesn't clutter the ns.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "srw.keycloakBootstrapName" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "keycloak-bootstrap") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.keycloak.bootstrap.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "keycloak-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $effectivePath }}
      # Wait for ESO to sync the bootstrap creds Secret from Vault. The
      # ExternalSecret is created at hook-weight -15 but ESO reconciles
      # asynchronously, so the Secret may not exist yet when this Job
      # starts. The kubelet retries the volume mount until the Secret
      # exists, which gives us a wait-for-Secret with no kubectl/RBAC.
      initContainers:
        - name: wait-for-creds
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              test -s /creds/KC_ADMIN_USER && \
              test -s /creds/KC_ADMIN_PASSWORD && \
              test -s /creds/MCP_OIDC_CLIENT_SECRET
          volumeMounts:
            - name: bootstrap-creds
              mountPath: /creds
              readOnly: true
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ include "srw.keycloakBootstrapImage" . | quote }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/bootstrap.sh"]
          env:
            - name: KC_SERVER
              value: {{ include "srw.keycloakBootstrapServer" . | quote }}
            - name: TARGET_REALM
              value: {{ include "srw.keycloakBootstrapRealm" . | quote }}
            - name: CREATE_REALM
              value: {{ .Values.keycloak.bootstrap.createRealm | quote }}
            - name: COCKPIT_CLIENT_ID
              value: {{ default .Values.keycloak.cockpitClientId .Values.keycloak.bootstrap.cockpitClientId | quote }}
            - name: COCKPIT_HOST
              value: {{ include "srw.host" (dict "context" . "key" "cockpit" "default" "") | quote }}
            - name: MCP_CLIENT_ID
              value: {{ default .Values.mcp.oauth.clientId .Values.keycloak.bootstrap.mcpClientId | quote }}
            - name: MCP_HOST
              value: {{ include "srw.host" (dict "context" . "key" "mcp" "default" "mcp") | quote }}
            # Admin credentials: from either a user-provided Secret or a
            # chart-managed Secret synced from Vault (see srw.keycloakBootstrapAdminSecretName).
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
                  key: KC_ADMIN_USER
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
                  key: KC_ADMIN_PASSWORD
            # MCP client secret: pulled from the bootstrap-creds Secret (same
            # Vault path as the runtime srw Secret by default), so the value
            # the kcadm Job registers in Keycloak matches what the MCP server
            # reads at runtime. Sourced via the bootstrap-creds Secret instead
            # of the runtime srw Secret to avoid the pre-install / main-install
            # hook-ordering race (the runtime Secret doesn't exist yet here).
            - name: MCP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
                  key: MCP_OIDC_CLIENT_SECRET
            # Cockpit BFF — registered alongside the MCP client. The
            # cockpit client flips from public-PKCE to confidential-secret
            # once a non-empty value lands here; absence keeps it public
            # for backwards compatibility (transitional).
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
                  key: KC_CLIENT_SECRET
                  optional: true
            # Public origin for the orchestrator BFF — used to register
            # the cockpit-bff client's /auth/callback redirect URI and
            # backchannel-logout endpoint in Keycloak.
            - name: API_HOST
              value: {{ include "srw.host" (dict "context" . "key" "api" "default" "api") | quote }}
            - name: BFF_CLIENT_ID
              value: {{ .Values.auth.bff.clientId | quote }}
            {{- if and $sa $sa.cloud $sa.cloud.enabled }}
            # Cloud service-account user — created in TARGET_REALM. Username
            # and password come from the same chart Secret keys the agent
            # reads at runtime, so the user we create matches what the agent
            # logs in as. The chart-values fallback (BOOTSTRAP_CLOUD_USERNAME)
            # is used only if CLOUD_SERVICE_USER is unset on the Secret.
            - name: BOOTSTRAP_CLOUD_ENABLED
              value: "true"
            - name: BOOTSTRAP_CLOUD_USERNAME
              value: {{ $sa.cloud.username | quote }}
            - name: BOOTSTRAP_CLOUD_EMAIL
              value: {{ $sa.cloud.email | quote }}
            - name: BOOTSTRAP_CLOUD_FIRST_NAME
              value: {{ $sa.cloud.firstName | quote }}
            - name: BOOTSTRAP_CLOUD_LAST_NAME
              value: {{ $sa.cloud.lastName | quote }}
            - name: CLOUD_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
                  key: CLOUD_SERVICE_USER
                  optional: true
            - name: CLOUD_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
                  key: CLOUD_SERVICE_PASSWORD
            {{- end }}
            {{- if or .Values.opencloud.enabled (eq (default "" .Values.cloud.externalBackend) "opencloud") }}
            # OpenCloud orchestrator client — needed for the orchestrator's
            # OAuth2 client_credentials flow against OpenCloud's Graph API.
            # Auto-enabled when opencloud is the active cloud backend; the
            # secret comes from the same Vault entry the runtime reads, so
            # rotations propagate to both sides on the next upgrade.
            - name: BOOTSTRAP_OPENCLOUD_ENABLED
              value: "true"
            - name: OPENCLOUD_KEYCLOAK_CLIENT_ID
              value: "opencloud-orchestrator"
            - name: OPENCLOUD_ADMIN_GROUP
              value: "opencloudAdmin"
            - name: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
                  key: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
            {{- end }}
          volumeMounts:
            - name: bootstrap-script
              mountPath: /scripts
              readOnly: true
          resources:
            {{- toYaml .Values.keycloak.bootstrap.resources | nindent 12 }}
      volumes:
        - name: bootstrap-script
          configMap:
            name: {{ include "srw.keycloakBootstrapName" . }}
            defaultMode: 0755
        {{- if $effectivePath }}
        - name: bootstrap-creds
          secret:
            secretName: {{ include "srw.keycloakBootstrapAdminSecretName" . }}
        {{- end }}
{{- end }}
