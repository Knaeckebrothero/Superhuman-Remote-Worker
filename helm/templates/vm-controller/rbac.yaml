{{- if .Values.vmController.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "srw.vmControllerName" . }}
  namespace: {{ include "srw.vmControllerNamespace" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "srw.vmControllerName" . }}
  namespace: {{ include "srw.vmControllerNamespace" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Golden-image cloning: the controller creates a shared golden DataVolume per
  # image digest and GCs stale ones. PVC get/list only (CDI owns their
  # lifecycle; deletion cascades from the DataVolume). Same-namespace clone → no
  # datavolumes/source cross-namespace grant needed.
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  {{ if .Values.vmController.lifecycleAuthSecretName }}
  # Durable replay claims for authenticated create/delete request UUIDs.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "delete"]
  {{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "srw.vmControllerName" . }}
  namespace: {{ include "srw.vmControllerNamespace" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.vmControllerName" . }}
    namespace: {{ include "srw.vmControllerNamespace" . }}
roleRef:
  kind: Role
  name: {{ include "srw.vmControllerName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
