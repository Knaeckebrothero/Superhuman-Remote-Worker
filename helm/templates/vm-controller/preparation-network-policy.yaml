{{- if include "srw.vmSameCluster" . }}
{{- $network := .Values.vmController.preparation.network }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" . }}-workspace-preparer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "workspace-preparer") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: workspace-preparer
  policyTypes: [Ingress, Egress]
  ingress: []
  {{- if not $network.enabled }}
  egress: []
  {{- else }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $network.blockedCidrs | nindent 14 }}
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
    {{- with $network.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
