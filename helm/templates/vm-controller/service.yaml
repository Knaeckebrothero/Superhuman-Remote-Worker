{{- if and .Values.vmController.enabled (ne .Values.vmController.transport "nats") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.vmControllerServiceName" . }}
  namespace: {{ include "srw.vmControllerNamespace" . }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.vmController.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "vm-controller") | nindent 4 }}
{{- end }}
