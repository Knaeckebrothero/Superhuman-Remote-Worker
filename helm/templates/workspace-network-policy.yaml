{{- if .Values.workspace.networkPolicy.enabled }}
# Unified workspace NetworkPolicy — covers BOTH container workspaces (pods)
# and VM workspaces (KubeVirt virt-launcher pods). KubeVirt propagates labels
# from VMI.spec.template.metadata.labels to the virt-launcher pod, so a
# single podSelector matches both implementations.
#
# See docs/features/workspace_network_policy_unification.md for the full
# design rationale, CNI compatibility caveats, and Tailscale-in-VM notes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" . }}-workspace-policy
  labels:
    {{- include "srw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      srw.io/component: agent-workspace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # SSH + CDP from agent pods (RemoteBackend + browser automation).
    # Agent pods are created by the orchestrator's provisioners (not by Helm),
    # so they carry the custom `app: srw-agent` / `app: srw-persistent-agent`
    # labels rather than Helm's `app.kubernetes.io/component` labels.
    - from:
        - podSelector:
            matchLabels:
              app: srw-agent
        - podSelector:
            matchLabels:
              app: srw-persistent-agent
      ports:
        - protocol: TCP
          port: 22
        - protocol: TCP
          port: 9222
    # code-server from orchestrator (IDE session proxying)
    - from:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    # code-server via Traefik ingress (direct IDE access)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTP/HTTPS for browser automation (agent-controlled browsing via CDP)
    # and the Tailscale DERP-relay fallback when UDP is blocked.
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Tailscale mesh — direct WireGuard peer (UDP/41641) and STUN (UDP/3478).
    # If UDP is blocked end-to-end, Tailscale falls back to DERP-over-443
    # transparently (still works, just relayed). Applies equally to container
    # workspaces (Tailscale runs in the pod netns) and VM workspaces (Tailscale
    # runs inside the VM, NAT'd through virt-launcher's veth — pod-level
    # policy sees only the encrypted envelope).
    - ports:
        - protocol: UDP
          port: 41641
        - protocol: UDP
          port: 3478
    # Gitea (workspace git repos)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "gitea") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
    # PostgreSQL (App DB — for datasource shell tools like psql)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    # PostgreSQL (Vector DB)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "pgvector") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    # Neo4j (for datasource shell tools)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "neo4j") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 7688
    # MongoDB (for datasource shell tools)
    - to:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "mongodb") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 27017
    # No general internet beyond TCP 80/443 + Tailscale UDP. Workspaces
    # cannot reach each other (no podSelector matchLabels srw.io/component:
    # agent-workspace in any allowed source).
{{- end }}
