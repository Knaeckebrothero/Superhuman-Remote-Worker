{{- if .Values.externalSecrets.enabled }}
# ---------------------------------------------------------------
# Main application secrets (DB credentials, API keys, etc.)
# ---------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srw.fullname" . }}
  labels:
    {{- include "srw.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srw.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.vaultPath is required when externalSecrets.enabled=true" .Values.externalSecrets.vaultPath }}
---
# ---------------------------------------------------------------
# VM SSH key — orchestrator mounts /run/secrets/vm-ssh-key with
# subPath: ssh-privatekey, and the K8s container provisioner mounts
# `ssh-publickey` from the same Secret into the workspace pod (used
# to seed authorized_keys). Both keys must be present. Two layouts:
#
#   Layout A (legacy)  vmSshKeyVaultPath set
#                      → ESO `dataFrom + extract` pulls the whole
#                        sub-bundle at that path (must already
#                        contain `ssh-privatekey` AND `ssh-publickey`)
#   Layout B (default) vmSshKeyVaultPath empty + main vaultPath set
#                      → ESO `data:` array maps `VM_SSH_PRIVATE_KEY`
#                        and `VM_SSH_PUBLIC_KEY` from the main bundle
#                        into `ssh-privatekey` and `ssh-publickey`
#
# This Secret ALSO carries `user-ca.pub` when sshGateway.enabled, because
# container_provisioner projects that key out of THIS Secret
# (WORKSPACE_SSH_SECRET) into every workspace pod, where the entrypoint
# installs it as sshd's TrustedUserCAKeys. It is not in sshGateway.userCaSecret's
# mount path and never passes through the gateway pod. Without it every attach
# ends in PermissionDenied — fail-closed, but the whole workspace-CA feature
# inert.
#
# Gated on sshGateway.enabled deliberately: ESO fails the WHOLE ExternalSecret
# sync when a `data` entry names a property the bundle does not have, so an
# ungated entry would break `vm-ssh-key` — the key the platform reaches every
# workspace with — for every install that never asked for an ssh-gateway.
#
# If neither is configured (no main vaultPath either), nothing is
# rendered and the orchestrator pod will hang on missing Secret —
# that's by design, vm-ssh-key is required when the agent has VMs.
# ---------------------------------------------------------------
{{- if .Values.externalSecrets.vmSshKeyVaultPath }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srw.fullname" . }}-vm-ssh-key
  labels:
    {{- include "srw.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srw.vmSshKeySecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.vmSshKeyVaultPath }}
  {{- if .Values.sshGateway.enabled }}
  # Layout A pulls a WHOLE bundle, so there is no item to add to it. ESO
  # permits `data` alongside `dataFrom` (and `data` wins on conflict), which is
  # how the CA public half joins a bundle the operator owns. Alternatively,
  # drop this and put a property literally named `user-ca.pub` in that bundle.
  data:
    - secretKey: user-ca.pub
      remoteRef:
        key: {{ required "sshGateway.enabled with externalSecrets requires externalSecrets.vaultPath (the bundle carrying SSH_GATEWAY_USER_CA_PUBLIC_KEY)" .Values.externalSecrets.vaultPath }}
        property: SSH_GATEWAY_USER_CA_PUBLIC_KEY
  {{- end }}
{{- else if .Values.externalSecrets.vaultPath }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "srw.fullname" . }}-vm-ssh-key
  labels:
    {{- include "srw.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "srw.vmSshKeySecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: ssh-privatekey
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: VM_SSH_PRIVATE_KEY
    - secretKey: ssh-publickey
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: VM_SSH_PUBLIC_KEY
    {{- if .Values.sshGateway.enabled }}
    # The ssh-gateway's user CA, public half. Same bundle, one more property.
    # The private half lives in sshGateway.userCaSecret and never comes here.
    - secretKey: user-ca.pub
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: SSH_GATEWAY_USER_CA_PUBLIC_KEY
    {{- end }}
{{- end }}
{{- end }}
