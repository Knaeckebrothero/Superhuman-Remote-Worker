{{- if and .Values.canvas.livePreview.viewer.enabled .Values.canvas.livePreview.viewer.database.credentials.create }}
{{- $database := .Values.canvas.livePreview.viewer.database -}}
{{- $credentials := $database.credentials -}}
{{- $name := printf "%s-canvas-gateway-db" (include "srw.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingUsername := "" -}}
{{- $existingPassword := "" -}}
{{- if and $existing $existing.data (index $existing.data $credentials.usernameKey) -}}
{{- $existingUsername = index $existing.data $credentials.usernameKey | b64dec -}}
{{- end -}}
{{- if and $existingUsername (ne $existingUsername $database.username) -}}
{{- fail "the chart-managed Canvas database role name cannot be changed in place; explicitly revoke the old role and delete its credential Secret first" -}}
{{- end -}}
{{- if and $existing $existing.data (index $existing.data $credentials.passwordKey) -}}
{{- $existingPassword = index $existing.data $credentials.passwordKey | b64dec -}}
{{- end -}}
{{- $password := $existingPassword | default (randAlphaNum 48) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "canvas-gateway-credentials") | nindent 4 }}
type: Opaque
stringData:
  {{ $credentials.usernameKey }}: {{ $database.username | quote }}
  {{ $credentials.passwordKey }}: {{ $password | quote }}
{{- end }}
