{{- if and .Values.canvas.livePreview.viewer.enabled .Values.canvas.livePreview.viewer.database.credentials.create }}
{{- $database := .Values.canvas.livePreview.viewer.database -}}
{{- $credentials := $database.credentials -}}
{{- $name := include "srw.canvasGatewayDatabaseSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingPassword := "" -}}
{{- if and $existing $existing.data (index $existing.data $credentials.passwordKey) -}}
{{- $existingPassword = index $existing.data $credentials.passwordKey | b64dec -}}
{{- else if and $existing $existing.data (index $existing.data "password") -}}
{{- $existingPassword = index $existing.data "password" | b64dec -}}
{{- end -}}
{{- $password := $existingPassword | default (randAlphaNum 48) -}}
{{- /* The role name lives only in database.username (delivered via the
gateway ConfigMap). Renaming it provisions a NEW role on the next Job run and
leaves the old one behind — revoke the old role explicitly when doing so. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "canvas-gateway-credentials") | nindent 4 }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ $database.username | quote }}
  password: {{ $password | quote }}
  {{- if ne $credentials.passwordKey "password" }}
  {{ $credentials.passwordKey }}: {{ $password | quote }}
  {{- end }}
{{- end }}
