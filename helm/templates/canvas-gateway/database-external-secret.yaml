{{- $viewer := .Values.canvas.livePreview.viewer -}}
{{- $credentials := $viewer.database.credentials -}}
{{- $vaultPath := trim $credentials.vaultPath -}}
{{- if and $viewer.enabled (ne $vaultPath "") -}}
{{- if not .Values.externalSecrets.enabled -}}
{{- fail "canvas.livePreview.viewer.database.credentials.vaultPath requires externalSecrets.enabled=true when the Canvas viewer is enabled" -}}
{{- end -}}
{{- $name := include "srw.canvasGatewayDatabaseSecretName" . -}}
# Dedicated least-privilege login for the public Canvas gateway. This resource
# deliberately shares the viewer.enabled lifecycle: a preconfigured Vault path
# does not contact the provider or require credentials while the gateway is off.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "canvas-gateway-credentials") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef | quote }}
    kind: {{ .Values.externalSecrets.secretStoreKind | quote }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: {{ $viewer.database.username | quote }}
        password: "{{ `{{ .password }}` }}"
        {{- if ne $credentials.passwordKey "password" }}
        {{ $credentials.passwordKey }}: "{{ `{{ .password }}` }}"
        {{- end }}
  data:
    # One remote property: the password. The role name is fixed chart
    # configuration. ESO projects the existing bundle-style property into the
    # canonical basic-auth `password` key and the gateway compatibility key.
    - secretKey: password
      remoteRef:
        key: {{ $vaultPath | quote }}
        property: {{ $credentials.passwordKey | quote }}
{{- end }}
