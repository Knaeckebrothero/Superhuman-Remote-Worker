{{- if (include "srw.garageEnabled" .) }}
# Bundled Garage config. Secrets (rpc_secret, admin_token) are injected via env
# (GARAGE_RPC_SECRET / GARAGE_ADMIN_TOKEN), NOT this file, so no secret sits in
# a ConfigMap. Single-node: replication_factor 1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.fullname" . }}-garage-config
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "garage") | nindent 4 }}
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "us-east-1"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.internal"

    [admin]
    api_bind_addr = "[::]:3903"
{{- end }}
