apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.fullname" . }}-cockpit-env
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "cockpit") | nindent 4 }}
data:
  env.js: |
    (function(window) {
      window['env'] = window['env'] || {};
      window['env']['apiUrl'] = '{{ ternary (include "srw.cockpitUrl" .) (include "srw.apiUrl" .) .Values.auth.bff.sameOriginApi }}/api';
      // Null keeps the live-app renderer dark. The suffix is exposed only
      // after the separate viewer gate is explicitly configured.
      window['env']['canvasViewerHostSuffix'] = {{ if and .Values.canvas.livePreview.enabled .Values.canvas.livePreview.viewer.enabled .Values.canvas.livePreview.viewer.hostSuffix }}{{ .Values.canvas.livePreview.viewer.hostSuffix | quote }}{{ else }}null{{ end }};
      // Exact foreign iframe origin; null keeps Office Canvas dark-shipped.
      window['env']['canvasOfficeOrigin'] = {{ if and .Values.collabora.enabled .Values.collabora.publicUrl }}{{ .Values.collabora.publicUrl | quote }}{{ else }}null{{ end }};
      window['env']['giteaUrl'] = '{{ include "srw.gitUrl" . }}/srw';
      window['env']['dozzleUrl'] = '{{ include "srw.urlScheme" . }}://{{ include "srw.dozzleHost" . }}';
      window['env']['minioConsoleUrl'] = '{{ include "srw.urlScheme" . }}://{{ include "srw.minioHost" . }}';
      window['env']['neo4jUrl'] = '{{ include "srw.urlScheme" . }}://{{ include "srw.neo4jBrowserHost" . }}';
      window['env']['pgadminUrl'] = '{{ include "srw.urlScheme" . }}://{{ include "srw.pgadminHost" . }}';
      window['env']['mcpUrl'] = '{{ include "srw.mcpUrl" . }}/mcp';
      window['env']['cloudUrl'] = '{{ include "srw.cloudUrl" . }}';

      // OIDC SSO is brokered by the orchestrator cookie BFF — the cockpit no
      // longer talks to Keycloak directly. The /auth/login redirect on the
      // API origin handles the PKCE handshake server-side. Keycloak URLs are
      // therefore no longer surfaced to the SPA.

      // Model catalog is sourced from GET /api/models (system_api_keys +
      // llm_endpoints). Do not seed window.env.models here — an empty
      // catalog triggers the role-aware "configure a provider" banner.
    })(this);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-cockpit
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "cockpit") | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.cockpit.replicas }}
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "cockpit") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "cockpit") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-orchestrator
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 {{ include "srw.fullname" . }}-orchestrator 8085; do sleep 2; done"]
      containers:
        - name: cockpit
          image: {{ include "srw.imageRef" (dict "image" .Values.image.cockpit) | quote }}
          imagePullPolicy: {{ .Values.image.cockpit.pullPolicy }}
          ports:
            - containerPort: 4000
          volumeMounts:
            - name: env-js
              mountPath: {{ .Values.cockpit.envJs.mountPath | quote }}
              subPath: env.js
          {{- if .Values.cockpit.startupProbe.enabled }}
          # Tilt-mode `ng serve` cold-compile takes 30-90s; without a startup
          # probe the readiness/liveness probes SIGTERM the container before
          # the dev server is ready to respond.
          startupProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: {{ .Values.cockpit.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.cockpit.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.cockpit.startupProbe.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.cockpit.resources | nindent 12 }}
      volumes:
        - name: env-js
          configMap:
            name: {{ include "srw.fullname" . }}-cockpit-env
