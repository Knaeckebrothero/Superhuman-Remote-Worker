apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-cockpit
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "cockpit") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "cockpit") | nindent 4 }}
