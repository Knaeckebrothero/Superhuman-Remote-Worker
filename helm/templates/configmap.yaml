apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.configMapName" . }}
  labels:
    {{- include "srw.labels" . | nindent 4 }}
data:
  # PostgreSQL (App DB) — non-secret connection parts. The DSN is composed
  # at runtime from these + POSTGRES_USER/POSTGRES_PASSWORD (Secret), with
  # URL-quoting applied to the credentials. Storing a full DATABASE_URL in
  # the Secret was redundant and a footgun (urlsplit truncates netlocs at
  # the first ``/`` — passwords with a slash broke config parsing).
  POSTGRES_HOST: {{ include "srw.postgresHost" . | quote }}
  POSTGRES_PORT: {{ include "srw.postgresPort" . | quote }}
  POSTGRES_DB: {{ include "srw.postgresDb" . | quote }}

  # Vector DB — non-secret connection parts. Composed with
  # VECTOR_POSTGRES_USER/VECTOR_POSTGRES_PASSWORD from the Secret.
  VECTOR_POSTGRES_HOST: {{ include "srw.vectorPostgresHost" . | quote }}
  VECTOR_POSTGRES_PORT: {{ include "srw.vectorPostgresPort" . | quote }}
  VECTOR_POSTGRES_DB: {{ include "srw.vectorPostgresDb" . | quote }}

  # Audit DB (srw-auditdb) — non-secret connection parts. Composed with
  # AUDIT_POSTGRES_USER/AUDIT_POSTGRES_PASSWORD from the Secret. Agent pods
  # inherit this ConfigMap via envFrom, so the audit writer reaches them too.
  AUDIT_POSTGRES_HOST: {{ include "srw.auditPostgresHost" . | quote }}
  AUDIT_POSTGRES_PORT: {{ include "srw.auditPostgresPort" . | quote }}
  AUDIT_POSTGRES_DB: {{ include "srw.auditPostgresDb" . | quote }}
  # Active audit backend (mongodb|postgres): the orchestrator reads it for the
  # reader selector; agents inherit it via envFrom for the writer.
  AUDIT_BACKEND: {{ .Values.databases.audit.backend | quote }}

  # LiteLLM gateway DB (srw_litellm) — non-secret connection parts. Composed
  # with LITELLM_POSTGRES_USER/PASSWORD (Secret) into the DATABASE_URL on the
  # LiteLLM pod. LiteLLM self-migrates this schema via Prisma (not the
  # orchestrator migration runner). Rendered unconditionally (mirrors the
  # audit keys); only consumed when litellm.enabled.
  LITELLM_POSTGRES_HOST: {{ include "srw.litellmPostgresHost" . | quote }}
  LITELLM_POSTGRES_PORT: {{ include "srw.litellmPostgresPort" . | quote }}
  LITELLM_POSTGRES_DB: {{ include "srw.litellmPostgresDb" . | quote }}
  {{- if .Values.litellm.enabled }}
  # In-cluster URL agents + orchestrator use to reach the LiteLLM gateway.
  # Presence of this key is what enables the orchestrator's catalog-sync loop.
  LITELLM_BASE_URL: {{ printf "http://%s:%d" (include "srw.serviceName" (dict "context" . "component" "litellm")) (int .Values.litellm.port) | quote }}
  # Aggregate upstream backstop (per-model rpm/tpm capacity) → stamped on the
  # shared fleet key by the orchestrator. JSON map keyed by model_id (+ "*").
  LITELLM_BACKSTOP: {{ .Values.litellm.backstop | toJson | quote }}
  # Per-user / per-project rate-limit policy (Slice 2b) → the orchestrator
  # expands it into LiteLLM teams (projects) + internal users + scoped keys.
  # JSON: { categories, projects, users }.
  LITELLM_RATE_POLICY: {{ .Values.litellm.ratePolicy | toJson | quote }}
  # Per-project daily quota policy (Slice 3) → the orchestrator's quota poll loop
  # freezes a project's jobs when its UTC-day usage crosses the cap.
  # JSON: { projects: { default|<id>: { requests_per_day, tokens_per_day } } }.
  LITELLM_QUOTA: {{ .Values.litellm.quota | toJson | quote }}
  {{- end }}

  # (Citations live in the vector store — srw_vector — reached through the
  # agent's shared VECTOR_POSTGRES_* pool. No separate citation DB/role/DSN.
  # See docs/done/citation_engine_integration.md.)

  {{- if .Values.databases.mongodb.enabled }}
  # MongoDB (retired audit backend — rendered only if explicitly re-enabled; D-5 removes this)
  MONGODB_URL: {{ include "srw.mongodbUrl" . | quote }}
  {{- end }}

  # Gitea
  GITEA_URL: {{ include "srw.gitUrl" . | quote }}
  GITEA_INTERNAL_URL: {{ include "srw.giteaInternalUrl" . | quote }}

  # Orchestrator
  ORCHESTRATOR_URL: {{ printf "http://%s:8085" (include "srw.serviceName" (dict "context" . "component" "orchestrator")) | quote }}

  # Workspace
  WORKSPACE_PATH: {{ "/workspace" | quote }}
  WORKSPACE_STORAGE_CLASS: {{ .Values.workspace.ephemeralStorageClass | default "longhorn-ephemeral" | quote }}

  # Agent
  AGENT_CONFIG: {{ .Values.agent.config | quote }}
  AGENT_PORT: {{ .Values.agent.port | quote }}
  PERSISTENT_AGENT_CONFIG: {{ .Values.agent.persistentConfig | quote }}

  # Apply DB-backed config overrides (admin-curated rows in the config_overrides
  # table) to dynamically provisioned agents. Read by the agent prompt loader
  # (src/core/loader.py) via envFrom on this shared ConfigMap. Default-off
  # chart-wide (prod-safe); the dev/experimental values file turns it on.
  CONFIG_DB_OVERRIDES_ENABLED: {{ .Values.agent.configDbOverridesEnabled | default "false" | quote }}
  # DB-backed user experts (experts table). Read by both the orchestrator
  # (list/CRUD) and the agent (expert-by-id load) via envFrom on this shared
  # ConfigMap. Default-off chart-wide (prod-safe); the dev values file turns it on.
  EXPERTS_DB_ENABLED: {{ .Values.agent.expertsDbEnabled | default "false" | quote }}
  # DB-backed Agent Skills (skills + skill_files). Read by the orchestrator's
  # skill CRUD/list endpoints. Default-off chart-wide (prod-safe); dev turns it on.
  SKILLS_DB_ENABLED: {{ .Values.agent.skillsDbEnabled | default "false" | quote }}

  # OIDC / SSO — works with internal Keycloak or external OIDC provider
  KEYCLOAK_URL: {{ include "srw.keycloakInternalUrl" . | quote }}
  KEYCLOAK_ISSUER_URL: {{ include "srw.authUrl" . | quote }}
  KEYCLOAK_REALM: {{ .Values.keycloak.realm | quote }}
  # Orchestrator BFF client (confidential, NOT the cockpit SPA public client).
  # The cockpit SPA still uses .Values.keycloak.cockpitClientId for its
  # PKCE-only Bearer flow.
  KEYCLOAK_CLIENT_ID: {{ .Values.auth.bff.clientId | quote }}
  {{- if .Values.keycloak.adminApiDisabled }}
  KEYCLOAK_ADMIN_API_DISABLED: {{ "true" | quote }}
  {{- end }}

  # Cookie BFF — orchestrator-issued sessions for the cockpit.
  # See docs/features/auth_bff_and_api_tokens.md.
  # When sameOriginApi=true, the BFF redirect lives on the cockpit origin
  # (path-routed to the orchestrator) so the OIDC callback and the cockpit
  # share an origin and the session cookie is first-party.
  SRW_BFF_REDIRECT_URI: {{ printf "%s/auth/callback" (ternary (include "srw.cockpitUrl" .) (include "srw.apiUrl" .) .Values.auth.bff.sameOriginApi) | quote }}
  SRW_SPA_BASE_URL: {{ include "srw.cockpitUrl" . | quote }}
  # auth.bff.cookieDomain semantics:
  #   "auto" (default) → ".<global.domain>" (rides on cockpit + api subdomains)
  #   ""               → host-only (right for localhost dev where browsers
  #                                  may reject Domain=.localhost as a public-suffix)
  #   anything else    → emitted literally
  SRW_COOKIE_DOMAIN: {{ if eq .Values.auth.bff.cookieDomain "auto" }}{{ printf ".%s" .Values.global.domain | quote }}{{ else }}{{ .Values.auth.bff.cookieDomain | quote }}{{ end }}
  SRW_COOKIE_SECURE: {{ .Values.auth.bff.cookieSecure | default "1" | quote }}
  SRW_COOKIE_SAMESITE: {{ .Values.auth.bff.cookieSamesite | default "lax" | quote }}
  SRW_SESSION_IDLE_TIMEOUT_S: {{ .Values.auth.bff.sessionIdleTimeoutSeconds | default 1800 | int | quote }}
  SRW_SESSION_ABSOLUTE_TIMEOUT_S: {{ .Values.auth.bff.sessionAbsoluteTimeoutSeconds | default 2592000 | int | quote }}
  SRW_ACCESS_TOKEN_REFRESH_SKEW_S: {{ .Values.auth.bff.accessTokenRefreshSkewSeconds | default 60 | int | quote }}

  # CORS (orchestrator reads this for additional allowed origins)
  CORS_ORIGINS: {{ include "srw.cockpitUrl" . | quote }}

  # Cockpit external URL (for deep links in emails/notifications)
  COCKPIT_EXTERNAL_URL: {{ include "srw.cockpitUrl" . | quote }}

  # LLM routing
  # All routing (base URLs, vision/embedding/codex/builder model IDs and
  # providers) moved to admin-curated catalog rows + default-model pins:
  #   - system_api_keys + llm_endpoints → transports (helm-seeded)
  #   - models table → catalog rows (provider_kind + provider_ref + capability)
  #   - default_llm_models → admin-pinned per-capability defaults
  # Removed in chunk 7 of models_yaml_removal: VISION_MODEL, EMBEDDING_MODEL,
  # EMBEDDING_BASE_URL, CODEX_BASE_URL, BUILDER_LLM_PROVIDER. See
  # docs/features/models_yaml_removal.md.
  KEY_COOLDOWN_SECONDS: {{ .Values.llm.keyCooldownSeconds | quote }}

  # (Citation embeddings now share SRW's EMBEDDING_* service — same 4096-dim
  # qwen3-embedding-8b model that backs memory/KB — so there is no separate
  # CITATION_EMBEDDING_* stack. See docs/done/citation_engine_integration.md.)

  # Codex raw-response diagnostic capture
  DEBUG_CODEX_RAW_RESPONSE: {{ "0" | quote }}
  CODEX_RAW_DUMP_DIR: {{ "/app/logs/codex-raw" | quote }}

  # Orchestrator settings
  AUTO_ASSIGN_ENABLED: {{ .Values.orchestrator.autoAssignEnabled | quote }}

  # Neo4j — only the Bolt URL is non-secret. Both NEO4J_USERNAME and
  # NEO4J_PASSWORD live in the Secret/Vault, mirroring the POSTGRES_USER /
  # VECTOR_POSTGRES_USER / CITATION_POSTGRES_USER pattern. The Neo4j server
  # image's NEO4J_AUTH env var is composed at pod-start from those two via
  # K8s $(VAR) substitution.
  {{- if .Values.databases.neo4j.enabled }}
  NEO4J_URL: {{ include "srw.neo4jUrl" . | quote }}
  DEFAULT_DS_NEO4J_URL: {{ include "srw.neo4jUrl" . | quote }}
  DEFAULT_DS_NEO4J_NAME: {{ "Default Neo4j" | quote }}
  DEFAULT_DS_NEO4J_READ_ONLY: {{ "false" | quote }}
  {{- end }}

  # S3 / Object Storage
  S3_ENDPOINT: {{ .Values.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  SNAPSHOT_MAX_SIZE_GB: {{ .Values.s3.snapshotMaxSizeGb | quote }}
  SNAPSHOT_RETENTION_DAYS: {{ .Values.s3.snapshotRetentionDays | quote }}

  # IDE sessions
  IDE_SESSION_IDLE_TIMEOUT: {{ .Values.ide.sessionIdleTimeout | quote }}
  IDE_SESSION_MAX_LIFETIME: {{ .Values.ide.sessionMaxLifetime | quote }}
  IDE_MAX_CONCURRENT_PER_USER: {{ .Values.ide.maxConcurrentPerUser | quote }}
  CODE_SERVER_IMAGE: {{ .Values.ide.codeServerImage | quote }}
  IDE_PROXY_BASE_URL: {{ include "srw.apiUrl" . | quote }}

  # Notification — SMTP
  SMTP_HOST: {{ .Values.email.smtp.host | quote }}
  SMTP_PORT: {{ .Values.email.smtp.port | quote }}
  SMTP_USE_TLS: {{ .Values.email.smtp.useTls | quote }}
  SMTP_TRUST_SELF_SIGNED: {{ .Values.email.smtp.trustSelfSigned | quote }}
  SMTP_FROM: {{ .Values.email.smtp.from | quote }}

  # Notification — IMAP
  IMAP_HOST: {{ .Values.email.imap.host | quote }}
  IMAP_PORT: {{ .Values.email.imap.port | quote }}
  IMAP_USE_SSL: {{ .Values.email.imap.useSsl | quote }}
  IMAP_TRUST_SELF_SIGNED: {{ .Values.email.imap.trustSelfSigned | quote }}
  IMAP_POLL_INTERVAL: {{ .Values.email.imap.pollInterval | quote }}
  AGENT_EMAIL: {{ .Values.email.agentEmail | quote }}
  MAIL_DOMAIN: {{ .Values.email.domain | quote }}

  # Notification — Ntfy (optional)
  NTFY_URL: {{ .Values.notifications.ntfy.url | quote }}
  NTFY_TOPIC: {{ .Values.notifications.ntfy.topic | quote }}

  # Nextcloud — internal + public URLs
  {{- if .Values.nextcloud.enabled }}
  NEXTCLOUD_URL: {{ printf "http://%s" (include "srw.serviceName" (dict "context" . "component" "nextcloud")) | quote }}
  NEXTCLOUD_PUBLIC_URL: {{ include "srw.cloudUrl" . | quote }}
  NEXTCLOUD_ADMIN_USER: {{ "admin" | quote }}
  NEXTCLOUD_AGENT_USER: {{ "agent-service" | quote }}

  # Nextcloud / WebDAV datasource (optional)
  DEFAULT_DS_WEBDAV_URL: {{ printf "http://%s/remote.php/dav/files/admin/" (include "srw.serviceName" (dict "context" . "component" "nextcloud")) | quote }}
  DEFAULT_DS_WEBDAV_NAME: {{ "Nextcloud" | quote }}
  DEFAULT_DS_WEBDAV_READ_ONLY: {{ "false" | quote }}
  {{- end }}

  # Main-cloud workspace data plane. "sync" preserves the legacy eager clone
  # path; "rclone_mount" asks supported agent runtimes to expose cloud folders
  # through lazy rclone/FUSE mounts instead.
  CLOUD_WORKSPACE_DRIVER: {{ .Values.cloud.workspaceDriver | default "rclone_mount" | quote }}
  CLOUD_RCLONE_ALLOW_CONTAINER: {{ ternary "true" "false" .Values.cloud.rcloneMount.allowContainer | quote }}

  # Virtual workspace tier (no_workspace_agent_mode.md §4/§5) — object store for
  # `workspace.backend: virtual` agents. Empty type disables the tier (a virtual
  # job/session then fails fast). For s3, endpoint/region/provider are non-secret
  # (here); credentials are the Secret keys VIRTUAL_WORKSPACE_S3_ACCESS_KEY_ID /
  # _SECRET_ACCESS_KEY, wired separately on the orchestrator pod.
  VIRTUAL_WORKSPACE_RCLONE_TYPE: {{ .Values.virtualWorkspace.rclone.type | default "" | quote }}
  VIRTUAL_WORKSPACE_RCLONE_ROOT: {{ .Values.virtualWorkspace.rclone.root | default "" | quote }}
  VIRTUAL_WORKSPACE_S3_ENDPOINT: {{ .Values.virtualWorkspace.s3.endpoint | default "" | quote }}
  VIRTUAL_WORKSPACE_S3_REGION: {{ .Values.virtualWorkspace.s3.region | default "us-east-1" | quote }}
  VIRTUAL_WORKSPACE_S3_PROVIDER: {{ .Values.virtualWorkspace.s3.provider | default "Minio" | quote }}
  {{- if .Values.cloud.nextcloudRcloneUserHomeUsername }}
  NEXTCLOUD_RCLONE_USER_HOME_USERNAME: {{ .Values.cloud.nextcloudRcloneUserHomeUsername | quote }}
  {{- end }}

  # Cloud backend — opencloud (bundled), nextcloud (bundled), external, or unset
  {{- if .Values.opencloud.enabled }}
  MAIN_CLOUD_BACKEND: {{ "opencloud" | quote }}
  OPENCLOUD_URL: {{ printf "http://%s:9200" (include "srw.serviceName" (dict "context" . "component" "opencloud")) | quote }}
  OPENCLOUD_PUBLIC_URL: {{ include "srw.cloudUrl" . | quote }}
  OPENCLOUD_KEYCLOAK_ISSUER: {{ printf "%s/realms/%s" (include "srw.keycloakInternalUrl" .) .Values.keycloak.realm | quote }}
  OPENCLOUD_KEYCLOAK_CLIENT_ID: {{ "opencloud-orchestrator" | quote }}
  {{- if .Values.opencloud.mountInsecureTls }}
  # Local-dev only: rclone mounts skip TLS verification on the tus
  # data-gateway hop (mkcert edge cert). Never enable on real deployments.
  OPENCLOUD_MOUNT_INSECURE_TLS: "true"
  {{- end }}
  {{- else if .Values.nextcloud.enabled }}
  MAIN_CLOUD_BACKEND: {{ "nextcloud" | quote }}
  {{- else if .Values.cloud.externalBackend }}
  MAIN_CLOUD_BACKEND: {{ .Values.cloud.externalBackend | quote }}
  {{- if eq .Values.cloud.externalBackend "nextcloud" }}
  NEXTCLOUD_URL: {{ include "srw.cloudServiceUrl" . | quote }}
  NEXTCLOUD_PUBLIC_URL: {{ required "cloud.externalUrl is required when cloud.externalBackend is set" .Values.cloud.externalUrl | quote }}
  {{- else if eq .Values.cloud.externalBackend "opencloud" }}
  OPENCLOUD_URL: {{ include "srw.cloudServiceUrl" . | quote }}
  OPENCLOUD_PUBLIC_URL: {{ required "cloud.externalUrl is required when cloud.externalBackend is set" .Values.cloud.externalUrl | quote }}
  OPENCLOUD_KEYCLOAK_ISSUER: {{ printf "%s/realms/%s" (include "srw.keycloakInternalUrl" .) .Values.keycloak.realm | quote }}
  OPENCLOUD_KEYCLOAK_CLIENT_ID: {{ "opencloud-orchestrator" | quote }}
  {{- else if eq .Values.cloud.externalBackend "webdav" }}
  DEFAULT_DS_WEBDAV_URL: {{ include "srw.cloudServiceUrl" . | quote }}
  DEFAULT_DS_WEBDAV_NAME: {{ "External WebDAV" | quote }}
  DEFAULT_DS_WEBDAV_READ_ONLY: {{ "false" | quote }}
  {{- end }}
  {{- end }}

  # NATS — when nats.internal=true, points at the in-cluster Service;
  # otherwise the user-supplied .Values.nats.url (empty disables VM lifecycle).
  NATS_URL: {{ include "srw.natsUrl" . | quote }}
  # Per-orchestrator id used to scope vm.lifecycle.* NATS subjects. Must match
  # the paired VM controller chart's orchestratorId.
  ORCHESTRATOR_ID: {{ include "srw.orchestratorId" . | quote }}

  # VM Controller (HTTP transport, same-cluster mode). Empty when
  # vmController.enabled=false or transport=nats — orchestrator falls back
  # to NATS / direct K8s in those cases.
  VM_CONTROLLER_URL: {{ include "srw.vmControllerUrl" . | quote }}
  VM_NAMESPACE: {{ include "srw.vmControllerNamespace" . | quote }}

  # Headscale (mesh VPN coordination server)
  HEADSCALE_URL: {{ include "srw.headscaleUrl" . | quote }}

  # Agent tailscale sidecar gate (read by AgentProvisioner). When "false",
  # dynamically provisioned agent pods skip the tailscale sidecar entirely.
  AGENT_TAILSCALE_ENABLED: {{ .Values.agent.tailscale.enabled | quote }}
  # Sustained-dark window (seconds) for the agent tailscale sidecar liveness probe.
  AGENT_TAILSCALE_DARK_TIMEOUT_SECONDS: {{ .Values.agent.tailscale.darkTimeoutSeconds | default 600 | quote }}

  # Workspace containers (per-job sandboxed execution environments)
  WORKSPACE_IMAGE: {{ printf "%s:%s" .Values.image.workspace.repository .Values.image.workspace.tag | quote }}
  WORKSPACE_NAMESPACE: {{ .Release.Namespace | quote }}
  WORKSPACE_FUSE_ENABLED: {{ ternary "true" "false" .Values.workspace.fuse.enabled | quote }}
  WORKSPACE_FUSE_PRIVILEGED: {{ ternary "true" "false" .Values.workspace.fuse.privileged | quote }}

  # PR 3 — one-time seed knob for the homelab operator. Empty in SaaS deployments.
  # When set, orchestrator init flips this user's default project from
  # the database default 'internet-only' to 'home-allowed' on first boot.
  OPERATOR_HOME_ALLOWED_EMAIL: {{ .Values.workspace.networkPolicy.operatorHomeAllowedEmail | default "" | quote }}

  # Agent pods (on-demand via AgentProvisioner)
  AGENT_IMAGE: {{ printf "%s:%s" .Values.image.agent.repository .Values.image.agent.tag | quote }}
  PERSISTENT_AGENT_IMAGE: {{ printf "%s:%s" .Values.image.agent.repository .Values.image.agent.tag | quote }}

  # Agent pool sizing (AgentProvisioner)
  MAX_AGENTS: {{ .Values.agent.pool.maxAgents | quote }}
  MIN_AGENTS: {{ .Values.agent.pool.minAgents | quote }}
  AGENT_BUFFER: {{ .Values.agent.pool.buffer | quote }}
  RESERVED_SESSION_SLOTS: {{ .Values.agent.pool.reservedSessionSlots | quote }}
  RESERVED_JOB_SLOTS: {{ .Values.agent.pool.reservedJobSlots | quote }}

  # Logging
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  # JSON structured logs for the aggregation pipeline (Alloy -> Loki); "text"
  # for human-readable output. See docs/features/centralized_logging.md.
  LOG_FORMAT: {{ .Values.logFormat | default "text" | quote }}

  # License acceptance (enforced at runtime by orchestrator)
  LICENSE_TERMS_ACCEPTED: {{ .Values.license.acceptTerms | quote }}
