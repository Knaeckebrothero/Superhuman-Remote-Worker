{{/*
Headscale — self-hosted Tailscale coordination server.
Deployed into its own "headscale" namespace (outside the release namespace).
*/}}
{{- if .Values.headscale.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: headscale
  labels:
    {{- include "srw.labels" . | nindent 4 }}
    app.kubernetes.io/component: headscale
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "headscale") | nindent 4 }}
data:
  config.yaml: |
    server_url: {{ include "srw.headscaleUrl" . }}
    listen_addr: 0.0.0.0:8443
    metrics_listen_addr: 0.0.0.0:9090
    noise:
      private_key_path: /var/lib/headscale/noise_private.key
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
    derp:
      server:
        enabled: true
        region_id: 999
        stun_listen_addr: 0.0.0.0:3478
      urls:
        - https://controlplane.tailscale.com/derpmap/default
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
    policy:
      mode: file
      path: /etc/headscale/acl.hujson
    dns:
      magic_dns: true
      base_domain: headscale.internal
      nameservers:
        global:
          - 1.1.1.1
          - 9.9.9.9
    log:
      level: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-acl
  namespace: headscale
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "headscale") | nindent 4 }}
data:
  acl.hujson: |
    {
      "acls": [
        {
          "action": "accept",
          "src": ["*"],
          "dst": ["*:*"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "srw.fullname" . }}-headscale
  namespace: headscale
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "headscale") | nindent 4 }}
spec:
  serviceName: {{ include "srw.fullname" . }}-headscale
  replicas: 1
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "headscale") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "headscale") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: headscale
          image: {{ .Values.headscale.image }}
          command: ["headscale", "serve"]
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 9090
              name: metrics
            - containerPort: 3478
              name: stun
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
            - name: acl
              mountPath: /etc/headscale/acl.hujson
              subPath: acl.hujson
            - name: data
              mountPath: /var/lib/headscale
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: headscale-config
        - name: acl
          configMap:
            name: headscale-acl
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.headscale.storageClass }}
        storageClassName: {{ .Values.headscale.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.headscale.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-headscale
  namespace: headscale
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "headscale") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 8443
      name: https
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "headscale") | nindent 4 }}
{{- if .Values.headscale.stun.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-headscale-stun
  namespace: headscale
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "headscale") | nindent 4 }}
spec:
  type: NodePort
  ports:
    - port: 3478
      targetPort: 3478
      protocol: UDP
      name: stun
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "headscale") | nindent 4 }}
{{- end }}
{{- if .Values.ingress.tls.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "srw.fullname" . }}-headscale-tls
  namespace: headscale
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "headscale") | nindent 4 }}
spec:
  secretName: {{ include "srw.fullname" . }}-headscale-tls
  issuerRef:
    name: {{ .Values.ingress.tls.issuerName }}
    kind: ClusterIssuer
  dnsNames:
    - headscale.{{ .Values.global.domain }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "srw.fullname" . }}-headscale
  namespace: headscale
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "headscale") | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`headscale.{{ .Values.global.domain }}`)
      services:
        - name: {{ include "srw.fullname" . }}-headscale
          port: 443
  tls:
    passthrough: true
{{- end }}
