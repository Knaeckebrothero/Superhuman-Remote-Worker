{{- if .Values.crawl4ai.enabled }}
{{- $component := "crawl4ai" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.fullname" . }}-crawl4ai
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
data:
  # Upstream 0.9.x binds to loopback unless a credential is configured. The
  # Service bind and the required static bearer token are both explicit here.
  config.yml: |
    app:
      host: "0.0.0.0"
      port: {{ .Values.crawl4ai.service.port }}
      workers: 1
      timeout_keep_alive: 300
    security:
      enabled: true
      jwt_enabled: true
      api_token: ""
      https_redirect: false
      trusted_hosts: ["*"]
      cors_allow_origins: []
    crawler:
      browser:
        kwargs:
          headless: true
          text_mode: true
        extra_args:
          - "--no-sandbox"
          - "--disable-dev-shm-usage"
          - "--disable-gpu"
          - "--disable-software-rasterizer"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-crawl4ai
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.crawl4ai | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crawl4ai
          image: {{ .Values.crawl4ai.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: CRAWL4AI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "srw.secretName" .) .Values.crawl4ai.apiTokenSecret.name | quote }}
                  key: {{ .Values.crawl4ai.apiTokenSecret.key | quote }}
            # Crawl4AI requires a stable >=32-character signing secret when
            # JWT is enabled. Reusing the high-entropy operator token adds no
            # privilege: that token already authenticates with admin scope.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "srw.secretName" .) .Values.crawl4ai.apiTokenSecret.name | quote }}
                  key: {{ .Values.crawl4ai.apiTokenSecret.key | quote }}
            - name: CRAWL4AI_HOOKS_ENABLED
              value: "false"
            - name: CRAWL4AI_EXECUTE_JS_ENABLED
              value: "false"
            - name: CRAWL4AI_ALLOW_INTERNAL_URLS
              value: "false"
          ports:
            - name: http
              containerPort: {{ .Values.crawl4ai.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: redis
              mountPath: /var/lib/redis
            - name: redis-log
              mountPath: /var/log/redis
            - name: outputs
              mountPath: /var/lib/crawl4ai/outputs
            - name: crawl-home
              mountPath: /home/appuser/.crawl4ai
            - name: url-cache
              mountPath: /home/appuser/.cache/url_seeder
            - name: gunicorn
              mountPath: /home/appuser/.gunicorn
            - name: shm
              mountPath: /dev/shm
          resources:
            {{- toYaml .Values.crawl4ai.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "srw.fullname" . }}-crawl4ai
        - name: tmp
          emptyDir: {}
        - name: redis
          emptyDir: {}
        - name: redis-log
          emptyDir: {}
        - name: outputs
          emptyDir: {}
        - name: crawl-home
          emptyDir: {}
        - name: url-cache
          emptyDir: {}
        - name: gunicorn
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.serviceName" (dict "context" . "component" $component) }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.crawl4ai.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" $component) | nindent 4 }}
{{- end }}
