{{/*
Stakater Reloader — watches ConfigMap/Secret changes and triggers
rolling restarts of annotated Deployments/StatefulSets/DaemonSets.
*/}}
{{- if .Values.reloader.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "srw.fullname" . }}-reloader
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "reloader") | nindent 4 }}
---
{{- if .Values.reloader.watchGlobally }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "srw.fullname" . }}-reloader
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "reloader") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["list", "get", "watch"]
  {{- /* Reloader emits an Event per reload. Without this it still reloads but
       logs a "cannot create resource events" error on every success. */}}
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list", "get", "watch", "update", "patch"]
  {{- /* It lists these on startup regardless of whether any are annotated. */}}
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "srw.fullname" . }}-reloader
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "reloader") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.fullname" . }}-reloader
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "srw.fullname" . }}-reloader
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "srw.fullname" . }}-reloader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "reloader") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["list", "get", "watch"]
  {{- /* Reloader emits an Event per reload. Without this it still reloads but
       logs a "cannot create resource events" error on every success. */}}
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list", "get", "watch", "update", "patch"]
  {{- /* It lists these on startup regardless of whether any are annotated. */}}
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "srw.fullname" . }}-reloader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "reloader") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.fullname" . }}-reloader
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "srw.fullname" . }}-reloader
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-reloader
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "reloader") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "reloader") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "reloader") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "srw.fullname" . }}-reloader
      containers:
        - name: reloader
          image: {{ .Values.reloader.image }}
          args:
            - --reload-strategy=annotations
          {{- if not .Values.reloader.watchGlobally }}
          env:
            {{- /* v1.3.0 scopes its watch by KUBERNETES_NAMESPACE, NOT by
                 RELOADER_WATCH_GLOBALLY (which it ignores). Unset, it logs
                 "will detect changes in all namespaces" and hammers the API
                 with cluster-scope list calls the Role above denies. */}}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- end }}
          resources:
            {{- toYaml .Values.reloader.resources | nindent 12 }}
{{- end }}
