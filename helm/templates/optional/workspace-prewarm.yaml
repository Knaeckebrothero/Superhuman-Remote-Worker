{{/*
Workspace image pre-warmer — DaemonSet that pulls the workspace image on every
node so the first session-attach for a freshly-published tag doesn't pay a
~2-minute cold pull penalty. The workspace image is ~1.4 GB; on first schedule
to a node without the tag cached, the kubelet spends that long pulling, which
exceeds both the agent's _poll_workspace_ready (120s) and the orchestrator's
WS-proxy /ready budget (default 180s).

Mechanism: the init container references the workspace image with
imagePullPolicy: Always (so a Helm rollout updates the cached layer); the
init's command is a no-op, the pull is the side effect. The main container
runs `pause` so the DaemonSet stays Ready and the kubelet doesn't garbage-
collect the image.
*/}}
{{- if .Values.workspace.prewarm.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "srw.fullname" . }}-workspace-prewarm
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "workspace-prewarm") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "workspace-prewarm") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "workspace-prewarm") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        # Land on every schedulable node, including tainted ones.
        - operator: Exists
      initContainers:
        - name: pull-workspace
          image: {{ printf "%s:%s" .Values.image.workspace.repository .Values.image.workspace.tag | quote }}
          imagePullPolicy: Always
          command: ["true"]
          resources:
            requests:
              cpu: "1m"
              memory: "8Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: pause
          image: {{ .Values.workspace.prewarm.pauseImage | default "registry.k8s.io/pause:3.10" | quote }}
          resources:
            requests:
              cpu: "1m"
              memory: "8Mi"
            limits:
              cpu: "10m"
              memory: "32Mi"
{{- end }}
