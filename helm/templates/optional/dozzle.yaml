{{/*
Dozzle — real-time log viewer for Kubernetes.
ClusterRole/ClusterRoleBinding are cluster-scoped and include the release
name to avoid collisions between multiple Helm releases.
*/}}
{{- if .Values.dozzle.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "srw.fullname" . }}-dozzle
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "dozzle") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "srw.fullname" . }}-dozzle
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "dozzle") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "srw.fullname" . }}-dozzle
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "dozzle") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.fullname" . }}-dozzle
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "srw.fullname" . }}-dozzle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-dozzle
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "dozzle") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "dozzle") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "dozzle") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "srw.fullname" . }}-dozzle
      containers:
        - name: dozzle
          image: {{ .Values.dozzle.image }}
          args:
            - --mode
            - k8s
            - --no-analytics
            - --namespace
            - {{ .Release.Namespace }}
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.dozzle.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-dozzle
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "dozzle") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9999
      targetPort: 8080
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "dozzle") | nindent 4 }}
{{- end }}
