{{- if and .Values.databases.mongodb.enabled .Values.databases.mongodb.internal }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "srw.fullname" . }}-mongodb-data
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "mongodb") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.databases.mongodb.storageClass }}
  storageClassName: {{ .Values.databases.mongodb.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.databases.mongodb.storageSize }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "srw.fullname" . }}-mongodb
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "mongodb") | nindent 4 }}
spec:
  serviceName: {{ include "srw.fullname" . }}-mongodb
  replicas: 1
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "mongodb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "mongodb") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mongodb
          image: {{ .Values.databases.mongodb.image }}
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: "srw_logs"
          volumeMounts:
            - name: data
              mountPath: /data/db
          # mongosh is a Node.js CLI; cold-start + driver handshake routinely
          # exceeds the default 1s probe timeout under PVC load, leading to
          # spurious liveness kills. 5s gives mongosh room to boot.
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--norc", "--eval", "db.adminCommand({ping:1})"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--norc", "--eval", "db.adminCommand({ping:1})"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.databases.mongodb.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "srw.fullname" . }}-mongodb-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-mongodb
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "mongodb") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "mongodb") | nindent 4 }}
{{- end }}
