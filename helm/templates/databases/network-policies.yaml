{{- if and .Values.databases.audit.enabled .Values.databases.audit.internal }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" . }}-auditdb
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "auditdb") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "auditdb") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Reader (orchestrator) + writer (agent pods) — both reach auditdb:5432.
    - from:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "agent") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
---
{{- end }}

