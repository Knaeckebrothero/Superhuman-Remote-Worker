{{- /*
Database-tier NetworkPolicies — one per internal DB StatefulSet.

Each policy locks the database pod to ingress from its legitimate consumers
only. Egress is intentionally unrestricted — a workspace-pod compromise that
reaches a DB is the threat model here, and that path is closed by the
podSelector-based allow-list below.

Probes (liveness/readiness) come from the kubelet on the node, which bypasses
NetworkPolicy entirely — no allowance needed.

Optional admin UIs (pgadmin) are conditionally added to the
allow-list when their respective .enabled toggles are set. The short-lived
llm-seed Job is allowed against the main Postgres so the install can seed
the model catalog.
*/ -}}

{{- if and .Values.databases.postgres.enabled .Values.databases.postgres.internal }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "srw.fullname" . }}-postgres
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 14 }}
        {{- if .Values.canvas.livePreview.viewer.enabled }}
        # Canvas origin/session authorization and revocation state is stored in
        # the application database; the internal gateway needs no other DB.
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "canvas-gateway") | nindent 14 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "agent") | nindent 14 }}
        {{- if .Values.agent.stateless.enabled }}
        # Stateless executor class — deliberately NOT component=agent (that
        # label pair would put it behind the agent Service/PDB), so it needs
        # its own ingress allowance.
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "agent-stateless") | nindent 14 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "llm-seed") | nindent 14 }}
        {{- if .Values.pgadmin.enabled }}
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "pgadmin") | nindent 14 }}
        {{- end }}
        {{- if (include "srw.dbRendersCnpg" (dict "context" . "key" "postgres")) }}
        # CloudNativePG streams WAL between the cluster's own instances on 5432.
        - podSelector:
            matchLabels:
              {{- include "srw.componentSelectorLabels" (dict "context" . "component" "postgres") | nindent 14 }}
        # The operator polls instance health; without this, failover never fires.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.databases.operator.namespace | quote }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
---
{{- end }}

