{{- /*
Short-lived Job that seeds system_api_keys and llm_endpoints from the
helm-rendered payload. Insert-only: `helm upgrade` re-runs this against an
already-seeded stack and exits 0 after logging "skipped" for every entry.

API keys are injected via env vars (never written into the ConfigMap) — each
`llm.seed.systemApiKeys[provider]` entry becomes a `SEED_<PROVIDER>_API_KEY`
env var sourced from the referenced Secret, and each endpoint's apiKeyRef
becomes `SEED_ENDPOINT_<index>_API_KEY`.

Rendered only when the orchestrator is actually scheduled to run. The health
gate below cannot pass at `orchestrator.replicas: 0`, and Helm blocks on a
post-upgrade hook until it finishes — so a quiesced orchestrator wedged the
release in `pending-upgrade`, which blocks every later apply *including the one
that scales the orchestrator back up*. That is a deadlock, and it cost two
manual recoveries during the 2026-08-23 CNPG cutover window. A database cutover
has to quiesce its writers (knowledge-base/knowledge/operations/
cnpg_migration_runbook.md §B2a), so that apply must carry no hook at all.

`gt (int ...) 0`, NOT `default` — Helm's `default` treats 0 as empty, so
`.Values.orchestrator.replicas | default 1` would render the hook straight
through the quiesce. Same trap as gitea.replicas, same day.

The payload ConfigMap (hook-weight 0) still renders while quiesced. It is
applied without a wait and is inert on its own, so it costs nothing and is back
in step with this Job the moment the replicas return.
*/ -}}
{{- if and .Values.llm.seed.enabled (gt (int .Values.orchestrator.replicas) 0) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "srw.fullname" . }}-llm-seed
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "llm-seed") | nindent 4 }}
  annotations:
    # Run after the orchestrator's own init has applied the schema. The
    # orchestrator ensures schemas at startup, so the Deployment must be
    # Ready before we seed. hook-weight 10 places us after all weight<10
    # hooks (e.g. ConfigMap at weight 0).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  # Hard ceiling on the hook, end to end. The bounded wait below caps one pod
  # at 300s, but backoffLimit retries it twice more, so the init container
  # alone would still let a failing apply hang for ~15 minutes. Seeding itself
  # is a handful of INSERTs (seconds), so 600s can only ever be hit by
  # something stuck — and Helm is released either way.
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "llm-seed") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if and .Values.databases.postgres.enabled .Values.databases.postgres.internal }}
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 {{ include "srw.postgresHost" . }} 5432; do sleep 2; done"]
        {{- end }}
        - name: wait-for-orchestrator
          # The orchestrator runs ensure_schema() on startup — delay the seed
          # until its health endpoint is responsive so the tables exist.
          #
          # Bounded at 100 tries × 3s. This loop had no ceiling until
          # 2026-08-23, and an orchestrator that never answers is not a
          # hypothetical: a rollout can fail, an image can be unpullable, and a
          # cutover deliberately scales it to zero. Helm waits on the hook, so
          # "forever" meant the release never left `pending-upgrade`.
          #
          # Exhausting the budget exits 1 rather than 0, deliberately. Exit 1
          # fails the hook and marks the release `failed` — noisy, but Fleet's
          # next apply proceeds normally, because `failed` is re-appliable and
          # `pending-upgrade` is not. Exit 0 would be worse than noisy: the
          # seeder talks to Postgres directly and only works because the
          # orchestrator has already applied the schema, so it would die on an
          # undefined table (main() returns 1 on any exception) and report a DB
          # error in place of the real cause — after possibly seeding part of a
          # half-migrated schema.
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              i=0
              until wget -q -O- http://{{ include "srw.fullname" . }}-orchestrator:8085/api/health >/dev/null; do
                i=$((i+1))
                [ "$i" -ge 100 ] && { echo "orchestrator not ready after 300s; failing the seed hook"; exit 1; }
                echo "waiting for orchestrator ($i/100)"; sleep 3
              done
      containers:
        - name: seed
          image: {{ include "srw.imageRef" (dict "image" .Values.image.orchestrator) | quote }}
          imagePullPolicy: {{ .Values.image.orchestrator.pullPolicy }}
          command: ["python", "-m", "seed.llm_config"]
          args: ["--payload", "/seed/llm.yaml"]
          env:
            # Postgres DSN is composed at runtime by the seeder
            # (orchestrator/utils/db_url.py).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: POSTGRES_DB
            # Explicit env -- this Job does not envFrom the shared ConfigMap.
            - name: POSTGRES_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: POSTGRES_SSLMODE
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: APP_ENCRYPTION_KEY
            {{- range $provider, $ref := .Values.llm.seed.systemApiKeys }}
            - name: {{ printf "SEED_%s_API_KEY" ($provider | upper | replace "-" "_") | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "systemApiKeys entry missing secretName" $ref.secretName | quote }}
                  key: {{ required "systemApiKeys entry missing key" $ref.key | quote }}
                  # A provider listed here whose key is absent from the Secret is
                  # tolerated: the env var stays unset and the seeder skips that
                  # provider (orchestrator/seed/llm_config.py _resolve_secret_value).
                  # Lets operators list providers without pre-creating empty keys.
                  optional: true
            {{- end }}
            {{- range $i, $ep := .Values.llm.seed.systemEndpoints }}
            {{- if $ep.apiKeyRef }}
            - name: {{ printf "SEED_ENDPOINT_%d_API_KEY" $i | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "apiKeyRef.secretName is required" $ep.apiKeyRef.secretName | quote }}
                  key: {{ required "apiKeyRef.key is required" $ep.apiKeyRef.key | quote }}
                  # Keyed endpoints tolerate a missing key too — the seeder
                  # creates the endpoint keyless rather than failing the pod.
                  optional: true
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: seed-payload
              mountPath: /seed
              readOnly: true
          resources:
            {{- toYaml .Values.llm.seed.resources | nindent 12 }}
      volumes:
        - name: seed-payload
          configMap:
            name: {{ include "srw.fullname" . }}-llm-seed
            items:
              - key: llm.yaml
                path: llm.yaml
{{- end }}
