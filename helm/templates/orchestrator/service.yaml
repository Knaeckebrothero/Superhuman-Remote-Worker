apiVersion: v1
kind: Service
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8085
      targetPort: 8085
  selector:
    {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
