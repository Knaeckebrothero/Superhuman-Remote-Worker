apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
rules:
  # Workspace container + agent pod lifecycle (create, delete, get status,
  # patch labels/annotations from the lifecycle reconciler).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  # Read pod logs before reap — supports the diagnostic log capture added
  # in commit 8e92c81 (Capture agent logs before pod deletion). Without
  # this, AgentProvisioner._capture_agent_logs_before_reap fails with 403
  # and the very logs we need to debug agent-side incidents are lost.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Finalizer manipulation for the lifecycle reconciler — guarantees
  # cleanup hooks run before a pod disappears from etcd. Adopted in
  # Phase 1 of the unified instance lifecycle redesign; Phase 1c is the
  # first consumer.
  - apiGroups: [""]
    resources: ["pods/finalizers"]
    verbs: ["update", "patch"]
  # PVC lifecycle for workspace persistence
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list"]
  # Session router: per-session Service + Ingress lifecycle managed by
  # SessionRouterService when a thread binds to an agent. See
  # docs/features/direct_session_websockets.md §RBAC changes.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "srw.fullname" . }}-orchestrator
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.fullname" . }}-orchestrator
    namespace: {{ .Release.Namespace }}
