apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
rules:
  # Workspace container + agent pod lifecycle (create, delete, get status,
  # patch labels/annotations from the lifecycle reconciler).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  # Finalizer manipulation for the lifecycle reconciler — guarantees
  # cleanup hooks run before a pod disappears from etcd. Adopted in
  # Phase 1 of the unified instance lifecycle redesign; Phase 1c is the
  # first consumer.
  - apiGroups: [""]
    resources: ["pods/finalizers"]
    verbs: ["update", "patch"]
  # PVC lifecycle for workspace persistence
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "srw.fullname" . }}-orchestrator
subjects:
  - kind: ServiceAccount
    name: {{ include "srw.fullname" . }}-orchestrator
    namespace: {{ .Release.Namespace }}
