apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srw.fullname" . }}-orchestrator
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "srw.componentSelectorLabels" (dict "context" . "component" "orchestrator") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "srw.fullname" . }}-orchestrator
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if and .Values.databases.postgres.enabled .Values.databases.postgres.internal }}
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "srw.fullname" . }}-postgres 5432; do sleep 2; done"]
        {{- end }}
        {{- if and .Values.databases.vector.enabled .Values.databases.vector.internal }}
        - name: wait-for-pgvector
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "srw.fullname" . }}-pgvector 5432; do sleep 2; done"]
        {{- end }}
        {{- if and .Values.databases.mongodb.enabled .Values.databases.mongodb.internal }}
        - name: wait-for-mongodb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "srw.fullname" . }}-mongodb 27017; do sleep 2; done"]
        {{- end }}
        {{- if and .Values.gitea.enabled .Values.gitea.internal }}
        - name: wait-for-gitea
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "srw.fullname" . }}-gitea 3000; do sleep 2; done"]
        {{- end }}
        {{- if and .Values.keycloak.enabled .Values.keycloak.internal }}
        - name: wait-for-keycloak
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "srw.fullname" . }}-keycloak 8080; do sleep 2; done"]
        {{- end }}
      containers:
        - name: orchestrator
          image: "{{ .Values.image.orchestrator.repository }}:{{ .Values.image.orchestrator.tag }}"
          imagePullPolicy: {{ .Values.image.orchestrator.pullPolicy }}
          ports:
            - containerPort: 8085
          env:
            - name: PORT
              value: "8085"
            # License acceptance — orchestrator refuses to start if not "true"
            - name: LICENSE_TERMS_ACCEPTED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: LICENSE_TERMS_ACCEPTED
            # Encryption key for API keys stored at rest (user_api_keys,
            # system_api_keys, llm_endpoints.api_key). Must be present
            # before the orchestrator starts — see NOTES.txt for the
            # operator backup procedure.
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: APP_ENCRYPTION_KEY
            # Core databases
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: DATABASE_URL
            - name: VECTOR_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: VECTOR_DB_URL
            - name: MONGODB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MONGODB_URL
            - name: WORKSPACE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_PATH
            - name: WORKSPACE_STORAGE_CLASS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_STORAGE_CLASS
            # Gitea
            - name: GITEA_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: GITEA_URL
            - name: GITEA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: GITEA_ADMIN_USER
            - name: GITEA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: GITEA_ADMIN_PASSWORD
            - name: GITEA_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: GITEA_INTERNAL_URL
            - name: GITEA_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: GITEA_OIDC_CLIENT_SECRET
                  optional: true
            # Keycloak SSO
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: KEYCLOAK_URL
            - name: KEYCLOAK_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: KEYCLOAK_ISSUER_URL
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: KEYCLOAK_REALM
            {{- if .Values.keycloak.internal }}
            # KEYCLOAK_ADMIN_* — only when SRW manages the Keycloak instance.
            # External Keycloak deployments use the bootstrap Job (with its
            # own KC_ADMIN_USER/PASSWORD Secret) instead.
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: KEYCLOAK_ADMIN_USER
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: KEYCLOAK_ADMIN_PASSWORD
            {{- end }}
            # MCP auth
            - name: MCP_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: MCP_INTERNAL_KEY
            # CORS
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CORS_ORIGINS
            # Cockpit external URL (deep links in notifications)
            - name: COCKPIT_EXTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: COCKPIT_EXTERNAL_URL
            # Instruction Builder
            # BUILDER_API_KEY removed — _create_builder_llm now resolves the
            # provider key from system_api_keys (seeded via the llm-seed-job).
            # See docs/api_key_resolution.md for the wire-format vs config-source
            # split.
            # BUILDER_MODEL + BUILDER_LLM_PROVIDER removed in chunk 7 of
            # models_yaml_removal — both resolved from the catalog at
            # request time (system_settings['llm.default_builder_model']
            # + the joined transport's provider_kind/provider_ref).
            # Default Neo4j datasource (local instance — optional)
            - name: DEFAULT_DS_NEO4J_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_NEO4J_URL
                  optional: true
            - name: DEFAULT_DS_NEO4J_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: DEFAULT_DS_NEO4J_USERNAME
                  optional: true
            - name: DEFAULT_DS_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NEO4J_PASSWORD
                  optional: true
            - name: DEFAULT_DS_NEO4J_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_NEO4J_NAME
                  optional: true
            - name: DEFAULT_DS_NEO4J_READ_ONLY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_NEO4J_READ_ONLY
                  optional: true
            {{- if or .Values.nextcloud.enabled (eq (default "" .Values.cloud.externalBackend) "nextcloud") }}
            # Nextcloud — bundled (nextcloud.enabled=true) or external
            # (cloud.externalBackend=nextcloud). Skipped entirely otherwise so
            # the chart doesn't reference Secret keys the operator hasn't
            # populated.
            - name: NEXTCLOUD_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_URL
                  optional: true
            - name: NEXTCLOUD_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_PUBLIC_URL
                  optional: true
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_ADMIN_USER
                  optional: true
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NEXTCLOUD_ADMIN_PASSWORD
                  optional: true
            - name: NEXTCLOUD_AGENT_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NEXTCLOUD_AGENT_USER
                  optional: true
            - name: NEXTCLOUD_AGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NEXTCLOUD_AGENT_PASSWORD
                  optional: true
            {{- end }}
            # Default WebDAV datasource (optional)
            - name: DEFAULT_DS_WEBDAV_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_WEBDAV_URL
                  optional: true
            - name: DEFAULT_DS_WEBDAV_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: DEFAULT_DS_WEBDAV_USERNAME
                  optional: true
            - name: DEFAULT_DS_WEBDAV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: DEFAULT_DS_WEBDAV_PASSWORD
                  optional: true
            - name: DEFAULT_DS_WEBDAV_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_WEBDAV_NAME
                  optional: true
            - name: DEFAULT_DS_WEBDAV_READ_ONLY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: DEFAULT_DS_WEBDAV_READ_ONLY
                  optional: true
            # Cloud backend selector (set when any cloud is enabled — bundled or external)
            - name: MAIN_CLOUD_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MAIN_CLOUD_BACKEND
                  optional: true
            {{- if or .Values.opencloud.enabled (eq (default "" .Values.cloud.externalBackend) "opencloud") }}
            # OpenCloud — bundled (opencloud.enabled=true) or external
            # (cloud.externalBackend=opencloud). Skipped entirely otherwise so
            # the chart doesn't reference Secret keys the operator hasn't
            # populated.
            - name: OPENCLOUD_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_URL
                  optional: true
            - name: OPENCLOUD_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_PUBLIC_URL
                  optional: true
            - name: OPENCLOUD_KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_KEYCLOAK_ISSUER
                  optional: true
            - name: OPENCLOUD_KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: OPENCLOUD_KEYCLOAK_CLIENT_ID
                  optional: true
            - name: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: OPENCLOUD_KEYCLOAK_CLIENT_SECRET
                  optional: true
            {{- end }}
            # External cloud service account (used with cloud.externalBackend)
            - name: CLOUD_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: CLOUD_SERVICE_USER
                  optional: true
            - name: CLOUD_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: CLOUD_SERVICE_PASSWORD
                  optional: true
            # S3 / MinIO (snapshots + IDE sessions)
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: S3_ENDPOINT
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: S3_SECRET_KEY
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: S3_BUCKET
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: S3_REGION
            - name: SNAPSHOT_MAX_SIZE_GB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SNAPSHOT_MAX_SIZE_GB
            - name: SNAPSHOT_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SNAPSHOT_RETENTION_DAYS
            # IDE sessions
            - name: IDE_SESSION_IDLE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IDE_SESSION_IDLE_TIMEOUT
            - name: IDE_SESSION_MAX_LIFETIME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IDE_SESSION_MAX_LIFETIME
            - name: IDE_MAX_CONCURRENT_PER_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IDE_MAX_CONCURRENT_PER_USER
            - name: CODE_SERVER_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: CODE_SERVER_IMAGE
            - name: IDE_PROXY_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IDE_PROXY_BASE_URL
            # Notification — SMTP
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SMTP_PASSWORD
            - name: SMTP_USE_TLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_USE_TLS
            - name: SMTP_TRUST_SELF_SIGNED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_TRUST_SELF_SIGNED
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: SMTP_FROM
            # Notification — IMAP (inbound email replies)
            - name: IMAP_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_HOST
            - name: IMAP_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_PORT
            - name: IMAP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: IMAP_USER
            - name: IMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: IMAP_PASSWORD
            - name: IMAP_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_USE_SSL
            - name: IMAP_TRUST_SELF_SIGNED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_TRUST_SELF_SIGNED
            - name: IMAP_POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: IMAP_POLL_INTERVAL
            - name: AGENT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AGENT_EMAIL
            - name: MAIL_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MAIL_DOMAIN
            # Notification — Webhooks (optional; empty/missing → transport disabled)
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: SLACK_WEBHOOK_URL
                  optional: true
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: DISCORD_WEBHOOK_URL
                  optional: true
            - name: NTFY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NTFY_URL
            - name: NTFY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NTFY_TOPIC
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: NTFY_TOKEN
                  optional: true
            # VM lifecycle (optional)
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: NATS_URL
                  optional: true
            - name: VM_TEMPLATE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VM_TEMPLATE_PATH
                  optional: true
            - name: VM_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VM_NAMESPACE
                  optional: true
            - name: VM_CONTROLLER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: VM_CONTROLLER_URL
                  optional: true
            # Workspace containers
            - name: WORKSPACE_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_IMAGE
                  optional: true
            - name: WORKSPACE_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: WORKSPACE_NAMESPACE
                  optional: true
            - name: WORKSPACE_SSH_SECRET
              value: {{ include "srw.vmSshKeySecretName" . | quote }}
            - name: AGENT_SECRET
              value: {{ include "srw.secretName" . | quote }}
            - name: AGENT_CONFIGMAP
              value: {{ include "srw.configMapName" . | quote }}
            # Chart-standard labels for dynamically-provisioned agent pods.
            # The chart's database NetworkPolicies match on these labels;
            # without them, dynamic agent pods are blocked from reaching
            # postgres/pgvector/mongodb/neo4j.
            - name: AGENT_LABEL_NAME
              value: {{ include "srw.name" . | quote }}
            - name: AGENT_LABEL_INSTANCE
              value: {{ .Release.Name | quote }}
            - name: SSH_KEY_PATH
              value: "/run/secrets/vm-ssh-key"
            # Budget for the WS proxy's /ready poll. Must outlast the agent's
            # own _poll_workspace_ready (120s) plus margin for cold image pulls.
            - name: WS_READY_TIMEOUT_S
              value: {{ .Values.orchestrator.wsReadyTimeoutSeconds | default 180 | quote }}
            # Persistent agent pods (on-demand provisioning)
            - name: PERSISTENT_AGENT_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: PERSISTENT_AGENT_IMAGE
                  optional: true
            # Agent tailscale sidecar gate (consumed by AgentProvisioner)
            - name: AGENT_TAILSCALE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AGENT_TAILSCALE_ENABLED
                  optional: true
            - name: HEADSCALE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: HEADSCALE_URL
                  optional: true
            # Codex OAuth Proxy
            - name: CODEX_PROXY_URL
              value: "http://{{ include "srw.fullname" . }}-codex-proxy:8317"
            # CODEX_BASE_URL removed in chunk 7 of models_yaml_removal —
            # the codex transport is a system endpoint catalog row now,
            # not an env-var-injected base URL.
            - name: CODEX_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "srw.secretName" . }}
                  key: CODEX_MANAGEMENT_KEY
                  optional: true
            # Orchestrator settings
            - name: AUTO_ASSIGN_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AUTO_ASSIGN_ENABLED
            # Agent pool sizing (AgentProvisioner)
            - name: MAX_AGENTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MAX_AGENTS
            - name: MIN_AGENTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: MIN_AGENTS
            - name: AGENT_BUFFER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: AGENT_BUFFER
            - name: RESERVED_SESSION_SLOTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: RESERVED_SESSION_SLOTS
            - name: RESERVED_JOB_SLOTS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: RESERVED_JOB_SLOTS
            # Logging
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "srw.configMapName" . }}
                  key: LOG_LEVEL
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: vm-ssh-key
              mountPath: /run/secrets/vm-ssh-key
              subPath: ssh-privatekey
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "srw.fullname" . }}-workspace
        - name: vm-ssh-key
          secret:
            secretName: {{ include "srw.vmSshKeySecretName" . }}
            defaultMode: 0400
