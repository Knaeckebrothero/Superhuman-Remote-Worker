{{- if .Values.llm.seed.enabled }}
{{- /*
Payload for `python -m orchestrator.seed.llm_config`. Stays plaintext-free:
API keys are referenced via `apiKeyEnv` and injected into the seed Job pod
via envFrom on the referenced Secrets.

The seeder is insert-only — re-applying an unchanged payload on `helm upgrade`
is a no-op, and admin-UI edits to `system_api_keys` / `llm_endpoints`
survive subsequent runs. See knowledge-base/knowledge/features/db_backed_llm_config.md for the
seed semantics and src/orchestrator/seed/llm_config.py for the payload schema.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srw.fullname" . }}-llm-seed
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "llm-seed") | nindent 4 }}
  annotations:
    # Render the ConfigMap before the seed Job runs (hook-weight 0 < Job's 10).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  llm.yaml: |
    systemApiKeys:
      {{- range $provider, $ref := .Values.llm.seed.systemApiKeys }}
      - provider: {{ $provider | quote }}
        apiKeyEnv: {{ printf "SEED_%s_API_KEY" ($provider | upper | replace "-" "_") | quote }}
      {{- end }}
    systemEndpoints:
      {{- range $i, $ep := .Values.llm.seed.systemEndpoints }}
      - label: {{ required "llm.seed.systemEndpoints[].label is required" $ep.label | quote }}
        baseUrl: {{ required "llm.seed.systemEndpoints[].baseUrl is required" $ep.baseUrl | quote }}
        {{- if $ep.apiKeyRef }}
        apiKeyEnv: {{ printf "SEED_ENDPOINT_%d_API_KEY" $i | quote }}
        {{- end }}
        models:
          {{- range $ep.models }}
          - id: {{ required "model.id is required" .id | quote }}
            displayName: {{ default .id .displayName | quote }}
            {{- with .capabilities }}
            capabilities:
              {{- range . }}
              - {{ . | quote }}
              {{- end }}
            {{- else }}
            capability: {{ default "chat" .capability | quote }}
            {{- end }}
            {{- with .family }}
            family: {{ . | quote }}
            {{- end }}
            {{- with .contextWindow }}
            contextWindow: {{ . }}
            {{- end }}
            {{- if hasKey . "reasoningLevel" }}
            reasoningLevel: {{ .reasoningLevel | quote }}
            {{- end }}
            {{- if hasKey . "multimodal" }}
            multimodal: {{ .multimodal }}
            {{- end }}
            enabled: {{ default true .enabled }}
          {{- end }}
      {{- end }}
    systemModels:
      {{- range .Values.llm.seed.systemModels }}
      - provider: {{ required "llm.seed.systemModels[].provider is required" .provider | quote }}
        id: {{ required "llm.seed.systemModels[].id is required" .id | quote }}
        displayName: {{ default .id .displayName | quote }}
        {{- with .capabilities }}
        capabilities:
          {{- range . }}
          - {{ . | quote }}
          {{- end }}
        {{- else }}
        capability: {{ default "chat" .capability | quote }}
        {{- end }}
        {{- with .family }}
        family: {{ . | quote }}
        {{- end }}
        {{- with .contextWindow }}
        contextWindow: {{ . }}
        {{- end }}
        {{- if hasKey . "reasoningLevel" }}
        reasoningLevel: {{ .reasoningLevel | quote }}
        {{- end }}
        {{- if hasKey . "multimodal" }}
        multimodal: {{ .multimodal }}
        {{- end }}
        enabled: {{ default true .enabled }}
      {{- end }}
    {{- /*
    Default-model pins: `llm.seed.defaults` is a kind -> catalog model_id map.
    The kind list mirrors VALID_DEFAULT_MODEL_KINDS (orchestrator/schemas/
    provider_catalog.py) and DEFAULT_PIN_CAPABILITY_BY_KIND (seed/llm_config.py);
    a typo fails the render here instead of a warning buried in the Job log.
    */}}
    {{- $validKinds := list "auxiliary" "browser" "chat" "citation" "embedding" "fetch" "rerank" "search" "search_fallback" "tts" "vision" "whisper" }}
    defaults:
      {{- range $kind, $model := .Values.llm.seed.defaults }}
      {{- if not (has $kind $validKinds) }}
      {{- fail (printf "llm.seed.defaults: unknown kind %q (valid: %s)" $kind (join ", " $validKinds)) }}
      {{- end }}
      {{- if $model }}
      {{ $kind }}: {{ $model | quote }}
      {{- end }}
      {{- end }}
{{- end }}
