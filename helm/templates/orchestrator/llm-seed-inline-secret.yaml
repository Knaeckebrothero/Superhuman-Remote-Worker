{{- /*
Dev-mode companion to llm-seed-job.yaml. `llm.seed.systemApiKeys.<provider>.value`
and `llm.seed.systemEndpoints[].apiKey` let a local overlay carry the seed keys
inline instead of pre-creating Secrets by hand. They are gathered into ONE
dedicated Secret that only the seed Job mounts — never the shared application
Secret, which agent pods take wholesale via envFrom — and the seeder encrypts
them into Postgres on write.

Plaintext credentials in values are a dev convenience, so this renders only in
the chart-managed-Secret mode (`secrets.create: true`, the same switch that
already puts `secrets.values` in plaintext). In ESO / production mode the
render fails loudly instead of quietly shipping a key.

Regular resource, not a hook: it is applied with the release, ahead of the
post-install/post-upgrade seed Job, and removed with `helm uninstall`.
*/ -}}
{{- if .Values.llm.seed.enabled }}
{{- $inline := dict }}
{{- range $provider, $ref := .Values.llm.seed.systemApiKeys }}
{{- if and (hasKey $ref "value") (or $ref.secretName $ref.key) }}
{{- fail (printf "llm.seed.systemApiKeys.%s: set either value (inline, dev only) or secretName/key, not both" $provider) }}
{{- end }}
{{- if hasKey $ref "value" }}
{{- $_ := set $inline $provider (toString $ref.value) }}
{{- end }}
{{- end }}
{{- range $i, $ep := .Values.llm.seed.systemEndpoints }}
{{- if and (hasKey $ep "apiKey") $ep.apiKeyRef }}
{{- fail (printf "llm.seed.systemEndpoints[%d] (%s): set either apiKey (inline, dev only) or apiKeyRef, not both" $i $ep.label) }}
{{- end }}
{{- if hasKey $ep "apiKey" }}
{{- $_ := set $inline (printf "endpoint-%d" $i) (toString $ep.apiKey) }}
{{- end }}
{{- end }}
{{- if $inline }}
{{- if not .Values.secrets.create }}
{{- fail "llm.seed: inline key values (systemApiKeys.<provider>.value / systemEndpoints[].apiKey) put plaintext credentials into values and are only allowed with secrets.create=true (chart-managed dev Secret). Reference a pre-existing Secret via secretName/key or apiKeyRef instead." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-llm-seed-inline" (include "srw.fullname" .) | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "srw.componentLabels" (dict "context" . "component" "llm-seed") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $inline }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
