server {
    listen 4000;
    root /usr/share/nginx/html;
    index index.html;

    # Canvas live apps are untrusted allow-same-origin frames. If one navigates
    # itself onto the Cockpit origin, the trusted document must refuse framing.
    # `always` also covers SPA/error responses rather than successful HTML only.
    add_header Content-Security-Policy "frame-ancestors 'none'; img-src 'self' blob: data:" always;
    add_header X-Frame-Options "DENY" always;

    # Stock mime.types has no .webmanifest mapping. Without this, Android may
    # install the PWA as a bookmark shortcut instead of a standalone app.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
