# sudo-gated daemon configuration (VM base image defaults).
# Transport credentials are supplied by the systemd environment files.

socket_path: /run/sudo-gated/sudo-gated.sock

nats:
  # Overridden by NATS_URL env var from cloud-init
  url: ""
  max_reconnects: -1
  reconnect_wait: 2s
  subject_prefix: sudo.request

orchestrator:
  # Overridden by ORCHESTRATOR_URL and VM_AUTH_TOKEN from cloud-init
  url: ""
  token: ""

rate_limit:
  requests_per_minute: 5
  burst: 3

timeouts:
  nats_request: 300s
  socket_read: 10s
  graceful_shutdown: 30s

log_level: info
